# Release Please keeps a "chore: release X.Y.Z" PR open on main. Merging it tags the release, and the
# build jobs below run in this same workflow: a tag pushed with GITHUB_TOKEN starts no other workflow.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        module: [zone-server, login-server, api-server]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bestia-${{ matrix.module }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :${{ matrix.module }}:bootJar
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          build-args: JAR=${{ matrix.module }}/build/libs/${{ matrix.module }}-${{ env.VERSION }}.jar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  client:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - preset: Linux
            platform: linux-x64
            binary: bestia.x86_64
          - preset: Windows Desktop
            platform: windows-x64
            binary: bestia.exe
    env:
      ARCHIVE: bestia-client-${{ needs.release-please.outputs.version }}-${{ matrix.platform }}
      PRESET: ${{ matrix.preset }}
      BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true
      - name: Export
        working-directory: bestia-client/src
        run: |
          # GDScript refers to the generated C# message types, so the assembly must exist before the import.
          dotnet build "Bestia Behemoth Client.csproj"
          # A fresh clone has no .godot import cache, and the export needs it.
          godot --headless --import
          mkdir -p "$RUNNER_TEMP/$ARCHIVE"
          godot --headless --export-release "$PRESET" "$RUNNER_TEMP/$ARCHIVE/$BINARY"
          test -f "$RUNNER_TEMP/$ARCHIVE/$BINARY"
      - name: Pack
        working-directory: ${{ runner.temp }}
        run: |
          # tar keeps the Linux binary executable; Windows players expect a zip.
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            zip -qr "$ARCHIVE.zip" "$ARCHIVE"
          else
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/${{ env.ARCHIVE }}.*
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/$ARCHIVE".* --repo "$GITHUB_REPOSITORY"
