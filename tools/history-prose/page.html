<title>History Prose Reading Set</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one reading column; each text is a section with its fact sheet, then one card per model. */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --fg: #1c2320;
  --muted: #5a6661;
  --line: #d5dcd8;
  --accent: #2c6b5e;
  --accent-soft: #e1eeea;
  --ok: #2f7a3f;
  --warn: #9a6a12;
  --bad: #b03a2e;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-text: "Literata", Georgia, serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --surface: #1b211f; --fg: #dde4e0; --muted: #94a19b; --line: #2e3733;
    --accent: #79bdaa; --accent-soft: #22312c; --ok: #72c084; --warn: #d9a64a; --bad: #e57b6f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1b211f; --fg: #dde4e0; --muted: #94a19b; --line: #2e3733;
  --accent: #79bdaa; --accent-soft: #22312c; --ok: #72c084; --warn: #d9a64a; --bad: #e57b6f; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-ui); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; display: grid; gap: 40px; }
header { display: grid; gap: 12px; }
.eyebrow { font: 500 12px/1 var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 600 30px/1.2 var(--font-ui); margin: 0; text-wrap: balance; }
h2 { font: 600 20px/1.3 var(--font-ui); margin: 0; text-wrap: balance; }
h2::first-letter { text-transform: uppercase; }
h3 { font: 600 13px/1.3 var(--font-data); margin: 0; letter-spacing: .02em; }
p { margin: 0; max-width: 68ch; }
.lead { color: var(--muted); }
.verdict { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 16px 18px; display: grid; gap: 8px; }
.verdict strong { color: var(--accent); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font: 13px/1.4 var(--font-ui); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; }
tr:last-child td { border-bottom: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters span { color: var(--muted); font-size: 13px; }
.chip { font: 500 13px/1 var(--font-ui); border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 7px 10px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
nav.toc a { color: var(--accent); text-decoration: none; }
nav.toc a:hover { text-decoration: underline; }
section.text { display: grid; gap: 14px; scroll-margin-top: 16px; }
.kind { font: 500 12px/1 var(--font-data); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
details.sheet { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; }
details.sheet summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.sheet pre { font: 12px/1.5 var(--font-data); white-space: pre-wrap; margin: 10px 0 0; color: var(--fg); }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font: 500 11.5px/1 var(--font-data); padding: 4px 7px; border-radius: 4px; border: 1px solid currentColor; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.info { color: var(--muted); }
.prose { font: 16px/1.65 var(--font-text); white-space: pre-wrap; max-width: 68ch; }
.prose.de { border-left: 2px solid var(--line); padding-left: 12px; }
.note { font-size: 13px; color: var(--muted); }
.problems { font: 12px/1.5 var(--font-data); color: var(--bad); }
.score { font-size: 13px; }
.score b { font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
@media (max-width: 520px) { h1 { font-size: 24px; } .prose { font-size: 15px; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Bestia · history prose spike · phase 2</div>
    <h1>History Prose Reading Set</h1>
    <p class="lead" id="lead"></p>
  </header>

  <div class="verdict" id="verdict"></div>

  <div class="table-wrap"><table id="summary"></table></div>

  <div class="filters" id="filters"><span>Show:</span></div>
  <nav class="toc" id="toc"></nav>

  <main id="texts" style="display:grid;gap:40px"></main>

  <footer id="footer"></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const data = JSON.parse(document.getElementById('data').textContent);
const shown = new Set(data.models);

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

document.getElementById('lead').textContent = data.lead;
document.getElementById('verdict').innerHTML = data.verdict;
document.getElementById('footer').innerHTML = data.footer;

// Summary table: one row per model and runtime.
const table = document.getElementById('summary');
const cols = data.summaryColumns;
const head = table.createTHead().insertRow();
cols.forEach(c => { const th = el('th', c.num ? 'num' : '', c.label); head.appendChild(th); });
const body = table.createTBody();
data.summary.forEach(row => {
  const tr = body.insertRow();
  cols.forEach(c => { const td = tr.insertCell(); td.textContent = row[c.key] ?? '–'; if (c.num) td.className = 'num'; });
});

// Model filter chips.
const filters = document.getElementById('filters');
data.models.forEach(m => {
  const b = el('button', 'chip', data.modelNames[m] || m);
  b.type = 'button';
  b.id = 'chip-' + m;
  b.setAttribute('aria-pressed', 'true');
  b.addEventListener('click', () => {
    if (shown.has(m)) shown.delete(m); else shown.add(m);
    b.setAttribute('aria-pressed', shown.has(m) ? 'true' : 'false');
    document.querySelectorAll('[data-model="' + m + '"]').forEach(c => { c.hidden = !shown.has(m); });
  });
  filters.appendChild(b);
});

// One section per text.
const toc = document.getElementById('toc');
const main = document.getElementById('texts');
data.texts.forEach((t, i) => {
  const id = 'text-' + (i + 1);
  const a = el('a', '', t.title); a.href = '#' + id; toc.appendChild(a);

  const s = el('section', 'text'); s.id = id;
  s.appendChild(el('div', 'kind', t.kindLabel));
  s.appendChild(el('h2', '', t.heading));
  const d = el('details', 'sheet');
  d.appendChild(el('summary', '', 'Fact sheet, as the model saw it'));
  d.appendChild(el('pre', '', t.sheet));
  s.appendChild(d);
  if (t.task) s.appendChild(el('p', 'note', t.task));

  const cards = el('div', 'cards');
  data.models.forEach(m => {
    const r = t.by[m];
    if (!r) return;
    const c = el('article', 'card'); c.dataset.model = m;
    const h = el('div', 'card-head');
    h.appendChild(el('h3', '', data.modelNames[m] || m));
    const badges = el('div', 'badges');
    const verdict = r.passed ? (r.attempts === 1 ? ['ok', 'valid at once'] : ['warn', 'valid after ' + r.attempts + ' tries'])
                             : ['bad', 'rejected after ' + r.attempts + ' tries'];
    badges.appendChild(el('span', 'badge ' + verdict[0], verdict[1]));
    badges.appendChild(el('span', 'badge info', Math.round(r.wall_s) + ' s'));
    if (r.score != null) badges.appendChild(el('span', 'badge info', 'score ' + r.score + '/5'));
    h.appendChild(badges);
    c.appendChild(h);
    c.appendChild(el('div', 'prose', r.text));
    if (r.problems.length) {
      c.appendChild(el('div', 'problems', 'Validator found: ' + r.problems.map(p => p.type + ' "' + p.value + '"').join(', ')));
    }
    if (r.comment) c.appendChild(el('p', 'note score', r.comment));
    (r.de || []).forEach(g => {
      c.appendChild(el('div', 'kind', 'German · ' + g.label));
      c.appendChild(el('div', 'prose de', g.text));
      if (g.comment) c.appendChild(el('p', 'note', g.comment));
      if (g.problems.length) c.appendChild(el('div', 'problems', 'Lost in translation: ' + g.problems.map(p => p.value).join(', ')));
    });
    cards.appendChild(c);
  });
  s.appendChild(cards);
  main.appendChild(s);
});
</script>
