# The Kotlin daemon writes its incremental-compilation caches through IntelliJ's IOUtil.syncStream,
# which reflects into FilterOutputStream.out to fsync the file. On JDK 16+ that throws
# InaccessibleObjectException, the daemon dies mid-write - corrupting the caches it was flushing -
# and the build falls back to the much slower daemonless compiler. Kotlin 1.9.25 opens java.io to
# nobody, so the toolchain JDK has to be told from here.
#
# Setting kotlin.daemon.jvmargs replaces the daemon's argument list rather than adding to it, so the
# heap and the sun.nio.ch export Kotlin passes by default have to be repeated.
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=384m --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED
