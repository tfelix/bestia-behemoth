apiVersion: 1

providers:
  - name: Bestia
    folder: Bestia
    type: file
    # The files are the source of truth: edit the JSON (a UI edit cannot be saved back), Grafana picks it up in seconds.
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
