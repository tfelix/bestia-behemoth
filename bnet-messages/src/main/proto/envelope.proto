option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "EnvelopeProto";

message Envelope {
  // Field numbers that were in use and must never be reused - a client built against an older schema would
  // read the new message as the old one.
  reserved 502;
  // 504 was vanish_entity, 505 damage_entity and 510-541 the comp_* messages: entity state now travels in
  // state_batch, and the damage event moved to a one-byte tag.
  reserved 504, 505, 510 to 541;

  oneof message {
    // SYSTEM & ACCOUNT 100
    OperationSuccess operation_success = 1;
    OperationError operation_error = 2;
    // The most frequent messages, in the field numbers that take one byte.
    StateBatchSMSG state_batch = 3;
    DamageEntitySMSG damage_entity = 4;

    Authentication authentication = 100;
    Disconnected disconnected = 101;
    AuthenticationSuccess authentication_success = 102;

    Ping ping = 120;
    Pong pong = 121;

    ChatCMSG chat_cmsg = 122;
    ChatSMSG chat_smsg = 123;
    RequestLogoutCMSG request_logout = 124;
    DialogSMSG dialog = 125;
    // 126 was held for a DialogChoiceCMSG answering a CHOICE dialog. Conversation absorbed that rather
    // than building beside it - one mechanism for asking the player something - so it answers a
    // ConversationSMSG instead.
    ConversationChoiceCMSG conversation_choice = 126;
    RespawnCMSG respawn = 127;
    InteractCMSG interact = 128;
    ConversationSMSG conversation = 129;

    // MAP 200
    WorldInfoSMSG world_info = 200;
    ChunkManifestSMSG chunk_manifest = 201;
    ChunkRequestCMSG chunk_request = 202;
    ChunkDataSMSG chunk_data = 203;
    ChunkPatchSMSG chunk_patch = 204;
    WeatherSMSG weather = 205;
    ChunkStaticEntitiesSMSG chunk_static_entities = 206;
    StaticEntityRemovedSMSG static_entity_removed = 207;
    CollectPropCMSG collect_prop = 208;
    WorldTimeSMSG world_time = 209;
    ChunkGroundOverlaySMSG chunk_ground_overlay = 210;
    InteractEntityCMSG interact_entity = 211;
    ChunkGroundLayersSMSG chunk_ground_layers = 212;
    ChunkGroundStampsSMSG chunk_ground_stamps = 213;
    GroundMarkRulesSMSG ground_mark_rules = 214;

    // INVENTORY 300
    GetInventoryCMSG get_inventory = 301;
    UseItemCMSG use_item = 302;
    DropItemCMSG drop_item = 303;
    LootItemCMSG loot_item = 304;
    EquipItemCMSG equip_item = 305;
    UnequipItemCMSG unequip_item = 306;

    // MASTER & BESTIA 400
    GetMasterCMSG get_master = 401;
    Master master = 402;
    SelectMasterCMSG select_master = 403;
    GetSelfCMSG get_self = 404;
    SelfSMSG self = 405;
    InvestSkillPointCMSG invest_skill_point = 406;
    GetSkillsCMSG get_skills = 407;
    ActivateSkillCMSG activate_skill = 408;
    CreateMasterCMSG create_master = 409;
    InvestStatusPointCMSG invest_status_point = 410;
    SetBestiaAiConfigCMSG set_bestia_ai_config = 411;
    BestiaAiConfigSMSG bestia_ai_config = 412;
    DeleteMasterCMSG delete_master = 413;
    BestiaCaptureSMSG bestia_capture = 414;
    OwnedBestiasSMSG owned_bestias = 415;
    ActiveEntitySMSG active_entity = 416;
    RequestCompendiumCMSG request_compendium = 417;
    CompendiumSMSG compendium = 418;

    // ENTITY & COMPONENTS 500
    SelectActiveEntity select_active_entity = 500;
    MoveActiveEntity move_active_entity = 501;
    // 502 held GetAllEntities, the one-shot login snapshot, and is reserved below. An entity is now
    // announced when the chunk it stands in reaches the client - see ChunkEntityVisibility.
    AttackEntityCMSG attack_entity = 503;

    // SOCIAL & PARTY 600
    AcceptPartyInviteCMSG accept_party_invite = 600;
    DeclinePartyInviteCMSG decline_party_invite = 601;
    PartyInvitationSMSG party_invitation = 602;
    PartyInfoSMSG party_info = 605;
    DisbandPartySMSG disband_party = 607;
    CreatePartyCMSG create_party = 608;
    LeavePartyCMSG leave_party = 609;
    RemovePartyMemberCMSG remove_party_member = 610;
    RequestDisbandPartyCMSG request_disband_party = 611;
    RequestPartyInvitationCMSG request_party_invitation = 612;
    RequestPartyInfoCMSG request_party_info = 613;
    SetPartyExpShareCMSG set_party_exp_share = 614;

    // GUILD 620
    CreateGuildCMSG create_guild = 620;
    RequestGuildInfoCMSG request_guild_info = 621;
    InviteToGuildCMSG invite_to_guild = 622;
    AnswerGuildInviteCMSG answer_guild_invite = 623;
    LeaveGuildCMSG leave_guild = 624;
    KickGuildMemberCMSG kick_guild_member = 625;
    SetGuildMemberRankCMSG set_guild_member_rank = 626;
    SaveGuildRankCMSG save_guild_rank = 627;
    DeleteGuildRankCMSG delete_guild_rank = 628;
    InvestGuildSkillCMSG invest_guild_skill = 629;
    DisbandGuildCMSG disband_guild = 630;
    GuildInfoSMSG guild_info = 631;
    GuildInvitationSMSG guild_invitation = 632;
    GuildLeftSMSG guild_left = 633;
    GuildSkillCooldownSMSG guild_skill_cooldown = 634;
    GuildNoticeSMSG guild_notice = 635;
    RequestGuildLogCMSG request_guild_log = 636;
    GuildLogSMSG guild_log = 637;
    SetGuildMotdCMSG set_guild_motd = 638;

    // CRAFTING & BUILDING 700
    CraftableRecipesSMSG craftable_recipes = 700;
    CraftItemCMSG craft_item = 701;
    CancelCraftCMSG cancel_craft = 702;

    // TRADE 800
    RequestTradeCMSG request_trade = 800;
    AnswerTradeRequestCMSG answer_trade_request = 801;
    OfferTradeItemCMSG offer_trade_item = 802;
    RetractTradeItemCMSG retract_trade_item = 803;
    SetTradeLockCMSG set_trade_lock = 804;
    ConfirmTradeCMSG confirm_trade = 805;
    CancelTradeCMSG cancel_trade = 806;
    TradeRequestSMSG trade_request = 810;
    TradeStateSMSG trade_state = 811;

    // SHOPS 820
    OpenShopCMSG open_shop = 820;
    ShopTradeCMSG shop_trade = 821;
    ShopOfferSMSG shop_offer = 822;

    // MISC
  }
}
