syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "AnnouncementSmsgProto";

// Something every connected player should read: a GM's words, or news of the world such as a castle left empty.
message AnnouncementSMSG {
  Announcement announcement = 1;
  // Substitution values for the client's own text, in order.
  repeated string args = 2;
}

enum Announcement {
  ANNOUNCEMENT_UNSPECIFIED = 0;
  // A GM's own words, args[0], shown as they are.
  ANNOUNCEMENT_GM = 1;
  // A guild disbanded, and its Stronghold stands empty for any guild to take. args[0] is the guild's name,
  // args[1] the Stronghold's.
  ANNOUNCEMENT_STRONGHOLD_UNHELD = 2;
  // The doomsday has run its course and the Last Stand begins. args[0] is the hours until the world falls.
  ANNOUNCEMENT_LAST_STAND = 3;
  // args[0] is the minutes until the world falls.
  ANNOUNCEMENT_LAST_STAND_SOON = 4;
  // The doom was beaten back, and the world lives on.
  ANNOUNCEMENT_LAST_STAND_WON = 5;
  // The world outlived its doom and the Calling begins. args[0] is the hours until the sky opens.
  ANNOUNCEMENT_CALLING = 6;
  // args[0] is the minutes until the sky opens.
  ANNOUNCEMENT_CALLING_SOON = 7;
  // The doomsday manifests. args[0] is the direction it lies in, args[1] its name, both as text keys.
  ANNOUNCEMENT_DOOM_ONSET = 8;
  // The doomsday spreads. args[0] is the direction it lies in, args[1] its name, both as text keys.
  ANNOUNCEMENT_DOOM_ESCALATION = 9;
  // The doomsday covers the world. args[0] is its name as a text key.
  ANNOUNCEMENT_DOOM_CATACLYSM = 10;
  // The doomsday was pushed back a stage. args[0] is its name as a text key.
  ANNOUNCEMENT_DOOM_RECEDES = 11;
  // The Foreshadowing strikes. args[0] is the direction it lies in, args[1] its name, both as text keys.
  ANNOUNCEMENT_FORESHADOW_BEGINS = 12;
  // The players contained the Foreshadowing. args[0] is its name as a text key.
  ANNOUNCEMENT_FORESHADOW_HELD = 13;
  // The Foreshadowing ran its course. args[0] is its name as a text key.
  ANNOUNCEMENT_FORESHADOW_FAILED = 14;
}
