syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "OperationSuccessProto";

enum OpSuccess {
  MASTER_CREATED = 0;
  MASTER_DELETED = 1;

  // A craft resolved and produced what it promised. The new item arrives through the ordinary inventory
  // sync; this is only what lets the window say so rather than the player inferring it from a bag.
  CRAFT_SUCCEEDED = 2;
  STRUCTURE_PLACED = 3;

  // A survey resolved into a chart, or two charts became one. The chart itself arrives through the ordinary
  // inventory sync; this is what lets the window say the cast did something, since a survey over ground the
  // player had already charted looks identical to one that failed.
  CHART_WRITTEN = 4;

  // An invitation went out. Whether it is taken up arrives later: a roster push, or a *_INVITE_DECLINED error.
  PARTY_INVITATION_SENT = 5;
  GUILD_INVITATION_SENT = 6;

  // A Mana Circle's ritual: opened by its owner, joined by a helper, started by the leader, and charged.
  RITUAL_OPENED = 7;
  RITUAL_JOINED = 8;
  RITUAL_STARTED = 9;
  RITUAL_CHARGED = 10;

  // A won survey started its ten minutes of work at the theodolite, and those ten minutes are over.
  SURVEY_STARTED = 11;
  SURVEY_READY = 12;
  // A Breeding Farm laid an egg. Sent to its owner when online; the farm window shows the egg itself.
  BREEDING_EGG_LAID = 13;
  // An Incubator hatched an egg into a new bestia of its owner, next to it.
  BESTIA_HATCHED = 14;

  // A bestia learned the attack on a spell scroll, or an attack was copied onto a new one.
  SPELL_LEARNED = 15;
  SPELL_INSCRIBED = 16;
}

message OperationSuccess {
  OpSuccess code = 1;
}
