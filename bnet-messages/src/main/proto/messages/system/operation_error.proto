syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "OperationErrorProto";

enum OpError {
  MASTER_NAME_ALREADY_TAKEN = 0;
  MASTER_MAX_MASTERS_REACHED = 1;
  MASTER_INVALID_NAME = 2;
  MASTER_GENERAL_ERROR = 3;

  EQUIP_SLOT_NOT_AVAILABLE = 4;
  EQUIP_ITEM_NOT_FOUND = 5;
  EQUIP_NOT_ALLOWED = 6;

  MASTER_INVALID_SPAWN_POINT = 7;

  AI_CONFIG_BESTIA_NOT_OWNED = 8;
  AI_CONFIG_INVALID_ORDERS = 9;

  // Also answers "no such master": a client must not be able to tell an id that does not exist from
  // one that belongs to somebody else, or deleting becomes a way to probe for foreign master ids.
  MASTER_NOT_OWNED = 10;
  // The name typed into the delete confirmation does not match the master's.
  MASTER_NAME_MISMATCH = 11;
  // The master is still live in the world (selected, or not finished writing itself back after a logout).
  MASTER_IN_USE = 12;

  // The prop is not there to be taken: never was, already collected by someone else, felled by the attack
  // path, or its column was re-materialised under a client still holding the old id. Deliberately one code
  // for all four, on the same reasoning as MASTER_NOT_OWNED above - the ids are ephemeral, and letting a
  // client tell "taken" from "never existed" would make them a way to probe what stands on ground it is not
  // holding.
  COLLECT_TARGET_GONE = 13;
  // Too far away. The one refusal a player can actually act on, which is why it is not folded into the code
  // above; the client walks into range before sending, so this should only be reachable under latency.
  COLLECT_OUT_OF_RANGE = 14;
  // The client offered a click on a kind that prop-kinds.yml gives no `collect` block. Not reachable by a
  // player - it means PropAppearance's Collectible mirror has drifted from the server, and it is kept
  // separate precisely so that drift is nameable rather than hidden inside COLLECT_TARGET_GONE.
  COLLECT_NOT_COLLECTIBLE = 15;

  // Crafting. The first three are refusals - the craft never started - and the last two are outcomes: the
  // materials are gone either way, which is the whole risk in a craft and has to be visible.
  //
  // Deliberately one code for "you cannot do this recipe" whatever the reason (unknown recipe, skill too
  // low, no station in range, target not held, target is a plain stack, nothing left to repair). A client
  // that could tell those apart would be a way to enumerate the recipe catalogue and other players' items,
  // and the crafting window already knows all of it except the target check.
  CRAFT_NOT_POSSIBLE = 16;
  CRAFT_MISSING_MATERIALS = 17;
  CRAFT_ALREADY_IN_PROGRESS = 18;
  CRAFT_FAILED = 19;
  // A failed rune-slot cut took the item with it - see MasterCraftBonusService.destroyChance.
  CRAFT_ITEM_DESTROYED = 20;

  // Placing a crafting station: no room, or already standing on somebody else's.
  STRUCTURE_NO_ROOM = 21;

  // Basic Skill gates what a player may do at all - see net.bestia.zone.account.master.skill.BasicSkillGate.
  // A code per subsystem rather than one shared code, because the ranks differ and the client says which rank
  // is needed. Trade posts and sitting are still unbuilt, so ranks 3 and 4 have nothing here.
  BASIC_SKILL_CHAT_LOCKED = 22;
  BASIC_SKILL_PARTY_LOCKED = 23;

  // The item is of a higher tier than the crafter can reach - see MasterCraftBonusService.maxItemLevel. Kept
  // apart from CRAFT_NOT_POSSIBLE because it is the one crafting refusal a player can act on by investing:
  // "raise the skill" is useful, and folding it into the catch-all would have hidden it.
  CRAFT_ITEM_TOO_ADVANCED = 24;

  // The wearer is below the item's level - see Item.level.
  EQUIP_LEVEL_TOO_LOW = 25;

  // Charts. The chart named is not held, not a chart at all, or the templates are missing from items.yml -
  // one code for all three on the reasoning MASTER_NOT_OWNED gives: a client that could tell them apart
  // would be a way to probe what other players are carrying.
  CHART_NOT_FOUND = 26;
  // Surveying and copying both consume a blank chart, and there is none in the inventory.
  CHART_NEEDS_BLANK = 27;
  // A chart cannot be merged into itself. Reachable only from a hand-built client - the map window picks two
  // rows - but the alternative would be silently consuming the chart into itself.
  CHART_MERGE_SAME = 28;
  // The chart was surveyed in a world that has since been regenerated, so its coverage names ground that no
  // longer exists. Named rather than folded into CHART_NOT_FOUND because the player still has the item and
  // would otherwise be told it does not exist.
  CHART_STALE_WORLD = 29;

  // Trading. Deliberately one code for every reason the other side cannot be traded with - not a player,
  // offline, already trading, gone, or the request sat unanswered until it expired. On the same reasoning
  // MASTER_NOT_OWNED gives: a client that could tell those apart would be a way to probe who is online and
  // what they are busy with.
  TRADE_TARGET_UNAVAILABLE = 30;
  // Too far away to ask. The one refusal a player can act on, which is why it is not folded into the code
  // above; the client only offers Trade on somebody in range, so this should only be reachable under latency.
  TRADE_OUT_OF_RANGE = 31;

  // The three ways a trade ends that are somebody else's doing, so the player is told who. Each carries the
  // other party's master name in args[0].
  TRADE_DECLINED = 32;
  TRADE_CANCELLED = 33;
  TRADE_WALKED_AWAY = 34;

  // The exchange itself could not be committed and was rolled back whole - nothing changed hands. Not
  // reachable by a player: it means the reserved items moved under the transaction, and both sides get it.
  TRADE_FAILED = 35;

  BASIC_SKILL_TRADE_LOCKED = 36;
  // Emotes are body language, so they open at the chat rank; worded on their own, since "you cannot speak"
  // would read oddly for a cheer.
  BASIC_SKILL_EMOTE_LOCKED = 102;

  // Chat commands. A command the player may not use is told apart from one that does not exist, because the
  // two are different problems: the first is answered by asking a GM, the second by checking the spelling.
  // The distinction leaks that a command exists, which is fine - `/help` lists them and they are not secret.
  CHAT_COMMAND_NO_PERMISSION = 37;
  CHAT_COMMAND_UNKNOWN = 38;
  // The command matched and then threw. Not reachable by typing: the grammar already rejected the bad forms,
  // so this means the command itself is broken, and the stack trace is server-side.
  CHAT_COMMAND_FAILED = 39;

  // Building. Only the reach, because it is the one refusal a player produces by playing: they walked off
  // mid-build, or clicked a site across the room. Everything else a site can refuse - an id that names
  // nothing, a target that is not a site - an honest client cannot send.
  BUILD_OUT_OF_RANGE = 40;
  // Shops. There is no settlement under the player's feet, or the one there has no economy - a ruin, or
  // a place history left nobody in.
  SHOP_NONE_HERE = 41;
  // The town does not deal in that at all. Separate from having run out, because the two are answered
  // differently: one is "come back tomorrow" and the other is "try somewhere else".
  SHOP_NOT_STOCKED = 42;
  // Fewer units on offer than asked for. What is on offer is the surplus above what the locals keep back
  // for themselves, so a town can be full of bread and still refuse to sell it.
  SHOP_OUT_OF_STOCK = 43;
  // The player has not got the coins. Carries the price in args[0], because the window may have been
  // drawn before the last trade moved it.
  SHOP_CANNOT_AFFORD = 44;
  // The town's treasury cannot cover what it would owe. A poor village genuinely cannot buy a cartload,
  // and refusing is honest where a bad price would still transfer money.
  SHOP_TREASURY_EMPTY = 45;
  // Was SHOP_TREASURY_FULL. A town now takes any amount of coin, and the surplus drains back to the world
  // reserve, so only the goods on offer limit what a player can buy.
  reserved 46;
  reserved "SHOP_TREASURY_FULL";

  // Walked away from whoever they were talking to.
  TALK_OUT_OF_RANGE = 47;

  // The whisper had nowhere to go. Deliberately one code for "no master of that name" and "that master
  // is not connected", on the same reasoning TRADE_TARGET_UNAVAILABLE gives: telling the two apart turns
  // whispering into a way to ask who is online. Carries the name that was typed in args[0], because the
  // sender is owed the spelling back and already knows it.
  CHAT_WHISPER_TARGET_UNAVAILABLE = 48;

  // The mint has nothing to strike coins out of. Every coin in the world comes from the world reserve,
  // and when that is empty no amount of gold will make more - which is the pressure that makes mining
  // worth doing rather than a fault the player can fix by trying again. Its own code rather than
  // CRAFT_NOT_POSSIBLE because the two ask for opposite things: one says learn more, this one says the
  // world is short and somebody has to go and dig.
  CRAFT_WORLD_OUT_OF_GOLD = 49;

  // Novice-only gear on a master who has invested a skill point outside the Novice tree. Sent both when one
  // is refused and when one the wearer already had is taken back off, which is why the wording has to read
  // for both - see `EquipmentRevalidationService`.
  EQUIP_NOVICE_ONLY = 50;

  // The bestia's species cannot wear armor of that weight, such as plate on a blob. The client does not grey
  // these out yet, so a player can ask for one.
  EQUIP_ARMOR_TYPE_NOT_WEARABLE = 51;

  // One side of a trade already offers as many lines as a trade holds. A player can reach this by offering
  // item after item, so it gets a code; the limit keeps the trade window and its database rows small.
  TRADE_OFFER_FULL = 52;

  // Bestia traps. Too far away to set: the client only offers a tile in reach, so this is the player having
  // walked while aiming.
  TRAP_OUT_OF_RANGE = 53;
  // No ground to set it on, or a trap is already there.
  TRAP_NO_ROOM = 54;
  // Every trap the master may have out at once is already set. Carries the limit in args[0].
  TRAP_LIMIT_REACHED = 55;
  // A trap caught a bestia and the master had no free bestia slot to keep it in, so it went free again.
  BESTIA_SLOTS_FULL = 56;

  // The server refused a request in a way no honest client can provoke (its UI does not offer it), so there
  // is nothing for the player to read; it only tells the client the request is over.
  REQUEST_REFUSED = 57;

  // An attack or a harmful skill aimed at a player, or at something a player owns, while a ward stone shields
  // one side. The ward is invisible, so this is how the attacker learns why nothing happened.
  COMBAT_TARGET_WARDED = 58;

  // A novice-only consumable, such as a novice potion, used by a master who has invested a skill point outside
  // the Novice tree. The item stays in the bag.
  ITEM_NOVICE_ONLY = 59;

  // Parties. One code for "no master of that name" and "that master is not being played", on the reasoning
  // CHAT_WHISPER_TARGET_UNAVAILABLE gives. The codes that name somebody carry that master's name in args[0].
  // Also what party chat answers when the sender is in no party.
  PARTY_NOT_IN_PARTY = 60;
  PARTY_PLAYER_NOT_FOUND = 61;
  // The invitation timed out, or was answered already.
  PARTY_INVITE_EXPIRED = 62;
  // Only the owner may invite, kick or change the EXP mode. Reachable through the chat commands, which the
  // party window's hidden buttons do not guard.
  PARTY_NO_PERMISSION = 63;
  PARTY_ALREADY_IN_PARTY = 64;
  PARTY_TARGET_IN_PARTY = 65;
  PARTY_NAME_IN_USE = 66;
  // Blank, too long, or not printable ASCII - see DisplayName.
  PARTY_INVALID_NAME = 67;
  // Every seat is taken, open invitations included.
  PARTY_FULL = 68;
  PARTY_NOT_A_MEMBER = 69;
  PARTY_INVITE_DECLINED = 70;

  // Guilds. The rules on who may do what to whom are enforced too, but the guild window only offers what the
  // recipient's rank allows, so breaking one answers REQUEST_REFUSED rather than a code of its own.
  GUILD_NAME_TAKEN = 71;
  // Blank, too long, or not printable ASCII - see DisplayName. Also a rank name.
  GUILD_INVALID_NAME = 72;
  // Also what guild chat answers when the sender is in no guild.
  GUILD_NOT_A_MEMBER = 73;
  // No master of that name, or not being played - one code, as for whispers. Carries the name in args[0].
  GUILD_TARGET_UNAVAILABLE = 74;
  GUILD_TARGET_IN_GUILD = 75;
  // Every seat is taken, open invitations included. Guild Extension seats more.
  GUILD_FULL = 76;
  GUILD_INVITE_EXPIRED = 77;
  GUILD_INVITE_DECLINED = 78;
  // A master leading a guild cannot be deleted while the guild stands: it hands the guild over or disbands it.
  // Carries the guild's name in args[0].
  GUILD_LEADER_MUST_DISBAND = 79;
  // A guild skill recovers for the whole guild after one member cast it.
  GUILD_SKILL_COOLDOWN = 80;
  // Emergency Recall works only inside the guild's own Stronghold.
  GUILD_NOT_IN_STRONGHOLD = 81;
  // Rally to the Banner needs the guild's War Banner standing.
  GUILD_NO_BANNER = 82;
  // Planting a War Banner needs Rally to the Banner and a rank that may use guild skills.
  GUILD_BANNER_NOT_ALLOWED = 83;
  GUILD_BANNER_OUT_OF_RANGE = 84;
  // The master was expelled from the guild and stays out until a rank that may kick lifts it. Carries the name
  // in args[0].
  GUILD_TARGET_EXPELLED = 85;
  // The notebook collection - routes, map marks - holds as many entries as it may; one has to go first.
  NOTEBOOK_FULL = 86;
  // Too far from the auction house's walls. The client walks up before it clicks, so this needs latency.
  AUCTION_OUT_OF_RANGE = 87;
  // A master may keep this many listings up at once; one has to sell or come down first.
  AUCTION_LISTING_LIMIT = 88;
  // The listing fee is paid up front and the purse does not hold it.
  AUCTION_CANNOT_AFFORD_FEE = 89;
  // Somebody else bought it first, or it ran out, between the board being drawn and the click.
  AUCTION_LISTING_GONE = 90;
  // The purse does not hold the price.
  AUCTION_CANNOT_AFFORD = 91;
  // The last torch in the light slot burnt out and the bag holds no other one to light.
  LIGHT_SOURCE_BURNT_OUT = 92;
  // A map click or a stop on a route lies in water too deep to wade. The client cannot tell from its map tiles.
  TRAVEL_DESTINATION_IN_WATER = 93;
  // Moving an item between two of the master's own entities. The client only offers it while they stand
  // together, so this needs one of them to walk off with the move in flight.
  EXCHANGE_OUT_OF_REACH = 94;
  // The receiver cannot carry that much more. The client caps what it sends at what fits, so this needs the
  // receiver to pick something up with the move in flight.
  EXCHANGE_TOO_HEAVY = 95;
  // Only a master trades: a trade settles against the master's own bag, so goods a bestia carries are handed to
  // the master first.
  TRADE_NEEDS_MASTER = 96;
  // A notebook entry changed in the other app since this one read it. The client lists it again.
  NOTEBOOK_STALE = 97;
  // A notebook entry this client may not write, or one its collection does not accept.
  NOTEBOOK_INVALID = 98;
  // The merchant is off shift. Their counter opens again with the hours the shop window showed.
  SHOP_CLOSED = 99;
  // The basket would leave the trader carrying more than they can.
  SHOP_TOO_HEAVY = 100;
  // Prices moved since the last quote and the trade would now come out worse than it was shown. The client
  // asks for a fresh quote.
  SHOP_PRICE_CHANGED = 101;
  // The merchant thinks so little of the trader's honor that they will not trade at all.
  SHOP_REFUSES_YOU = 107;

  // An emote asked for while walking, casting or crafting. The player stops and asks again.
  EMOTE_NOT_NOW = 103;

  // A wing used again before the last one's lock ran out. The player waits a few seconds.
  TELEPORT_NOT_READY = 104;
  // A wing used while casting, trading or logging out. The player finishes that first.
  TELEPORT_NOT_NOW = 105;
  // A wing found no dry ground to land on, or no save point. It is spent and the body stays.
  TELEPORT_NO_LANDING = 106;

  // A two-handed weapon and a left-hand item at once. The player takes one of them off first.
  EQUIP_HANDS_FULL = 108;
  // A shot with no ammo in the quiver that fits the weapon. The attack stops until the quiver is filled.
  ATTACK_OUT_OF_AMMO = 109;
  // Gear worn down to no durability. The player has it repaired before wearing it again.
  EQUIP_ITEM_BROKEN = 110;
  // A strip skill emptied the slot a moment ago. The player waits until its status runs out.
  EQUIP_SLOT_STRIPPED = 111;

  // No master has the name a letter was addressed to. The player checks the name. Args: the name.
  MAIL_RECIPIENT_UNKNOWN = 112;
  // The sender cannot pay a letter's postage. The player brings gold.
  MAIL_CANNOT_AFFORD = 113;
  // The recipient's mailbox is full. The player waits until they throw letters away. Args: the name.
  MAIL_RECIPIENT_FULL = 114;
  // A parcel over 10 kg. The player sends less, or hires a Transport commission.
  PARCEL_TOO_HEAVY = 115;
  // The sender cannot pay a parcel's freight fee. The player brings gold.
  PARCEL_CANNOT_AFFORD = 116;
  // A parcel waits at an office too far from this one. Args: that office's name.
  PARCEL_NOT_HERE = 117;
  // A parcel is still on the road. The player waits for its latest arrival time.
  PARCEL_NOT_ARRIVED = 118;
  // The postmaster has gone home. The player comes back during their hours.
  POST_OFFICE_CLOSED = 119;
  // A bound item, like a mail sack, never leaves its holder's bag by hand. The player delivers it instead.
  ITEM_BOUND = 120;
  // Parcels from the route board that weigh more than the courier can still carry. The courier takes fewer.
  ROUTE_TOO_HEAVY = 121;
  // The courier missed a mail deadline and is struck off. The player waits until STRUCK_OFF runs out.
  COURIER_STRUCK_OFF = 122;
  // The caster has less mana or stamina than the skill costs at this level.
  SKILL_NOT_ENOUGH_MANA = 123;
  SKILL_NOT_ENOUGH_STAMINA = 124;
  // The choice sent with a cast (an element, an item, a listing) is not one the skill accepts.
  SKILL_INVALID_CHOICE = 125;
  // Neither of the master's two professions allows this weapon type or armor weight.
  EQUIP_NOT_YOUR_PROFESSION = 126;
  // The effect already on the target came from a stronger cast; a weaker one cannot refresh it.
  SKILL_WEAKER_THAN_ACTIVE = 127;
  // A Mana Circle's ritual refused a click: too far, resting from the last one, not opened by its owner yet,
  // already channeling, joined twice, or five helpers already. FAILED: the leader broke off the channel.
  RITUAL_OUT_OF_RANGE = 128;
  RITUAL_FATIGUED = 129;
  RITUAL_NOT_OPEN = 130;
  RITUAL_RUNNING = 131;
  RITUAL_ALREADY_JOINED = 132;
  RITUAL_FULL = 133;
  RITUAL_FAILED = 134;
  // Every slot of the chest is taken and the goods would need a new one. The player takes something out first.
  CHEST_FULL = 135;
  // Only the master who built a chest, and that master's bestias, may open it.
  CHEST_NOT_YOURS = 136;
  // The chest is too far away to reach into. The player walks up to it.
  CHEST_OUT_OF_REACH = 137;
  // Listing and buying at a trade post needs Basic Skill 3. Browsing does not.
  BASIC_SKILL_TRADE_POST_LOCKED = 138;
  // A skill whose cast uses up an item (a bandage, a crystal) was started without one in the bag.
  SKILL_MISSING_REAGENT = 139;
  // A tree falls only to an axe or a felling tool like a hatchet.
  FELLING_NEEDS_AXE = 140;
  // Cartography at a theodolite: none of yours idle within reach, a survey size your level has not opened, the
  // needle missed (paper and ink are spent), not your theodolite, or still surveying (minutes left in args[0]).
  SURVEY_NO_THEODOLITE = 141;
  SURVEY_TIER_LOCKED = 142;
  SURVEY_MISSED = 143;
  SURVEY_NOT_YOURS = 144;
  SURVEY_IN_PROGRESS = 145;
  // A herb above the level the picker's Herbalism allows.
  HERB_TOO_RARE = 146;
  // Street stalls: the Trader already has one standing, all its listing places are taken, it packed up or the
  // offer was sold, the buyer lacks the coins, or stands too far away.
  STALL_ALREADY_OPEN = 147;
  STALL_FULL = 148;
  STALL_GONE = 149;
  STALL_CANNOT_AFFORD = 150;
  STALL_OUT_OF_RANGE = 151;

  // Player settlements, from 300 so other features can keep counting up from 122.
  // The town name is blank, shorter than 3 or longer than 24 characters, or not printable.
  SETTLEMENT_NAME_INVALID = 300;
  SETTLEMENT_NAME_TAKEN = 301;
  // The sender already holds a town or a sign site.
  SETTLEMENT_ALREADY_HELD = 302;
  // Another settlement, or a town that fell less than 48 h ago, is within 5 km.
  SETTLEMENT_TOO_CLOSE = 303;
  // A post office or auction house still stands in the sphere.
  SETTLEMENT_NOT_EMPTY = 304;
  // The named master is not nearby, has no Founder, or already holds a town. args[0] is the name.
  SETTLEMENT_CANNOT_RECEIVE = 305;
  // args[0] is who declined.
  SETTLEMENT_OFFER_DECLINED = 306;
  SETTLEMENT_OUT_OF_RANGE = 307;
  // This building only goes up inside a standing player town.
  SETTLEMENT_NEEDS_TOWN = 308;
  // The town already has this building, finished or still being built.
  SETTLEMENT_ALREADY_HAS_ONE = 309;
  // Repairs only happen inside a standing player town.
  REPAIR_OUTSIDE_TOWN = 310;
  REPAIR_NOT_NEEDED = 311;
  // The repairer carries none of the materials the repair needs.
  REPAIR_NEEDS_MATERIALS = 312;

  // Player auction houses, from 320.
  // The house's town has fallen; it trades nothing until a town holds it again.
  AUCTION_HOUSE_CLOSED = 320;
  // The owner fee can change once a day.
  AUCTION_FEE_CHANGED_RECENTLY = 321;
  // Listings are still up in the house.
  AUCTION_HOUSE_NOT_EMPTY = 322;
  // Trade Post Owner needs an auction house kit in the bag.
  TRADE_POST_NEEDS_KIT = 323;
  // The master runs as many auction houses as their Trade Post Owner level allows.
  TRADE_POST_LIMIT = 324;
  // The town needs a working post office first.
  TRADE_POST_NEEDS_POST_OFFICE = 325;
  // Somebody bid at least as much in the meantime. The board shows the new least bid.
  AUCTION_BID_TOO_LOW = 326;
  // An auction with a bid on it cannot be taken down.
  AUCTION_HAS_BIDS = 327;
  // Trade Agreement links auction houses, so the caster must own one.
  TRADE_AGREEMENT_NEEDS_HOUSE = 328;
  // The caster has as many partners as their Trade Agreement level allows.
  TRADE_AGREEMENT_LIMIT = 329;
  // args[0] owns no auction house, does not know Trade Agreement, has no free partner, or is linked already.
  TRADE_AGREEMENT_TARGET_INVALID = 330;
  // A purchase is collected at the house it waits at, by the master or one of their bestias.
  PICKUP_OUT_OF_RANGE = 331;
  // There is no water deep enough to fish where the line was cast.
  FISHING_NOT_WATER = 152;
  // The water is further away than a line reaches.
  FISHING_TOO_FAR = 153;
  // The bite came and went without a strike.
  FISHING_GOT_AWAY = 154;
  // Digging needs a shovel or a pickaxe in the right hand.
  DIG_NEEDS_TOOL = 332;
  // The ground under the spot is rock. The player digs it with a pickaxe.
  DIG_NEEDS_PICKAXE = 333;
  // The ground under the spot is soil. The player digs it with a shovel.
  DIG_NEEDS_SHOVEL = 334;
  // The spot is out of reach. The player walks closer.
  DIG_TOO_FAR = 335;
  // A metre of digging turned up nothing. Nothing is buried here.
  DIG_NOTHING_FOUND = 336;
  // Treasure Map found no cache the caster sensed in the last ten minutes. The player casts Treasure Sense first.
  TREASURE_MAP_NOTHING_SENSED = 337;
  // A Breeding Farm cannot start a clutch the client should not have offered: wrong pair, busy farm, not the owner.
  BREEDING_NOT_POSSIBLE = 218;
  // Every clutch needs a Nesting Bundle. The player makes or buys one.
  BREEDING_NEEDS_BUNDLE = 219;
  // A parent cannot walk to the farm, for example from deep water. The player brings it closer.
  BREEDING_PAIR_CANNOT_TRAVEL = 220;
  // A parent left, was sent off or died before the egg was laid; the clutch and its bundle are lost.
  BREEDING_CLUTCH_FAILED = 221;
  // The egg does not fit in the master's bag. The player makes room.
  BREEDING_NO_ROOM_FOR_EGG = 222;
  // An egg is ready to hatch, but its owner has no free bestia slot. It waits in the incubator until one frees up.
  INCUBATOR_NO_FREE_SLOT = 223;
  // Warp Portal: the saved spot picked is not there (any more), or the portal has no passage left or is gone.
  PORTAL_NO_SPOT = 155;
  PORTAL_SPENT = 156;
  // Spell scrolls: the bestia is not one of yours, its level is below the attack's, or it knows the attack
  // already. Training or extraction failed; the scroll is spent either way.
  SPELL_NOT_OWN_BESTIA = 157;
  SPELL_LEVEL_TOO_LOW = 158;
  SPELL_ALREADY_KNOWN = 159;
  SPELL_TRAINING_FAILED = 160;
  SPELL_INSCRIPTION_FAILED = 161;
  // A failed extraction broke the bestia's mind. It is lost; its bag went to the master by post.
  SPELL_MIND_BROKEN = 162;
  // A spell scroll aimed past its attack's reach; the scroll stays in the bag.
  SPELL_OUT_OF_RANGE = 163;
  // Spell Binding: the scroll's attack is above what the skill level may bind, or the trigger is not learned yet.
  SPELL_BINDING_TOO_STRONG = 380;
  SPELL_BINDING_TRIGGER_LOCKED = 381;
  // A rite that blesses water, like Aqua Benedicta, needs its caster to stand in water.
  SKILL_NEEDS_WATER = 164;
  // The master has an order preset or a named place of that name already.
  ORDERS_NAME_TAKEN = 224;
  // The master has as many order presets as allowed.
  ORDERS_TOO_MANY_PRESETS = 225;
  // The master has as many named places as allowed.
  ORDERS_TOO_MANY_PLACES = 226;
  // A skill meant for the caster's own bestias, like Mindbreak, was aimed at something else.
  SKILL_NEEDS_OWN_BESTIA = 165;
  // A strike from hiding, like Backstab or Shadow Step, was used without Hide or Cloak on.
  SKILL_NEEDS_HIDING = 166;
  // Backstab was aimed at a target the caster does not stand behind.
  SKILL_NEEDS_BEHIND = 167;
  // Strip Equipment failed against gear under Equipment Coating.
  STRIP_GEAR_COATED = 168;
  // A weapon was put into the left hand by a master without Dual Wield.
  EQUIP_NEEDS_DUAL_WIELD = 169;
  // A skill that forces a fight, like Provoke, was aimed at a master. Only creatures can be forced.
  SKILL_NOT_ON_MASTERS = 170;
  // A skill for a long weapon, like Brandish Spear, was used without a spear or a polearm in hand.
  SKILL_NEEDS_SPEAR = 171;
  // A shield skill, like Shield Wall, was used without a shield in the left hand.
  SKILL_NEEDS_SHIELD = 172;
  // A skill that guards someone else, like Devotion, was aimed at the caster or at someone outside the party.
  SKILL_NEEDS_PARTY_MEMBER = 173;
  // A staff skill, like Staff Sweep, was used without a staff in hand.
  SKILL_NEEDS_STAFF = 174;
  // Chain Combo was used without a Triple Blow landed just before it.
  SKILL_NEEDS_TRIPLE_BLOW = 175;
  // A finisher like Ultima Fist was used while not Berserk.
  SKILL_NEEDS_BERSERK = 176;
  // A finisher like Ultima Fist was used with less than half the mana.
  SKILL_NEEDS_HALF_MANA = 177;
  // A throwing skill, like Javelin, was used without a spear or a thrown weapon in hand.
  SKILL_NEEDS_SPEAR_OR_THROWN = 178;
  // A throwing skill was used with the last of the thrown weapon in hand: none is left in the bag to throw.
  SKILL_NOTHING_TO_THROW = 179;
  // A bow skill, like Double Strafe, was used without a bow in hand.
  SKILL_NEEDS_BOW = 180;
  // A whip skill, like Hobbling Lash, was used without a whip in hand.
  SKILL_NEEDS_WHIP = 181;
  // An instrument skill, like Discord Strike, was used without an instrument in hand.
  SKILL_NEEDS_INSTRUMENT = 182;
  // A skill that helps an ally, like Potion Pitcher, was aimed at something on the other side.
  SKILL_NEEDS_ALLY = 183;
}

message OperationError {
  OpError code = 1;

  // Substitution values for the client's message template, in order - a player's name, a count, a place.
  // Never a server-composed sentence: the wording and its translation stay on the client, which is what
  // keeps a code from quietly becoming an English string on the wire. Most codes carry none.
  repeated string args = 2;
}

