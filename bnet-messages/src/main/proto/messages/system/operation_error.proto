syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "OperationErrorProto";

enum OpError {
  MASTER_NAME_ALREADY_TAKEN = 0;
  MASTER_MAX_MASTERS_REACHED = 1;
  MASTER_INVALID_NAME = 2;
  MASTER_GENERAL_ERROR = 3;

  EQUIP_SLOT_NOT_AVAILABLE = 4;
  EQUIP_ITEM_NOT_FOUND = 5;
  EQUIP_NOT_ALLOWED = 6;

  MASTER_INVALID_SPAWN_POINT = 7;

  AI_CONFIG_BESTIA_NOT_OWNED = 8;
  AI_CONFIG_INVALID_STANCE = 9;

  // Also answers "no such master": a client must not be able to tell an id that does not exist from
  // one that belongs to somebody else, or deleting becomes a way to probe for foreign master ids.
  MASTER_NOT_OWNED = 10;
  // The name typed into the delete confirmation does not match the master's.
  MASTER_NAME_MISMATCH = 11;
  // The master is still live in the world (selected, or not finished writing itself back after a logout).
  MASTER_IN_USE = 12;

  // The prop is not there to be taken: never was, already collected by someone else, felled by the attack
  // path, or its column was re-materialised under a client still holding the old id. Deliberately one code
  // for all four, on the same reasoning as MASTER_NOT_OWNED above - the ids are ephemeral, and letting a
  // client tell "taken" from "never existed" would make them a way to probe what stands on ground it is not
  // holding.
  COLLECT_TARGET_GONE = 13;
  // Too far away. The one refusal a player can actually act on, which is why it is not folded into the code
  // above; the client walks into range before sending, so this should only be reachable under latency.
  COLLECT_OUT_OF_RANGE = 14;
  // The client offered a click on a kind that prop-kinds.yml gives no `collect` block. Not reachable by a
  // player - it means PropAppearance's Collectible mirror has drifted from the server, and it is kept
  // separate precisely so that drift is nameable rather than hidden inside COLLECT_TARGET_GONE.
  COLLECT_NOT_COLLECTIBLE = 15;

  // Crafting. The first three are refusals - the craft never started - and the last two are outcomes: the
  // materials are gone either way, which is the whole risk in a craft and has to be visible.
  //
  // Deliberately one code for "you cannot do this recipe" whatever the reason (unknown recipe, skill too
  // low, no station in range, target not held, target is a plain stack, nothing left to repair). A client
  // that could tell those apart would be a way to enumerate the recipe catalogue and other players' items,
  // and the crafting window already knows all of it except the target check.
  CRAFT_NOT_POSSIBLE = 16;
  CRAFT_MISSING_MATERIALS = 17;
  CRAFT_ALREADY_IN_PROGRESS = 18;
  CRAFT_FAILED = 19;
  // A failed rune-slot cut took the item with it - see MasterCraftBonusService.destroyChance.
  CRAFT_ITEM_DESTROYED = 20;

  // Placing a crafting station: no room, or already standing on somebody else's.
  STRUCTURE_NO_ROOM = 21;

  // Basic Skill gates what a player may do at all - see net.bestia.zone.account.master.skill.BasicSkillGate.
  // Two codes rather than one because the ranks differ and the client says which rank is needed; only the two
  // subsystems that exist are gated, so there is nothing here for trading, trade posts or sitting.
  BASIC_SKILL_CHAT_LOCKED = 22;
  BASIC_SKILL_PARTY_LOCKED = 23;

  // The item is of a higher tier than the crafter can reach - see MasterCraftBonusService.maxItemLevel. Kept
  // apart from CRAFT_NOT_POSSIBLE because it is the one crafting refusal a player can act on by investing:
  // "raise the skill" is useful, and folding it into the catch-all would have hidden it.
  CRAFT_ITEM_TOO_ADVANCED = 24;

  // The wearer is below the item's level - see Item.level.
  EQUIP_LEVEL_TOO_LOW = 25;

  // Charts. The chart named is not held, not a chart at all, or the templates are missing from items.yml -
  // one code for all three on the reasoning MASTER_NOT_OWNED gives: a client that could tell them apart
  // would be a way to probe what other players are carrying.
  CHART_NOT_FOUND = 26;
  // Surveying and copying both consume a blank chart, and there is none in the inventory.
  CHART_NEEDS_BLANK = 27;
  // A chart cannot be merged into itself. Reachable only from a hand-built client - the map window picks two
  // rows - but the alternative would be silently consuming the chart into itself.
  CHART_MERGE_SAME = 28;
  // The chart was surveyed in a world that has since been regenerated, so its coverage names ground that no
  // longer exists. Named rather than folded into CHART_NOT_FOUND because the player still has the item and
  // would otherwise be told it does not exist.
  CHART_STALE_WORLD = 29;
}

message OperationError {
  OpError code = 1;
}

