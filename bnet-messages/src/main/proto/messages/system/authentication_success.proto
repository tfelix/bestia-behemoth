syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "AuthenticationSuccessProto";

enum ClientPermissions {
    KILL = 0;
    MAP_MOVE = 1;
}

message AuthenticationSuccess {
    string serverVersion = 1;
    ClientPermissions permissions = 2;

    // Credential for the client's HTTP requests, good for exactly as long as this connection. The map is
    // the only thing behind it today; it is named for what it authenticates rather than for that one caller.
    string http_ticket = 3;
}
