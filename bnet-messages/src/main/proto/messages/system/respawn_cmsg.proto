syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "RespawnCmsgProto";

// Client asks for its currently active entity to be revived at its save point. Carries nothing: the
// server resolves which entity acts from the session and where it belongs from the database, and
// refuses the request unless that entity is actually dead.
message RespawnCMSG {
}
