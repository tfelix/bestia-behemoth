syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "TradeLinkNoticeSmsgProto";

// A Trade Agreement of the receiver began or ended. The client words it.
message TradeLinkNoticeSMSG {
  enum Notice {
    LINKED = 0;
    CUT = 1;
    DECLINED = 2;
  }

  Notice notice = 1;
  string partner_name = 2;
}
