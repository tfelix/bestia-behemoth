syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "AuctionPurchasedSmsgProto";

// The sender bought a listing; the goods are already in the inventory.
message AuctionPurchasedSMSG {
  uint64 listing_id = 1;
  uint64 item_id = 2;
  int32 amount = 3;
}
