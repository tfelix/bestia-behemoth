syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "BuyAuctionListingCmsgProto";

// Buys a whole listing at its price. Answered by AuctionPurchasedSMSG, or by an OperationError.
message BuyAuctionListingCMSG {
  uint64 house_entity_id = 1;
  uint64 listing_id = 2;
}
