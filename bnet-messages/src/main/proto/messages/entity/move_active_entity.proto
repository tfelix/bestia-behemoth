syntax = "proto3";

package bnet;

import "messages/delta_path.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "MoveActiveEntityProto";

/**
 * Sends the active selected entity to the server.
 */
message MoveActiveEntity {
  reserved 1; // the path as absolute waypoints, now `path` below
  DeltaPath path = 3;
  // Continue the walk under way: the path starts next to the current path's last step and is added to it,
  // so the entity does not stop between legs. A path that does not join it is ignored.
  bool append = 2;
}
