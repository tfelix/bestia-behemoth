syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "StallListCmsgProto";

// The seller puts goods from their bag on their own stall, for `price` coins the lot.
message StallListCMSG {
  uint64 stall_entity_id = 1;
  uint64 player_item_id = 2;
  int32 amount = 3;
  int64 price = 4;
}
