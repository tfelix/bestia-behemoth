syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "ConfirmTradeCmsgProto";

// The final commitment, accepted only once both sides are locked. One-way: there is no un-confirm, and
// the exchange runs the moment the second one arrives.
message ConfirmTradeCMSG {
  uint64 trade_id = 1;
}
