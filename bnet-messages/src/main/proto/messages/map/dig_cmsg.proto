syntax = "proto3";

package bnet;

import "messages/vec3.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "DigCMSGProto";

/**
 * Starts digging at a ground tile with the shovel or pickaxe in the right hand.
 *
 * The server digs one metre at a time and keeps going while a treasure cache lies below. Moving or taking
 * damage stops it, like a craft.
 */
message DigCMSG {
  Vec3 position = 1;
}
