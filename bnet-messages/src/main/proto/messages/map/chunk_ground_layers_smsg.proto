syntax = "proto3";

package bnet;

import "messages/map/chunk.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "ChunkGroundLayersSMSGProto";

/**
 * How one layer's cells are laid out.
 *
 * A discriminator for `ChunkGroundOverlayEncoding`'s reason, and the same hazard: **any** byte string is a
 * legal payload. A decoder that disagrees about the layout does not fail - it draws a plausible pattern of
 * wear in the wrong places, which is indistinguishable from ground people happen to have walked oddly. So the
 * format is named on the wire and pinned by a fixture test on both sides.
 */
enum ChunkGroundLayerEncoding {
  /** Refuse. Zero is "nobody said", which is a different thing from the first format. */
  CHUNK_GROUND_LAYER_ENCODING_UNSPECIFIED = 0;

  /**
   * `chunk_size * chunk_size` nibbles, cell `(localX, localY)` at index `localY * chunk_size + localX`, that
   * index's nibble in byte `index / 2` - **low nibble for an even index, high for an odd one**.
   *
   * The same cell order `ColumnMask` and `ColumnSummary` use, so a reader who knows one knows the others.
   * Sixteen levels because that is what is worth drawing; the server accumulates in a byte and quantises here,
   * since one footfall has to be worth far less than one visible step.
   */
  CHUNK_GROUND_LAYER_ENCODING_NIBBLE_V1 = 1;

  /**
   * The exact levels of every non-zero cell, **including those below the layer's visible threshold**: repeated
   * `(cell index u16 little endian, level u8)`, ascending by index, 3 bytes each. The index is
   * `localY * chunk_size + localX`.
   *
   * For the layers a client keeps adding to itself (`WORN`, `BLOODIED`). A nibble payload would not do: it drops
   * the low four bits and every cell under the threshold, so a client seeded from it would cross the threshold
   * at a different footfall than the server did. Pair with `last_decayed_second`.
   */
  CHUNK_GROUND_LAYER_ENCODING_LEVELS_SPARSE_V1 = 2;
}

/** Which kind of mark a set of cells describes. Mirrors the server's `GroundLayer`; never renumbered. */
enum GroundLayerId {
  GROUND_LAYER_UNSPECIFIED = 0;
  GROUND_LAYER_SCORCHED = 1;
  GROUND_LAYER_WORN = 2;
  GROUND_LAYER_BLOODIED = 3;
  GROUND_LAYER_DISTURBED = 4;
}

/**
 * One layer's worth of cells for one column.
 *
 * Replaces whatever the client held for this layer. Empty `cells` retires it.
 */
message GroundLayerCells {
  GroundLayerId layer = 1;
  ChunkGroundLayerEncoding encoding = 2;
  bytes cells = 3;

  /**
   * The Bestia second, on `WorldTimeSMSG.world_age_bestia_seconds`'s axis, up to which these levels have
   * already faded. A client continues the fade from here with the same integer arithmetic as the server, so
   * it is the whole of the decay state. Zero for an encoding that does not decay (`NIBBLE_V1`).
   */
  int64 last_decayed_second = 4;
}

/**
 * What lasting has happened to the ground of one chunk column.
 *
 * ### Why this is not part of the chunk, and not `ChunkGroundOverlaySMSG` either
 *
 * Not part of the chunk, for the reason `ChunkGroundOverlaySMSG` gives: `ChunkPatchEncoding` has exactly one
 * value, `CHUNK_PATCH_ENCODING_REMOVAL_V1`, and a client derives a patched voxel's material locally - so no
 * message in this protocol can change a voxel's material. Ground history travels beside the ground.
 *
 * Not `ChunkGroundOverlaySMSG`, because that message carries what is **happening** to a column - fire, which
 * moves several times a second - and this carries what the column **is**, which changes rarely. Sharing one
 * message would re-send every worn cell on every step of a grass fire.
 *
 * ### Each layer is replaced on its own
 *
 * A message names the layers it speaks about, and the client replaces exactly those. A layer that is not
 * named is untouched, and one named with empty cells is retired. A scorch can therefore go out alone while a
 * fire burns, without re-sending the wear and blood beside it.
 *
 * ### Who lays what
 *
 * `WORN` and `BLOODIED` are laid by the client itself from what it sees walk and die (see
 * `GroundMarkRulesSMSG`), so they are sent on arrival and then only as a rare resync that corrects drift.
 * `SCORCHED` follows the fire, which a client cannot simulate, so it is sent whenever it changes.
 *
 * ### Not in the manifest, not requested, and not a delta
 *
 * Pushed behind the terrain and dropped when the manifest withdraws the column, exactly as
 * `ChunkStaticEntitiesSMSG` and `ChunkGroundOverlaySMSG` are.
 *
 * **Each layer entry is the whole layer for the column, never a diff.** A lost one self-heals on the next send
 * and applying the same one twice changes nothing.
 */
message ChunkGroundLayersSMSG {
  /**
   * The column. `z` is meaningless and must be ignored, as in `ChunkGroundOverlaySMSG`: what happened to the
   * ground happened to the surface, which belongs to a column rather than to a slab.
   */
  ChunkPos pos = 1;

  /** The layers this message speaks about. See the message note on what a missing layer means. */
  repeated GroundLayerCells layers = 2;

  /**
   * Marks with a shape and a heading - footprints - went to `ChunkGroundStampsSMSG` instead: they arrive
   * several times a second, and carrying them here would re-send every worn cell behind every footstep.
   */
  reserved 3;
}
