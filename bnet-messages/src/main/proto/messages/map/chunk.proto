syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "ChunkProto";

/**
 * A chunk address.
 *
 * Three signed ints rather than the folded `ChunkPos.key()` the server uses internally: that key masks
 * each axis to 21 *unsigned* bits, and z is routinely negative because voxel index 0 sits at sea level
 * rather than at a world floor. A folded key cannot carry that, so it stays a cache key and never
 * reaches the wire.
 */
message ChunkPos {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}

/**
 * A chunk address plus the revision of its content, which is what a manifest is made of.
 *
 * The revision starts at zero for an untouched chunk and increments once per applied edit batch. A
 * client that already holds this (position, revision) pair needs nothing sent; that comparison is the
 * entire point of announcing a manifest before shipping any payload.
 */
message ChunkRef {
  ChunkPos pos = 1;
  uint32 revision = 2;
}

/**
 * How the bytes in a chunk payload are encoded.
 *
 * Deliberately separate from the server's pipeline/palette/format version vector and from the
 * `chunk_engine_version` the client is told: an encoding can be *added* without invalidating a single
 * stored chunk or obsoleting a single client, because a payload names its own. Folding it into a version
 * would turn a purely additive change into a forced update.
 */
enum ChunkEncoding {
  /** A payload that does not say how it was encoded cannot be decoded; refuse rather than guess. */
  CHUNK_ENCODING_UNSPECIFIED = 0;

  /** Run-length encoding, version 2 - the format `RleCodec` writes. Self-describing about its dimensions. */
  CHUNK_ENCODING_RLE_V2 = 1;
}

/**
 * How the bytes in a chunk *patch* are encoded.
 *
 * Separate from `ChunkEncoding` because a patch and a snapshot are different formats solving different
 * problems, and they will not change together.
 *
 * A patch needs a discriminator more urgently than a snapshot does, which is the reason this enum exists at
 * all. Every byte of a packed removal stream is a legal varint continuation, so a decoder reading one format
 * as the other does not fail - it produces **plausible garbage**, silently, and neither existing safety net
 * notices: the revision check passes because the revision really did advance, and `base_hash` is only carried
 * on a snapshot, never re-verified on a patch. The failure would surface as terrain quietly disagreeing
 * between server and client, which is the one thing this whole subsystem is built to prevent. One byte per
 * patch buys immunity to it.
 */
enum ChunkPatchEncoding {
  /** A patch that does not say how it was encoded cannot be decoded; refuse rather than guess. */
  CHUNK_PATCH_ENCODING_UNSPECIFIED = 0;

  /**
   * Delta-coded voxel removals: `repeated: uvar indexDelta, u8 remainingOccupancy`.
   *
   * The only format there has ever been in a shipped build, but not numbered zero - a client that reads a
   * field it was compiled before seeing gets `UNSPECIFIED` from proto3 and must refuse, and that only works
   * if refusing and "the first format" are different values.
   */
  CHUNK_PATCH_ENCODING_REMOVAL_V1 = 1;
}

/**
 * Whether a payload was compressed on top of its encoding.
 *
 * Zero is `NONE` on purpose, mirroring the framing byte in `DeflatedBlobStore`: a uniform underground
 * chunk encodes to thirteen bytes and *grows* to nineteen if deflated, and there are a very great many
 * of those. Compressing unconditionally would make the commonest chunk in the world bigger.
 */
enum ChunkCompression {
  CHUNK_COMPRESSION_NONE = 0;
  CHUNK_COMPRESSION_DEFLATE = 1;
}
