syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "WorldInfoSMSGProto";

/**
 * The world's shape and identity, sent once per connection as soon as it is authenticated.
 *
 * Everything here is needed before a chunk payload means anything: the client cannot turn a position
 * into a chunk address without the chunk dimensions, and cannot turn a voxel index back into an
 * elevation without the voxel size and the fact that index zero is sea level.
 *
 * ### The seed is deliberately absent
 *
 * The client does not generate base terrain, so it has no use for the seed - and the seed is exactly
 * what would let it precompute every ore deposit in the world without prospecting for any of them.
 * It becomes sendable if and when client-side base generation ships, and not before.
 */
message WorldInfoSMSG {
  string name = 1;

  int32 width_cells = 2;
  int32 height_cells = 3;
  double cell_size_metres = 4;

  int32 chunk_size = 10;
  int32 chunk_height = 11;
  double voxel_size_metres = 12;
  double sea_level_metres = 13;

  /** East and west are the same place. */
  bool wrap_x = 20;
  /** North and south are the same place. */
  bool wrap_y = 21;

  /**
   * One number covering everything a client has to agree with the server about to read a chunk: the
   * RLE encoding and the block palette the ids in it index into.
   *
   * The server tracks the two separately, plus a third for the generation pipeline, because it has to
   * diagnose them separately - a stale cache entry is a different problem from an unreadable blob. A
   * client that receives only merged chunks, which is every client today, cannot act on that
   * distinction: either it can decode what arrives and name the materials, or it must be updated.
   * Sending the vector would only invite it to make a decision it has no basis for.
   */
  uint32 chunk_engine_version = 30;

  /** How far the server will stream, in chunks from the player's own. Informational; the server decides. */
  int32 view_radius_chunks = 40;

  /**
   * Identity of the coarse surface patches this world produces, so a client may keep them on disk.
   *
   * A patch never changes for a given world, which is what makes a cache across sessions safe where the
   * chunk cache is not - a chunk is keyed on a revision the server forgets when it restarts. But "a given
   * world" has to be checkable, and neither of the two numbers already here can do it: the seed is
   * deliberately absent, and [chunk_engine_version] says whether the client can *decode* a payload, not
   * which world produced it. Cache against that and a regenerated world reads back the old world's terrain.
   *
   * So this folds the world row's own generation identity together with the patch format version. It
   * changes when the ground changes, and a client that sees a new value throws its stored patches away.
   */
  uint32 surface_patch_version = 41;

  /** How far coarse patches reach, in chunks from the player's own. Zero when the server sends none. */
  int32 patch_radius_chunks = 42;

  /**
   * The world calendar, as an anchor the client runs forward on its own rather than as a ticking message.
   *
   * A clock that is pushed has to be pushed often enough to look like a clock, which is a message per player
   * per second for a HUD readout - and it would still need interpolating between them. Sending the reading
   * once and the rate it advances at costs one message per connection and ticks smoothly by construction.
   *
   * Deliberately elapsed Bestia-seconds rather than a wall-clock instant. The client never has to be trusted
   * to know what time it is, and a machine with a badly set clock shows the same date as everyone else.
   */
  double world_age_bestia_seconds = 50;

  /** How many times faster Bestia time runs than real time - what the client advances the reading by. */
  double time_speed_factor = 51;

  /**
   * The shape of the calendar.
   *
   * Sent rather than compiled into the client for the reason the block palette's ordinals are a stated wire
   * format: these are the numbers a date rolls over at, and a client carrying its own copy would keep
   * displaying a plausible wrong date after the server's changed rather than failing where anyone can see it.
   */
  int32 hours_per_day = 52;
  int32 days_per_month = 53;
  int32 months_per_year = 54;

  /**
   * The four hours the day is cut at, splitting it into full night, dawn, full day and dusk:
   *
   * ```
   * 00 ---- night_end -- dawn_end ------------ dusk_start -- night_start ---- 24
   *   full night   |   dawn   |    full day     |    dusk    |   full night
   * ```
   *
   * Ordered `night_end < dawn_end < dusk_start < night_start < hours_per_day`; only full night wraps
   * midnight, because it is the two open ends of that ordering.
   *
   * ### Sent because the client has to draw the curve, not just read a flag
   *
   * Light level is a per-frame quantity and the clock is an anchor sent once per connection, so there is no
   * message that could carry it - the client evaluates the same ramp the server does, from the same
   * boundaries. That is also why this replaced a single `night_hours`: a boolean cannot express a sunset,
   * and a renderer handed one produces a light switch.
   *
   * Field 55 was that `night_hours`, and is reserved rather than reused. It meant "hours `[0, n)` are dark",
   * which a client reading a new server as an old message would decode as a 4-hour night starting at
   * midnight - plausible, wrong, and silent.
   */
  reserved 55;
  reserved "night_hours";

  int32 night_end_hour = 56;
  int32 dawn_end_hour = 57;
  int32 dusk_start_hour = 58;
  int32 night_start_hour = 59;
}
