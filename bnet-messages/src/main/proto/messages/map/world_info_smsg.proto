syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "WorldInfoSMSGProto";

/**
 * The world's shape and identity, sent once per connection as soon as it is authenticated.
 *
 * Everything here is needed before a chunk payload means anything: the client cannot turn a position
 * into a chunk address without the chunk dimensions, and cannot turn a voxel index back into an
 * elevation without the voxel size and the fact that index zero is sea level.
 *
 * ### The seed is deliberately absent
 *
 * The client does not generate base terrain, so it has no use for the seed - and the seed is exactly
 * what would let it precompute every ore deposit in the world without prospecting for any of them.
 * It becomes sendable if and when client-side base generation ships, and not before.
 */
message WorldInfoSMSG {
  string name = 1;

  int32 width_cells = 2;
  int32 height_cells = 3;
  double cell_size_metres = 4;

  int32 chunk_size = 10;
  int32 chunk_height = 11;
  double voxel_size_metres = 12;
  double sea_level_metres = 13;

  /** East and west are the same place. */
  bool wrap_x = 20;
  /** North and south are the same place. */
  bool wrap_y = 21;

  /**
   * One number covering everything a client has to agree with the server about to read a chunk: the
   * RLE encoding and the block palette the ids in it index into.
   *
   * The server tracks the two separately, plus a third for the generation pipeline, because it has to
   * diagnose them separately - a stale cache entry is a different problem from an unreadable blob. A
   * client that receives only merged chunks, which is every client today, cannot act on that
   * distinction: either it can decode what arrives and name the materials, or it must be updated.
   * Sending the vector would only invite it to make a decision it has no basis for.
   */
  uint32 chunk_engine_version = 30;

  /** How far the server will stream, in chunks from the player's own. Informational; the server decides. */
  int32 view_radius_chunks = 40;
}
