syntax = "proto3";

package bnet;

import "messages/vec3.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "DetectedEntitiesSmsgProto";

// What a Detect skill found around its caster: masters and player bestia, hidden ones included. Only for the
// caster's map, which shows them for `seconds`; they are not revealed in the world.
message DetectedEntitiesSMSG {
  repeated DetectedEntity entities = 1;
  float seconds = 2;
}

message DetectedEntity {
  uint64 entity_id = 1;
  Vec3 position = 2;
  // A master rather than a bestia, so the map can draw them apart.
  bool master = 3;
}
