syntax = "proto3";

package bnet;

import "messages/vec3.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "TreasureShimmerSMSGProto";

/**
 * Treasure Sense found these caches. The client shows a faint shimmer on the ground above each one, for the
 * caster only, until `seconds` have passed.
 */
message TreasureShimmerSMSG {
  repeated Vec3 spots = 1;
  float seconds = 2;
}
