syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "DropItemCMSGProto";

message DropItemCMSG {
  reserved 1, 3; // item_id and unique_id, replaced by player_item_id

  // The held item to drop from, as InventoryItem.player_item_id names it.
  uint64 player_item_id = 4;
  uint32 amount = 2;
}
