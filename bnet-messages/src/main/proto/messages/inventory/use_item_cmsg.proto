syntax = "proto3";

package bnet;

import "messages/system/script_args.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "UseItemCMSGProto";

/**
 * Asks to use one item out of the inventory of the currently selected entity.
 */
message UseItemCMSG {
  reserved 1; // item_id: two piles of one item can differ, so the client names the one it means

  // The held item to use, as InventoryItem.player_item_id names it.
  uint64 player_item_id = 3;

  /**
   * What the client gathered before sending, for items whose script needs more than "use it".
   *
   * Empty for the ordinary case - an apple needs no arguments. Which keys a script reads is the
   * script's own business; see `ScriptArgKeys`.
   */
  ScriptArgs args = 2;
}
