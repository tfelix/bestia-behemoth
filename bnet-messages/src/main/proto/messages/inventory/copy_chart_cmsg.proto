syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "CopyChartCmsgProto";

/**
 * Copy a map chart onto a sheet of blank vellum.
 *
 * The blank is consumed and the original is untouched, so the point of it is selling: a surveyor can part with
 * a copy of what they know without parting with knowing it.
 */
message CopyChartCMSG {
  uint64 unique_id = 1;
}
