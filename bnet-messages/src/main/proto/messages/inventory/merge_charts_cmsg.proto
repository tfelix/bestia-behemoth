syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "MergeChartsCmsgProto";

/**
 * Join two map charts held in the inventory into one.
 *
 * Not a skill activation, deliberately. Cartography only *makes* charts; joining two is an inventory operation
 * anyone can do with the right items in hand, which is what makes a chart worth buying from somebody who has
 * surveyed ground you have not.
 *
 * The union goes into `into_unique_id` and the other chart is consumed - a merge that left both would let one
 * chart be duplicated for free.
 */
message MergeChartsCMSG {
  // The chart that stays, and ends up holding both surveys.
  uint64 into_unique_id = 1;

  // The chart that is consumed.
  uint64 from_unique_id = 2;
}
