syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "ParcelQuoteSmsgProto";

// What a parcel costs and when it arrives at the latest.
message ParcelQuoteSMSG {
  string recipient_name = 1;
  string destination_name = 2;
  int32 weight_units = 3;
  int64 fee = 4;
  int64 latest_arrival_epoch_seconds = 5;
}
