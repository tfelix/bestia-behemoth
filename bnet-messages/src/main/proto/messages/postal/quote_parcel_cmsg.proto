syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "QuoteParcelCmsgProto";

import "messages/postal/parcel.proto";

// Weighs a parcel and asks its fee and latest arrival time. Answered by ParcelQuoteSMSG or an OperationError.
message QuoteParcelCMSG {
  uint64 postmaster_entity_id = 1;
  string recipient_name = 2;
  repeated ParcelItem items = 3;
}
