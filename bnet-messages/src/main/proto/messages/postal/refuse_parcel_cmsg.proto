syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "RefuseParcelCmsgProto";

// Sends a parcel back to its sender, at no cost. Answered by ParcelsSMSG.
message RefuseParcelCMSG {
  uint64 postmaster_entity_id = 1;
  uint64 parcel_id = 2;
}
