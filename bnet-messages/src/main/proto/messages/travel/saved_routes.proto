syntax = "proto3";

package bnet;

import "messages/vec3.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SavedRoutesProto";

// A way a master keeps to send its entities along again, by name: from the first waypoint to the last, and
// back the other way.
message SavedRoute {
  uint64 id = 1;
  string name = 2;
  repeated Vec3 waypoints = 3;
  // False while the name is the one the server gave it from where the route starts and ends.
  bool custom_name = 4;
}

// Every route the selected master keeps. Sent on request and whenever one changes.
message SavedRoutesSMSG {
  repeated SavedRoute routes = 1;
}

message RequestSavedRoutesCMSG {
}

// No name lets the server name it from where it starts and ends.
message SaveRouteCMSG {
  repeated Vec3 waypoints = 1;
  string name = 2;
}

// An empty name gives the route its server-given name back.
message RenameRouteCMSG {
  uint64 route_id = 1;
  string name = 2;
}

message DeleteRouteCMSG {
  uint64 route_id = 1;
}
