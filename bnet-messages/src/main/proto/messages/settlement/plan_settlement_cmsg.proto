syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "PlanSettlementCmsgProto";

// Names the town the sender is about to found. Sent before the Founder cast, which takes the name. Answered by
// SettlementPlannedSMSG or an OperationError.
message PlanSettlementCMSG {
  string name = 1;
}
