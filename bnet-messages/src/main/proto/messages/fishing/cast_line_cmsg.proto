syntax = "proto3";

package bnet;

import "messages/vec3.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "CastLineCmsgProto";

// The active master casts a fishing line onto the water at target, with a rod in the right hand.
// The bobber appears as a FishingComponentSMSG; a refusal comes as an OperationError.
message CastLineCMSG {
  Vec3 target = 1;
}
