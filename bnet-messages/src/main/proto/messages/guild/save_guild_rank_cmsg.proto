syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SaveGuildRankCmsgProto";

// A member whose rank may manage ranks edits a rank below its own, or adds one at the bottom with rank_id 0.
// The leader's rank keeps every permission whatever is sent; only its name and tax change, and only the
// leader may change them.
message SaveGuildRankCMSG {
  uint64 rank_id = 1;
  string name = 2;
  uint32 tax_percent = 3;
  bool can_invite = 4;
  bool can_kick = 5;
  bool can_manage_ranks = 6;
  bool can_use_guild_skills = 7;
}
