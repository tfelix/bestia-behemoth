syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "TransferGuildLeadershipCmsgProto";

// The leader hands the guild to another member, who takes the leader's rank; the old leader takes theirs.
message TransferGuildLeadershipCMSG {
  uint64 master_id = 1;
}
