syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "InviteToGuildCmsgProto";

// A member whose rank may invite asks another player, by master name, to join. The invited player is asked
// with a GuildInvitationSMSG, the inviter is told with OperationSuccess GUILD_INVITATION_SENT.
message InviteToGuildCMSG {
  string master_name = 1;
}
