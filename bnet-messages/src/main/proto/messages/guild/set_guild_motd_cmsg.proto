syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SetGuildMotdCmsgProto";

// The leader, or a member whose rank may edit it, replaces the guild's message of the day. Plain text; both empty
// clears it.
message SetGuildMotdCMSG {
  string title = 1;
  string body = 2;
}
