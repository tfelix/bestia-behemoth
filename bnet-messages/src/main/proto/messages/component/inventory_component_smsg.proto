syntax = "proto3";

package bnet;

import "messages/component/item_stat_value.proto";
import "messages/component/item_essence.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "InventoryComponentSMSGProto";

/**
 * Inventory component containing items for an entity/bestia.
 */
message InventoryComponentSMSG {
  reserved 1; // entity_id, now on EntityUpdate
  repeated InventoryItem items = 2;
}

message InventoryItem {
  uint32 item_id = 1;
  uint64 unique_id = 2;
  uint32 amount = 3;
  bool equipped = 4;

  // Wear on the backing item instance. Both zero for a plain stack and for gear nobody gave a
  // durability - see net.bestia.zone.item.instance.ItemInstance.maxDurability. A client draws a wear
  // bar only when max_durability > 0.
  uint32 durability = 5;
  uint32 max_durability = 6;
  // Sockets of the backing instance, opened at the forge or by Item Customization.
  uint32 slots = 7;

  // Upgrade level on the backing instance, 0 for an untouched item and for every plain stack. What
  // Upgrade Equipment raises and what every equip script scales off.
  uint32 upgrade_level = 8;

  // This copy's item level: its base level raised by its stats and sockets. Without the upgrade level.
  uint32 item_level = 9;
  // What this copy rolled when it was made. Fixed stats are static item data and not sent.
  repeated ItemStatValue rolled_stats = 10;

  // What every action on this held item names it by. Equals unique_id for an instance. A plain pile gets a
  // handle that holds while the pile is held this session.
  uint64 player_item_id = 11;

  // Who crafted this pile or copy, and in which world. Both empty for an item nobody crafted.
  string crafted_by = 12;
  string crafted_in = 13;

  // A circle this copy draws on its holder's map, like a treasure map's search area. Unset for most items.
  MapCircle map_circle = 14;

  // This copy's own name, like a relic's. Empty for an item that has only its kind's name.
  string title = 15;

  // What this copy weighs, 100 per kg. Set only for a copy, which can weigh more than its kind, like an item
  // bundle with what it holds. A pile weighs what its kind does.
  optional uint32 weight = 16;

  // What fills the sockets, in order; the rest of slots are empty.
  repeated ItemEssence essences = 17;
  // What an essence gem holds. Unset on every other item.
  ItemEssence held_essence = 18;
}

// In world metres, x east and y north like the server's coordinates.
message MapCircle {
  double x = 1;
  double y = 2;
  double radius = 3;
}

