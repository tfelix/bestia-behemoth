syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "InventoryComponentSMSGProto";

/**
 * Inventory component containing items for an entity/bestia.
 */
message InventoryComponentSMSG {
  fixed64 entity_id = 1;
  repeated InventoryItem items = 2;
}

message InventoryItem {
  uint32 item_id = 1;
  uint64 unique_id = 2;
  uint32 amount = 3;
  bool equipped = 4;

  // Wear on the backing item instance. Both zero for a plain stack and for gear nobody gave a
  // durability - see net.bestia.zone.item.instance.ItemInstance.maxDurability. A client draws a wear
  // bar only when max_durability > 0.
  uint32 durability = 5;
  uint32 max_durability = 6;
  // Rune slots cut into the backing instance by Item Customization; nothing can fill one yet.
  uint32 slots = 7;

  // Upgrade level on the backing instance, 0 for an untouched item and for every plain stack. What
  // Upgrade Equipment raises and what every equip script scales off.
  uint32 upgrade_level = 8;
}

