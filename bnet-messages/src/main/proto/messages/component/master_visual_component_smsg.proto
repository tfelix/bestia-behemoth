syntax = "proto3";

package bnet;

import "messages/master/master.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "MasterVisualComponentSMSGProto";

message MasterVisualComponentSMSG {
  fixed64 entity_id = 1;
  Color skin_color = 3;
  Color hair_color = 4;
  Face face = 5;
  BodyType body = 6;
  Hairstyle hair = 7;

  // The master's name, so the client can label whoever it is looking at. It rides along with the visual
  // rather than on a component of its own because it is the same fact under the same broadcast rule: it is
  // public, it never changes while the entity lives, and every viewer needs it exactly when the body arrives.
  string name = 8;
}
