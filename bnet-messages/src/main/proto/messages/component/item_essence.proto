syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "ItemEssenceProto";

// A Bestia's essence bound into a gem: the species sets the effect, the gem sets its strength.
message ItemEssence {
  uint64 bestia_id = 1;
  // The server's GemTier name, e.g. "RUBY". A name for the reason ItemStatValue.stat gives.
  string tier = 2;
}
