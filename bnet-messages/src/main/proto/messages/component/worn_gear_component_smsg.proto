syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "WornGearComponentSMSGProto";

/**
 * What an entity visibly wears, for everyone who sees it. The owner gets the full details from the
 * owner-only EquipmentComponentSMSG; this is only what a client needs to draw the gear.
 */
message WornGearComponentSMSG {
  repeated WornItem items = 1;
}

message WornItem {
  // EquipmentSlot ordinal, as in EquippedItem.slot.
  uint32 slot = 1;
  uint32 item_id = 2;
}
