syntax = "proto3";

package bnet;

import "messages/vec3.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "FishingComponentSMSGProto";

// A master's line in the water, sent to everyone in range. removed = true when it is pulled in, whatever the
// reason; a catch shows up as an inventory gain.
message FishingComponentSMSG {
  // The voxel column the bobber floats on; the client puts it on that column's water surface.
  Vec3 bobber = 1;
  // A fish has the hook: the bobber plunges, and a strike now lands it.
  bool biting = 2;
  bool removed = 3;
}
