syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "ItemEnchantmentsComponentSMSGProto";

// The enchantments on an item lying on the ground, so the client can make it glow and draw a countdown ring. Sent
// to everyone in range. Removed, with removed = true, when the last one is broken.
message ItemEnchantmentsComponentSMSG {
  repeated GroundItemEnchantment enchantments = 1;
  bool removed = 2;
}

message GroundItemEnchantment {
  // The id in item_enchantments.yml.
  uint32 enchantment_id = 1;
  // Until the enchantment ends; 0 for one without an end.
  float remaining_seconds = 2;
  // From the moment the item reached the ground to the end, for how full the ring is.
  float total_seconds = 3;
}
