syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SurveyStopsCmsgProto";

// When the player stopped the needle in each round of a survey's game, in milliseconds since that round began.
message SurveyStopsCMSG {
  uint64 structure_id = 1;
  repeated int64 stops_ms = 2;
}
