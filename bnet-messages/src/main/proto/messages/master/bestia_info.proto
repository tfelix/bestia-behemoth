syntax = "proto3";

package bnet;

import "messages/vec3.proto";
import "messages/master/bestia_genetics.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "BestiaInfoProto";


message BestiaInfo {
  fixed64 entity_id = 1;
  uint32 mob_id = 2;
  string name = 3;
  uint32 level = 4;
  Vec3 position = 5;
  BestiaSex sex = 6;
  IvReading ivs = 7;
  /** Names the bestia in its orders, which outlive the entity. */
  uint64 player_bestia_id = 8;
}