syntax = "proto3";

package bnet;

import "messages/master/set_bestia_ai_config_cmsg.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "BestiaAiConfigSmsgProto";

/**
 * The orders now in force for one of the player's bestias, sent back after a successful SetBestiaAiConfigCMSG.
 */
message BestiaAiConfigSMSG {
  uint64 player_bestia_id = 1;

  // See SetBestiaAiConfigCMSG for the reserved fields.
  reserved 2, 3, 4;

  SetBestiaAiConfigCMSG.Job job = 5;
  SetBestiaAiConfigCMSG.Courage courage = 6;
}
