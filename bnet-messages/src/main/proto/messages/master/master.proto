syntax = "proto3";

package bnet;

import "messages/vec3.proto";
import "messages/master/bestia_info.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "MasterProto";


enum BodyType {
  BODY_M_1 = 0;
  BODY_F_1 = 1;
}

// Faces and hairstyles are parts of the client's master_head_parts.glb, in the same order.
enum Face {
  FACE_1 = 0;
  FACE_2 = 1;
  FACE_3 = 2;
  FACE_4 = 3;
  FACE_5 = 4;
}

enum Hairstyle {
  HAIR_1 = 0;
  HAIR_2 = 1;
  HAIR_3 = 2;
  HAIR_4 = 3;
  HAIR_5 = 4; // bald
}

message Color {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
}

/**
 * A master's six effort values - the player-controlled part of their status values. Field order
 * follows the StatusAttribute enum in invest_status_point_cmsg.proto.
 *
 * At creation every value starts at 1 and the player distributes a fixed budget across them under an
 * escalating cost curve; the server re-validates the distribution and refuses anything that does not
 * spend it exactly. See https://docs.bestia-game.net/docs/mechanics/statusvalues/#effort-values
 */
message EffortValues {
  uint32 strength = 1;
  uint32 agility = 2;
  uint32 vitality = 3;
  uint32 intelligence = 4;
  uint32 dexterity = 5;
  uint32 willpower = 6;
}

/**
 * A list of all available master.
 */
message Master {
  uint32 max_available_master_slots = 1;
  uint32 max_available_bestia_slots = 2;

  repeated MasterInfo master = 3;

  // Settlement spawn point candidates a new master can choose to start life near. Populated
  // regardless of whether the account has any free master slots, so the creation screen has them
  // ready the moment the player picks an empty slot.
  repeated MasterSpawnPointCandidate spawn_points = 4;
}

/**
 * One settlement a new master could choose to start life near.
 */
message MasterSpawnPointCandidate {
  uint32 id = 1;
  string settlement_name = 2;
  string tier = 3;
}

message MasterInfo {
  uint64 master_id = 1;
  string name = 3;
  uint32 level = 4;
  Vec3 position = 5;
  BodyType body = 6;
  Face face = 7;
  Color skin_color = 8;
  Color hair_color = 9;
  repeated BestiaInfo bestias = 10;
  Hairstyle hair = 11;
  // The account slot this master is pinned to, counted from 0. Chosen once, at creation, and never changed:
  // the selection screen draws the master in this slot, so a gap left by a deletion stays a gap.
  uint32 slot = 12;
  // TODO add an equipment list
}