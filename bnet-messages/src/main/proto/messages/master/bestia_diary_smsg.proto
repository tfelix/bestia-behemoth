syntax = "proto3";

package bnet;

import "messages/master/bestia_news_smsg.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "BestiaDiarySmsgProto";

// The diary of the selected master's bestias, newest first: what the chat's Bestias tab shows of the past.
message BestiaDiarySMSG {
  repeated BestiaNewsSMSG lines = 1;
}
