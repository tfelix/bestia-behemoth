syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SetBestiaAiConfigCmsgProto";

/**
 * Sets the orders of one of the player's own bestias: what it does while they are not driving it.
 *
 * The vocabulary is deliberately narrow. A job and a courage step are enums rather than a list of goals, so the
 * client can never author behaviour directly: it states an intent and the server decides what that means. See
 * AiConfig on the server for why.
 */
message SetBestiaAiConfigCMSG {
  /** Which of the player's bestias to configure. */
  uint64 player_bestia_id = 1;

  // 2 and 3 were `stance` and `aggression`, replaced by job and courage. 4 was `flee_threshold_pct`. Reserved
  // rather than recycled: an old client still sending them must not have them read as something else.
  reserved 2, 3, 4;

  Job job = 5;
  Courage courage = 6;

  /** What it does while `job` has nothing to do. JOB_UNSPECIFIED: no fallback. Only GATHER, CRAFT and MINE take one. */
  Job fallback_job = 7;

  /** The numbers set by hand in Fine-tune. The server clamps each to its limit. */
  Overrides overrides = 8;

  /** Read from the top, the first that holds deciding. At most 8. */
  repeated Rule rules = 9;

  /** Follows this preset of the master. Then `overrides` are only the numbers the bestia keeps as its own. */
  optional uint64 preset_id = 10;

  /** A named work area instead of the one around its home. */
  optional uint64 area_place_id = 11;

  /** A named chest instead of the nearest. */
  optional uint64 chest_place_id = 12;

  /** "When condition then action". Only the pairs the server allows; see OrderRule there. */
  message Rule {
    Condition condition = 1;
    /** The x in "stamina below x%"; unset for a condition without a number. */
    optional int32 threshold = 2;
    Action action = 3;

    enum Condition {
      CONDITION_UNSPECIFIED = 0;
      STAMINA_BELOW = 1;
      HEALTH_BELOW = 2;
      BAG_ABOVE = 3;
      NIGHT = 4;
      DAY = 5;
      STRONGER_FOE_IN_SIGHT = 6;
    }

    enum Action {
      ACTION_UNSPECIFIED = 0;
      EAT = 1;
      REST_AT_HOME = 2;
      HEAL = 3;
      RETREAT = 4;
      HAUL_NOW = 5;
      KEEP_WORKING = 6;
      HOLD_GROUND = 7;
    }
  }

  /** An unset field keeps what the courage step and the job choose. */
  message Overrides {
    /** 0 never retreats. */
    optional int32 retreat_below_health_pct = 1;
    optional int32 eat_below_stamina_pct = 2;
    optional int32 heal_below_health_pct = 3;
    optional int32 haul_at_load_pct = 4;
    /** In tiles. */
    optional int32 area_radius = 5;
  }

  enum Job {
    /** Never sent by a well-behaved client; present so an unset field is not silently a real job. */
    JOB_UNSPECIFIED = 0;
    GUARD = 1;
    REST = 2;
    GATHER = 3;
    CRAFT = 4;
    MINE = 5;
  }

  enum Courage {
    /** Never sent by a well-behaved client; present so an unset field is not silently a real step. */
    COURAGE_UNSPECIFIED = 0;
    TIMID = 1;
    CAREFUL = 2;
    STEADY = 3;
    BOLD = 4;
    BRAVE = 5;
  }
}
