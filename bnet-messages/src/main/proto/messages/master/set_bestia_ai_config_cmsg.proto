syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SetBestiaAiConfigCmsgProto";

/**
 * Sets the orders of one of the player's own bestias: what it does while they are not driving it.
 *
 * The vocabulary is deliberately narrow. A job and a courage step are enums rather than a list of goals, so the
 * client can never author behaviour directly: it states an intent and the server decides what that means. See
 * AiConfig on the server for why.
 */
message SetBestiaAiConfigCMSG {
  /** Which of the player's bestias to configure. */
  uint64 player_bestia_id = 1;

  // 2 and 3 were `stance` and `aggression`, replaced by job and courage. 4 was `flee_threshold_pct`. Reserved
  // rather than recycled: an old client still sending them must not have them read as something else.
  reserved 2, 3, 4;

  Job job = 5;
  Courage courage = 6;

  enum Job {
    /** Never sent by a well-behaved client; present so an unset field is not silently a real job. */
    JOB_UNSPECIFIED = 0;
    GUARD = 1;
    REST = 2;
  }

  enum Courage {
    /** Never sent by a well-behaved client; present so an unset field is not silently a real step. */
    COURAGE_UNSPECIFIED = 0;
    TIMID = 1;
    CAREFUL = 2;
    STEADY = 3;
    BOLD = 4;
    BRAVE = 5;
  }
}
