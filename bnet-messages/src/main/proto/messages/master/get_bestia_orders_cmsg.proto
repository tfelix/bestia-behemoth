syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "GetBestiaOrdersCmsgProto";

/** Asks for the orders of one of the player's own bestias, answered with BestiaAiConfigSMSG. */
message GetBestiaOrdersCMSG {
  uint64 player_bestia_id = 1;
}
