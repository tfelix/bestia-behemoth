syntax = "proto3";

package bnet;

import "messages/master/bestia_info.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SelfSMSGProto";


/**
 * Contains information about the currently selected master and its associated entity id. Also returns the information
 * about available bestia to this master to the player.
 */
message SelfSMSG {
  uint64 master_id = 1;
  uint64 master_entity_id = 2;
  repeated BestiaInfo available_bestias = 3;

  // Field 4 was `has_performed_master_ritual`, and is reserved rather than reused. The trees are
  // now gated on Basic Skill 5, which the client reads straight off the SkillListSMSG it already
  // receives - so the lock updates the moment the point is spent, instead of only at the next login
  // when a SelfSMSG happens to arrive.
  reserved 4;
  reserved "has_performed_master_ritual";
}