syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SkillCooldownSmsgProto";

// One of the player's entities cast a skill that now recovers. Sent to the owner only; the client counts it
// down by itself. A duration rather than a clock time, because the two clocks differ. Guild skills recover for
// the whole guild and use GuildSkillCooldownSMSG instead.
message SkillCooldownSMSG {
  uint64 entity_id = 1;
  uint64 skill_id = 2;
  uint64 remaining_ms = 3;
}
