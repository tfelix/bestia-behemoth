syntax = "proto3";

package bnet;

import "messages/master/bestia_info.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "OwnedBestiasSmsgProto";

/**
 * Every bestia the selected master owns that is in the world, sent whenever that set changes. The whole list
 * rather than a delta, so a client that missed one is correct again on the next.
 */
message OwnedBestiasSMSG {
  repeated BestiaInfo bestias = 1;
}
