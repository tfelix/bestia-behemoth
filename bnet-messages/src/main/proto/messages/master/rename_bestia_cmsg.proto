syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "RenameBestiaCmsgProto";

// Names one of the player's own party bestias. An empty name gives it back its species' name.
message RenameBestiaCMSG {
  fixed64 entity_id = 1;
  string name = 2;
}
