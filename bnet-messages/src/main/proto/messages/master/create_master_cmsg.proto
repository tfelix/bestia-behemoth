syntax = "proto3";

package bnet;

import "messages/master/master.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "CreateMasterProto";

/**
 * Requests the server to create a new master (character) for the current account.
 * The result is reported back via OperationSuccess (MASTER_CREATED) or OperationError.
 */
message CreateMasterCMSG {
  string name = 1;
  BodyType body = 2;
  Face face = 3;
  Hairstyle hair = 4;
  Color skin_color = 5;
  Color hair_color = 6;
  // Id of a MasterSpawnPointCandidate offered by AvailableMasterSMSG. Required: there is no world-default
  // spawn, so leaving this unset (0) gets the request refused with MASTER_INVALID_SPAWN_POINT.
  uint32 spawn_point_id = 7;
  // The starting effort value distribution picked on the creation screen. Required: the server
  // insists the creation budget is spent exactly, so an unset (all-zero) message is refused - the
  // creation screen keeps its Create button disabled until the distribution is valid, so only a
  // broken or hand-crafted client can get here.
  EffortValues effort_values = 8;
}
