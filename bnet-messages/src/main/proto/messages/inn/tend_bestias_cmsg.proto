syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "TendBestiasCmsgProto";

// Pays the inn to restore every bestia out in the world. Refused if the price rose above [expected_price].
message TendBestiasCMSG {
  uint64 counter_entity_id = 1;
  uint32 expected_price = 2;
}
