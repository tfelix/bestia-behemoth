syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "RequestPartyInvitationCmsgProto";

// The party owner invites another player by master name. The invited player is asked with a
// PartyInvitationSMSG, the owner is told with OperationSuccess PARTY_INVITATION_SENT.
message RequestPartyInvitationCMSG {
  string invited_master_name = 1;
}
