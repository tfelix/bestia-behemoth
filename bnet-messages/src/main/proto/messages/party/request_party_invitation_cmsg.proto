syntax = "proto3";

package bnet;

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "RequestPartyInvitationCmsgProto";

// The party owner invites another player, who is answered with a PartyInvitationSMSG.
message RequestPartyInvitationCMSG {
  uint64 invited_account_id = 1;
}
