syntax = "proto3";

package bnet;

import "messages/party/party_info_smsg.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "SetPartyLootShareCmsgProto";

// The party owner picks how the party holds the drops of its kills. Every member is sent the new roster.
message SetPartyLootShareCMSG {
  PartyLootShare loot_share = 1;
}
