syntax = "proto3";

package bnet;

import "messages/system/text.proto";

option java_package = "net.bestia.bnet.proto";
option java_outer_classname = "QuestProto";

// Who made a quest. Quests are made at runtime, so this names a maker, never a catalogue of quests.
enum QuestOrigin {
  QUEST_ORIGIN_BLACKBOARD = 0;
  // The world itself made it, from its history or from something that happened.
  QUEST_ORIGIN_WORLD = 1;
  // A town asks for it on the blackboard, because it really lacks something.
  QUEST_ORIGIN_TOWN = 2;
  // An Order's Envoy, for a master who asks to join.
  QUEST_ORIGIN_ORDER = 3;
}

enum QuestStatus {
  QUEST_STATUS_OPEN = 0;
  // The poster withdrew it: work handed in before the notice runs out still counts.
  QUEST_STATUS_CLOSING = 1;
  QUEST_STATUS_COMPLETED = 2;
  QUEST_STATUS_EXPIRED = 3;
  QUEST_STATUS_WITHDRAWN = 4;
  // Somebody else took the one prize the quest was about.
  QUEST_STATUS_SUPERSEDED = 5;
}

// Why the quest is in this master's log.
enum QuestRole {
  QUEST_ROLE_ACCEPTED = 0;
  QUEST_ROLE_POSTED = 1;
  // On a board, not yet taken by this master.
  QUEST_ROLE_OFFERED = 2;
}

enum ObjectiveKind {
  OBJECTIVE_KIND_DELIVER_ITEM = 0;
  OBJECTIVE_KIND_KILL = 1;
  OBJECTIVE_KIND_EXAMINE = 2;
  OBJECTIVE_KIND_TALK = 3;
  OBJECTIVE_KIND_DECIDE = 4;
  OBJECTIVE_KIND_BRING = 5;
}

enum ObjectiveScope {
  // Everyone who accepted works towards one counter.
  OBJECTIVE_SCOPE_SHARED = 0;
  OBJECTIVE_SCOPE_PERSONAL = 1;
}

enum QuestRewardKind {
  QUEST_REWARD_KIND_COINS_PER_UNIT = 0;
}

// One thing a decide objective lets the master pick.
message QuestChoice {
  string id = 1;
  TextRef text = 2;
}

message QuestObjective {
  ObjectiveKind kind = 1;
  ObjectiveScope scope = 2;
  int64 item_id = 3;
  uint32 required = 4;
  // The shared total for a shared objective, the master's own count for a personal one.
  uint32 progress = 5;
  // What this master contributed. Equal to progress for a personal objective.
  uint32 yours = 6;
  int64 species_id = 7;
  // The place a kill must happen in, empty when anywhere counts or the spot has no name.
  string place_name = 8;
  // The step of the quest this belongs to. A master works on one stage at a time.
  uint32 stage = 9;
  // How to word the objective. Unset for a delivery or a kill, which the client words from the ids above.
  TextRef text = 10;
  // What a decide objective offers. Answered with a DecideQuestCMSG.
  repeated QuestChoice choices = 11;
  // The id this master picked, empty while it has not.
  string chosen = 12;
}

message QuestReward {
  QuestRewardKind kind = 1;
  int64 amount = 2;
}

// Everything the client shows of one quest. Complete on its own: there is no quest definition to look up.
message Quest {
  uint64 quest_id = 1;
  QuestOrigin origin = 2;
  QuestStatus status = 3;
  QuestRole role = 4;
  TextRef title = 5;
  uint32 suggested_level = 7;
  int64 deadline_epoch_ms = 8;
  string poster_name = 9;
  repeated QuestObjective objectives = 10;
  repeated QuestReward rewards = 11;
  // The stage this master works on. Objectives of later stages are not sent.
  uint32 stage = 12;
  // Who took the prize of a superseded quest. Empty when nobody is named.
  string won_by = 13;
}
