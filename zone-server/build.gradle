plugins {
	id 'org.jetbrains.kotlin.plugin.spring'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

group = 'net.bestia.zone'
description = 'zone-server'

dependencies {
	implementation project(':bnet-messages')
	implementation project(':shared')
	// Deterministic world generation and the chunk representation. Pure functions over data, no I/O -
	// see worldgen/build.gradle. This module owns the persistence and the sockets; worldgen owns the voxels.
	implementation project(':worldgen')

	implementation 'io.netty:netty-all:4.1.118.Final'
	implementation 'io.github.oshai:kotlin-logging-jvm:7.0.3'
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Serves the map tile pyramid, and nothing else. The game itself talks over the Netty socket; tiles are
	// bulk binary asset traffic with their own caching and conditional-request semantics, which is what HTTP is
	// for and what a message envelope is not.
	//
	// `spring-boot-starter-security` used to sit here marked `// needed?`, imported by exactly zero Kotlin
	// files. It was inert only because there was no web layer: adding this line activates its auto-config,
	// which installs a default `SecurityFilterChain` demanding HTTP Basic with a password printed at boot and
	// would have 401'd every tile request. Removed rather than configured around - the map's own auth is a
	// plain `OncePerRequestFilter` over the login JWT, and `jjwt` below is independent of it.
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.reflections:reflections:0.10.2'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.17.0'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// Real datastore - see compose.yaml. H2 stays runtimeOnly below because the "test" profile
	// (application-test.yml) still runs against an in-memory DB, so the suite never needs Docker.
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	runtimeOnly 'com.h2database:h2'
	// developmentOnly: present for `bootRun` only (never in the packaged jar or on the test classpath).
	// Starts/stops compose.yaml's mariadb container automatically and wires the datasource to it.
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation 'org.awaitility:awaitility:4.2.2'
    testImplementation 'io.mockk:mockk:1.14.5'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

allOpen {
	annotation 'jakarta.persistence.Entity'
	annotation 'jakarta.persistence.MappedSuperclass'
	annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
	useJUnitPlatform()
}

/**
 * Enable resource filtering to fill in the version number
 */
processResources {
	filesMatching("**/application.yml") {
		expand(version: project.version)
	}
}


/**
 * Cross-checks (and optionally fixes) skill ids/max levels between zone-server's skill config
 * and the Godot client's Attack DB. See buildSrc/src/main/kotlin/SkillDbSyncTask.kt and
 * .claude/skills/skill-system/SKILL.md.
 */
tasks.register('checkSkillDb', SkillDbSyncTask) {
    group = 'verification'
    description = 'Fails if skills.yml/master_skill_tree.yml and the client Attack DB (.tres + skills.csv) disagree on ids, max levels, or descriptions.'
    skillsYml = layout.projectDirectory.file('src/main/resources/skills.yml')
    masterSkillTreeYml = layout.projectDirectory.file('src/main/resources/master_skill_tree.yml')
    clientDbDir = rootProject.layout.projectDirectory.dir('bestia-client/src/Game/Attack/DB')
    skillsCsv = rootProject.layout.projectDirectory.file('bestia-client/src/Localization/skills.csv')
    fix = false
}

tasks.register('syncSkillDb', SkillDbSyncTask) {
    group = 'other'
    description = 'Patches max_level/description_key in existing client .tres files, syncs English descriptions into skills.csv, and creates stubs for missing skills, from skills.yml/master_skill_tree.yml.'
    skillsYml = layout.projectDirectory.file('src/main/resources/skills.yml')
    masterSkillTreeYml = layout.projectDirectory.file('src/main/resources/master_skill_tree.yml')
    clientDbDir = rootProject.layout.projectDirectory.dir('bestia-client/src/Game/Attack/DB')
    skillsCsv = rootProject.layout.projectDirectory.file('bestia-client/src/Localization/skills.csv')
    fix = true
}

/**
 * Same idea as check/syncSkillDb, for items: item_id/type/weight/equip_slot plus the English
 * description in items.csv. See buildSrc/src/main/kotlin/ItemDbSyncTask.kt.
 */
tasks.register('checkItemDb', ItemDbSyncTask) {
    group = 'verification'
    description = 'Fails if items.yml and the client Item DB (.tres + items.csv) disagree on ids, type, weight, equip slot, or descriptions.'
    itemsYml = layout.projectDirectory.file('src/main/resources/items.yml')
    clientDbDir = rootProject.layout.projectDirectory.dir('bestia-client/src/Game/Item/DB')
    itemsCsv = rootProject.layout.projectDirectory.file('bestia-client/src/Localization/items.csv')
    fix = false
}

tasks.register('syncItemDb', ItemDbSyncTask) {
    group = 'other'
    description = 'Patches type/weight/equip_slot in existing client item .tres files, syncs English descriptions into items.csv, and creates stubs for missing items, from items.yml.'
    itemsYml = layout.projectDirectory.file('src/main/resources/items.yml')
    clientDbDir = rootProject.layout.projectDirectory.dir('bestia-client/src/Game/Item/DB')
    itemsCsv = rootProject.layout.projectDirectory.file('bestia-client/src/Localization/items.csv')
    fix = true
}

/**
 * Exports each bestia species' equipment slot mask into the client's static bestia DB - the client
 * needs it to grey out slots a species does not have, and it is static content that is deliberately
 * never sent over the wire. See buildSrc/src/main/kotlin/BestiaDbSyncTask.kt.
 */
tasks.register('checkBestiaDb', BestiaDbSyncTask) {
    group = 'verification'
    description = 'Fails if the mob YMLs and the client bestia DB (.tres) disagree on equipment slot masks.'
    mobYmlDir = layout.projectDirectory.dir('src/main/resources/mob')
    clientDbDir = rootProject.layout.projectDirectory.dir('bestia-client/src/Game/Bestia/DB')
    fix = false
}

tasks.register('syncBestiaDb', BestiaDbSyncTask) {
    group = 'other'
    description = 'Patches equip_slots in existing client bestia .tres files and creates stubs for missing bestias, from the mob YMLs.'
    mobYmlDir = layout.projectDirectory.dir('src/main/resources/mob')
    clientDbDir = rootProject.layout.projectDirectory.dir('bestia-client/src/Game/Bestia/DB')
    fix = true
}

/**
 * Dialogs are the one content type where the server holds no text at all - it sends an id and the
 * client resolves DIALOG_<id>_TEXT itself - so neither side can validate the pairing at runtime.
 * This checks it at build time instead, placeholders included. See
 * buildSrc/src/main/kotlin/DialogDbSyncTask.kt.
 */
tasks.register('checkDialogDb', DialogDbSyncTask) {
    group = 'verification'
    description = 'Fails if dialogs.yml and the client dialogs.csv disagree on which dialogs exist or which placeholders their text uses.'
    dialogsYml = layout.projectDirectory.file('src/main/resources/dialogs.yml')
    dialogsCsv = rootProject.layout.projectDirectory.file('bestia-client/src/Localization/dialogs.csv')
    fix = false
}

tasks.register('syncDialogDb', DialogDbSyncTask) {
    group = 'other'
    description = 'Adds TODO stub rows to dialogs.csv for dialogs declared in dialogs.yml that have no text yet.'
    dialogsYml = layout.projectDirectory.file('src/main/resources/dialogs.yml')
    dialogsCsv = rootProject.layout.projectDirectory.file('bestia-client/src/Localization/dialogs.csv')
    fix = true
}

/**
 * The cartography tools.
 *
 * All of them build a world through `StandardWorld.build` and draw it, with no Spring context and no database,
 * so the cycle from editing a style to looking at the result is a few seconds rather than a boot. That is the
 * whole reason they live here as `JavaExec` mains rather than as a Spring profile.
 *
 * Conventions are worldgen's, not invented here - see the long comment on `cli` in worldgen/build.gradle for
 * why `project.hasProperty` is never used.
 */
def cli = { String name -> project.gradle.startParameter.projectProperties[name] }

/** zone-server's own birth settings, so `-Pgenesis` draws the world this server actually boots. */
def genesisSettings = layout.projectDirectory.file('src/main/resources/application.yml')

/**
 * The world-shaping switches every cartography task takes.
 *
 * Spelled to match `WorldGenSettings.FLAGS`, which is what lets `-Pgenesis` hand these tools and worldgen's own
 * tools the same world.
 */
def WORLD_PROPS = ['genesis', 'seed', 'cells', 'params'] as Set

/**
 * Forwards a task's switches, and refuses any `-P` the task does not understand.
 *
 * The refusal closes a hole that was live in this file and is still live in worldgen's. `cli('level')` returns
 * null for `-Plevl=6`, so a mistyped switch was never forwarded and never complained about: `mapRender
 * -Pgenesis -Plevl=6` rendered the default level and printed a confident "L7" while the operator believed they
 * had asked for L6. That is the same class of bug worldgen's header records shipping twice with `-Pdepth` and
 * `-Partifacts`, one layer further out - the switch reaches Gradle, is accepted, and is dropped between there
 * and the tool.
 *
 * Declaring each switch once, as a map from property to tool flag, is what keeps the check honest: the accepted
 * set is derived from the same map that does the forwarding, so the two cannot drift.
 *
 * Checked in `doFirst` rather than at configuration time, so an unrelated invocation - `:zone-server:test` with
 * some other project property set - is not broken by a validation only these five tasks want.
 *
 * `-Pgenesis` is applied before the rest so an explicit `-Pseed` or `-Pcells` still overrides it: MapToolArgs
 * takes the *last* occurrence of a flag, which is what makes "the server's world, but 256 cells across"
 * expressible.
 *
 * @param values   `-Pname=x` switches, mapped to the tool flag that carries the value
 * @param switches valueless `-Pname` switches, mapped to their tool flag
 */
def cartographyTool = { task, Map values, Map switches ->
    if (cli('genesis') != null) {
        task.args WorldGenSettings.toolArgs(genesisSettings.asFile)
    }
    if (cli('seed') != null) task.args '--seed', cli('seed')
    if (cli('cells') != null) {
        // Per-edge rather than a single --cells, so -Pgenesis -Pcells=256 is not a contradiction.
        task.args '--width-cells', cli('cells')
        task.args '--height-cells', cli('cells')
    }
    if (cli('params') != null) task.args '--params', cli('params')

    values.each { name, flag -> if (cli(name) != null) task.args flag, cli(name) }
    switches.each { name, flag -> if (cli(name) != null) task.args flag }

    def accepted = WORLD_PROPS + values.keySet() + switches.keySet()
    def taskName = task.name

    task.doFirst {
        def unknown = project.gradle.startParameter.projectProperties.keySet() - accepted
        if (!unknown.isEmpty()) {
            throw new GradleException(
                    taskName + ' does not understand -P' + unknown.sort().join(', -P') + '.\n' +
                    'It would have been accepted and silently dropped, so this run would have used defaults ' +
                    'while looking like it had honoured the switch.\n' +
                    'Known: -P' + accepted.sort().join(', -P'))
        }
    }

    // JavaExec otherwise runs on the Gradle daemon's JVM, which is older than the toolchain these classes were
    // compiled against.
    task.javaLauncher = javaToolchains.launcherFor(java.toolchain)
    task.classpath = sourceSets.main.runtimeClasspath
    task.group = 'cartography'
}

/**
 * One viewport of the map to a PNG: `./gradlew :zone-server:mapRender -Pgenesis -Plevel=7`.
 *
 * `-Plevel=n` is metres per pixel as a power of two, so 0 is 1 m/px and 9 is 512. Omit it and the whole world is
 * fitted to the image width. The style follows the zoom unless `-Pstyle` overrides it.
 */
tasks.register('mapRender', JavaExec) {
    description = 'Renders one viewport of the world map to a PNG'
    mainClass = 'net.bestia.zone.cartography.tools.MapRenderMain'
    cartographyTool(it,
            [level: '--level', x: '--x', y: '--y', width: '--width', height: '--height',
             palette: '--palette', paper: '--paper', style: '--style', out: '--out'],
            [noLabels: '--no-labels'])
}

/**
 * What the map is drawing from, as text: `./gradlew :zone-server:mapInspect -Pgenesis -Pcoast`.
 *
 * The other half of `mapRender`. A wrong-looking map is either a wrong picture or wrong data, and only this can
 * tell you which.
 */
tasks.register('mapInspect', JavaExec) {
    description = 'Prints the fields the map renders from: a point, a transect, the coast, towns or a census'
    mainClass = 'net.bestia.zone.cartography.tools.MapInspectMain'
    cartographyTool(it,
            [x: '--x', y: '--y', to: '--to', steps: '--steps', level: '--level'],
            [coast: '--coast', grid: '--grid', census: '--census', towns: '--towns'])
}

/**
 * Bakes the tile pyramid: `./gradlew :zone-server:mapBake -Pgenesis`.
 *
 * Coarse levels whole, fine levels only around settlements. `-Pwhole` bakes every level across the entire world
 * instead, which is a very different amount of work - see MapBakeMain's own comment.
 */
tasks.register('mapBake', JavaExec) {
    description = 'Renders the map tile pyramid to the on-disk cache'
    mainClass = 'net.bestia.zone.cartography.tools.MapBakeMain'
    cartographyTool(it,
            [levels: '--levels', out: '--out', threads: '--threads'],
            [force: '--force', whole: '--whole'])
}

/**
 * Serves the tiles and a viewer: `./gradlew :zone-server:mapServe -Pgenesis`, then open localhost:8099.
 *
 * The only tool that can show a *seam* interactively, which is the failure a tiled map is actually prone to and
 * which no single tile reveals. Renders on demand into the same cache `mapBake` writes.
 *
 * `-Pfog=x,y,r` masks the tiles against a synthetic chart, semicolons separating several discs - quote it, since
 * PowerShell reads a bare semicolon as a command separator.
 */
tasks.register('mapServe', JavaExec) {
    description = 'Serves the tile pyramid with a browser slippy-map viewer'
    mainClass = 'net.bestia.zone.cartography.tools.MapServeMain'
    cartographyTool(it, [port: '--port', out: '--out', fog: '--fog'], [:])
}

/**
 * Renders one level twice and diffs it: `./gradlew :zone-server:mapAtlas -Pgenesis -Plevel=6`.
 *
 * Assembled from tiles, and again as a single frame. The two must be identical; where they are not, the
 * difference image says which pass is frame-dependent. `AtlasStyleSeamTest` asserts the same property in CI.
 */
tasks.register('mapAtlas', JavaExec) {
    description = 'Renders one zoom level as tiles and as one frame, and reports any difference'
    mainClass = 'net.bestia.zone.cartography.tools.MapAtlasMain'
    cartographyTool(it, [level: '--level', out: '--out'], [tiled: '--tiled'])
}
