zone:
  version: ${version}
  # Slot Count which can be increased via a per account setting.
  bestia-base-slot-count: 4
  # The max amount of bestia slot a single master can have.
  bestia-max-slot-count: 8
  # Storage slots for bestia out of the world, increased per account like the active slots.
  bestia-storage-base-slot-count: 20
  bestia-storage-max-slot-count: 100
  # jwt-auth-secret-key: no value on purpose, so a deployment that forgets it does not boot. Supplied through
  # ZONE_JWT_AUTH_SECRET_KEY and identical to login-server's `jwt.secret`; the dev profile carries a public one.
  # A shared HMAC secret for now: it moves to an asymmetric key pair (login signs, zones only verify) before
  # production.
  # Must be different for every zone which starts. So this probably needs to be overwritten
  # during deployment. This hard coded value is for development purposes.
  shard-id: 1
  # A kicked account's login tokens issued before the kick stay refused this long. Must outlast login-server's
  # `jwt.login-token-minutes`.
  kick-memory-seconds: 300
  # What to do when the tick thread runs SQL: `log` warns once per statement, `fail` throws (tests).
  sql-on-tick: log

persistence:
  # Each persistent entity is saved this often if it changed; the population is spread over the interval.
  interval-ms: 90000

exp-curve:
  # How long a level takes someone who does nothing but earn EXP: anchor-hours at anchor-level, growing with
  # level^exponent and never below floor-seconds. The EXP a level costs is that time at the EXP rate of an on-level
  # kill (4 * lv + 5 per reference-kill-seconds), so fighting and working take the same time per level. A craft takes
  # 1.2 * itemLevel^2 seconds, so exponent 2.5 means ever more crafts per level.
  anchor-level: 97
  anchor-hours: 24
  exponent: 2.5
  floor-seconds: 60
  reference-kill-seconds: 25

work-exp:
  # EXP for successful crafts: the share of a level that the craft's time is worth on the curve above, times pace.
  pace: 0.75
  # The most of a level one payout may be.
  payout-cap-share: 0.35
  # Effort that can be banked while not working, online or off. Effort is paid at one second per second at most.
  bank-seconds: 3600

party:
  # Seats in a party, the owner's included. Open invitations hold a seat each.
  max-size: 12
  name-max-length: 20
  # Even share and Take turns: who stands within this many metres of a kill (flat on the map, from their master or
  # the entity they play) shares its EXP or takes a turn at its loot. The bonus is added to the shared EXP when at
  # least two members share it.
  exp-share-range-metres: 100
  even-share-bonus-percent: 30
  invitation-timeout-seconds: 60
  # Take turns: a drop waits this long for the member whose turn it is, then the whole party may pick it up.
  take-turns-claim-seconds: 30

guild:
  name-max-length: 24
  rank-name-max-length: 20
  # Seats in a new guild; each Guild Extension level adds members-per-extension-level more.
  base-max-members: 16
  members-per-extension-level: 4
  max-level: 50
  # Guild EXP to reach the next level is exp-unit * (L * (L + 1) / 2 + 1): Ragnarok Online's guild table, scaled
  # down to Bestia's EXP. 2000 makes Lv 10 (where Guild Extension can be maxed) 348k guild EXP.
  exp-unit: 2000
  max-ranks: 10
  # The share of a member's kill EXP the rank funnels into the guild, in percent.
  default-tax-percent: 5
  min-tax-percent: 1
  max-tax-percent: 50
  motd-title-max-length: 60
  motd-body-max-length: 240
  expulsion-reason-max-length: 60
  invitation-timeout-seconds: 60
  # Taxed EXP is gathered in memory and written to the guild this often. A crash loses at most this much.
  exp-flush-seconds: 30
  # The stat auras (Great Leadership and its kin) reach this far from the guild leader.
  aura-radius-metres: 15
  # Fortune's Favor multiplies each drop's chance by 1 + this * level / 100: Lv.5 turns a 10% drop into 12.5%.
  fortune-percent-per-level: 5
  # A planted War Banner: what enemies must cut through, and how long it stands otherwise.
  war-banner-hp: 1500
  war-banner-seconds: 300

# Guild Strongholds stand on Empyrite Seeds the world generator placed. Awake seeds:
# max(min-awake-seeds, approved guilds / guilds-per-seed, rounded up). Awake seeds never sleep again.
faction:
  # A master below this level cannot swear to an Order.
  min-swear-level: 40
  # Mana crystals the Novitiate of Eternity or Chaos asks for, and the days it has to be walked in.
  novitiate-offerings: 3
  novitiate-days: 30

stronghold:
  min-awake-seeds: 4
  guilds-per-seed: 25
  # A seed this close to a player town or its sign site is skipped, and no town is founded this close to a seed.
  settlement-clearance-metres: 1000
  # A master discovers a seed by walking onto its core.
  core-radius-metres: 5
  # Official Guild Approval shows up to sense-marks free awake seeds within sense-range-metres, each off by up to
  # sense-error-share of its distance.
  sense-range-metres: 30000
  sense-marks: 3
  sense-error-share: 0.333
  # Planting the Empyrite: what it costs the planter, the work its site needs, and how long an unworked site lasts.
  plant-coins: 10000
  site-build-minutes: 30
  site-idle-hours: 24
  # The Empyrite before any Defense level, and the grounds around it.
  empyrite-hp: 50000
  empyrite-defense: 20
  grounds-radius-metres: 500
  # Each Defense level adds this much HP and DEF to the Empyrite.
  empyrite-hp-per-defense: 10000
  empyrite-defense-per-level: 4
  # Members invest in three tracks of 10 levels, 5 steps each. A step towards level N costs N times this.
  step-coins-per-level: 20000
  # With Permanent Development, the chance that a step counts twice.
  double-step-chance: 0.5
  # With Steward Contract, any member hires a steward at the Empyrite for this, when the Stronghold has none.
  steward-coins: 200000
  # The guild storage, opened at a steward, has this many slots per level of Guild Storage, plus this many per
  # Storage level of each Stronghold the guild holds.
  storage-slots-per-skill-level: 100
  storage-slots-per-storage-level: 50
  # A guild that holds no Stronghold with a steward may have its sealed storage posted to the leader, per used slot.
  storage-send-away-coins-per-slot: 1000
  # With Watcher Research the leader calls watchers: 2 posts plus 1 per Defense level, at most 12, at level 50 plus 5
  # per Defense level. A fallen watcher comes back after the minutes, or at once for the coins. They roam and fight
  # this far round their Empyrite.
  watcher-base-posts: 2
  watcher-max-posts: 12
  watcher-base-level: 50
  watcher-level-per-defense: 5
  watcher-return-minutes: 30
  watcher-bring-back-coins: 50000
  watcher-roam-metres: 120
  # A treasure drop every 24 hours after planting; 3 wait at most, a new one replaces the oldest. Coins: 10,000 plus
  # 10,000 per Economy level, taken from the world reserve when collected. Ore: 2 pieces per Economy level of each of
  # the 3 nearest deposit kinds within 3 km, never gold. One crafting item per 2 Economy levels, from those unlocked.
  treasury-drop-hours: 24
  treasury-waiting-drops: 3
  treasury-coins-base: 10000
  treasury-coins-per-economy: 10000
  treasury-ore-kinds: 3
  treasury-ore-range-metres: 3000
  treasury-ore-pieces-per-economy: 2
  treasury-economy-per-crafting-item: 2
  treasury-crafting-items:
    - { item: shadow_shard, from-economy: 2 }
    - { item: drake_hide, from-economy: 2 }
    - { item: mana_paper, from-economy: 2 }
    - { item: storm_feather, from-economy: 4 }
    - { item: golden_carapace, from-economy: 4 }
    - { item: blackiron_ingot, from-economy: 4 }
    - { item: clockwork_core, from-economy: 6 }
    - { item: wyrm_bone, from-economy: 6 }
    - { item: dragon_scale, from-economy: 6 }
    - { item: star_core, from-economy: 8 }
    - { item: heartwood, from-economy: 8 }
    - { item: starweave, from-economy: 8 }
    - { item: adamantium_ingot, from-economy: 10 }
    - { item: ghost_herb, from-economy: 10 }
  # The guild that breaks an Empyrite takes the Stronghold; the new Empyrite cannot be harmed for this long.
  capture-grace-minutes: 10
  # Weekly spans in which Strongholds can be attacked, such as "SATURDAY 18:00-22:00", read in attack-window-zone.
  # Outside them nothing on a Stronghold's grounds takes harm. An empty list means always.
  attack-windows: []
  attack-window-zone: UTC

# Settings a *new* world is born with. Ignored once a world exists: what gets generated then comes from the
# stored record, because that is what its chunks and any player edits were built against.
worldgen:
  name: Genesis
  # Fixed, so every boot is the same world. Leave it unset and a seed is drawn at random on first boot and
  # persisted - reproducible after the fact, but useless while debugging, because the H2 datasource below is
  # in-memory: every restart is a different planet and no bug reproduces twice.
  #
  # This particular number is `StandardWorld.DEFAULT_SEED` (0xB3571A), chosen for two properties:
  #   - the viewer and the probe default to it, so `./gradlew :worldgen:viewer -Pcells=128` shows *this* world.
  #     Any other value and the offline tooling inspects a world the server is not running.
  #   - the world centre is dry land - tropical seasonal forest at 53 m - and the centre is where a new master
  #     spawns. Most seeds put the centre in open ocean: of fourteen sampled, twelve did.
  #
  # DEV ONLY - this value is committed and therefore public. The
  # generator is open source and runs offline in well under a second, so anyone who knows the seed can
  # regenerate the whole map - every ore deposit, cave hoard and ruin - before setting foot in it. A real,
  # persistent deployment must leave this unset (a fresh `Long` is then drawn at random on first boot, over
  # the full 64-bit range, and persisted in `PersistedWorld` - never transmitted to the client, see
  # `WorldInfoSMSG`) or override it via an environment-specific, non-committed source. Either way, set it
  # *before* the first boot: the seed is permanent the moment the world row is written.
  seed: 11753242
  # World extent in cells. A cell is `cell-size-metres` across, so at the default these are kilometres.
  width-cells: 128
  height-cells: 128
  cell-size-metres: 1000.0
  chunk-size: 32
  chunk-height: 256
  voxel-size-metres: 1.0
  sea-level-metres: 0.0
  # Whether the edges join up. Both on: the seam is hidden inside the 2.5 km ocean margin that `OceanBorder`
  # forces around all four edges, which is wider than the client can see. Y costs a climate discontinuity -
  # latitude is a linear ramp, so temperature and wind direction jump at the seam - but that lands in
  # unreachable polar ocean, and the alternative is a wall.
  wrap-x: true
  wrap-y: true
  # Which Order won the *previous* world incarnation: CHAOS, ETERNITY or CIRCLE.
  #
  # Unset, as it must be for Genesis - there is no previous world, so no Order has won anything, and the
  # generated history contains no mention of them at all. That is the intended first-incarnation story.
  #
  # This setting is a development lever, not the source of truth. On every later world the answer is read off the
  # world being replaced (`WorldProvisioning.recreate` carries `winningOrder` forward), which is the only piece
  # of state that survives a regeneration. Set it here to look at an Order-shaped history without faking a whole
  # world lifecycle first. It is a *birth* setting like the rest of this block, folded into `pipelineVersion`
  # via `HistoryParams.orderInfluence` - but unlike the rest of this block, changing it under an existing world
  # does nothing at all: `WorldService.incompatibilityOf` deliberately recomputes the version from the *row's*
  # `previousWinningOrder`, never this one, or setting the lever would report every world as incompatible. It
  # only takes effect on a world that does not exist yet, so reset the world to see it.
  #
  # To see what it does without booting the server:
  #   ./gradlew :worldgen:chronicle -Porders -Pcells=384 -Pparams=orders.params
  # previous-winning-order: CHAOS
  # What to do when the stored world is not the world these settings and this build describe.
  #   REFUSE     - abort the boot. The safe answer, and what a live server wants.
  #   REGENERATE - delete the world and make the one that was asked for, moving every master to the new
  #                spawn. DESTRUCTIVE, no backup. Set here because this is the development configuration:
  #                the settings above are the thing being changed, and worldgen tweaks are expected to
  #                blow away whatever's there. Note this is no longer a free action now that the datasource
  #                (see below) is MariaDB persisted in a compose volume rather than in-memory H2 - a stray
  #                params change on restart really does delete a world that survived the last one. Switch
  #                this to REFUSE before this config is ever pointed at data you care about keeping.
  #   IGNORE     - boot regardless and log it.
  on-mismatch: REGENERATE

# Terrain streaming to the client. Runtime settings: unlike `worldgen` above, none of these affect what the
# terrain *is*, so they can change on a restart with no consequence.
chunk-stream:
  # Horizontal radius in chunks around the player's own. A chunk is 32 m across, so 5 gives an 11x11 square -
  # 352 m across, 176 m from centre to edge. Cost is quadratic: 7 would be 225 chunks rather than 121.
  view-radius-chunks: 5
  # A held chunk is withdrawn only this many chunks past the view radius, so walking back and forth over the
  # view edge does not withdraw and re-send a whole row each time.
  release-margin-chunks: 1
  # Vertical radius in slabs. A slab is 256 m tall, so 1 is already a 768 m column - far more than the camera
  # shows. This caps what the surface rule may offer; it is not subscribed to as a box. Without it a login in
  # deep water offered every slab from the seabed up to the waterline, 726 chunks where 121 was the answer.
  view-radius-chunks-vertical: 1
  # Chunk payloads one connection may be sent per tick. At tick-rate 20 that is 80/s, so a first load of ~121
  # chunks spreads over about a second and a half. The cap is as much for the client - it drains its whole
  # receive queue in one frame - as for the socket.
  chunks-per-tick-per-player: 4
  # Token bucket for chunk requests. The burst has to cover a client legitimately asking for a whole manifest
  # at once on login; the refill is what limits sustained asking.
  request-burst: 512
  request-refill-per-tick: 2
  # Payloads below this are not compressed: deflate has a fixed overhead and a uniform underground chunk is
  # 13 bytes encoded and 19 deflated.
  deflate-minimum-bytes: 64
  deflate-level: 9
  # Threads that generate and encode chunks off the tick. 0 does it on the tick at once (tests).
  encode-workers: 2
  # Chunk payloads started per tick across all players; the rest wait in their send queues.
  encodes-per-tick: 16
  # Heap for encoded wire payloads (a few kB at the surface, often ~100 B). This is what makes thirty players
  # entering the same area cost one encode between them rather than thirty.
  encoded-cache-size: 64MB
  # Decoded chunks kept for the server's own voxel queries. Half a megabyte each, so this sets the footprint:
  # 128 is about 64 MB.
  hot-chunk-capacity: 128
  # Cached vertical slab ranges, one per horizontal chunk column (two ints each, so this can be generous).
  # Computing one means a feature query plus ~1000 noise evaluations; never invalidated, because what it holds
  # is the *generated* slabs and the heightfield those derive from is immutable. The slabs a player's digging
  # adds are tracked separately and unioned in on read - the heightfield cannot express a hole.
  slab-cache-capacity: 16384
  # New slab ranges computed per tick, across all players. The cache makes a repeated manifest free, but the
  # first one over fresh ground still has to sample every column in the view volume - doing all 121 in one
  # tick stalls the zone thread for whole ticks. So a manifest grows over a second or so instead, which the
  # protocol already supports since it is a diff. The player's own column is never deferred.
  slab-computations-per-tick: 4
  # Milliseconds of one tick those slab computations may use, whichever limit is hit first. One slab is always
  # allowed. A slab over fresh ground is world generation and the count alone held ticks for hundreds of ms.
  slab-millis-per-tick: 8
  # Derived walkability tiles built or rebuilt per tick, across all players. Queries serve the stale copy until
  # then, which beats a rebuild hitch on the zone thread every time somebody places a block. This budget also
  # pays for the *first* build of every chunk entering a subscription - a login is a whole view volume at once -
  # so at tick-rate 20 this is 160 chunks a second and fresh ground becomes walkable in under a second.
  #
  # One build is now one pass over a chunk's voxels rather than three: column summaries and the opacity grid
  # have no reader and DerivedStore builds them on demand instead. Watch the slow-tick warning from ZoneEngine
  # before raising this - the number that matters is how long a tick takes, not how many chunks it clears.
  derived-rebuilds-per-tick: 8
  # Milliseconds of one tick the rebuilds above may use, whichever limit is hit first. At least one chunk is
  # always rebuilt. A build in dense ground costs tens of ms, so the count alone held ticks for ~250 ms.
  derived-rebuild-millis-per-tick: 5
  # Whether the /carve chat command is honoured. It also needs the TERRAIN authority.
  allow-debug-edits: true
  # How often edited chunks are written to the database. A crash loses at most this much digging; a normal
  # shutdown writes the rest.
  edit-flush-seconds: 10

# Masters and player bestias hold the walk data around them resident, as a client's view does, so dens,
# wildlife and pathing work where they stand with no player near. Props and townsfolk stay where clients look.
# One anchor alone holds about 180 chunks, 2 MB of walk data.
simulation-anchors:
  # Past this many, the least important anchors (resting before travelling) hold nothing.
  max-holding-anchors: 512
  # New slab ranges computed per tick for all anchors together; see `slab-computations-per-tick` above.
  slab-computations-per-tick: 4

# Ground wearing down under traffic. Runtime settings in `chunk-stream`'s sense: none decides what the terrain
# is, and what is stored is a level rather than a rate, so retuning these reshapes how existing paths fade
# rather than invalidating them.
ground-wear:
  # Bestia seconds for a fully worn cell to close over completely with nobody walking on it. Three Bestia days,
  # which at SPEED_FACTOR 3 is about one real day. The knob most likely to want changing, and a duration rather
  # than a rate because "a path lasts three days" is a sentence somebody can disagree with.
  fade-seconds: 259200
  # Added per footfall, out of the 255 a cell holds. Against `visible-threshold` below this decides how many
  # passes a route needs before it shows at all - roughly six here - independently of how fast it then fades.
  step-weight: 6
  # Added to the four cells beside the one stepped on. Without it an eight-connected walk leaves a one metre
  # staircase, which reads as a scratch rather than as a trail.
  neighbour-weight: 2
  # The level below which a cell is not drawn. Load bearing rather than cosmetic: creatures wandering at
  # random spread their wear thinly over a wide area, and this is what keeps that below notice so only
  # genuinely repeated routes ever show. Raise it if an idling player grows a faint halo.
  visible-threshold: 32
  # How often changed columns are written. Wear is touched far too often to persist per step the way a burn
  # scar is, so writes are coalesced and a crash costs a few minutes of footfalls.
  flush-interval-seconds: 120
  # Worn columns held in memory at once. One is a kilobyte, so this is about eight megabytes. A column evicted
  # while still worn is written out first and read back when somebody returns to it.
  max-resident-columns: 8192

# Blood soaking into the ground where something died. Written once and only ever dries, which is why the
# weight is most of a full cell where a footfall above is a few parts in a hundred.
ground-blood:
  # Bestia seconds for a full cell to dry out. Five Bestia days, about forty real hours at SPEED_FACTOR 3 -
  # long enough that a battle site still reads as one the next day, which is the whole point of it lasting.
  fade-seconds: 432000
  # What lands on the tile something died on, out of the 255 a cell holds.
  spill-weight: 220
  # How far the pool reaches, with a falloff to nothing just past its edge.
  spill-radius-tiles: 2
  # The level below which a cell is not drawn. Lower than wear's: there is no diffuse background of blood to
  # keep under notice - a stain is either there or it is not.
  visible-threshold: 16
  flush-interval-seconds: 120
  max-resident-columns: 4096

# Footprints and the other marks that have a shape and a heading rather than a level. Never persisted, so
# unlike the wear above there is nothing stored for a retune to disagree with.
ground-stamps:
  # Bestia seconds a print lasts. Twenty real minutes at SPEED_FACTOR 3 - long enough to follow something that
  # has walked out of sight, short enough that a crossroads does not silt up. What a tracking skill is worth is
  # set here.
  footprint-ttl-seconds: 3600
  # Prints held for one 32 m column, oldest dropped first. Roughly one and a half crossings, so a busy column
  # shows the most recent tracks rather than every track. Allocated up front, at twelve bytes each.
  max-stamps-per-column: 48
  # Columns holding prints at once. Unlike wear this is not tied to what players hold - creatures leave tracks
  # where nobody is watching, and finding those later is the point of tracking at all.
  max-columns: 8192

# How clients are kept in step with the footprints, wear and blood they lay down themselves from what they see.
# A client is sent a column's marks as it comes into view, and then only a resync that corrects drift.
ground-sync:
  # Bestia seconds after the first change a client was not told about before the column is re-sent; changes
  # inside that window share the send. 180 is one real minute at SPEED_FACTOR 3. 0 never resyncs, so a client
  # only learns a column's marks as it enters view.
  resync-interval-seconds: 180

water:
  # Cells the simulation updates per step, ten steps a second. About 95 ns each, so the default is a millisecond.
  cells-per-step: 10000
  # Chunks held at most, about 700 kB each. Water pressing past them stops as if against a wall.
  max-chunks: 64

# The mana play adds to the world or takes from it. Only the change over the start density is stored, so all of
# this may be retuned on a restart.
mana:
  field:
    # Real days until half of any added or taken mana is gone again.
    leak-half-life-days: 30
    # How far mana spreads from where it was added, in metres per real week.
    creep-metres-per-week: 300
    # The start towns' provinces drain added mana down to this density, half of the rest every few Bestia days.
    sanctuary-target: 0.3
    sanctuary-half-life-bestia-days: 3
    # A place changes tier only after it stayed past the border this long, so it does not flicker.
    tier-dwell-bestia-hours: 1
  # What each source releases, in motes (a thousandth of density on one 128 m cell). Set from how the field should
  # feel: ManaCalibrationTest replays the play behind each number.
  emission:
    # A caster's day at one spot adds about 0.03.
    motes-per-mana-point: 0.0055
    # A grind spot hunted every day for a week rises by about 0.15. A boss releases ten times as much.
    motes-per-kill-level: 0.04
    boss-factor: 10
    # What a broken store releases per item.
    stored-motes:
      mana_crystal: 10
    # An old Wound lifts the land within its reach to storms in about two weeks. A new world's Wounds pour a
    # tenth of that, rising to full over half a year.
    wound-motes-per-day: 50000
    wound-reach-metres: 2500
    wound-young-share: 0.1
    wound-full-age-days: 180

# The doomsday: one threat per world that sets in after months and ends the world, or the world outlives it. Days
# are real days of world age. See the doomsday server page.
doomsday:
  enabled: true
  onset-min-days: 180
  onset-spread-days: 90
  unfold-min-days: 180
  unfold-max-days: 365
  # The Foreshadowing strikes at this share of the time before onset.
  foreshadow-at-min: 0.4
  foreshadow-at-max: 0.6
  # A world still standing at this percentage of its life span is saved.
  saved-at-t: 150
  # Ages the world faster for the doomsday only. 30 makes a real day count as a month, for test servers.
  time-scale: 1
  min-pace: 0.25
  max-pace: 3.0
  stage-hysteresis: 0.02
  # The Last Stand and the Calling run this long before the world ends.
  end-window-hours: 24
  # Winning the Last Stand sets the clock back to this.
  last-stand-push-back-to: 0.85
  # Clients play their final sequence this long before the server closes every connection.
  end-sequence-seconds: 90
  # The Void Tear, at its onset and at the end of its clock. Days are real days.
  void-tear:
    motes-per-day-at-onset: 100000
    motes-per-day-at-end: 600000
    seed-reach-at-onset-metres: 4000
    seed-reach-at-end-metres: 30000
    knots-per-day-at-onset: 0.5
    knots-per-day-at-end: 4.0
    reform-days: 3.0
  # The Withering's front of corruption crystals. Days are real days.
  withering:
    max-crystals: 300
    crystals-per-day: 6.0
    crystal-reach-metres: 2000
    corrupt-per-day: 0.25
    heal-per-day: 0.05
    plants-die-from: 0.7
  # The Destroyer: a freed world boss marching on the towns. Days are real days.
  destroyer:
    hp-multiplier: 20
    hp-multiplier-per-town: 5
    raze-push: 0.08
    defeat-push: -0.10
    return-days: 3.0
    reseal-days: 14.0
    containment-days: 14.0
  # Alpha tests: force the threat, the Foreshadowing or the origin (metres) of a new world.
  # force-kind: VOID_TEAR
  # force-foreshadow: MANA_STORM_SEASON
  # force-origin-x: 64000
  # force-origin-y: 64000

# How often the World Event Director may start an event in a province. Events themselves are in world_events.yml.
world-events:
  enabled: true
  # A province's budget grows by this each Bestia day, up to the cap. An event costs 1 (small) to 5 (big).
  budget-per-bestia-day: 1.0
  budget-cap: 5.0
  # Bestia days of quiet in a province after an event ends.
  quiet-bestia-days: 3.0
  # Chance per five-minute run that a ready province starts an event.
  start-chance: 0.25
  rift:
    # A knot gathers this many Bestia days before it opens; an open rift collapses after the real hours.
    knot-min-bestia-days: 2.5
    knot-max-bestia-days: 4.5
    open-real-hours: 24
    # How far a knot and a fully grown rift pull, and how hard, per real minute at the centre.
    knot-radius-metres: 300
    open-radius-metres: 1500
    knot-pull-per-minute: 0.002
    open-pull-per-minute: 0.004
    drained-density: 0.05
    # A knot whose surrounding ring falls below this dissolves. A collapse spills within the radius.
    dissolve-below: 0.6
    spill-radius-metres: 300
    # An open gate sends a wave every 20-30 real minutes: five bestia while players watch it, two while nobody does.
    wave-min-real-minutes: 20
    wave-max-real-minutes: 30
    wave-size-watched: 5
    wave-size-unwatched: 2
    watch-radius-metres: 1500
    wave-levels-per-stage: 5
    # The anchor first steps out at stage 3, this many levels above the province's strongest den.
    anchor-levels-above-dens: 10
    # A rift's Potency against a seal: the base, and more for every stage it reached.
    seal-potency-base: 100
    seal-potency-per-stage: 30

# Reading tracks: what the world remembers about the things that left prints, and how much of it a rank
# earns. None of this changes what is stored, so all of it may be retuned on a restart.
spoor:
  # Bestia seconds a walker's description is kept after it was last seen walking. Longer than a print's life
  # on purpose - the print is what expires, and this only has to outlive it.
  signature-ttl-seconds: 7200
  # Walkers described at once. Bounds the index on a busy shard.
  max-signatures: 8192
  # How often a walking creature's description is rebuilt from its components. A track records what walked at
  # the time, so a level-up reaching the index late costs nothing.
  refresh-seconds: 300
  # How far around the read point each skill level searches, in tiles.
  read-radius-per-level-tiles: 3
  # The ranks at which a reading says which way the trail led, what made it, and who by name.
  heading-level: 2
  identity-level: 3
  name-level: 4
  # A trail younger than the first reads as fresh, older than the second as cold, between them as going cold.
  fresh-seconds: 300
  cold-seconds: 2400

bestia:
  diary:
    # How long a line of an owned bestia's diary is kept, and the most lines kept per bestia.
    keep-days: 7
    max-lines-per-bestia: 200

navigation:
  # Local (tile-accurate) pathfinding searches allowed per tick, across all NPCs. One bounded search is well
  # under a millisecond against a 50 ms tick, so this is generous; what it stops is a whole pack running out of
  # waypoints on the same tick and each starting one. A refused search costs nothing - the NPC keeps walking
  # what it had and asks again next tick.
  local-pathfinds-per-tick: 8
  # Longest straight-line distance, in tiles, the local tier will accept. Beyond this the caller wants the
  # macro graph: expanding a few thousand columns to discover the target is a kilometre away wastes the tick.
  # 32 is one chunk, comfortably more than any wander or chase needs.
  local-search-span: 32
  # Slack around the endpoints' bounding box, so walking round a building still fits inside the search.
  local-search-margin: 12
  # Hard ceiling on columns one local search may expand - the safety valve for a target in a sealed room.
  local-expansion-limit: 2048
  # How often blocked macro edges are re-tested. Seconds rather than ticks on purpose: a bridge being
  # destroyed is a rare discrete event, unlike the voxel edits derived-rebuilds-per-tick reacts to, so
  # checking every tick would be checking ~100x more often than anything changes. This is also the
  # propagation lag - NPCs learn a crossing is gone within a few seconds rather than instantly.
  macro-revalidate-seconds: 5
  # Stale edges re-tested per pass. Bounded for the same reason derived-rebuilds-per-tick is: mining along a
  # riverbank can invalidate a batch at once, and draining over two or three passes is invisible.
  macro-revalidations-per-pass: 8

# Bounds on what one skill script may do to the world. A script runs off the tick thread (see
# SkillExecutionService), but it reaches the world through the same lock the tick holds - so what these limit
# is lock occupancy, not tick time. A script that trips either of them has a bug: the cast fizzles and the
# overrun is logged at ERROR with the skill and the caster.
# Long journeys of masters, bestias and NPCs.
travel:
  # How long a master and its bestias trust a blockage they saw. After it they try the route again.
  knowledge-ttl: 21d

skill:
  # World operations one cast may spend - a component read, a spatial query, a spawn, a message. Each is one
  # short lock scope, so this is the number that bounds how long a cast can keep the tick waiting. The
  # busiest script today (a crafting activation: position, station, master, place) spends four, and a spawn
  # is charged eight, so this is generous by an order of magnitude while still catching a loop.
  world-ops-per-cast: 64
  # Entities one spatial query may answer with, charged per result on top of the query itself. Over this the
  # query is refused rather than truncated - a script that silently saw half the entities in a cube would be
  # a bug nobody could see. Must stay below world-ops-per-cast, or the op budget always trips first and this
  # limit never reports anything; SkillExecutionConfig refuses to start if it does not.
  max-query-results: 32
  # CPU time one cast may take, checked whenever an operation is charged. It catches a script looping
  # *between* operations; it cannot interrupt one already running, so it is a runaway guard rather than the
  # bound. The op count above is what pins behaviour. Casts resolve on the tick thread, so keep it at a tick.
  max-millis-per-cast: 50

world:
  tick-rate: 20
  parallel-systems: false
  logout-protection-seconds: 20
  # A dropped plain item is gone after this long, in real time. Unique items stay.
  ground-item-despawn-after: 7d
  # Kill loot belongs to the killer alone for this long, and cannot be damaged.
  loot-protection-seconds: 6
  # Move requests one account may make. Click-to-move produces a handful a second even from somebody clicking
  # frantically, and every accepted request broadcasts a path to everyone in range - so the burst is sized for
  # a flurry of clicking and the sustained rate for nothing else.
  move-requests-per-second: 10
  move-request-burst: 20
  # A system touching a component it did not declare: `off`, `log`, or `fail` (tests).
  undeclared-access: off

# How much of the generator's den field is actually used, per level band of the *den*.
#
# Runtime settings, not birth settings: unlike `worldgen` above, everything here takes effect on a restart
# with no consequence at all, because a den is rebuilt from the generator's markers at every boot. Nothing
# in this block moves `pipelineVersion` and nothing in it can destroy a world.
#
# The one direction it cannot go: `den-share` can only THIN. Nothing here can invent a marker, and the
# generator now emits each band at its own creatures/km2 (`spawner.starterDensity` and siblings in worldgen),
# so wanting a band *thicker* than it was born is a params change and a world regeneration.
wild-spawn:
  # Matched against the den's own LEVEL_MAX, using the same 1-8 / 9-40 / 41-79 / 80-100 banding
  # `Invariants.spawnerCensus` prints per seed - so the generator's census and this config are talking
  # about the same four groups.
  #
  # Spring REPLACES this list rather than merging into it, so a block here must be complete; a partial one
  # would silently drop the bands it omits. `WildSpawnConfig`'s init refuses a set that stops below 120.
  #
  # Every multiplier is neutral, and that is deliberate. The density curve lives in the generator now, stated
  # per band as creatures per square kilometre (`SpawnerParams.starterDensity` and its siblings), so anything
  # other than 1.0 here would apply that curve twice - a den-share of 0.35 would thin an endgame already
  # chosen to be an eighth of the starter band. These stay as the restart-cheap knob to tune *away* from.
  bands:
    # Starter country: 200 creatures/km2 out of the generator, about twenty-five on a screen.
    - max-level: 9
      den-share: 1.0
      pack-multiplier: 1.0
      radius-multiplier: 1.0
    - max-level: 40
      den-share: 1.0
      pack-multiplier: 1.0
      radius-multiplier: 1.0
    - max-level: 79
      den-share: 1.0
      pack-multiplier: 1.0
      radius-multiplier: 1.0
    # The endgame, already sparse when it arrives: a level-ninety pack is a fight rather than scenery. Boss
    # dens are exempt from den-share - dropping one of those drops content, not density. Up to 120, because
    # a boss den in deep corruption reaches past the ordinary cap of 100.
    - max-level: 120
      den-share: 1.0
      pack-multiplier: 1.0
      radius-multiplier: 1.0

  # Species never auto-placed, whatever their bestia row says. The operational escape hatch for a species
  # that turns out to be broken in the wild; `event-only` in the mob YML is the content-level answer.
  excluded-species: []

  # Metres a den wakes beyond its own spawn radius, so a pack is already standing when it comes into view.
  # Also the headroom that keeps `range + margin` within SpawnerSystem.MAX_ACTIVATION_RANGE: a
  # radius-multiplier that would breach it is clamped, with one warning rather than one per den.
  activation-margin: 220
  # Ceiling on one den's pack after pack-multiplier, so a runaway multiplier cannot fill a screen.
  max-pack: 40

  # Temperature is a soft preference expressed as a weight, not a filter. A species this many degrees
  # outside its window is drawn at `min-temperature-weight` of its spawn weight; set that to 0 to make
  # temperature effectively hard. Biome is the constraint that is never relaxed - see WildSpawnerService.
  temperature-falloff-celsius: 10.0
  min-temperature-weight: 0.05

# The baseline wilderness, on top of the dens above.
#
# The dens cannot produce the density this is for and no knob above can make them: `den-share` only thins,
# and the generator's `candidateSpacing` is quadratic - one den per thirty metres would be millions of
# markers and a regenerated world. So the baseline is not markers at all. It is a function of the world seed
# and a position, worked out for the ground a player is standing on and never written down, which is what
# makes eleven hundred creatures per square kilometre affordable.
#
# Everything here takes effect on a restart, moves no version and destroys nothing - `AmbientSpawnConfig`
# has the argument. `spacing-tiles` is the one to know about: it renames every lattice cell and so re-rolls
# the whole wilderness, which is harmless only because no ambient creature is persisted.
townsfolk:
  # Off leaves the empty towns this was added to. The first knob to reach for if a town misbehaves.
  enabled: true
  # Measured against where a person would *be*, not where they live - a farmer's field can be a kilometre
  # from their door. Same figure as the ambient ring and chosen the same way: interest radius, plus the
  # widest anybody strays, plus margin, so somebody is standing before they can be seen.
  activation-radius-tiles: 240
  # People created per 0.25 s pass, across all players. Independent of the ambient budget, so a player at a
  # city edge draws both allocations at once - worth knowing before either is raised.
  spawns-per-pass: 12
  # Matches the ambient layer: stepping away and back must not empty a street and refill it.
  unload-delay-seconds: 60
  # People a house puts out of doors, drawn per household in this range. A household averages 4.6 people
  # and a town has about one residence per ten inhabitants, so the whole household outside every door was
  # four or five times more bodies than the town has front doors. Raise the ceiling past a household's
  # size to get that back.
  min-per-home: 1
  max-per-home: 2
  # No throttle knob: townsfolk carry AiThrottleable, so they use ambient-spawn.throttle-factor and
  # background-factor below, like every other creature that opts in.

ambient-spawn:
  # Off leaves exactly the den-only world. The first knob to reach for if the wilderness misbehaves.
  enabled: true
  # Tiles between sites before thinning; one tile is one metre. 30 puts about four creatures in the ~60 m of
  # ground the camera actually shows. Population scales with the inverse square, so 20 is twice as many.
  spacing-tiles: 30
  # Share of sites removed in the harshest country, against the same danger curve the dens use. Because that
  # curve's largest term is distance to the nearest town, this is also what makes a village's fields the
  # fullest ground on the map without anything here mentioning towns.
  danger-thinning: 0.6
  # Ceiling on an ambient creature's level. Corrupted ground is level 80 up by construction, and that many
  # level-ninety creatures is impassable terrain rather than atmosphere - the dens are the danger there.
  max-level: 40
  # 176 (interest radius) + 40 (widest wander radius) + margin, so a creature is standing before it can be
  # seen. `AmbientSpawnerBootRunner` refuses a value that does not clear that sum.
  activation-radius-tiles: 240
  # Creatures created per 0.25 s pass across all players. 12 fills a fresh view in about three seconds,
  # which happens outside the view volume and so is invisible.
  spawns-per-pass: 12
  # Matches SpawnerSystem.UNLOAD_DELAY_SECONDS: stepping away and back must not disturb anything.
  unload-delay-seconds: 60
  # How long a killed site stays empty. Without it, standing on one spot is an endless supply.
  respawn-delay-seconds: 120
  # Clearance beyond a town's outermost building, not its centre - settlements are neither round nor all the
  # same size. Quantised up to TownClearance.MASK_CELL_METRES, so 100 lands between 100 and 128 m.
  town-clearance-tiles: 100
  # Resolved cells kept in memory. A site cannot change, so this is a memo with nothing to invalidate.
  site-cache-size: 200000
  # A creature someone can see, but with no player near, runs its AI at 1/factor the usual rate. 1 turns
  # this off. Den mobs, bosses, /spawn'ed mobs and a player's own bestia never drop below this tier; an AI
  # profile's min_detail: full keeps one at full rate.
  throttle-factor: 4
  # For an ambient creature nobody can see at all. It still eats, sleeps and walks, only less often.
  background-factor: 20
  # AI profiles this layer never puts in the background tier.
  never-throttled-profiles: []

teleport-items:
  # Inside the client's 160 m view radius, so a fly wing lands on ground already drawn and shows no loading screen.
  fly-wing-radius-metres: 150
  fly-wing-min-metres: 20
  # How long each half of the vanish/appear effect plays, in ms. The client stretches its effect to these.
  fly-wing-vanish-ms: 250
  fly-wing-appear-ms: 250
  butterfly-wing-vanish-ms: 900
  butterfly-wing-appear-ms: 600

economy:
  # Every coin the world can ever hold. Derived, not chosen: it is what the gold the generator places on a
  # 128 km world mints at 10,000 coins per ore voxel, which is sized for ~300 concurrent players.
  # See docs/server/settlements/money-supply in bestia-docs before changing it.
  coin-supply: 300000000
  # Share of that sitting in settlement treasuries the day a world opens. The rest is still in the ground.
  npc-share: 0.5

quest:
  # Quests one master may have accepted at once, ended ones included until cleared.
  log-capacity: 25
  # How long an ended quest stays readable in the logs before it is deleted.
  ended-kept-for: 3d

# The QuestManager: quests the world makes from its history. See docs: server/quest-manager.
questgen:
  # Quests a town offers at once whatever its size, and one more for every so many people.
  offers-per-town: 1
  people-per-extra-offer: 400
  # How long a quest takes work after its first master accepted it.
  quest-runs-for: 30d
  # Rewards. Experience per suggested level of the quest; honor in the artifact's home town for bringing it
  # back or keeping it; and the share of its treasury the town pays, with a cap.
  exp-per-level: 100
  return-honor: 15
  keep-honor-loss: 5
  return-treasury-share: 0.02
  return-coins-cap: 5000

# The text job: a language model writes quest texts and epitaphs for a new world. See docs: server/dynamic-text.
# The zone starts the model in a container of its own when a world has texts to write, waits with the rest of its
# boot until they are written, and removes the container again. Off, every text stays its template.
prose:
  enabled: false
  # English first: it is what a client without its own language shows.
  locales: [en, de]
  # The most time spent on one language over the life of a world. A restart does not start the clock again.
  cap-per-locale: 3h
  llm:
    # DOCKER: this zone starts and stops the container; it needs Docker. URL: use the server at `url`.
    host: DOCKER
    # The socket for a zone on the host. The release bundle sets a socket proxy here (deploy/compose.yaml).
    docker-host: unix:///var/run/docker.sock
    # Pinned by digest; the `server` tag moves with every build of llama.cpp.
    image: ghcr.io/ggml-org/llama.cpp@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23
    # Fetched from Hugging Face on the first start (about 5 GB) and kept in the Docker volume `model-cache`.
    model: google/gemma-4-E4B-it-qat-q4_0-gguf
    # This repository does not name its file by quantisation, so the server must be told the file.
    model-file: gemma-4-E4B_q4_0-it.gguf
    model-cache: bestia-llm-models
    threads: 6
    prompt-threads: 10
    memory: 8GB

blackboard:
  # The runs a poster may pick, in days, and the fee each costs in percent of the pay. Paid up front into the
  # world reserve and never refunded.
  fee-percent-by-days:
    1: 3
    3: 5
    7: 8
  max-open-per-master: 10
  # How long a withdrawn quest still takes hand-ins.
  withdraw-notice: 1h

world-time:
  # Left unset: defaults to this server instance's boot time (a new world timeline each restart).
  # world-epoch: 2026-01-01T00:00:00Z
  speed-factor: 3.0

# What running out of stamina costs a master or an owned bestia (StaminaExhaustionSystem). Below 5 % stamina
# the body loses drain-health-percent of its max health every drain-interval-seconds.
stamina:
  drain-interval-seconds: 30
  drain-health-percent: 0.3
  # What an owned bestia's work costs it in stamina, before its drain reduction (a worker's meal takes a share off).
  work:
    gather: 2                   # per prop picked
    mine: 3                     # per voxel mined out of a shaft
    craft-per-ten-seconds: 1.0  # per ten seconds an item took at a station

socket:
  ip-address: 127.0.0.1
  port: 8090
  authentication-timeout-seconds: 5
  # Per connection. An honest client sends far less: a ping on a timer, movement legs, chunk requests per
  # manifest and clicks at human speed. A client over the limit is disconnected.
  message-burst: 200
  messages-per-second: 50
  # Frames are buffered whole before decoding. Before authentication only the login message is expected.
  max-frame-bytes-before-auth: 8192
  max-frame-bytes: 65536
  # Concurrent connections from one IP address. Players behind one NAT share an address.
  max-connections-per-address: 10
  # A channel holding more unsent bytes than the high mark counts as busy until it drains below the low mark.
  write-buffer-high-bytes: 262144
  write-buffer-low-bytes: 65536
  # A client that stops reading is dropped after this long busy, or at once past this many unsent bytes.
  unwritable-timeout-seconds: 10
  max-write-backlog-bytes: 4194304
  # The client pings every 5 s, so this is six missed pings.
  read-idle-timeout-seconds: 30
  filter-log-messages:
    # Every tick's entity state for every client, mostly positions and paths.
    - "!state_batch"
    # The keepalive and its answer, every few seconds per client and empty.
    - "!ping"
    - "!pong"
    # A few hundred entries per chunk, and one of these follows every chunk payload. It carries its own terse
    # toString, but the filter is what keeps it off the path entirely.
    - "!chunk_static_entities"
    # 128 bytes of bitmask, and protobuf's own toString escapes every byte of it - so a kilobyte of log per
    # send, several times a second per column for the length of a fire.
    - "!chunk_ground_overlay"
    # Up to three kilobytes per layer, and one of these follows every chunk that has ever been burnt or walked
    # on.
    - "!chunk_ground_layers"
    # Up to 240 bytes, and one of these follows every chunk with prints on it.
    - "!chunk_ground_stamps"

logging:
  level:
    root: INFO
    # TRACE stringifies every message in both directions; application-dev.yml turns it on for local play.
    net.bestia.zone: INFO
  pattern:
    # Adds the account a client message runs for (see AccountInbox), and nothing when there is none.
    # No dollar sign or backslash: this file goes through Gradle's `expand` first (see build.gradle).
    level: "%5p%replace( account=%X{account}){' account=(?!.)', ''}"

spring:
  # `dev` when no profile is set, so a local start needs no setup. To change before production: a server started
  # without a profile is a dev server, with the public secret. Any profile a deployment sets replaces `dev` and
  # drops it; the server then does not boot until it is given a secret of its own.
  profiles:
    default: dev
  datasource:
    # Matches zone-server/compose.yaml. `./gradlew :zone-server:bootRun` starts that container via
    # spring-boot-docker-compose (build.gradle) and wires the datasource to it directly, so these values
    # only take effect when running standalone against a real MariaDB - override them with env vars there.
    url: jdbc:mariadb://localhost:3306/bestia_zone
    driver-class-name: org.mariadb.jdbc.Driver
    username: bestia
    password: bestia

  jpa:
    hibernate:
      # `create`, drops and recreated the schema every boot. `update` leaves
      # existing data alone and only adds what Hibernate's mappings say is missing.
      ddl-auto: update
    show-sql: false  # Optional: Show SQL statements in logs
    open-in-view: false
    properties:
      # One round trip per 50 rows for the periodic save's UPDATEs. Inserts stay single: IDENTITY ids
      # cannot be batched, and a sequence would collide with the rows `ddl-auto: update` already made.
      hibernate.jdbc.batch_size: 50
      hibernate.order_updates: true
      hibernate.order_inserts: true

  main:
    # No web server. The zone serves its game socket (`socket.port`), answers the bus, and exports metrics on a
    # port of their own (`metrics` below); its HTTP face is the api-server.
    web-application-type: none

# The Prometheus scrape (`/metrics`) and a liveness probe (`/-/healthy`), served by the Prometheus client's own
# exporter rather than a Spring web server. Loopback only: the metrics show what the zone does. `port: -1` serves
# nothing.
metrics:
  address: 127.0.0.1
  port: 8092

# Builds the meter registry the exporter reads; actuator serves no endpoint without a web server.
management:
  metrics:
    tags:
      application: zone-server
      # Escaped: this file goes through Gradle's `expand` first (see build.gradle).
      shard: \${zone.shard-id}

cartography:
  # Where baked tiles live. Regenerable: the directory is keyed by world shape, pipeline and style version, so
  # deleting it costs render time and nothing else.
  cache-dir: ./build/map-cache
  starter-chart-radius-metres: 5000

# The Valkey bus (see bus/ and compose.yaml). The zone answers the api-server's questions about an account, keeps
# the directory of who is in the world, appends events to the stream, and reads the login server's kicks.
bus:
  enabled: true
  # host, port, username, password: no defaults on purpose, the dev profile carries the compose values.
  # This node's name on the bus; must differ for every zone node.
  node-id: zone-1
  # Requests answered at once; more are told the zone is busy.
  max-in-flight: 64
  # A directory entry outlives a missed heartbeat or two, then lapses on its own if the node is gone.
  directory-ttl-seconds: 30

# How a wild creature's strength follows the level it rolled inside its species' `level-min`..`level-max`.
# Health, mana, attributes and EXP are authored for the middle of the range and scaled by
# (level + offset) / (middle + offset). Higher flattens the spread; 0 makes it proportional to level.
mob-level:
  scaling-offset: 10
