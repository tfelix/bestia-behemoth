zone:
  version: ${version}
  # Slot Count which can be increased via a per account setting.
  bestia-base-slot-count: 4
  # The max amount of bestia slot a single master can have.
  bestia-max-slot-count: 8
  jwt-auth-secret-key: "your-secret-key-here-change-in-production"
  # Must be different for every zone which starts. So this probably needs to be overwritten
  # during deployment. This hard coded value is for development purposes.
  shard-id: 1
  party-name-max-length: 20

persistence:
  initial-delay-ms: 90000
  interval-ms: 90000

# Settings a *new* world is born with. Ignored once a world exists: what gets generated then comes from the
# stored record, because that is what its chunks and any player edits were built against.
worldgen:
  name: Genesis
  # Fixed, so every boot is the same world. Leave it unset and a seed is drawn at random on first boot and
  # persisted - reproducible after the fact, but useless while debugging, because the H2 datasource below is
  # in-memory: every restart is a different planet and no bug reproduces twice.
  #
  # This particular number is `StandardWorld.DEFAULT_SEED` (0xB3571A), chosen for two properties:
  #   - the viewer and the probe default to it, so `./gradlew :worldgen:viewer -Pcells=128` shows *this* world.
  #     Any other value and the offline tooling inspects a world the server is not running.
  #   - the world centre is dry land - tropical seasonal forest at 53 m - and the centre is where a new master
  #     spawns. Most seeds put the centre in open ocean: of fourteen sampled, twelve did.
  seed: 11753242
  # World extent in cells. A cell is `cell-size-metres` across, so at the default these are kilometres.
  width-cells: 128
  height-cells: 128
  cell-size-metres: 1000.0
  chunk-size: 32
  chunk-height: 256
  voxel-size-metres: 1.0
  sea-level-metres: 0.0
  # Whether the edges join up. Both on: the seam is hidden inside the 2.5 km ocean margin that `OceanBorder`
  # forces around all four edges, which is wider than the client can see. Y costs a climate discontinuity -
  # latitude is a linear ramp, so temperature and wind direction jump at the seam - but that lands in
  # unreachable polar ocean, and the alternative is a wall.
  wrap-x: true
  wrap-y: true
  # What to do when the stored world is not the world these settings and this build describe.
  #   REFUSE     - abort the boot. The safe answer, and what a live server wants.
  #   REGENERATE - delete the world and make the one that was asked for, moving every master to the new
  #                spawn. DESTRUCTIVE, no backup. Set here because this is the development configuration:
  #                the settings above are the thing being changed, and the H2 datasource is in-memory anyway.
  #   IGNORE     - boot regardless and log it.
  on-mismatch: REGENERATE

# Terrain streaming to the client. Runtime settings: unlike `worldgen` above, none of these affect what the
# terrain *is*, so they can change on a restart with no consequence.
chunk-stream:
  # Horizontal radius in chunks around the player's own. A chunk is 32 m across, so 5 gives an 11x11 square -
  # 352 m across, 176 m from centre to edge. Cost is quadratic: 7 would be 225 chunks rather than 121.
  view-radius-chunks: 5
  # Vertical radius in slabs. A slab is 256 m tall, so 1 is already a 768 m column - far more than the camera
  # shows. This caps what the surface rule may offer; it is not subscribed to as a box. Without it a login in
  # deep water offered every slab from the seabed up to the waterline, 726 chunks where 121 was the answer.
  view-radius-chunks-vertical: 1
  # Chunk payloads one connection may be sent per tick. At tick-rate 20 that is 80/s, so a first load of ~121
  # chunks spreads over about a second and a half. The cap is as much for the client - it drains its whole
  # receive queue in one frame - as for the socket.
  chunks-per-tick-per-player: 4
  # Token bucket for chunk requests. The burst has to cover a client legitimately asking for a whole manifest
  # at once on login; the refill is what limits sustained asking.
  request-burst: 512
  request-refill-per-tick: 2
  # Payloads below this are not compressed: deflate has a fixed overhead and a uniform underground chunk is
  # 13 bytes encoded and 19 deflated.
  deflate-minimum-bytes: 64
  deflate-level: 9
  # Encoded wire payloads kept (~3 kB each). This is what makes thirty players entering the same area cost one
  # encode between them rather than thirty, so it should exceed one view volume comfortably.
  encoded-cache-capacity: 1024
  # Decoded chunks kept for the server's own voxel queries. Half a megabyte each, so this sets the footprint:
  # 128 is about 64 MB.
  hot-chunk-capacity: 128
  # Cached vertical slab ranges, one per horizontal chunk column (two ints each, so this can be generous).
  # Computing one means a feature query plus ~1000 noise evaluations; never invalidated, because the
  # heightfield it derives from is immutable and player edits change voxels rather than terrain height.
  slab-cache-capacity: 16384
  # New slab ranges computed per tick, across all players. The cache makes a repeated manifest free, but the
  # first one over fresh ground still has to sample every column in the view volume - doing all 121 in one
  # tick stalls the zone thread for whole ticks. So a manifest grows over a second or so instead, which the
  # protocol already supports since it is a diff. The player's own column is never deferred.
  slab-computations-per-tick: 4
  # Derived structures (walkable spans, opacity) rebuilt per tick. Queries serve the stale copy until then,
  # which beats a rebuild hitch on the zone thread every time somebody places a block.
  derived-rebuilds-per-tick: 2
  # Whether the /carve chat command is honoured. It also needs the TERRAIN authority.
  allow-debug-edits: true

navigation:
  # Local (tile-accurate) pathfinding searches allowed per tick, across all NPCs. One bounded search is well
  # under a millisecond against a 50 ms tick, so this is generous; what it stops is a whole pack running out of
  # waypoints on the same tick and each starting one. A refused search costs nothing - the NPC keeps walking
  # what it had and asks again next tick.
  local-pathfinds-per-tick: 8
  # Longest straight-line distance, in tiles, the local tier will accept. Beyond this the caller wants the
  # macro graph: expanding a few thousand columns to discover the target is a kilometre away wastes the tick.
  # 32 is one chunk, comfortably more than any wander or chase needs.
  local-search-span: 32
  # Slack around the endpoints' bounding box, so walking round a building still fits inside the search.
  local-search-margin: 12
  # Hard ceiling on columns one local search may expand - the safety valve for a target in a sealed room.
  local-expansion-limit: 2048
  # How often blocked macro edges are re-tested. Seconds rather than ticks on purpose: a bridge being
  # destroyed is a rare discrete event, unlike the voxel edits derived-rebuilds-per-tick reacts to, so
  # checking every tick would be checking ~100x more often than anything changes. This is also the
  # propagation lag - NPCs learn a crossing is gone within a few seconds rather than instantly.
  macro-revalidate-seconds: 5
  # Stale edges re-tested per pass. Bounded for the same reason derived-rebuilds-per-tick is: mining along a
  # riverbank can invalidate a batch at once, and draining over two or three passes is invisible.
  macro-revalidations-per-pass: 8
  # How long an individual NPC may keep planning against a graph version it knows is out of date. Without this
  # every traveller in the world replans on the tick the graph moves, which is both a spike and a tell - a
  # hundred NPCs changing their minds together reads as a system reacting rather than creatures finding out.
  macro-replan-jitter-seconds: 60

world:
  tick-rate: 20
  parallel-systems: false
  logout-protection-seconds: 20

world-time:
  # Left unset: defaults to this server instance's boot time (a new world timeline each restart).
  # world-epoch: 2026-01-01T00:00:00Z
  speed-factor: 3.0

socket:
  ip-address: 127.0.0.1
  port: 8090
  authentication-timeout-seconds: 5
  filter-log-messages:
    - "!comp_path"
    - "!comp_position"
    # A few hundred entries per chunk, and one of these follows every chunk payload. It carries its own terse
    # toString, but the filter is what keeps it off the path entirely.
    - "!chunk_static_entities"

logging:
  level:
    root: INFO
    net.bestia.zone: TRACE
    net.bestia.zone.ecs.movement.MoveSystem: INFO # disable movement, too spammy

spring:
  datasource:
    url: jdbc:h2:mem:behemoth  # Example for H2 in-memory database
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create  # This setting will drop and recreate the schema on every start
    show-sql: false  # Optional: Show SQL statements in logs
    open-in-view: false

  h2:
    console:
      enabled: true  # Optional: Enable H2 console for accessing the database

  main:
    web-application-type: none