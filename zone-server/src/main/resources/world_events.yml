# The discrete events the World Event Director may pick for a province. Ladder effects (storms, stronger dens,
# sickness, rumours, scars) are not here: they follow the mana on their own.
#
# `script` names the WorldEvent bean that runs it; the boot fails on one nobody implements. `cost` comes out of the
# province budget, which grows by one per Bestia day up to five, so a cost of 1 is a small event and 5 a big one.
# `min-tier` and `min-tier-cells` say how much of the province must be at least that thick with mana. `cooldown`
# keeps the same event out of one province for a while after it last started there; `lasts` is how long it runs
# before it ends by itself. Both in Bestia days. `loot` is what everyone who fought or held ground for it splits
# by their share when players end it; nobody needs to accept anything to take part. `family` is what Observation
# calls it (mana, beasts, earth, sky, people) and `felt-from` how many times further than a small event it is felt.
events:
  # The strongest bestia of the province's own dens, born mana-touched and a few levels up, roams in from the
  # province edge toward the thickest mana. Killing it ends the event.
  - id: apex-roamer
    script: ApexRoamer
    cost: 1
    weight: 1
    min-tier: OMINOUS
    min-tier-cells: 12
    cooldown: 4
    lasts: 2
    family: beasts
    loot:
      - { item: mana_crystal, amount: 6 }

  # Where the mana runs thickest and the land around can feed it, a knot forms. It pulls quietly for a few
  # Bestia days, then opens, grows through five stages and collapses after a real day unless players drain the
  # land until it loses its hold, or seal it. See the rift section of the world events page.
  - id: rift
    script: Rift
    cost: 3
    weight: 1
    min-tier: EVENT
    min-tier-cells: 6
    cooldown: 6
    lasts: 10
    family: mana
    felt-from: 3
    loot:
      - { item: mana_crystal, amount: 30 }

  # A named bestia whose land lies in the province while its sky holds: see rare_bestia.yml. It roams near where
  # it came down and leaves when the sky moves on; killing it ends the event. Not drawn by mana at all.
  - id: rare-bestia
    script: RareBestia
    cost: 1
    weight: 1
    cooldown: 3
    lasts: 0.5
    family: beasts
    loot:
      - { item: mana_crystal, amount: 3 }

  # A den near a road or a town that nobody hunted for a week grows an alpha: its own species, a few levels up,
  # prowling the road. Killing it ends the event. The other side of the hunting ground that fills with mana: too
  # little hunting is a problem too.
  - id: alpha-rises
    script: AlphaRises
    cost: 1
    weight: 1
    cooldown: 4
    lasts: 3
    family: beasts
    loot:
      - { item: mana_crystal, amount: 4 }

  # Strong mana wears an old seal thin: a crystal of the history that holds a world boss, or a seal stone older than
  # a Bestia month. It cracks, and a ritual beside it within two Bestia days reinforces it. Otherwise it breaks: the
  # world boss wakes, or the stone spills the mana it held.
  - id: old-seal
    script: OldSeal
    cost: 3
    weight: 1
    min-tier: UNEASY
    min-tier-cells: 1
    cooldown: 10
    lasts: 3
    family: earth
    felt-from: 2
    loot:
      - { item: mana_crystal, amount: 10 }
