# What a townsperson does with a day.
#
# `shift` is the post, `rest` the bed, and OccupationCatalogue refuses an occupation whose two overlap.
# `rest` may be left out for anybody keeping ordinary hours - see OccupationCatalogue.DEFAULT_REST.
#
# `business` joins an occupation to a BusinessCatalogue trade, which is how the roster the world generator
# already decides gets people in it. Every trade must appear either as somebody's `business` or in
# `unstaffed` below; OccupationCoverage fails the boot otherwise.
#
# `dialog` is how many phrasings the client carries for this trade's greeting and for what it says about
# its own work. Leave it out for one of each. See OccupationDialog.
#
# `knowledge` weights the contest for the town's memories - see KnowledgeProfile. It only ever reorders
# that contest, so an interest is who *usually* remembers a thing and never who does. Leave it out for a
# trade with no particular claim on any of the news, which is most of them.
occupations:
  - id: guard
    dialog: { greetings: 5, trade: 5 }
    business: barracks
    shift: { from: 6, to: 18 }
    # The only one. Everybody else makes for a doorway when a fight starts - see TownsfolkDomain.TAKE_SHELTER.
    holds-ground: true
    knowledge:
      interests: [WAR_DECLARED, BATTLE, SIEGE, SETTLEMENT_SACKED, SETTLEMENT_RAZED, CONQUEST, FORT_BUILT]

  - id: priest
    dialog: { greetings: 5, trade: 5 }
    business: temple
    shift: { from: 8, to: 18 }
    knowledge:
      interests: [ORDER_SWORN, ORDER_SCHISM, SHRINE_RAISED, RITE_PERFORMED, MONASTERY_FOUNDED,
                  SEER_VANISHED, STAR_FELL]

  - id: innkeeper
    dialog: { greetings: 5, trade: 5 }
    business: inn
    # Open late, and so up late: an innkeeper on the commoner's bedtime would shut at ten every night.
    shift: { from: 10, to: 23 }
    rest: { from: 0, to: 7 }
    knowledge:
      # Travellers talk, so an innkeeper carries more of the town's news than most - but only a little
      # more. A large number here is a reach gradient, which is the one thing this model refuses to be.
      curiosity: 1.6
      interests: [TECHNOLOGY, PEACE, ARTIFACT_TAKEN, TRAVELLER_LOST, FIGURE_ROSE]

  # No shop of their own. A town has these whether or not its roster has room for a trade.
  - id: farmer
    dialog: { greetings: 5, trade: 5 }
    # The fields are outside the walls and the light is what decides, so this is the longest day in town.
    shift: { from: 6, to: 19 }
    rest: { from: 21, to: 5 }
    knowledge:
      # What the weather did to whom, which is the memory a farm keeps and passes down.
      interests: [FAMINE, FLOOD, PLAGUE, BLIGHT_SPREAD, ERUPTION]

  - id: labourer
    dialog: { greetings: 5, trade: 5 }
    shift: { from: 7, to: 17 }
    knowledge:
      # Whoever dug it, hauled it or raised it. A labourer's claim is on what the town built.
      interests: [MINE_OPENED, MONUMENT_BUILT, SETTLEMENT_WALLED, LIGHTHOUSE_LIT]

  - id: beggar
    dialog: { greetings: 5, trade: 5 }
    shift: { from: 9, to: 17 }
    knowledge:
      # On the street all day with nothing to do but watch, and nobody minds what they say near him.
      curiosity: 1.4

  # No shift at all, which is the case the WorkShift goal has to survive rather than a placeholder.
  - id: child
    dialog: { greetings: 5, trade: 5 }
    rest: { from: 21, to: 7 }
    knowledge:
      # Half of what everyone else has, and the half is the point: asking a child is how a player learns
      # that who they ask matters at all.
      curiosity: 0.5

# Trades the generator builds that nobody keeps yet. This list is the release's to-do, and it shrinks as
# occupations arrive - a name must come off it the day somebody takes the trade on.
unstaffed:
  - alchemist
  - apothecary
  - armourer
  - baker
  - banker
  - blacksmith
  - bookbinder
  - brewer
  - butcher
  - carpenter
  - charcoaler
  - dyer
  - fishmonger
  - general_store
  - healer
  - jeweller
  - market_trader
  - mason
  - miller
  - potter
  - scribe
  - shipwright
  - stable
  - tailor
  - tanner
  - vintner
  - weaver

# Minutes either side of the stated hours that one person's whole day is allowed to sit.
#
# One offset per person, applied to their shift *and* their bed rather than one draw per boundary: a
# translation keeps a shift its own length and keeps a post out of its own bedtime. The guard is why -
# his watch ends at exactly the minute his night begins, so independent draws would have him at his post
# in bed.
#
# A Bestia hour is twenty real minutes, so 30 is a ten-real-minute spread on when a street empties. 0 is off.
day-jitter-minutes: 30
