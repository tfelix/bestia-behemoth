# What a townsperson can say about each thing the world's history logged.
#
# Every EventKind must appear here or the boot fails. That is the point of the file: a kind nobody can
# talk about is an event class silently absent from every conversation in the world, which is the
# LIGHTHOUSE_LIT mistake - a thing standing on the map with nothing anywhere able to account for it,
# found by a player rather than by a build.
#
# `slots` are the placeholders a phrasing may use, and they are not free choices: they come from the
# event's own actors, so a kind whose events carry no settlement cannot say {place}. An eruption happens
# to a mountain and names nobody at all, which is why it has only the year. Declaring a slot the events
# do not carry is caught by HistoryLineTest against real worlds.
#
# Where the generator adds an actor conditionally - the abandon family attaches a civ only when one
# still held the place - the slot is left out rather than declared and hoped for.
#
# `eras` repeats the band names the Era enum declares, in its order. The bands themselves are Kotlin's -
# what the list is for is letting `./gradlew checkDialogDb` see which ERA_* rows the client owes, and the
# boot refuses a file where the two have drifted apart.
#
# `variants` is how many phrasings exist, HISTORY_<KIND>_1 upward. The speaker picks one off their own
# seed, so two people in a town tell you the same thing differently. Each kind also needs a
# HISTORY_<KIND>_ASK row, which is the option a player clicks. Both live in the client's dialogs.csv and
# are checked by `./gradlew checkDialogDb`.
events:
  # --- Settlements ------------------------------------------------------------------------------
  SETTLEMENT_FOUNDED: { variants: 3, slots: [civ, place, year, era] }
  SETTLEMENT_WALLED: { variants: 2, slots: [place, year, era] }
  SETTLEMENT_SACKED: { variants: 3, slots: [civ, place, year, era, foe] }
  # No civ: `abandon` attaches one only where somebody still held the place.
  SETTLEMENT_RAZED: { variants: 2, slots: [place, year, era] }
  SETTLEMENT_ABANDONED: { variants: 2, slots: [place, year, era] }
  SETTLEMENT_FORSAKEN: { variants: 1, slots: [place, year, era] }
  SETTLEMENT_BURIED: { variants: 3, slots: [place, year, era] }

  # --- Civilisations and war --------------------------------------------------------------------
  CIV_FOUNDED: { variants: 2, slots: [civ, place, year, era] }
  CIV_FELL: { variants: 2, slots: [civ, year, era] }
  CIV_ARRIVED: { variants: 2, slots: [civ, place, year, era] }
  CIV_MIGRATED: { variants: 2, slots: [civ, place, year, era] }
  CIV_REVOLT: { variants: 2, slots: [place, civ, year, era] }
  CIV_SECEDED: { variants: 2, slots: [civ, foe, place, year, era] }
  CIV_REFOUNDED: { variants: 2, slots: [civ, place, year, era] }
  SUCCESSION: { variants: 2, slots: [figure, civ, year, era] }
  SUCCESSION_CRISIS: { variants: 2, slots: [figure, civ, year, era] }
  DYNASTY_EXILED: { variants: 2, slots: [figure, civ, foe, place, year, era] }
  MARRIAGE_ALLIANCE: { variants: 2, slots: [figure, civ, foe, year, era] }
  FEUD_BEGAN: { variants: 2, slots: [figure, civ, foe, year, era] }
  VENGEANCE_SWORN: { variants: 2, slots: [figure, civ, year, era] }
  VENGEANCE_FULFILLED: { variants: 2, slots: [figure, civ, year, era] }
  BETRAYAL: { variants: 2, slots: [figure, place, civ, foe, year, era] }
  DEITY_RISEN: { variants: 2, slots: [deity, year, era] }
  CULT_FOUNDED: { variants: 2, slots: [figure, cult, place, year, era] }
  CULT_SPREAD: { variants: 2, slots: [cult, place, year, era] }
  CULT_PERSECUTED: { variants: 2, slots: [cult, civ, year, era] }
  CULT_WIPED_OUT: { variants: 2, slots: [cult, civ, year, era] }
  CULT_REVOLT: { variants: 2, slots: [cult, civ, foe, place, year, era] }
  CULT_ABSORBED: { variants: 2, slots: [cult, year, era] }
  MONSTER_AWOKE: { variants: 2, slots: [monster, year, era] }
  MONSTER_RAVAGED: { variants: 2, slots: [monster, place, year, era] }
  MONSTER_SLAIN: { variants: 2, slots: [figure, monster, place, artifact, year, era] }
  MONSTER_SEALED: { variants: 2, slots: [monster, year, era] }
  MONSTER_WITHDREW: { variants: 2, slots: [monster, year, era] }
  MONSTER_VANISHED: { variants: 2, slots: [monster, year, era] }
  WAR_DECLARED: { variants: 2, slots: [civ, year, era, foe] }
  BATTLE: { variants: 3, slots: [civ, year, era, foe] }
  SIEGE: { variants: 2, slots: [civ, place, year, era] }
  CONQUEST: { variants: 2, slots: [civ, place, year, era] }
  PEACE: { variants: 2, slots: [civ, year, era, foe] }

  # --- What the land did ------------------------------------------------------------------------
  PLAGUE: { variants: 3, slots: [place, year, era] }
  FAMINE: { variants: 2, slots: [place, year, era] }
  FLOOD: { variants: 2, slots: [place, year, era] }
  # A mountain waking names nobody and nowhere - the event carries no actors at all.
  ERUPTION: { variants: 3, slots: [year, era] }

  # --- People -----------------------------------------------------------------------------------
  FIGURE_ROSE: { variants: 2, slots: [civ, figure, year, era] }
  FIGURE_DIED: { variants: 1, slots: [civ, figure, year, era] }
  FIGURE_SLAIN: { variants: 2, slots: [civ, figure, year, era] }
  TRAVELLER_LOST: { variants: 3, slots: [civ, figure, year, era] }
  SEER_VANISHED: { variants: 1, slots: [figure, year, era] }

  # --- Things -----------------------------------------------------------------------------------
  ARTIFACT_FORGED: { variants: 1, slots: [artifact, figure, year, era] }
  ARTIFACT_TAKEN: { variants: 1, slots: [artifact, figure, year, era] }
  ARTIFACT_LOST: { variants: 1, slots: [year, era] }
  ARTIFACT_ENTOMBED: { variants: 1, slots: [artifact, figure, year, era] }
  ARTIFACT_ENSHRINED: { variants: 2, slots: [artifact, place, year, era] }
  # The place is where the victors took it; the town it came from is still in the event's detail.
  ARTIFACT_PLUNDERED: { variants: 2, slots: [artifact, place, civ, year, era] }
  # The place is the town that raised the monument.
  ARTIFACT_SEALED: { variants: 1, slots: [artifact, place, year, era] }

  # --- What was built ---------------------------------------------------------------------------
  MINE_OPENED: { variants: 1, slots: [civ, place, year, era] }
  MONASTERY_FOUNDED: { variants: 1, slots: [civ, place, year, era] }
  FORT_BUILT: { variants: 1, slots: [civ, place, year, era] }
  LIGHTHOUSE_LIT: { variants: 1, slots: [civ, place, year, era] }
  MONUMENT_BUILT: { variants: 1, slots: [civ, place, year, era] }
  TECHNOLOGY: { variants: 2, slots: [civ, year, era] }

  # --- The mana -----------------------------------------------------------------------------------
  STAR_FELL: { variants: 1, slots: [year, era] }
  BLIGHT_SPREAD: { variants: 1, slots: [place, year, era] }
  WARD_RAISED: { variants: 1, slots: [civ, place, year, era] }

  # --- The Orders ---------------------------------------------------------------------------------
  #
  # Absent from a first world's history entirely - they are logged only where a previous incarnation
  # had a victor. Voiced anyway, because "never on the default config" is not "never".
  ORDER_SWORN: { variants: 1, slots: [civ, place, year, era] }
  ORDER_SCHISM: { variants: 1, slots: [civ, place, year, era] }
  SHRINE_RAISED: { variants: 1, slots: [civ, place, year, era] }
  RITE_PERFORMED: { variants: 1, slots: [civ, year, era] }

# The lines a conversation owns itself, rather than getting from a memory or from a trade: how somebody
# signs off, how they answer "what is this place", what they say when they have no news, and what a
# half-built action answers with.
#
# `variants` and `slots` mean what they mean above - TALK_GOODBYE_1 upward, picked off the speaker's own
# seed - except that a slot here is filled by the provider that sends the line rather than by an event.
# The keys are ConversationKeys', which is what keeps a misspelling a compile error; this file owns only
# how many phrasings each has, and ConversationLineCatalogue refuses a boot that leaves one out.
#
# There is deliberately no entry for the rows a *player* clicks. See ConversationKeys.
conversation:
  TALK_GOODBYE: { variants: 4, slots: [] }
  TALK_ABOUT_TOWN: { variants: 4, slots: [town, trade] }
  TALK_NEWS_NONE: { variants: 4, slots: [] }
  TALK_NOT_YET: { variants: 4, slots: [] }
  # Said instead of a conversation to a Master this person, or their town, thinks badly of.
  TALK_COLD_SHOULDER: { variants: 3, slots: [] }
  # Said as the counter opens, so an action does not leave the conversation looking broken.
  TALK_SHOP_OPENED: { variants: 4, slots: [] }
  # An off-shift merchant asked when they open.
  TALK_SHOP_HOURS: { variants: 3, slots: [opens, closes] }
  # Frames around an old memory, which is sent as the {tale} token. Each speaker keeps one frame.
  TALK_HEARSAY_TOLD: { variants: 4, slots: [tale] }
  TALK_HEARSAY_LEGEND: { variants: 4, slots: [tale] }

# How long ago something was, in words - see the Era enum for the bands these name.
eras:
  - ERA_RECENT
  - ERA_LIVING
  - ERA_GENERATIONS
  - ERA_DISTANT
  - ERA_ANCIENT
