# What a townsperson can say about each thing the world's history logged.
#
# Every EventKind must appear here or the boot fails. That is the point of the file: a kind nobody can
# talk about is an event class silently absent from every conversation in the world, which is the
# LIGHTHOUSE_LIT mistake - a thing standing on the map with nothing anywhere able to account for it,
# found by a player rather than by a build.
#
# `slots` are the placeholders a phrasing may use, and they are not free choices: they come from the
# event's own actors, so a kind whose events carry no settlement cannot say {place}. An eruption happens
# to a mountain and names nobody at all, which is why it has only the year. Declaring a slot the events
# do not carry is caught by HistoryLineTest against real worlds.
#
# Where the generator adds an actor conditionally - the abandon family attaches a civ only when one
# still held the place - the slot is left out rather than declared and hoped for.
#
# `eras` repeats the band names the Era enum declares, in its order. The bands themselves are Kotlin's -
# what the list is for is letting `./gradlew checkDialogDb` see which ERA_* rows the client owes, and the
# boot refuses a file where the two have drifted apart.
#
# `variants` is how many phrasings exist, HISTORY_<KIND>_1 upward. The speaker picks one off their own
# seed, so two people in a town tell you the same thing differently. Each kind also needs a
# HISTORY_<KIND>_ASK row, which is the option a player clicks. Both live in the client's dialogs.csv and
# are checked by `./gradlew checkDialogDb`.
events:
  # --- Settlements ------------------------------------------------------------------------------
  SETTLEMENT_FOUNDED: { variants: 2, slots: [civ, place, year, era] }
  SETTLEMENT_WALLED: { variants: 1, slots: [place, year, era] }
  SETTLEMENT_SACKED: { variants: 2, slots: [civ, place, year, era, foe] }
  # No civ: `abandon` attaches one only where somebody still held the place.
  SETTLEMENT_RAZED: { variants: 1, slots: [place, year, era] }
  SETTLEMENT_ABANDONED: { variants: 1, slots: [place, year, era] }
  SETTLEMENT_FORSAKEN: { variants: 1, slots: [place, year, era] }
  SETTLEMENT_BURIED: { variants: 2, slots: [place, year, era] }

  # --- Civilisations and war --------------------------------------------------------------------
  CIV_FOUNDED: { variants: 1, slots: [civ, place, year, era] }
  CIV_FELL: { variants: 1, slots: [civ, year, era] }
  WAR_DECLARED: { variants: 1, slots: [civ, year, era, foe] }
  BATTLE: { variants: 2, slots: [civ, year, era, foe] }
  SIEGE: { variants: 1, slots: [civ, place, year, era] }
  CONQUEST: { variants: 1, slots: [civ, place, year, era] }
  PEACE: { variants: 1, slots: [civ, year, era, foe] }

  # --- What the land did ------------------------------------------------------------------------
  PLAGUE: { variants: 2, slots: [place, year, era] }
  FAMINE: { variants: 1, slots: [place, year, era] }
  FLOOD: { variants: 1, slots: [place, year, era] }
  # A mountain waking names nobody and nowhere - the event carries no actors at all.
  ERUPTION: { variants: 2, slots: [year, era] }

  # --- People -----------------------------------------------------------------------------------
  FIGURE_ROSE: { variants: 1, slots: [civ, figure, year, era] }
  FIGURE_DIED: { variants: 1, slots: [civ, figure, year, era] }
  FIGURE_SLAIN: { variants: 1, slots: [civ, figure, year, era] }
  TRAVELLER_LOST: { variants: 2, slots: [civ, figure, year, era] }
  SEER_VANISHED: { variants: 1, slots: [figure, year, era] }

  # --- Things -----------------------------------------------------------------------------------
  ARTIFACT_FORGED: { variants: 1, slots: [artifact, figure, year, era] }
  ARTIFACT_TAKEN: { variants: 1, slots: [artifact, figure, year, era] }
  ARTIFACT_LOST: { variants: 1, slots: [year, era] }
  ARTIFACT_ENTOMBED: { variants: 1, slots: [artifact, figure, year, era] }

  # --- What was built ---------------------------------------------------------------------------
  MINE_OPENED: { variants: 1, slots: [civ, place, year, era] }
  MONASTERY_FOUNDED: { variants: 1, slots: [civ, place, year, era] }
  FORT_BUILT: { variants: 1, slots: [civ, place, year, era] }
  LIGHTHOUSE_LIT: { variants: 1, slots: [civ, place, year, era] }
  MONUMENT_BUILT: { variants: 1, slots: [civ, place, year, era] }
  TECHNOLOGY: { variants: 1, slots: [civ, year, era] }

  # --- The mana -----------------------------------------------------------------------------------
  STAR_FELL: { variants: 1, slots: [year, era] }
  BLIGHT_SPREAD: { variants: 1, slots: [place, year, era] }
  WARD_RAISED: { variants: 1, slots: [civ, place, year, era] }

  # --- The Orders ---------------------------------------------------------------------------------
  #
  # Absent from a first world's history entirely - they are logged only where a previous incarnation
  # had a victor. Voiced anyway, because "never on the default config" is not "never".
  ORDER_SWORN: { variants: 1, slots: [civ, place, year, era] }
  ORDER_SCHISM: { variants: 1, slots: [civ, place, year, era] }
  SHRINE_RAISED: { variants: 1, slots: [civ, place, year, era] }
  RITE_PERFORMED: { variants: 1, slots: [civ, year, era] }

# How long ago something was, in words - see the Era enum for the bands these name.
eras:
  - ERA_RECENT
  - ERA_LIVING
  - ERA_GENERATIONS
  - ERA_DISTANT
  - ERA_ANCIENT
