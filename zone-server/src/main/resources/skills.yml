skills:
  - id: 1
    identifier: M_BASIC_SKILL
    targetType: FRIENDLY
    description: |
      The first lessons every wanderer learns before mana ever answers their call - how to speak
      with others, strike a fair trade, and hold their own among strangers.

      Lv.1 Allows to trade with other players.
      Lv.2 Allows to chat with other players via public and whisper chat.
      Lv.3 Allows to use trade posts.
      Lv.4 Allows sitting to double HP & Mana recovery.
      Lv.5 Allows to create parties and invite players into them. Joining a party needs no rank.
      Unlocks all the other skill trees.

  - id: 2
    identifier: M_DIVINE_PROTECTION
    targetType: FRIENDLY

  - id: 3
    identifier: M_COOKING
    script: Cooking
    targetType: GROUND
    range: 2
    description: |
      The Master and his Bestia can learn recipes and start to cook meals on fire places. Food
      helps a Bestia to keep its health and stamina up and usually applies buff effects when it
      is eaten.

      Level 1 enables you to place a campfire to cook at. What you can cook grows with the
      recipes you discover, not with the rank.

      Lv.1 `-0%` cooking time, `+0%` success chance, 5 stamina
      Lv.2 `-20%` cooking time, `+20%` success chance, 8 stamina
      Lv.3 `-40%` cooking time, `+40%` success chance, 11 stamina

  - id: 4
    identifier: M_HEAL
    script: Heal
    targetType: FRIENDLY
    needsLineOfSight: false

  - id: 5
    identifier: M_FIREBOLT
    script: Firebolt
    targetType: ENEMY
    needsLineOfSight: true
    range: 8
    manaCost: 12
    castTime: 2.0
    description: |
      Hurls a bolt of searing fire at a single enemy.

      Must be channelled - moving or taking damage interrupts the cast.

  - id: 6
    identifier: M_BLESSING
    script: Blessing
    targetType: FRIENDLY
    needsLineOfSight: true
    description: |
      Blesses the target with divine power.
      
      Temporary increase of STR, DEX, INT and HIT. Versus Undead property and Demon race
      Bestia halves their DEX and INT instead.
      
      [table=5]
      [cell]Level[/cell][cell]Stat Increase[/cell][cell]HIT Increase[/cell][cell]Duration[/cell][cell]Mana[/cell]
      [cell]1[/cell][cell]1[/cell][cell]2[/cell][cell]60s[/cell][cell]28[/cell][cell]2[/cell][cell]2[/cell][cell]4[/cell][cell]80s[/cell][cell]32[/cell][cell]3[/cell][cell]3[/cell][cell]6[/cell][cell]100s[/cell][cell]36[/cell][cell]4[/cell][cell]4[/cell][cell]8[/cell][cell]120s[/cell][cell]40[/cell][cell]5[/cell][cell]5[/cell][cell]10[/cell][cell]140s[/cell][cell]44[/cell][cell]6[/cell][cell]6[/cell][cell]12[/cell][cell]160s[/cell][cell]48[/cell][cell]7[/cell][cell]7[/cell][cell]14[/cell][cell]180s[/cell][cell]52[/cell][cell]8[/cell][cell]8[/cell][cell]16[/cell][cell]200s[/cell][cell]56[/cell][cell]9[/cell][cell]9[/cell][cell]18[/cell][cell]220s[/cell][cell]60[/cell][cell]10[/cell][cell]10[/cell][cell]20[/cell][cell]240s[/cell][cell]64[/cell][/table]

  - id: 8
    identifier: M_FIRST_AID
    script: FirstAid
    targetType: FRIENDLY
    needsLineOfSight: true
    range: 2
    manaCost: 12
    castTime: 10.0
    description: |
      Apply bandages to yourself or to a friendly Bestia or master and channel a healing effect
      over 10s. The cooldown of this skill is 3 minutes. A target can only receive a single
      First Aid every 60 secs.

      Whichever is smaller, a share of the maximum health of the target or a flat amount:
      Lv.1 `+30%` max HP or `+100 HP`, 12 mana
      Lv.2 `+60%` max HP or `+200 HP`, 16 mana
      Lv.3 `+100%` max HP or `+350 HP`, 20 mana

# --- Craftsman Tree ---
  - id: 10
    identifier: M_CARPENTRY
    script: Carpentry
    targetType: GROUND
    range: 2
    manaCost: 20
    description: |
      Turns raw timber and honest labor into the workbenches, furniture and structures every
      settlement needs to stand on its own.

      Level 1 enables you to place a Workbench
      `+5%/lv` success chance
      `+10 item lv/lv` of items that can be produced, up to item level 100+ at max rank

  - id: 11
    identifier: M_MASTER_CRAFTSMAN
    targetType: FRIENDLY
    description: |
      A lifetime of calluses paid off - tools answer faster and structures rise quicker under
      this Craftsman's hand, and the Bestia working alongside them keep pace.

      `-10%/lv` construction time of structures
      `+2%/lv` construction success chance

  - id: 12
    identifier: M_ITEM_CUSTOMIZATION
    script: ItemCustomization
    targetType: GROUND
    range: 2
    manaCost: 23
    description: |
      A meticulous rework that opens sockets in an item's frame, letting a Runic Etcher's runes
      be slotted into it later. Requires an Engraving Set which will be consumed in the process.

      `+10%/lv` success chance
      `-2%/lv` chance to destroy the item when the engraving fails, from 30% down to 12%
      1 rune slot, rising to 2 at Lv.4 and 3 at Lv.7
      Every slot beyond the first lowers the success chance by 40%

# Blacksmith
  - id: 13
    identifier: M_ORE_REFINEMENT
    script: OreRefinement
    targetType: GROUND
    range: 2
    manaCost: 18
    castTime: 10.0
    description: |
      Feeds raw ore to the roar of the furnace, coaxing out the pure ingots every weapon and
      suit of armor is ultimately built from. Burns Coal as fuel. A failed smelt loses both
      the ore and the fuel.

      Level 1 enables you to place a Furnace
      `+30%/lv` refinement success chance, no ore level cap

  - id: 14
    identifier: M_FORGE_WEAPON
    script: ForgeWeapon
    targetType: GROUND
    range: 2
    manaCost: 23
    castTime: 10.0
    description: |
      Discovers and forges weapon blueprints from smelted ingots - the Blacksmith's bread and
      butter. Higher skill levels reliably reach higher-level weapons.

      Level 1 enables you to place a Forge
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 15
    identifier: M_FORGE_ARMOR
    script: ForgeArmor
    targetType: GROUND
    range: 2
    manaCost: 23
    castTime: 10.0
    description: |
      The counterpart to Forge Weapon: discovers and forges armor blueprints - plate, mail and
      shields - from smelted ingots. Higher skill levels reliably reach higher-level armor.

      Level 1 enables you to place a Forge
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 16
    identifier: M_EQUIPMENT_REPAIR
    script: EquipmentRepair
    targetType: GROUND
    range: 2
    manaCost: 33
    castTime: 3.0
    description: |
      Hammers dents from armor and sets a fresh edge to broken blades, coaxing worn-out
      equipment back into fighting shape. Only weapons and armor wear out and can be repaired.
      The burnt time of a light source is gone for good.

      `+20 item lv/lv` of equipment that can be repaired, up to item level 100+ at max rank

  - id: 17
    identifier: M_WEAPONRY_RESEARCH
    targetType: FRIENDLY
    description: |
      Deeper knowledge of weapons and armor that raises the odds of successfully refining
      either one further after forging. If an upgrade fails the equipment can be destroyed.

      `+4%/lv` success chance when upgrading a weapon or armor
      `+1%/lv` success chance when forging

  - id: 18
    identifier: M_MASTER_SMITH
    targetType: FRIENDLY
    description: |
      The capstone of the forge. Makes a Blacksmith's hands steady enough to trust with the
      rarest ore.

      `+5%/lv` Weapon/Armor forging chance
      `+5%/lv` upgrade chance

# Artificer
  - id: 19
    identifier: M_MANA_HARVESTER
    script: ManaHarvester
    targetType: GROUND
    range: 2
    manaCost: 19
    castTime: 10.0
    description: |
      Build and operate Mana Harvesters which channel mana from the environment into raw
      crystals - the source of magic for many use cases. Yield follows the local mana
      concentration, so where a harvester stands matters as much as its rank.

      Level 1 enables you to place a Mana Harvester
      `-5%/lv` harvesting time
      `+3%/lv` crystal yield
      One more active harvester at Lv.4, Lv.7 and Lv.10

  - id: 20
    identifier: M_MANAFLOW_EXPERT
    script: ManaflowExpert
    targetType: GROUND
    range: 2
    manaCost: 22
    castTime: 10.0
    description: |
      Refine the raw and unstable mana crystals harvested by a Mana Harvester into the finest
      arcane raw materials used to build powerful magic artifacts. A crystal above your max
      crystal level cannot be refined.

      Level 1 enables you to place a Crystal Lathe
      `+4%/lv` success chance
      `+20 crystal lv/lv` max crystal level, 100+ at max rank

  - id: 21
    identifier: M_RUNIC_ETCHING
    script: RunicEtching
    targetType: GROUND
    range: 2
    manaCost: 25
    castTime: 10.0
    description: |
      Create runes from Bestia essences. These runes are imbued with the power of the Bestia
      and can be slotted into a weapon or piece of equipment that has been prepared with Item
      Customization. An attempt to convert a Bestia into an essence destroys the Bestia.

      Level 1 enables you to place a Carving Table, the Bestia must stand next to it
      `+5%/lv` success chance
      `+10 Bestia lv/lv` reliable Bestia level, 100+ at max rank
      `-5%` success chance per Bestia level above the reliable one, no hard cap

  - id: 22
    identifier: M_MAGIC_ARTISAN
    script: MagicArtisan
    targetType: GROUND
    range: 2
    manaCost: 38
    castTime: 10.0
    description: |
      Can create magic artifacts by binding sustained enchantments to an item, going well
      beyond what a single etched rune can hold. Every binding needs refined mana crystals.

      Level 1 enables you to place an Enchantment Altar
      `+4%/lv` enchantment chance
      `-3%/lv` chance to destroy the item if the binding fails, from 40% down to 13%

# Alchemist
  - id: 23
    identifier: M_HERBALISM
    targetType: FRIENDLY
    description: |
      Teaches which roots, herbs and mana-touched growth are worth the harvest, and how to
      keep them potent until they reach the cauldron. A herb above your max level cannot be
      gathered.

      `+20 herb lv/lv` max herb level, 100+ at max rank

  - id: 24
    identifier: M_ALCHEMY
    script: Alchemy
    targetType: GROUND
    range: 2
    manaCost: 24
    castTime: 10.0
    description: |
      The core craft of the Alchemist: brewing reagents down into potions, tonics and other
      consumables. Builds directly on what Herbalism teaches about picking the right ingredient.

      Level 1 enables you to place an Alchemy Laboratory
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 25
    identifier: M_TRANSMUTATION
    script: Transmutation
    targetType: GROUND
    range: 2
    manaCost: 34
    castTime: 10.0
    description: |
      The Alchemist's capstone. Where Alchemy brews what nature already provides,
      Transmutation reshapes mundane matter itself into the rare magically-infused resources
      needed for strong artifact creation and weapon refinements.

      Level 1 enables you to place a Transmutation Workbench
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 26
    identifier: M_ALCHEMY_MASTERY
    targetType: FRIENDLY
    description: |
      A deeper feel for the cauldron - reagents stretch further and brews take hold more
      reliably under this Alchemist's hand.

      `+5%/lv` Alchemy success chance
      `+10%/lv` Alchemy crafting speed

# --- Survival Tree ---
  - id: 27
    identifier: M_INNER_PEACE
    targetType: FRIENDLY
    description: |
      Your Bestia and Master gain an increased HP and Mana regeneration rate.

      `+3% effect/lv`

  - id: 28
    identifier: M_WEATHER_RESISTANCE
    targetType: FRIENDLY
    description: |
      Your Bestia and Master gain an increased tolerance against high and low environment
      temperatures.

      `+3%` higher tolerance/lv

  - id: 29
    identifier: M_QUICK_TRAVEL
    targetType: FRIENDLY
    description: |
      You and your Bestia know every kind of terrain.

      `+3%` higher movement speed/lv

  - id: 30
    identifier: M_FISHING
    script: Fishing
    targetType: GROUND
    description: |
      With this skill you are able to catch fish. Fish can be cooked and are used for food and
      trading.

      `+20 fish lv/lv` that can be caught, up to fish level 100+ at max rank

# Forester
  - id: 31
    identifier: M_LUMBERJACK
    targetType: FRIENDLY
    description: |
      The player is able to gather wood resources faster.

      `-3%/lv` wood gathering time
      `+2%/lv` resource drop chance

  - id: 32
    identifier: M_TRAPPING
    script: Trapping
    targetType: GROUND
    description: |
      Sets snares and deadfalls that keep working for the master even while they're off doing
      something else, passively catching small game over time for meat and pelts on a later
      check-in.

      `+4%/lv` chance a snare yields a catch
      Higher levels unlock snares for larger game

  - id: 33
    identifier: M_EXPERT_TAMING
    targetType: FRIENDLY
    description: |
      Bestia under your control gain faster experience and require less food to maintain their
      stamina out in the open.

      `+5%/lv` EXP gain
      `-2%/lv` stamina loss

  - id: 34
    identifier: M_BEASTFRIEND
    targetType: FRIENDLY
    description: |
      Detailed knowledge of the Bestia and their behavior makes it easier for you to tame and
      catch them.

      `+5%/lv` chance to tame

# Prospector
  - id: 35
    identifier: M_MAXIMIZE_CARRY_CAPACITY
    targetType: FRIENDLY
    description: |
      Raises the carrying capacity of your own Master.

      `+10%/lv` weight limit

  - id: 36
    identifier: M_ENLARGE_WEIGHT_LIMIT
    targetType: FRIENDLY
    description: |
      Raises the carrying capacity of every Bestia under your control.

      `+10%/lv` weight limit

  - id: 37
    identifier: M_CARTOGRAPHY
    script: Cartography
    targetType: GROUND
    range: 4
    manaCost: 15
    # Surveying channels, so it runs through the existing Casting/CastingSystem and can be interrupted by
    # taking a hit. A survey that resolved instantly would be a map drawn while running away from something.
    castTime: 5.0
    description: |
      Enables the player to chart unexplored land, revealing terrain that can be shared,
      traded on, or built on.

      Spends one sheet of blank vellum and produces a chart of the ground around the surveyed
      point. Each level reaches a kilometre further, up to five at full rank.

  - id: 38
    identifier: M_WILDERNESS_SURVIVAL
    targetType: FRIENDLY
    description: |
      Hardens the master and their Bestia against travel through hostile terrain, far from the
      comfort of a settlement. Reduces the stamina and HP drain caused by hostile terrain and
      environmental hazards.

      `-10%/lv` stamina drain in hostile terrain
      `-10%/lv` environmental hazard damage

  - id: 39
    identifier: M_WEATHER_SENSE
    targetType: FRIENDLY
    description: |
      An instinct for reading the sky and wind well before a storm ever arrives, letting the
      Prospector plan a route or a dig around what's coming.

      `+5min/lv` how far ahead upcoming weather changes can be sensed. Level 1 shows you the
      current wind direction and speed.

# Miner
  - id: 40
    identifier: M_MINING
    script: Mining
    targetType: GROUND
    description: |
      Specialized in digging mine shafts and gathering mineral resources.

      Level 1 enables you to place a mining shaft
      `-10%/lv` mining time
      `+20 resource lv/lv` that can be mined, up to resource level 100+ at max rank

  - id: 41
    identifier: M_GEM_CUTTING
    script: GemCutting
    targetType: GROUND
    description: |
      Turns the rough gemstones a Miner digs up into cut stones fit for an Artificer's socket
      or a Trader's scale. Can cut raw gems recovered from mining into faceted gemstones,
      increasing their value and unlocking their use in socketed equipment.

      Higher levels unlock cutting higher-grade gems
      `-8%/lv` chance to shatter a gem while cutting

  - id: 42
    identifier: M_DEEP_DELVER
    targetType: FRIENDLY
    description: |
      Lets a Miner push shafts deeper than good sense would recommend, into ground that pays
      off precisely because nobody else risks it. Grants access to deeper, more dangerous mine
      shafts holding rarer ore veins and the odd buried structure.

      `+10% more resources/lv`

  - id: 43
    identifier: M_RESOURCE_SONAR
    targetType: FRIENDLY
    description: |
      The Miner's capstone: a feel for what's underfoot precise enough to map a shaft before
      the first swing of the pick.

      Can sense ore and gem deposits through solid rock within 5m / Lv.

  # Craftsman tree - see the tree grouping in master_skill_tree.yml.
  - id: 44
    identifier: M_UPGRADE_EQUIPMENT
    script: UpgradeEquipment
    targetType: GROUND
    range: 2
    manaCost: 18
    description: |
      Time spent far from settlements teaches a Craftsman to adapt and improvise, reworking
      weapons and armor in the field to better suit their needs. Each attempt can fail, and a
      failed attempt can destroy the equipment outright.

      Weaponry Research raises the odds; Master Smith raises them further.

  - id: 45
    identifier: M_READ_TRACKS
    script: ReadTracks
    targetType: GROUND
    range: 4
    manaCost: 8
    # Deliberately no cast time: reading the ground is a look, not a working, and the answer is already
    # in memory. Cartography channels because it produces a thing; this produces a sentence.
    description: |
      Reads what has walked over a patch of ground, from the prints it left. Ground that takes
      no print - rock, paving, ice - keeps no tracks at all, at any rank.

      `+3 tiles/lv` how far around the read point you can search
      Level 2 reads which way the trail led
      Level 3 names what made it, and how strong it was
      Level 4 names another master by name

  - id: 46
    identifier: M_SPRINT
    script: Sprint
    targetType: FRIENDLY
    needsLineOfSight: false
    description: |
      A burst of speed for when walking away is not fast enough - the first escape every
      wanderer learns, and the one they never stop using.

      Lasts 5s and costs 20 stamina instead of mana. Ends early when you attack or cast a
      skill. Cooldown 30s.

      Lv.1 `+30%` movement speed
      Lv.2 `+40%` movement speed
      Lv.3 `+50%` movement speed

  - id: 47
    identifier: M_CALL_BESTIA
    script: CallBestia
    targetType: FRIENDLY
    needsLineOfSight: false
    manaCost: 10
    castTime: 5.0
    description: |
      A whistle every Bestia learns to answer. Calls your Bestias back from wherever they
      wandered off to.

      Every Bestia you own that is out in the world, and not in storage, appears next to you
      when the channel ends. Taking damage breaks the channel. A Bestia that is fighting does
      not answer. Cooldown 5min.

# BESTIA SKILLS (reserved 1000-8999, see master_skill_tree.yml / skill-system SKILL.md)
  - id: 1000
    identifier: ember
    name: Ember
    script: Ember
    archetype: DOT
    element: FIRE
    cooldown: 12
    targetType: AOE_GROUND
    aoeRadius: 1.0
    needsLineOfSight: true
    range: 6
    manaCost: 6
    description: |
      Sets a patch of ground alight. Everything standing in the flames is burnt every 1.2s for
      9.6s - eight times in all.

      Aimed at the ground rather than at a creature, and it does not care whose side anyone is on:
      the flames burn the caster too.


