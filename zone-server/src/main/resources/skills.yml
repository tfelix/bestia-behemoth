skills:
  - id: 1
    identifier: M_BASIC_SKILL
    targetType: FRIENDLY
    description: |
      The first lessons every wanderer learns before mana ever answers their call - how to speak
      with others, strike a fair trade, and hold their own among strangers.

      Lv.1 Allows to trade with other players.
      Lv.2 Allows to chat with other players via public and whisper chat.
      Lv.3 Allows to use trade posts.
      Lv.4 Allows sitting to double HP & Mana recovery.
      Lv.5 Allows to create parties and invite players into them. Joining a party needs no rank.
      Unlocks all the other skill trees.

  - id: 3
    identifier: M_COOKING
    script: Cooking
    targetType: GROUND
    range: 2
    description: |
      The Master and his Bestia can learn recipes and start to cook meals on fire places. Food
      helps a Bestia to keep its health and stamina up and usually applies buff effects when it
      is eaten.

      Level 1 enables you to place a campfire to cook at. What you can cook grows with the
      recipes you discover, not with the rank.

      Lv.1 `-0%` cooking time, `+0%` success chance, 5 stamina
      Lv.2 `-20%` cooking time, `+20%` success chance, 8 stamina
      Lv.3 `-40%` cooking time, `+40%` success chance, 11 stamina

  - id: 4
    identifier: M_HEAL
    script: Heal
    targetType: FRIENDLY
    needsLineOfSight: false
    range: 9
    manaCost: 13
    castTime: 1.5
    description: |
      Channels mana directly into a target's wounds, restoring HP in an instant. The Priest's
      bread and butter - simple, reliable, and the first rite every Priest learns.

      Heals `[(BaseLv + INT) / 8] * (4 + 8 * SkillLv)` HP. Against an Undead target it is a holy
      attack for half that amount.
      `+3/lv` mana cost, from 13 at Lv.1

  - id: 5
    identifier: M_FIREBOLT
    script: Firebolt
    targetType: ENEMY
    needsLineOfSight: true
    range: 9
    manaCost: 18
    castTime: 2.0
    description: |
      A quick bolt of flame hurled at a single target. The first spell most Wizards ever learn,
      and the one they cast the most often. Must be channelled - moving or taking damage
      interrupts the cast.

      `+20%/lv` MATK
      `-0.2s/lv` cast time

  - id: 6
    identifier: M_BLESSING
    script: Blessing
    targetType: FRIENDLY
    needsLineOfSight: true
    range: 9
    manaCost: 28
    castTime: 2.0
    description: |
      A benediction that steadies body and mind. On an Undead or Demon target it turns into a
      curse that halves DEX and INT instead.

      `+2/lv` STR, DEX and INT
      `+4/lv` HIT
      `+3/lv` ATK and MATK
      `40s + 40s/lv` duration

  - id: 8
    identifier: M_FIRST_AID
    script: FirstAid
    targetType: FRIENDLY
    needsLineOfSight: true
    range: 2
    manaCost: 12
    castTime: 10.0
    description: |
      Apply bandages to yourself or to a friendly Bestia or master and channel a healing effect
      over 10s. The cooldown of this skill is 3 minutes. A target can only receive a single
      First Aid every 60 secs.

      Whichever is smaller, a share of the maximum health of the target or a flat amount:
      Lv.1 `+30%` max HP or `+100 HP`, 12 mana
      Lv.2 `+60%` max HP or `+200 HP`, 16 mana
      Lv.3 `+100%` max HP or `+350 HP`, 20 mana

# --- Craftsman Tree ---
  - id: 10
    identifier: M_CARPENTRY
    script: Carpentry
    targetType: GROUND
    range: 2
    manaCost: 20
    description: |
      Turns raw timber and honest labor into the workbenches, furniture and structures every
      settlement needs to stand on its own.

      Level 1 enables you to place a Workbench
      `+5%/lv` success chance
      `+10 item lv/lv` of items that can be produced, up to item level 100+ at max rank

  - id: 11
    identifier: M_MASTER_CRAFTSMAN
    targetType: FRIENDLY
    description: |
      A lifetime of calluses paid off - tools answer faster and structures rise quicker under
      this Craftsman's hand, and the Bestia working alongside them keep pace.

      `-10%/lv` construction time of structures
      `+2%/lv` construction success chance

  - id: 12
    identifier: M_ITEM_CUSTOMIZATION
    script: ItemCustomization
    targetType: GROUND
    range: 2
    manaCost: 23
    description: |
      A meticulous rework that opens sockets in an item's frame, letting a Runic Etcher's runes
      be slotted into it later. Requires an Engraving Set which will be consumed in the process.

      `+10%/lv` success chance
      `-2%/lv` chance to destroy the item when the engraving fails, from 30% down to 12%
      1 rune slot, rising to 2 at Lv.4 and 3 at Lv.7
      Every slot beyond the first lowers the success chance by 40%

# Blacksmith
  - id: 13
    identifier: M_ORE_REFINEMENT
    script: OreRefinement
    targetType: GROUND
    range: 2
    manaCost: 18
    castTime: 10.0
    description: |
      Feeds raw ore to the roar of the furnace, coaxing out the pure ingots every weapon and
      suit of armor is ultimately built from. Burns Coal as fuel. A failed smelt loses both
      the ore and the fuel.

      Level 1 enables you to place a Furnace
      `+30%/lv` refinement success chance, no ore level cap

  - id: 14
    identifier: M_FORGE_WEAPON
    script: ForgeWeapon
    targetType: GROUND
    range: 2
    manaCost: 23
    castTime: 10.0
    description: |
      Discovers and forges weapon blueprints from smelted ingots - the Blacksmith's bread and
      butter. Higher skill levels reliably reach higher-level weapons.

      Level 1 enables you to place a Forge
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 15
    identifier: M_FORGE_ARMOR
    script: ForgeArmor
    targetType: GROUND
    range: 2
    manaCost: 23
    castTime: 10.0
    description: |
      The counterpart to Forge Weapon: discovers and forges armor blueprints - plate, mail and
      shields - from smelted ingots. Higher skill levels reliably reach higher-level armor.

      Level 1 enables you to place a Forge
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 16
    identifier: M_EQUIPMENT_REPAIR
    script: EquipmentRepair
    targetType: GROUND
    range: 2
    manaCost: 33
    castTime: 3.0
    description: |
      Hammers dents from armor and sets a fresh edge to broken blades, coaxing worn-out
      equipment back into fighting shape. Only weapons and armor wear out and can be repaired.
      The burnt time of a light source is gone for good.

      `+20 item lv/lv` of equipment that can be repaired, up to item level 100+ at max rank

  - id: 17
    identifier: M_WEAPONRY_RESEARCH
    targetType: FRIENDLY
    description: |
      Deeper knowledge of weapons and armor that raises the odds of successfully refining
      either one further after forging. If an upgrade fails the equipment can be destroyed.

      `+8%/lv` success chance when upgrading a weapon or armor
      `+2%/lv` success chance when forging

  - id: 18
    identifier: M_MASTER_SMITH
    targetType: FRIENDLY
    description: |
      The capstone of the forge. Makes a Blacksmith's hands steady enough to trust with the
      rarest ore.

      `+5%/lv` Weapon/Armor forging chance
      `+5%/lv` upgrade chance

# Artificer
  - id: 19
    identifier: M_MANA_HARVESTER
    script: ManaHarvester
    targetType: GROUND
    range: 2
    manaCost: 19
    castTime: 10.0
    description: |
      Build and operate Mana Harvesters which channel mana from the environment into raw
      crystals - the source of magic for many use cases. Yield follows the local mana
      concentration, so where a harvester stands matters as much as its rank.

      Level 1 enables you to place a Mana Harvester
      `-5%/lv` harvesting time
      `+3%/lv` crystal yield
      One more active harvester at Lv.4, Lv.7 and Lv.10

  - id: 20
    identifier: M_MANAFLOW_EXPERT
    script: ManaflowExpert
    targetType: GROUND
    range: 2
    manaCost: 22
    castTime: 10.0
    description: |
      Refine the raw and unstable mana crystals harvested by a Mana Harvester into the finest
      arcane raw materials used to build powerful magic artifacts. A crystal above your max
      crystal level cannot be refined.

      Level 1 enables you to place a Crystal Lathe
      `+4%/lv` success chance
      `+20 crystal lv/lv` max crystal level, 100+ at max rank

  - id: 21
    identifier: M_RUNIC_ETCHING
    script: RunicEtching
    targetType: GROUND
    range: 2
    manaCost: 25
    castTime: 10.0
    description: |
      Create runes from Bestia essences. These runes are imbued with the power of the Bestia
      and can be slotted into a weapon or piece of equipment that has been prepared with Item
      Customization. An attempt to convert a Bestia into an essence destroys the Bestia.

      Level 1 enables you to place a Carving Table, the Bestia must stand next to it
      `+5%/lv` success chance
      `+10 Bestia lv/lv` reliable Bestia level, 100+ at max rank
      `-5%` success chance per Bestia level above the reliable one, no hard cap

  - id: 22
    identifier: M_MAGIC_ARTISAN
    script: MagicArtisan
    targetType: GROUND
    range: 2
    manaCost: 38
    castTime: 10.0
    description: |
      Can create magic artifacts by binding sustained enchantments to an item, going well
      beyond what a single etched rune can hold. Every binding needs refined mana crystals.

      Level 1 enables you to place an Enchantment Altar
      `+4%/lv` enchantment chance
      `-3%/lv` chance to destroy the item if the binding fails, from 40% down to 13%

# Alchemist
  - id: 23
    identifier: M_HERBALISM
    targetType: FRIENDLY
    description: |
      Teaches which roots, herbs and mana-touched growth are worth the harvest, and how to
      keep them potent until they reach the cauldron. A herb above your max level cannot be
      gathered.

      `+20 herb lv/lv` max herb level, 100+ at max rank

  - id: 24
    identifier: M_ALCHEMY
    script: Alchemy
    targetType: GROUND
    range: 2
    manaCost: 24
    castTime: 10.0
    description: |
      The core craft of the Alchemist: brewing reagents down into potions, tonics and other
      consumables. Builds directly on what Herbalism teaches about picking the right ingredient.

      Level 1 enables you to place an Alchemy Laboratory
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 25
    identifier: M_TRANSMUTATION
    script: Transmutation
    targetType: GROUND
    range: 2
    manaCost: 34
    castTime: 10.0
    description: |
      The Alchemist's capstone. Where Alchemy brews what nature already provides,
      Transmutation reshapes mundane matter itself into the rare magically-infused resources
      needed for strong artifact creation and weapon refinements.

      Level 1 enables you to place a Transmutation Workbench
      `+5%/lv` success chance
      `+10 item lv/lv` reliable item level, 100+ at max rank
      `-5%` success chance per item level above the reliable one, no hard cap

  - id: 26
    identifier: M_ALCHEMY_MASTERY
    targetType: FRIENDLY
    description: |
      A deeper feel for the cauldron - reagents stretch further and brews take hold more
      reliably under this Alchemist's hand.

      `+5%/lv` Alchemy success chance
      `+10%/lv` Alchemy crafting speed

# --- Survival Tree ---
  # Meditation sits on the Warrior trunk, but keeps the id it had as Inner Peace in this tree.
  - id: 27
    identifier: M_MEDITATION
    targetType: FRIENDLY
    description: |
      A calm, centered breathing that quickens the master's natural mending.

      `+6%/lv` HP and Mana regeneration

  - id: 28
    identifier: M_WEATHER_RESISTANCE
    targetType: FRIENDLY
    description: |
      Nights in the snow and noons in the desert teach a Master and their Bestia to shrug off
      the weather. Widens the band of temperatures they can bear, on the cold side and the hot
      side alike.

      `+3 °C/lv` temperature tolerance

  - id: 29
    identifier: M_QUICK_TRAVEL
    targetType: FRIENDLY
    description: |
      Years on the road teach a Master and their Bestia how to cross any terrain without losing
      a step.

      `+3%/lv` movement speed

  - id: 30
    identifier: M_FISHING
    targetType: FRIENDLY
    description: |
      A patient hand with rod and net that pulls fish from any water worth casting into - as
      good on the plate as it is at the trade post. Anyone with a fishing rod can fish, but an
      untrained angler only catches fish and loot up to level 10.

      `+20 fish lv/lv` that can be caught, up to fish level 100+ at max rank

# Forester
  - id: 31
    identifier: M_LUMBERJACK
    targetType: FRIENDLY
    description: |
      An axeman's read of the forest - which trunks fell clean, which grain splits true, and how
      to bring both down efficiently.

      Level 1 lets you build a Lumberjack Cabin
      `-10%/lv` wood gathering time
      `+20%/lv` resource drop chance

  - id: 32
    identifier: M_TRAPPING
    targetType: FRIENDLY
    description: |
      Knowing where to set a trap, how to bait it and when to spring it. Raises the catch chance
      of every Bestia trap the master throws.

      `+6%/lv` catch chance

  - id: 33
    identifier: M_EXPERT_TAMING
    targetType: FRIENDLY
    description: |
      A Forester's patient hand with wild Bestia rubs off on them, sharpening how fast they learn
      and how little they need to keep going out in the open.

      `+5%/lv` EXP gain
      `-2%/lv` stamina loss

  - id: 34
    identifier: M_BEASTFRIEND
    targetType: FRIENDLY
    description: |
      A lifetime studying Bestia behavior down to the last twitch of an ear, making both the
      taming and the trapping of them that much easier.

      `+5%/lv` chance to tame

# Prospector
  # Maximize Carry Capacity sits on the Survival trunk, but keeps the id it had in this tree.
  - id: 35
    identifier: M_MAXIMIZE_CARRY_CAPACITY
    targetType: FRIENDLY
    description: |
      Smarter packing, better-fitted saddlebags and a stronger back. Everything a Master and
      their Bestia can shoulder gets easier to shoulder.

      `+15%/lv` weight limit of the Master and of every Bestia under their command

  - id: 37
    identifier: M_CARTOGRAPHY
    script: Cartography
    targetType: GROUND
    range: 4
    manaCost: 50
    # Surveying channels, so it runs through the existing Casting/CastingSystem and can be interrupted by
    # taking a hit. A survey that resolved instantly would be a map drawn while running away from something.
    castTime: 30.0
    description: |
      Enables the player to chart unexplored land, revealing terrain that can be shared,
      traded on, or built on.

      Spends one sheet of blank vellum and produces a chart of the surveyed ground.

      `-10/lv` survey difficulty

  - id: 39
    identifier: M_WEATHER_SENSE
    targetType: FRIENDLY
    description: |
      Charting the same valley through a dozen seasons teaches a Prospector to read the sky
      above it. An instinct for what the wind is about to do, well before the storm arrives.

      It also reads the mana in the land: how strong it is where you stand, and where it grows
      stronger or weaker.

      `+5min/lv` how far ahead upcoming weather changes can be sensed. Level 1 shows you the
      current wind direction and speed, and the mana concentration where you stand.
      `+1 km/lv` from Lv.2: the direction of the nearest stronger and weaker mana fields

# Miner
  - id: 40
    identifier: M_MINING
    targetType: FRIENDLY
    description: |
      A pickaxe, a steady lamp, and the nose for where the rock is worth breaking. Anyone with a
      pickaxe can mine, but an untrained miner only gets resources up to level 10.

      Level 1 lets you craft a pickaxe and build a Mining Shaft
      `-10%/lv` mining time
      `+20 resource lv/lv` that can be mined, up to resource level 100+ at max rank

  - id: 41
    identifier: M_GEM_CUTTING
    script: GemCutting
    targetType: GROUND
    range: 2
    manaCost: 20
    castTime: 10.0
    description: |
      Turns the rough gemstones a Miner digs up into cut stones fit for an Artificer's socket
      or a Trader's sale. A failed cut shatters the gem.

      Level 1 enables you to place a Gem Cut Station
      `+8%/lv` success chance
      `+20 gem lv/lv` reliable gem level, 100+ at max rank
      `-5%` success chance per gem level above the reliable one, no hard cap

  - id: 42
    identifier: M_RICH_VEINS
    targetType: FRIENDLY
    description: |
      A Miner learns to follow a vein instead of hacking at it, and the rock gives up more for
      every swing.

      `+10%/lv` chance that a mined ore or gem block drops a second piece

  - id: 43
    identifier: M_RESOURCE_SONAR
    targetType: FRIENDLY
    description: |
      The Miner's capstone: a feel for what's underfoot precise enough to map a shaft before
      the first swing of the pick.

      Can sense ore and gem deposits through solid rock within 5m / Lv.

  # Craftsman tree - see the tree grouping in master_skill_tree.yml.
  - id: 44
    identifier: M_UPGRADE_EQUIPMENT
    script: UpgradeEquipment
    targetType: GROUND
    range: 2
    manaCost: 18
    description: |
      Time spent far from settlements teaches a Craftsman to adapt and improvise, reworking
      weapons and armor in the field to better suit their needs. Each attempt can fail, and a
      failed attempt can destroy the equipment outright.

      Weaponry Research raises the odds; Master Smith raises them further.

  - id: 45
    identifier: M_TRACK_READING
    script: ReadTracks
    targetType: GROUND
    range: 4
    manaCost: 8
    # Deliberately no cast time: reading the ground is a look, not a working, and the answer is already
    # in memory. Cartography channels because it produces a thing; this produces a sentence.
    description: |
      Reads what has walked over a patch of ground, from the prints it left. Ground that takes
      no print - rock, paving, ice - keeps no tracks at all, at any rank.

      `+3 tiles/lv` how far around the read point you can search
      Level 2 reads which way the trail led
      Level 3 names what made it, and how strong it was
      Level 4 names another master by name
      Level 5 only searches further

  - id: 46
    identifier: M_SPRINT
    script: Sprint
    targetType: FRIENDLY
    needsLineOfSight: false
    description: |
      A burst of speed for when walking away is not fast enough - the first escape every
      wanderer learns, and the one they never stop using.

      Lasts 5s and costs 20 stamina instead of mana. Ends early when you attack or cast a
      skill. Cooldown 30s.

      Lv.1 `+30%` movement speed
      Lv.2 `+40%` movement speed
      Lv.3 `+50%` movement speed

  - id: 47
    identifier: M_CALL_BESTIA
    script: CallBestia
    targetType: FRIENDLY
    needsLineOfSight: false
    manaCost: 10
    castTime: 5.0
    description: |
      A whistle every Bestia learns to answer. Calls your Bestias back from wherever they
      wandered off to.

      Every Bestia you own that is out in the world, and not in storage, appears next to you
      when the channel ends. Taking damage breaks the channel. A Bestia that is fighting does
      not answer. Cooldown 5min.

  - id: 48
    identifier: M_RESOURCE_SENSE
    script: ResourceSense
    targetType: FRIENDLY
    needsLineOfSight: false
    manaCost: 15
    castTime: 2.0
    description: |
      An instinct for the direction and distance of nearby physical resources - ore veins,
      herb patches, timber stands and game trails - long before they come into view. Each
      cast points to the nearest resources of every kind within reach. Cooldown 60s.

      `+1 km/lv` detection distance
      `+10%/lv` detection accuracy

  - id: 50
    identifier: M_BLOODLINE_STUDY
    targetType: FRIENDLY
    description: |
      Knowing which pair of Bestia is worth putting in a Breeder, and why the last clutch came
      out the way it did. Applies to every Breeder the master owns.

      `-5%/lv` breeding and hatch time, within the same 50% floor as upgrades and feed
      Level 4 draws a fourth dominant IV per clutch

# Scholar trunk
  - id: 51
    identifier: M_MAGIC_SENSE
    script: MagicSense
    targetType: FRIENDLY
    needsLineOfSight: false
    manaCost: 12
    castTime: 2.0
    description: |
      A prickle at the back of the mind that flags mana at work nearby, and picks apart what
      spell an item or entity carries bound to it. Each cast sweeps the area once. Local mana
      concentration widens the range in a mana-rich region and shrinks it in a drained one.
      Cooldown 10s.

      `+10m/lv` range
      Lv.1 shows that something nearby carries mana
      Lv.2 shows the direction and rough strength of each source
      Lv.3 shows the element of the mana
      Lv.4 shows the exact spell bound to an item or place
      Lv.5 shows who bound it, and what trigger a Spell Binding waits for

  - id: 52
    identifier: M_SENSE
    script: Sense
    targetType: ENEMY
    range: 12
    manaCost: 6
    castTime: 1.0
    description: |
      Cast on a monster to read what mana and instinct alone can tell about it. Reveals its
      status values, element, HP and mana. Cooldown 3s.

  - id: 53
    identifier: M_RUWACH
    script: Ruwach
    targetType: FRIENDLY
    needsLineOfSight: false
    manaCost: 14
    description: |
      A pulse of second sight that peels back concealment. For 10s, hidden traps, hiding
      Bestia and cloaked Assassins within 10m of the caster stand out for what they are.
      Detection resistance does not help against it. Cooldown 10s.

  - id: 54
    identifier: M_OBSERVATION
    script: Observation
    targetType: FRIENDLY
    needsLineOfSight: false
    manaCost: 20
    castTime: 5.0
    description: |
      The Scholar's ear to the ground - a sense for the direction and distance of world-changing
      events long before word of them travels. Only works at an Observation Outpost. Level 1
      lets you build one from an outpost kit. Cooldown 60s.

      `+1 km/lv` detection distance around the outpost

  # Founder sits in the Prospector sub-tree.
  - id: 55
    identifier: M_FOUNDER
    script: Founder
    targetType: GROUND
    range: 0
    manaCost: 100
    castTime: 60.0
    description: |
      The founding rite that plants a city sign in the ground and calls a settlement into being
      around it. Only one settlement can be active at a time. Cooldown 24h.

# Trader
  - id: 56
    identifier: M_SCAVENGER
    targetType: FRIENDLY
    description: |
      A scrapper's eye for what's still worth keeping - coaxes more usable components out of
      anything broken down for parts.

      `+5%/lv` recycle success chance

  - id: 57
    identifier: M_MINTING
    script: Minting
    targetType: GROUND
    range: 2
    manaCost: 15
    castTime: 10.0
    description: |
      The final step between a fistful of raw gold and coin that actually spends. Allows the
      master to mint gold bars into gold coins. The gold a mint does not recover goes back to
      the world reserve.

      Level 1 enables you to place a Mint
      `60%` of a bar's gold becomes coin at Lv.1, `+10%/lv`, all of it at max rank

  - id: 58
    identifier: M_TRADE_POST_OWNER
    script: TradePostOwner
    targetType: GROUND
    range: 2
    manaCost: 40
    castTime: 10.0
    description: |
      Builds an auction house where other citizens can buy and sell their wares, turning any
      settlement into a proper marketplace. Only one auction house can stand in a settlement.

      `+1/lv` auction houses the master may run
      `+5%/lv` highest owner fee

  - id: 59
    identifier: M_TRADE_AGREEMENT
    script: TradeAgreement
    targetType: FRIENDLY
    range: 10
    manaCost: 30
    castTime: 5.0
    description: |
      Weaves this Trader's auction house into those of other consenting players, merging their
      listings into a single, wider marketplace. To be linked, the other player needs at least
      level 1 of this skill too. Cooldown 60s.

      `+1/lv` linked players

  - id: 60
    identifier: M_HONORABLE_CITIZEN
    targetType: FRIENDLY
    description: |
      A quiet ledger of who's been caught with sticky fingers. Anyone caught stealing from this
      Trader's stock, mint or linked auction listings suffers a steeper honor penalty than they
      otherwise would.

      `+20%/lv` honor penalty for robbers

# Sage
  - id: 61
    identifier: M_SPELL_TRAINING
    script: SpellTraining
    targetType: FRIENDLY
    range: 2
    manaCost: 25
    castTime: 10.0
    description: |
      Trains a spell from a scroll into a Bestia's memory, the first step of every Sage's
      education. Consumes the scroll, also when the training fails. The base chance depends on the
      level of the spell, as with Spell Inscription.

      `+10%/lv` success chance

  - id: 62
    identifier: M_FREE_CAST
    targetType: FRIENDLY
    description: |
      Trains a Sage to keep moving through an incantation instead of rooting to the spot.

      `+20%/lv` movement speed kept while casting, all of it at max rank
      `+10%/lv` resistance against a hit breaking the cast

  - id: 63
    identifier: M_SCRY
    script: Scry
    targetType: GROUND
    needsLineOfSight: false
    manaCost: 30
    castTime: 5.0
    description: |
      Casts a Sage's sight far beyond their own eyes, scouting distant ground and the resources
