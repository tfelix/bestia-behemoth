# Every node carries the tree (and, inside a tree, the sub-tree) it belongs to. These reach the client
# through its own Attack DB rather than over the wire - `./gradlew syncSkillDb` copies them into the
# .tres files, which is where the Skills window reads them to build one tab per tree. The server parses
# them only so that adding one here is not a boot failure; it has no use for the grouping itself.
skills:
  # --- Novice Tree ---
