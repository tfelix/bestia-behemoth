    tree: NOVICE
    maxLevel: 5

  - skill: M_CALL_BESTIA
    tree: NOVICE
    maxLevel: 1
    prerequisites:
      - skill: M_BASIC_SKILL
        level: 1

  - skill: M_SPRINT
    tree: NOVICE
    maxLevel: 3
    prerequisites:
      - skill: M_BASIC_SKILL
        level: 2

  - skill: M_FIRST_AID
