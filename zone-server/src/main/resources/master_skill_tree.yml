# Every node carries the tree (and, inside a tree, the sub-tree) it belongs to. These reach the client
# through its own Attack DB rather than over the wire - `./gradlew syncSkillDb` copies them into the
# .tres files, which is where the Skills window reads them to build one tab per tree. The server parses
# them only so that adding one here is not a boot failure; it has no use for the grouping itself.
skills:
  # --- Novice Tree ---
  - skill: M_BASIC_SKILL
    tree: NOVICE
    maxLevel: 5

  - skill: M_CALL_BESTIA
    tree: NOVICE
    maxLevel: 1
    prerequisites:
      - skill: M_BASIC_SKILL
        level: 1

  - skill: M_SPRINT
    tree: NOVICE
    maxLevel: 3
    prerequisites:
      - skill: M_BASIC_SKILL
        level: 2

  - skill: M_FIRST_AID
    tree: NOVICE
    maxLevel: 3
    prerequisites:
      - skill: M_BASIC_SKILL
        level: 3

  - skill: M_COOKING
    tree: NOVICE
    maxLevel: 3
    prerequisites:
      - skill: M_BASIC_SKILL
        level: 3

  # --- Craftsman Tree ---
  - skill: M_CARPENTRY
    tree: CRAFTSMAN
    maxLevel: 10

  - skill: M_MASTER_CRAFTSMAN
    tree: CRAFTSMAN
    maxLevel: 5
    prerequisites:
      - skill: M_CARPENTRY
        level: 3

  - skill: M_ITEM_CUSTOMIZATION
    tree: CRAFTSMAN
    maxLevel: 10
    prerequisites:
      - skill: M_CARPENTRY
        level: 3

  - skill: M_UPGRADE_EQUIPMENT
    tree: CRAFTSMAN
    maxLevel: 1

  # Blacksmith (unlocked at 5+ pts in Craftsman Tree)
  - skill: M_ORE_REFINEMENT
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 3

  - skill: M_FORGE_WEAPON
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 10
    prerequisites:
      - skill: M_ORE_REFINEMENT
        level: 1
      - skill: M_ITEM_CUSTOMIZATION
        level: 5

  - skill: M_FORGE_ARMOR
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 10
    prerequisites:
      - skill: M_ORE_REFINEMENT
        level: 1
      - skill: M_ITEM_CUSTOMIZATION
        level: 5

  - skill: M_EQUIPMENT_REPAIR
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 5
    prerequisites:
      - skill: M_ORE_REFINEMENT
        level: 3

  - skill: M_WEAPONRY_RESEARCH
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 10
    prerequisites:
      - skill: M_EQUIPMENT_REPAIR
        level: 3
      - skill: M_UPGRADE_EQUIPMENT
        level: 1

  - skill: M_MASTER_SMITH
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 5
    prerequisites:
      - skill: M_FORGE_WEAPON
        level: 8
      - skill: M_FORGE_ARMOR
        level: 8

  # Artificer (unlocked at 5+ pts in Craftsman Tree)
  - skill: M_MANA_HARVESTER
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 10

  - skill: M_MANAFLOW_EXPERT
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 5
    prerequisites:
      - skill: M_MANA_HARVESTER
        level: 3

  - skill: M_RUNIC_ETCHING
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 10
    prerequisites:
      - skill: M_ITEM_CUSTOMIZATION
        level: 3

  - skill: M_MAGIC_ARTISAN
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 10
    prerequisites:
      - skill: M_RUNIC_ETCHING
        level: 5
      - skill: M_MANAFLOW_EXPERT
        level: 3

  # Alchemist (unlocked at 5+ pts in Craftsman Tree)
  - skill: M_HERBALISM
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 5

  - skill: M_ALCHEMY
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 10
    prerequisites:
      - skill: M_HERBALISM
        level: 2

  - skill: M_TRANSMUTATION
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 10
    prerequisites:
      - skill: M_ALCHEMY
        level: 5

  - skill: M_ALCHEMY_MASTERY
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 5
    prerequisites:
      - skill: M_ALCHEMY
        level: 5

  # --- Survival Tree ---
  - skill: M_WEATHER_RESISTANCE
    tree: SURVIVAL
    maxLevel: 5

  - skill: M_QUICK_TRAVEL
    tree: SURVIVAL
    maxLevel: 5

  - skill: M_FISHING
    tree: SURVIVAL
    maxLevel: 5

  - skill: M_RESOURCE_SENSE
    tree: SURVIVAL
    maxLevel: 5

  # Forester (unlocked at 5+ pts in Survival Tree)
  - skill: M_LUMBERJACK
    tree: SURVIVAL
    subTree: FORESTER
    maxLevel: 5

  - skill: M_TRAPPING
    tree: SURVIVAL
    subTree: FORESTER
    maxLevel: 5

  - skill: M_EXPERT_TAMING
    tree: SURVIVAL
    subTree: FORESTER
    maxLevel: 5

  - skill: M_BEASTFRIEND
    tree: SURVIVAL
    subTree: FORESTER
    maxLevel: 5
    prerequisites:
      - skill: M_EXPERT_TAMING
        level: 3

  # Prospector (unlocked at 5+ pts in Survival Tree)
  - skill: M_MAXIMIZE_CARRY_CAPACITY
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 5

  # Note: master.md's "Enlarge Weight Limit" lists its requirement as "Power Maximize Lv. 3",
  # which doesn't match any skill name in this tree - treated as Maximize Carry Capacity per
  # the doc's own note.
  - skill: M_ENLARGE_WEIGHT_LIMIT
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 5
    prerequisites:
      - skill: M_MAXIMIZE_CARRY_CAPACITY
        level: 3

  - skill: M_CARTOGRAPHY
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 5
    prerequisites:
      - skill: M_RESOURCE_SENSE
        level: 1

  - skill: M_WILDERNESS_SURVIVAL
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 5
    prerequisites:
      - skill: M_ENLARGE_WEIGHT_LIMIT
        level: 3

  - skill: M_WEATHER_SENSE
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 3

  - skill: M_READ_TRACKS
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 4
    prerequisites:
      - skill: M_WILDERNESS_SURVIVAL
        level: 2

  # Miner (unlocked at 5+ pts in Survival Tree)
  - skill: M_MINING
    tree: SURVIVAL
    subTree: MINER
    maxLevel: 5

  - skill: M_GEM_CUTTING
    tree: SURVIVAL
    subTree: MINER
    maxLevel: 5
    prerequisites:
      - skill: M_MINING
        level: 3

  - skill: M_DEEP_DELVER
    tree: SURVIVAL
    subTree: MINER
    maxLevel: 5
    prerequisites:
      - skill: M_MINING
        level: 3

  - skill: M_RESOURCE_SONAR
    tree: SURVIVAL
    subTree: MINER
    maxLevel: 3
    prerequisites:
      - skill: M_GEM_CUTTING
        level: 3
      - skill: M_DEEP_DELVER
        level: 3

  # --- Scholar Tree (Priest sub-tree partially catalogued below; Trader/Sage/Warrior tree
  # skills from master.md are not yet added - see docs/mechanics/master.md for the full design) ---
  - skill: M_BLESSING
    tree: SCHOLAR
    subTree: PRIEST
    maxLevel: 10
    prerequisites:
      - skill: M_DIVINE_PROTECTION
        level: 5

  - skill: M_HEAL
    tree: SCHOLAR
    subTree: PRIEST
