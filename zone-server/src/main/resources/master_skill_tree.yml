# Every node carries the tree (and, inside a tree, the sub-tree) it belongs to. These reach the client
# through its own Attack DB rather than over the wire - `./gradlew syncSkillDb` copies them into the
# .tres files, which is where the Skills window reads them to build one tab per tree. The server parses
# them only so that adding one here is not a boot failure; it has no use for the grouping itself.
skills:
  # --- Novice Tree ---
  - skill: BASIC_SKILL
    tree: NOVICE
    maxLevel: 5

  - skill: PLAY_DEAD
    tree: NOVICE
    maxLevel: 1
    prerequisites:
      - skill: BASIC_SKILL
        level: 2

  - skill: FIRST_AID
    tree: NOVICE
    maxLevel: 3
    prerequisites:
      - skill: BASIC_SKILL
        level: 3

  - skill: COOKING
    tree: NOVICE
    maxLevel: 3
    prerequisites:
      - skill: BASIC_SKILL
        level: 3

  - skill: MASTER_RITUAL
    tree: NOVICE
    maxLevel: 1
    prerequisites:
      - skill: BASIC_SKILL
        level: 5

  # --- Craftsman Tree ---
  - skill: CARPENTRY
    tree: CRAFTSMAN
    maxLevel: 10

  - skill: TINKERER
    tree: CRAFTSMAN
    maxLevel: 5
    prerequisites:
      - skill: CARPENTRY
        level: 3

  - skill: ITEM_CUSTOMIZATION
    tree: CRAFTSMAN
    maxLevel: 10
    prerequisites:
      - skill: CARPENTRY
        level: 3

  - skill: UPGRADE_EQUIPMENT
    tree: CRAFTSMAN
    maxLevel: 1

  # Blacksmith (unlocked at 5+ pts in Craftsman Tree)
  - skill: ORE_REFINEMENT
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 3

  - skill: FORGE_WEAPON
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 10
    prerequisites:
      - skill: ORE_REFINEMENT
        level: 1
      - skill: ITEM_CUSTOMIZATION
        level: 5

  - skill: FORGE_ARMOR
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 10
    prerequisites:
      - skill: ORE_REFINEMENT
        level: 1
      - skill: ITEM_CUSTOMIZATION
        level: 5

  - skill: WEAPON_REPAIR
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 5
    prerequisites:
      - skill: ORE_REFINEMENT
        level: 3

  - skill: WEAPONRY_RESEARCH
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 10
    prerequisites:
      - skill: WEAPON_REPAIR
        level: 3
      - skill: UPGRADE_EQUIPMENT
        level: 1

  - skill: MASTER_SMITH
    tree: CRAFTSMAN
    subTree: BLACKSMITH
    maxLevel: 5
    prerequisites:
      - skill: FORGE_WEAPON
        level: 8
      - skill: FORGE_ARMOR
        level: 8

  # Artificer (unlocked at 5+ pts in Craftsman Tree)
  - skill: MANA_HARVESTER
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 10

  - skill: MANAFLOW_EXPERT
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 5
    prerequisites:
      - skill: MANA_HARVESTER
        level: 3

  - skill: RUNIC_ETCHING
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 10
    prerequisites:
      - skill: ITEM_CUSTOMIZATION
        level: 3

  - skill: MAGIC_ARTISAN
    tree: CRAFTSMAN
    subTree: ARTIFICER
    maxLevel: 10
    prerequisites:
      - skill: RUNIC_ETCHING
        level: 5

  # Alchemist (unlocked at 5+ pts in Craftsman Tree)
  - skill: HERBALISM
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 5

  - skill: ALCHEMY
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 10
    prerequisites:
      - skill: HERBALISM
        level: 2

  - skill: TRANSMUTATION
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 10
    prerequisites:
      - skill: ALCHEMY
        level: 5

  - skill: ALCHEMY_MASTERY
    tree: CRAFTSMAN
    subTree: ALCHEMIST
    maxLevel: 5
    prerequisites:
      - skill: ALCHEMY
        level: 5

  # --- Survival Tree ---
  - skill: INNER_PEACE
    tree: SURVIVAL
    maxLevel: 10

  - skill: WEATHER_RESISTANCE
    tree: SURVIVAL
    maxLevel: 5

  - skill: QUICK_TRAVEL
