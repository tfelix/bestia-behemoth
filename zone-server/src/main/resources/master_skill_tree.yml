        level: 3
      - skill: DEEP_DELVER
        level: 3

  # --- Scholar Tree (Priest sub-tree partially catalogued below; Trader/Sage/Warrior tree
  # skills from master.md are not yet added - see docs/mechanics/master.md for the full design) ---
  - skill: BLESSING
    tree: SCHOLAR
