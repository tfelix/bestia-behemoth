  # Prospector (unlocked at 5+ pts in Survival Tree)
  - skill: MAXIMIZE_CARRY_CAPACITY
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 5

  # Note: master.md's "Enlarge Weight Limit" lists its requirement as "Power Maximize Lv. 3",
  # which doesn't match any skill name in this tree - treated as Maximize Carry Capacity per
  # the doc's own note.
  - skill: ENLARGE_WEIGHT_LIMIT
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 5
    prerequisites:
      - skill: MAXIMIZE_CARRY_CAPACITY
        level: 3

  - skill: CARTOGRAPHY
    tree: SURVIVAL
