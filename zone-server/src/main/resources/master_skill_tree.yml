    tree: CRAFTSMAN
    maxLevel: 10

  - skill: M_MASTER_CRAFTSMAN
    tree: CRAFTSMAN
    maxLevel: 5
    prerequisites:
      - skill: M_CARPENTRY
        level: 3

  - skill: M_ITEM_CUSTOMIZATION
    tree: CRAFTSMAN
    maxLevel: 10
    prerequisites:
