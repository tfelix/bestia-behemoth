  - skill: WEATHER_SENSE
    tree: SURVIVAL
    subTree: PROSPECTOR
    maxLevel: 3

  # Miner (unlocked at 5+ pts in Survival Tree)
  - skill: MINING
    tree: SURVIVAL
    subTree: MINER
    maxLevel: 5

  - skill: GEM_CUTTING
    tree: SURVIVAL
    subTree: MINER
    maxLevel: 5
    prerequisites:
      - skill: MINING
        level: 3

  - skill: DEEP_DELVER
    tree: SURVIVAL
    subTree: MINER
    maxLevel: 5
    prerequisites:
