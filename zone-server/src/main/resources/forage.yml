  TROPICAL_SEASONAL_FOREST:
    - { item: peppercorn, weight: 30 }
    - { item: cinnamon_bark, weight: 20 }
    - { item: apple, weight: 15 }
    - { item: grape, weight: 15 }

  TROPICAL_RAINFOREST:
    - { item: cinnamon_bark, weight: 20 }
    - { item: grape, weight: 20 }
    - { item: vanilla_pod, weight: 5 }

  VOLCANIC_FIELD:
