# Every craft in the game: what it needs, where, and what it produces or changes.
#
# Config rather than rows, for the reason `master_skill_tree.yml` is - nothing in the database ever
# references a recipe, because a finished craft is recorded as the item it made. Read once at boot into
# `RecipeRegistry`.
#
# `effect` decides the shape of the entry:
#   PRODUCE   - declares `output`, takes no target
#   ADD_SLOT  - cuts a rune slot into an item the crafter holds; declares no output
#   UPGRADE   - raises that item's upgrade level by one
#   REPAIR    - restores its durability
# The three targeted effects all refuse a plain stackable pile: wear, upgrade level and slots are
# per-instance state.
#
# `inputs` are consumed on failure as well as on success. That is the whole risk in a craft, and the
# reason the success tables in the design docs are worth anything.
#
# `station` names a `StaticEntityKind` that must be standing within `CraftingService.STATION_RANGE`
# tiles. Cooking deliberately has none: there is no camp-fire prop, so a meal is cooked anywhere.
#
# `baseSuccessChance` is before skill bonuses - see `CraftBonusService`, which applies the docs'
# per-level tables on top. A recipe at 1.0 cannot fail on its own.
recipes:

  # --- Novice tree ---------------------------------------------------------------------------------

  - id: 1
    identifier: HEARTY_STEW
    effect: PRODUCE
    output: { item: hearty_stew, amount: 1 }
    inputs:
      - { item: apple, amount: 2 }
      - { item: jelly, amount: 1 }
    skill: { skill: M_COOKING, level: 1 }
    craftSeconds: 6.0
    baseSuccessChance: 0.5

  # Stick and stone: the first two tools, from what lies on the ground (`LootScatter`'s loose stones, sticks,
  # and the flint a broken boulder drops). No station - there is nothing to build one with yet - and only the
  # basic skill, because these are what a player does before they have any other.
  - id: 28
    identifier: STONE_KNIFE
    effect: PRODUCE
    output: { item: stone_knife, amount: 1 }
    inputs:
      - { item: flint, amount: 1 }
      - { item: stick, amount: 1 }
    skill: { skill: M_BASIC_SKILL, level: 1 }
    craftSeconds: 4.0
    baseSuccessChance: 0.8

  - id: 29
    identifier: STONE_HATCHET
    effect: PRODUCE
    output: { item: stone_hatchet, amount: 1 }
    inputs:
      - { item: loose_stone, amount: 2 }
      - { item: stick, amount: 1 }
    skill: { skill: M_BASIC_SKILL, level: 1 }
    craftSeconds: 5.0
    baseSuccessChance: 0.8

  # --- Craftsman tree, at a workbench --------------------------------------------------------------

  - id: 10
