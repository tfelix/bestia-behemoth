    inputs:
      - { item: clay, amount: 2 }
      - { item: mana_dust, amount: 1 }
    skill: { skill: M_CARPENTRY, level: 2 }
    station: WORKBENCH
    craftSeconds: 10.0
    baseSuccessChance: 0.55

  - id: 12
    identifier: ARMOR_BLUEPRINT
    effect: PRODUCE
    output: { item: armor_blueprint, amount: 1 }
    inputs:
      - { item: clay, amount: 3 }
      - { item: mana_dust, amount: 1 }
    skill: { skill: M_CARPENTRY, level: 2 }
    station: WORKBENCH
    craftSeconds: 10.0
    baseSuccessChance: 0.55

  # Cutting a slot costs the engraving set outright, so the tool is a real gate on how often it happens.
  - id: 13
    identifier: CUT_RUNE_SLOT
    effect: ADD_SLOT
    inputs:
      - { item: engraving_set, amount: 1 }
      - { item: mana_dust, amount: 2 }
    skill: { skill: M_ITEM_CUSTOMIZATION, level: 1 }
    station: WORKBENCH
    craftSeconds: 12.0
    baseSuccessChance: 0.25

  # --- Blacksmith sub-tree ------------------------------------------------------------------------

  # The one refining recipe, and the reason a furnace is worth placing: two ore plus coal weigh 700 and
  # come out as an ingot weighing 250.
  - id: 20
    identifier: IRON_INGOT
    effect: PRODUCE
    output: { item: iron_ingot, amount: 1 }
    inputs:
      - { item: iron_ore, amount: 2 }
      - { item: coal, amount: 1 }
    skill: { skill: M_ORE_REFINEMENT, level: 1 }
    station: FURNACE
    craftSeconds: 10.0
    baseSuccessChance: 0.4

  # Gold refines like iron and for the same reason a furnace is worth placing. What the bar is *for* is
  # minting, which is the only way coin enters the world - see the money supply design.
  - id: 25
    identifier: GOLD_BAR
    effect: PRODUCE
    output: { item: gold_bar, amount: 1 }
    inputs:
      - { item: gold_ore, amount: 2 }
      - { item: coal, amount: 1 }
    skill: { skill: M_ORE_REFINEMENT, level: 1 }
    station: FURNACE
    craftSeconds: 14.0
    baseSuccessChance: 0.4

  # The mint. Every coin in the world is struck here and nowhere else, out of the world reserve - so this
  # is the one recipe whose output is money, and the one that can be refused because the world has run out.
  #
  # The output is what Minting Lv. 5 strikes. A lower level recovers less, and the rest of the bar's gold
  # stays in the reserve.
  #
  # It cannot fail. Inputs are spent before the roll and never returned, so a failed mint would destroy the
  # bar's gold outside the reserve and the supply would quietly shrink every time somebody was unlucky.
  - id: 26
    identifier: GOLD_COIN
    effect: PRODUCE
    output: { item: gold_coin, amount: 10000 }
    inputs:
      - { item: gold_bar, amount: 1 }
    skill: { skill: M_MINTING, level: 1 }
    # A workbench until the Mint exists as a station.
    station: WORKBENCH
    craftSeconds: 20.0
    baseSuccessChance: 1.0

