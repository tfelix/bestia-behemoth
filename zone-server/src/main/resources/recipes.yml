  # The mint. Every coin in the world is struck here and nowhere else, out of the world reserve - so this
  # is the one recipe whose output is money, and the one that can be refused because the world has run out.
  #
  # The output is what Minting Lv. 5 strikes. A lower level recovers less, and the rest of the bar's gold
  # stays in the reserve.
  #
  # It cannot fail. Inputs are spent before the roll and never returned, so a failed mint would destroy the
  # bar's gold outside the reserve and the supply would quietly shrink every time somebody was unlucky.
  - id: 26
