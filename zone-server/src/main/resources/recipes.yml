# Every craft in the game: what it needs, where, and what it produces or changes.
#
# Config rather than rows, for the reason `master_skill_tree.yml` is - nothing in the database ever
# references a recipe, because a finished craft is recorded as the item it made. Read once at boot into
# `RecipeRegistry`.
#
# `effect` decides the shape of the entry:
#   PRODUCE   - declares `output`, takes no target
#   ADD_SLOT  - cuts a rune slot into an item the crafter holds; declares no output
#   UPGRADE   - raises that item's upgrade level by one
#   REPAIR    - restores its durability
# The three targeted effects all refuse a plain stackable pile: wear, upgrade level and slots are
# per-instance state.
#
# `inputs` are consumed on failure as well as on success. That is the whole risk in a craft, and the
# reason the success tables in the design docs are worth anything.
#
# `station` names a `StaticEntityKind` that must be standing within `PlayerStructureService.RANGE_TILES`
# tiles. A campfire counts only while it burns.
#
# `baseSuccessChance` is before skill bonuses - see `CraftBonusService`, which applies the docs'
# per-level tables on top. A recipe at 1.0 cannot fail on its own.
