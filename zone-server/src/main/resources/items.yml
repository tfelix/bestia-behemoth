  # --- Foraged plants -----------------------------------------------------------------------------
  # What the three ground cover kinds yield - see `prop-kinds.yml`. All ETC: a material is only ever an
  # input, and none of these is worth a USABLE script of its own when Cooking already has one.
  #
  # Light, because foraging is something you do while walking somewhere else. `WeightLimitCalculator`
  # counts every one, and a herb that cost as much to carry as a lump of ore would make picking it a
  # decision instead of a reflex. A fresh master carries 495 herbs against 8 lumps of ore, which is the
  # ratio that keeps it a reflex - `ItemCatalogWeightTest` holds these to a tenth of an ore each.
  - id: 23
    item-db-name: wild_herb
