# `level` is the item's tier: what it takes to have anything to do with it. It is the level a wearer needs
# to put gear on, the reach a crafter needs to make it or work on it (see `MasterCraftBonusService`), and for
# a material the tier of work it belongs to. Defaults to 1, so an item with nothing to say about its tier
# says nothing.
#
# A material's level gates nothing by itself - a recipe already names the skill and rank it needs, and saying
# it twice would only let the two drift. It is what a player reads off the material and what a future recipe
# is priced against.
#
# An instance's effective level is this plus its upgrade level, so a `+6` sword is harder to repair than a
# plain one. Item.effectiveLevel is the only place that arithmetic lives.
