  # --- What a town's trades deal in ---------------------------------------------------------------
  # One item per blocked trade in `economy/economy.yml`'s `unbound` list, so that the day a trade is
  # priced there is something for it to hand over. None of these is a commodity yet: a commodity needs a
  # price, a spoil rate and a chain, and those are authored together or a town sells what it never made.
  #
  # Weights sit on the same scale as the ore above - a fresh master carries 2475 - and the heavy end is
  # deliberate. A log at 900 means two of them and nothing else, which is what makes a carpenter's
  # supply a haulage problem rather than a formality.

  # Behind every general store counter, whatever else the town does. `MerchantStock` gives a retail
  # trade the whole commodity list, so these are the goods a player can count on finding anywhere.
  - id: 33
