    level: 10
    weight: 40
    type: ETC
    description: |
      A splinter of aetherite, prised from corrupted rock. It hums faintly against the palm.


  # --- Crafting materials -------------------------------------------------------------------------
  # What the Craftsman and Blacksmith trees act on (`recipes.yml`). Everything here is ETC: a material
  # is not usable and not worn, it is only ever an input or an output of a recipe.
  #
  # Weights are shaped so that carrying ore is a decision - `WeightLimitCalculator` counts every one of
  # these, and eight lumps of ore is most of what a fresh master can lift - and so that refining is a
  # *gain*: two ore plus one coal (700) become one ingot (250).
  - id: 8
    item-db-name: iron_ore
    level: 10
    weight: 300
    type: ETC
    description: |
      A lump of raw iron ore, streaked with rust-coloured veins.

      Useless until a furnace has had it.

