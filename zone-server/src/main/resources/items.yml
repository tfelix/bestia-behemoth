  # --- The economy's first commodities ------------------------------------------------------------
  # farm -> mill -> bakery -> household, which is the shortest chain that exercises every part of the
  # settlement ledger at once: several stages, a capacity that player damage can take away at the farm
  # end, a consumption sink at the household end, and real spoilage on the perishable.
  - id: 27
    item-db-name: gold_coin
