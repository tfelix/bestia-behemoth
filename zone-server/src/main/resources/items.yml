# `base-level` is the item's tier before its stats are counted: what it takes to have anything to do with it.
# It is the reach a crafter needs to make it or work on it (see `CraftBonusService`), and for a material the
# tier of work it belongs to. Defaults to 1, so an item with nothing to say about its tier says nothing.
#
# `min-level` is the level a wearer needs to put gear on. Every EQUIP item names one, by hand, and nothing
# else may. It does not follow the item level, so a lucky roll never locks its owner out; the docs' equipment
# design page gives the guideline (about half the item level, up to 40; 60+ only for legendaries).
#
# Accessories declare ACCESSORY_1 and fit either accessory slot.
#
# A material's level gates nothing by itself - a recipe already names the skill and rank it needs, and saying
# it twice would only let the two drift. It is what a player reads off the material and what a future recipe
# is priced against.
#
# An instance's effective level is this plus its upgrade level, so a `+6` sword is harder to repair than a
# plain one. Item.effectiveLevel is the only place that arithmetic lives.
#
# `armor-type` (CLOTH, LIGHT, MEDIUM or HEAVY) makes gear armor. A bestia only wears the types its mob YML
# lists under `armor-types`. Weapons and accessories have none, so anyone with the slot can wear them.
#
# `material` is required. `item-materials.yml` says how a stack of it fares on the ground in fire and water.
#
# `attack`, `magic-attack`, `defense` and `magic-defense` are gear's base properties; `base-level` already
# prices them. `stats` are fixed bonuses on top (`STR: 4`, `HIT: 10`, see `ItemStat`) and raise the item level.
# An item with no `script` gets `StatBonusEquipmentScript`, which applies exactly these.
#
# `random-stats` is what a forged copy may roll. Each `affixes` entry rolls one stat from a `pool` (ATTRIBUTE,
# OFFENSE, DEFENSE, ARCANE, RESIST - see `StatPool`) or names one `stat`, with a `chance` in percent (default
# 100) and an optional `min`/`max`. `sockets` holds one chance per socket. The forge caps how high it rolls.
#
# `craft-axes` places a material in the crafting feature space, each axis from -1 to 1 (STATE fluid..solid,
# INTEGRITY brittle..resilient, HEFT light..massive, EDGE blunt..keen, VITALITY necrotic..restorative, ARCANE
# warding..charged, COMPLEXITY crude..intricate). A recipe can only be discovered when all its inputs have them.
