    description: |
      Wet river clay, kneaded into a ball. It takes a shape and keeps it.

  - id: 12
    item-db-name: void_essence
    level: 30
    weight: 2
    type: ETC
    description: |
      A bead of condensed void, cold in a way that has nothing to do with temperature.

  - id: 13
    item-db-name: mana_dust
    level: 15
    weight: 3
    type: ETC
    description: |
      Mana crystal ground to a fine, faintly glowing powder.

  - id: 14
    item-db-name: engraving_set
    level: 10
    weight: 45
    type: ETC
    description: |
      A roll of fine chisels and gravers.

      Consumed a little at a time by the work of cutting slots into a finished item.

  - id: 16
    item-db-name: weapon_blueprint
    level: 15
    weight: 10
    type: ETC
    description: |
      A smith's drawing of a blade, annotated in a hand that assumed the reader already knew how.

  - id: 17
    item-db-name: armor_blueprint
    level: 15
    weight: 10
    type: ETC
    description: |
      A smith's drawing of a breastplate, with the hard part - the fitting - left as an exercise.

  # The one thing Cooking makes, and the only crafted item that is USABLE rather than a material.
  - id: 18
    item-db-name: hearty_stew
    level: 5
    weight: 15
    type: USABLE
    script: HeartyStewScript
    description: |
      A thick stew of whatever was to hand, cooked over an open fire.

      Restores health and stamina both, which no potion does.

  # --- Forged gear --------------------------------------------------------------------------------
  # What Forge Weapon and Forge Armor produce, and the reason they exist: the catalogue had only two
  # pieces of footgear, so a forge had nothing it could plausibly make. Both wear, both take an upgrade
  # level, and both are what Weapon Repair and Upgrade Equipment act on.
  - id: 19
    item-db-name: iron_sword
    level: 20
    weight: 90
    type: EQUIP
    equip-slot: RIGHT_HAND
    max-durability: 200
    script: IronSwordScript
    description: |
      A straight iron blade, plain and heavier than it looks.

      Nothing about it is clever. It does not need to be.

  - id: 20
    item-db-name: iron_cuirass
    level: 25
    weight: 240
    type: EQUIP
    equip-slot: ARMOR
    max-durability: 300
    script: IronCuirassScript
    description: |
      A breastplate beaten out of four ingots and fitted by eye.

      It will stop what it stops.

  - id: 21
    item-db-name: chart
    level: 1
    weight: 5
    type: ETC
    # Never stacks: the surveyed ground lives on a `map_chart` row keyed by this item's instance, so two
    # charts merged into one stack would be one chart and one orphaned row.
    stackable: false
    description: |
      A chart of surveyed land, drawn by hand.

      Shows the ground whoever made it walked. Two charts can be joined into one, and any chart can be
      copied onto blank vellum.

  - id: 22
    item-db-name: chart_blank
    level: 1
    weight: 5
    type: ETC
    description: |
      Blank vellum, ruled and ready to be drawn on.

      Surveying spends one, and so does copying a chart.
