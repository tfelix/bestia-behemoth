  # --- Novice starter kit -------------------------------------------------------------------------
  # What a master is created holding and wearing. `novice-only` is the whole point of the set: it comes off
  # by itself the moment its wearer invests a skill point outside the Novice tree, so the kit is something
  # to be outgrown rather than a permanent floor under every build. See `EquipmentService.checkStillWearable`
  # for the rule and `EquipmentRevalidationService` for what takes it off.
  #
  # Level 1 throughout, because a fresh master is level 1 and gear they cannot wear on their first login
  # would be a cruel joke rather than a tutorial.
  - id: 65
    item-db-name: novice_knife
