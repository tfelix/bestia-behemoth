id: 1
identifier: blob
level: 3
# Statuswerte
ai: passive_wanderer
health: 10
mana: 8
experience: 5
# Where the wild spawners are allowed to place it. Empty `habitat` means "anywhere on land".
habitat:
  - GRASSLAND
  - DRYLAND
  - RIPARIAN
  - BEACH
  - TEMPERATE_FOREST
# Mean annual temperature the blob prefers, in degrees Celsius. A preference and not a requirement: a den
# outside this draws blobs more rarely rather than never, which is what keeps a thin catalogue from leaving
# holes. `habitat` above is the hard constraint.
temperature-min: -5
temperature-max: 32
spawn-weight: 100
# A blob has no head, hands or accessories - only these two slots exist for it.
equip-slots:
  - ARMOR
  - GARMENT
loot:
  - item: jelly
    chance: 1000
  - item: apple
    chance: 1000
