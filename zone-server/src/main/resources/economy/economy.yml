# What a settlement makes, holds and eats.
#
# The commodities are real items from `items.yml` - there is no abstract "good". A trade turns some of
# them into another one at a fixed proportion, and households eat what has a `per-capita`.
#
# Every business in `BusinessCatalogue.ALL` must appear exactly once below, as a `trades` entry, in
# `retail`, or in `unbound` with a reason. A trade with no entry is a shop standing in every town in the
# world with nobody in it, and that should be found by a build rather than by a player.

commodities:
  # `price` is the reference price in coins, before a settlement's own wealth and its deviation.
  #
  # `spoil` is the fraction lost per game-day. It is what stops a commodity being an unbounded
  # accumulator, so nothing here may sit at zero unless trade alone can drain it.
  #
  # `cover-days` is how many days of throughput a settlement holds. It sets the reference stock, and it is
  # also what the price reads: below its cover a town charges more, above it charges less.
  #
  # `season` moves the *visible* stock and price through the year without moving the ledger at all - that
  # is the whole point of storing a deviation. `peak-day` is a day of the 120-day year.
  - id: grain
    item: grain
    price: 3.0
    spoil: 0.01
    cover-days: 30
    season: { peak-day: 90, amplitude: 0.45 }

  - id: flour
    item: flour
    price: 5.0
    spoil: 0.015
    cover-days: 12

  - id: bread
    item: bread
    price: 9.0
    # A loaf is stale in three days, and this is the number that makes a bakery a *daily* trade rather
    # than one that fills a warehouse once and stops.
    spoil: 0.25
    cover-days: 3
    # Loaves per resident per game-day. The only sink in the chain, and therefore what every reference
    # throughput above it is derived from - see SettlementReference.
    per-capita: 0.9

trades:
  # `per-unit` is input per unit of output, so the chain reads as a recipe: 1.3 sacks of grain make a unit
  # of flour, and 0.35 of a unit of flour makes a loaf.
  #
  # `building` is what player damage will be tested against; see the damage sweep.
  #
  # Grain is grown by the farm sector rather than by a business, because that is what the generator
  # models: farming is what the households left over after the roster do.
  - id: farm
    sector: FARM
    building: FARM
    produces: grain

  - id: mill
    business: miller
    building: CRAFT
    produces: flour
    consumes:
      - { commodity: grain, per-unit: 1.3 }

  - id: bakery
    business: baker
    building: CRAFT
    produces: bread
    consumes:
      - { commodity: flour, per-unit: 0.35 }

# Hold stock and sell it without producing any of it.
retail:
  - general_store
  - market_trader

# Everything not producing a commodity yet, each with the reason. `needs` names an item the catalogue does
# not have; the boot refuses an entry naming one that does exist, so this list prunes itself as items
# arrive rather than quietly going stale.
unbound:
  - { business: temple, reason: "a service, and inventing an abstract one buys an item nobody can hold" }
  - { business: healer, reason: "a service" }
  - { business: scribe, reason: "a service" }
  - { business: banker, reason: "a service" }
  - { business: barracks, reason: "a service" }
  - { business: inn, reason: "sells lodging, which is not a good" }
  - { business: stable, reason: "sells stabling, which is not a good" }

  # The goods these trades deal in are items now. What is still missing is the price, the spoil rate and
  # the chain that would make each one a commodity, and those are authored together or a town sells what
  # it never made. So `needs` no longer holds any of them back - the catalogue above does.
  - { business: butcher, reason: "raw_meat is not priced as a commodity yet" }
  - { business: brewer, reason: "ale is not priced as a commodity yet" }
  - { business: vintner, reason: "wine is not priced as a commodity yet" }
  - { business: fishmonger, reason: "raw_fish is not priced as a commodity yet" }
  - { business: shipwright, reason: "hull_timber is not priced as a commodity yet" }
  - { business: carpenter, reason: "log and plank are not priced as commodities yet" }
  - { business: charcoaler, reason: "coal and the log it is charred from are not priced as commodities yet" }
  - { business: mason, reason: "quarried_stone and cut_stone are not priced as commodities yet" }
  - { business: potter, reason: "clay_pot and brick are not priced as commodities yet" }
  - { business: tanner, reason: "leather is not priced as a commodity yet" }
  - { business: dyer, reason: "dye is not priced as a commodity yet" }
  - { business: weaver, reason: "cloth is not priced as a commodity yet" }
  - { business: tailor, reason: "linen_tunic is not priced as a commodity yet" }
  - { business: jeweller, reason: "gold_ring is not priced as a commodity yet" }
  - { business: bookbinder, reason: "book is not priced as a commodity yet" }
  - { business: alchemist, reason: "catalyst is not priced as a commodity yet" }
  - { business: apothecary, reason: "medicine is not priced as a commodity yet" }

  # The two whose *output* already exists, blocked on the input side instead: a player mines iron ore, but
  # no settlement trade produces any, so a smith's reference throughput would have nothing to derive from.
  - { business: blacksmith, reason: "iron_ore has no settlement producer" }
  - { business: armourer, reason: "iron_ore has no settlement producer" }
