# Catalog of every status effect (buff/debuff) the server can apply.
#
# Every entry needs a matching constant in net.bestia.zone.battle.status.StatusEffectId - call
# sites use that enum, and StatusEffectCatalogBootValidator fails the boot if the two ever drift
# apart (missing on either side, or an `identifier` that no longer matches the constant name).
#
# `script` is the simple class name of the StatusEffectScript bean in
# net.bestia.zone.battle.status.scripts that implements the behavior. What an effect shields from, whether it is
# stored and how long it lasts are the script's to say, not this file's.
#
# `polarity: DEBUFF` makes an effect harm, which the damage gate weighs like a blow. Bookkeeping is NEUTRAL.
#
# `resist` names the two attributes that shake an effect off (STR, VIT, INT, DEX, WIL, AGI), see StatusResistance.
# Without it the effect always lands when a skill rolls it. `dispellable: false` keeps a buff from being dispelled.
statusEffects:
  - id: 1
    identifier: SWIFTNESS
    polarity: BUFF
    showIcon: true
    isSyncedToClient: true
    script: Swiftness

  - id: 2
    identifier: CRIPPLE
    polarity: DEBUFF
    showIcon: true
    isSyncedToClient: true
    script: Cripple

  # THORNS (reflect-on-damage) is removed pending a redesigned trigger/reaction hook on
  # StatusEffectScript - the old StatusEffectDamageInterceptSystem/StatusEffectTriggerAction
  # mechanism it depended on was dropped as out of scope for the stat-recalc refactor.

  # Internal bookkeeping only - tracks that this bestia already resisted a debuff once this
  # encounter. Never shown to the client (isSyncedToClient: false).
  - id: 4
    identifier: RESISTED_ONCE_MARKER
    polarity: NEUTRAL
    showIcon: false
    isSyncedToClient: false
    script: ResistedOnceMarker

  # Applied by the BLESSING skill (skills.yml id 1).
  - id: 5
    identifier: BLESSING
    polarity: BUFF
    showIcon: true
    isSyncedToClient: true
    script: BlessingStatusEffect

  # Applied by the PLAY_DEAD skill (skills.yml id 7). Synced so the client can show the player they
  # are still feigning; what it actually does is make PerceptionSystem look past them.
  - id: 7
    identifier: PLAY_DEAD
    polarity: BUFF
    showIcon: true
    isSyncedToClient: true
    script: PlayDeadStatusEffect

  # Internal bookkeeping only: a bestia may only receive First Aid once a minute (skills.yml id 8).
  - id: 8
    identifier: FIRST_AID_COOLDOWN
    polarity: NEUTRAL
    showIcon: false
    isSyncedToClient: false
    script: FirstAidCooldown

  # Placeholder hook, attached to every master entity as it materializes (MasterEntitySpawner).
  # Currently does nothing at all - it exists so the "show the intro dialog once the master is in
  # the world" trigger can be built against a real, already-attached, never-synced effect. See
  # MasterIntroMarker for why it can't just send the dialog from apply().
  - id: 6
    identifier: MASTER_INTRO_MARKER
    polarity: NEUTRAL
    showIcon: false
    isSyncedToClient: false
    script: MasterIntroMarker

  # Applied to every non-combatant species as it spawns (BestiaEntitySpawner), so it follows the mob
  # catalogue rather than storage.
  - id: 9
    identifier: INVULNERABLE
    polarity: BUFF
    dispellable: false
    showIcon: false
    isSyncedToClient: false
    script: InvulnerableEffect

  # Handed out by WARD_AURA to everything a player owns near a ward stone. Synced so every client can see who is
  # protected before aiming at them.
  - id: 10
    identifier: WARDED
    polarity: BUFF
    dispellable: false
    showIcon: true
    isSyncedToClient: true
    script: Warded

  # The spell on a ward stone.
  - id: 11
    identifier: WARD_AURA
    polarity: NEUTRAL
    dispellable: false
    showIcon: false
    isSyncedToClient: false
    script: WardAura

  # Kept on the members around their guild leader by GuildAuraSystem. What it adds is the guild's levels in
  # its six stat auras, read off the leader that gave it.
  - id: 12
    identifier: GUILD_AURA
    polarity: BUFF
    dispellable: false
    showIcon: true
    isSyncedToClient: true
    script: GuildAura

  # The guild skills a member casts for the members around them.
  - id: 13
    identifier: BATTLE_ORDERS
    polarity: BUFF
    dispellable: false
    showIcon: true
    isSyncedToClient: true
    script: BattleOrdersEffect

  - id: 14
    identifier: GUILD_REGENERATION
    polarity: BUFF
    dispellable: false
    showIcon: true
    isSyncedToClient: true
    script: GuildRegenerationEffect

  - id: 15
    identifier: EMERGENCY_MOVE
    polarity: BUFF
    showIcon: true
    isSyncedToClient: true
    script: EmergencyMoveEffect

  # Bookkeeping after a fly wing or butterfly wing: the next one is refused until it runs out. Never shown.
  - id: 16
    identifier: TELEPORT_LOCK
    polarity: NEUTRAL
    dispellable: false
    showIcon: false
    isSyncedToClient: false
    script: TeleportLock

  # The buff and debuff archetypes of bestia skills (bestia_blueprint.yaml `archetypes`).
  - id: 17
    identifier: EMPOWERED
    polarity: BUFF
    showIcon: true
    isSyncedToClient: true
    script: Empowered

  - id: 18
    identifier: WEAKENED
    polarity: DEBUFF
    showIcon: true
    isSyncedToClient: true
    script: Weakened

  # Applied by a bestia's Warm Fur and Cooling Mist. EnvironmentalExposureSystem widens the comfort band while
  # one is on, so they need no stat change of their own.
  - id: 19
    identifier: WARMED
    polarity: BUFF
    showIcon: true
    isSyncedToClient: true
    script: Warmed

  - id: 20
    identifier: COOLED
    polarity: BUFF
    showIcon: true
    isSyncedToClient: true
    script: Cooled

  # Put on a master by AggressorSystem when they harm a player who was not an aggressor. Synced so everybody can
  # see whom they may fight back against without losing honor.
  - id: 21
    identifier: AGGRESSOR
    polarity: NEUTRAL
    showIcon: true
    isSyncedToClient: true
    script: Aggressor

  # Kept on a master by HonorStandingSystem while their global honor is below zero, so other players can see
  # whom they may hunt for honor.
  - id: 22
    identifier: DISHONORED
    polarity: NEUTRAL
    showIcon: true
    isSyncedToClient: true
    script: Dishonored

  # Put on a master who stole, for six real hours. Whoever kills them earns extra honor.
  - id: 23
    identifier: THIEF
    polarity: NEUTRAL
    showIcon: true
    isSyncedToClient: true
    script: Thief

  # Crowd control. `resist` pairs are spread so every attribute guards about as many effects as the others.
  - id: 24
    identifier: STUN
    polarity: DEBUFF
    resist: [VIT, STR]
    showIcon: true
    isSyncedToClient: true
    script: Stun

  - id: 25
    identifier: FROZEN
    polarity: DEBUFF
    resist: [VIT, WIL]
    showIcon: true
    isSyncedToClient: true
    script: Frozen

  - id: 26
    identifier: STONING
    polarity: DEBUFF
    resist: [WIL, INT]
    showIcon: true
    isSyncedToClient: true
    script: Stoning

  # Follows STONING on its own, so it is never rolled and needs no resist.
  - id: 27
    identifier: STONE
    polarity: DEBUFF
    showIcon: true
    isSyncedToClient: true
    script: Stone

  - id: 28
    identifier: IMMOBILIZED
    polarity: DEBUFF
    showIcon: true
    isSyncedToClient: true
    script: Immobilized

  - id: 29
    identifier: SLOWED
    polarity: DEBUFF
    resist: [AGI, STR]
    showIcon: true
    isSyncedToClient: true
    script: Slowed

  - id: 30
    identifier: CONFUSED
    polarity: DEBUFF
    resist: [INT, DEX]
    showIcon: true
    isSyncedToClient: true
    script: Confused

  - id: 31
    identifier: FEARED
    polarity: DEBUFF
    resist: [WIL, STR]
    showIcon: true
    isSyncedToClient: true
    script: Feared

  - id: 32
    identifier: BLIND
    polarity: DEBUFF
    resist: [INT, DEX]
    showIcon: true
    isSyncedToClient: true
    script: Blind

  - id: 33
    identifier: STIFFENED
    polarity: DEBUFF
    resist: [DEX, AGI]
    showIcon: true
    isSyncedToClient: true
    script: Stiffened
