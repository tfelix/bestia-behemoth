# What every master starts out knowing.
#
# `blueprints` names producing recipes from `recipes.yml` that no master has to discover: the first meal, the
# first ingots, the first sword and armour. A new player cannot be expected to find their first tools, so these
# are given; discovery starts after them. They are a baseline rather than a grant: a change here applies to every
# master, old and new. A recipe that is not listed has to be discovered or learned from a written recipe.
blueprints:
  - HEARTY_STEW
  - ENGRAVING_SET
  - IRON_INGOT
  # Charred from a log, which has no craft-axes, so it cannot be discovered.
  - CHARCOAL
  # The charcoal-fired twin of every coal-fired starter smelt.
  - IRON_INGOT_CHARCOAL
  - GOLD_BAR_CHARCOAL
  - TIN_INGOT_CHARCOAL
  - COPPER_INGOT_CHARCOAL
  - STEEL_INGOT_CHARCOAL
  - SILVER_INGOT_CHARCOAL
  - PALLADIUM_INGOT_CHARCOAL
  - MITHRIL_INGOT_CHARCOAL
  - ADAMANTIUM_INGOT_CHARCOAL
  - BRICK_CHARCOAL
  - GOLD_BAR
  - GOLD_COIN
  - IRON_SWORD
  - IRON_CUIRASS
  - PICKAXE
  - ARROW
  # The special arrows: Arrow Crafting's level, not discovery, decides which a master can make.
  - STEEL_ARROW
  - SHARP_ARROW
  - FIRE_ARROW
  - CRYSTAL_ARROW
  - WIND_ARROW
  - STONE_ARROW
  - SILVER_ARROW
  - SHADOW_ARROW
  - POISON_ARROW
  - STUN_ARROW
  # The basics every master can make by hand, from what lies on the ground and what a felled tree drops.
  - STONE_KNIFE
  - STONE_HATCHET
  - SHOVEL
  - TORCH
  - WILLOW_ROD
  # A station's kit, so nobody has to discover how to build the place they discover everything else at.
  - WORKBENCH_KIT
  - FURNACE_KIT
  - FORGE_KIT
  - TANNING_RACK_KIT
  - LOOM_KIT
  - GLASS_FURNACE_KIT
  - GLASSBLOWING_BENCH_KIT
  - ALCHEMY_LABORATORY_KIT
  - GEM_CUT_STATION_KIT
  - TRANSMUTATION_WORKBENCH_KIT
  - CARVING_TABLE_KIT
  - MINT_KIT
  - CAMPFIRE_KIT
  # Found stranded by `CraftingChainTest`: a log carries no craft-axes (it is the precursor of a plank), so these four
  # had no point to discover and nothing else teaches a recipe. Carpentry rank still gates the town buildings.
  - CHEST_KIT
  - MINING_SHAFT_KIT
  - POST_OFFICE_KIT
  - BESTIA_CENTER_KIT
  - INN_KIT
  - AUCTION_HOUSE_KIT
  - BLACKBOARD_KIT
  # Observation's lookout. Its log has no craft-axes either; knowing Observation is what gates raising it.
  - OBSERVATION_OUTPOST_KIT
  # Breeding: the farm, the incubator and what a clutch uses up, so every master can breed without discovering
  # anything first.
  - BREEDING_FARM_KIT
  - NESTING_BUNDLE
  - INCUBATOR_KIT
  # The material chains. Refining has nothing to discover - the raw inputs carry no craft-axes - so every master
  # knows how, and the skill rank, the station and the inputs decide who can.
  - TIN_INGOT
  - COPPER_INGOT
  - BRONZE_INGOT
  - STEEL_INGOT
  - SILVER_INGOT
  - QUICKSILVER
  - BLACKIRON_INGOT
