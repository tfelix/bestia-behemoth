  # The skeleton of a slain world boss. Broken, it is a heap of bone.
  - kind: FIXTURE_GIANT_REMAINS
    max-hp: 3000
    collider: { half-x: 6, half-y: 3, height: 6 }
    variants: 1
    loot:
      - { item-id: 92, amount: 10, drop-chance: 10000 }
