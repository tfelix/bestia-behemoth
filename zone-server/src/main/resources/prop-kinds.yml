# What each kind of static entity is made of, beyond where it stands.
#
# A registry rather than a table: none of this is persisted and none of it is per-instance, so it is
# configuration in the sense `ai/*.yml` and `movement/*.yml` are - read once at boot into memory. Contrast
# `items.yml` and `mob/*.yml`, which become rows because other rows reference them by id.
#
# `max-hp` is what a static entity's health starts from once `PropPromotionService` promotes it on the
# first point of damage - shaped right, not balanced.
#
# `collider` is half-extents and height in position units (= metres). Unread: movement does not consult
# entity colliders yet, and the seam for it is `ChunkWalkQuery.canStep`. Recorded here so that when it does,
# the numbers are in one place rather than in the factory.
#
# `regrow-seconds` is how long after being used up the same spot stands the prop again; a kind without it or
# `regrowth` is terminal - a claimed landmark or a mined-out crystal never comes back.
#
# `regrowth`, on the two tree kinds only, replaces it: a removed tree leaves a stump, which tries every
# `stage-seconds` to sprout and then grows back as a sapling and a young tree. It only sprouts while a grown
# tree stands within `neighbour-radius`, so a wood that was cleared completely stays cleared. `size` scales a
# stage's height and max HP, `yield` its loot. Removed means anything but its ground being carved away:
# `PropRemoval` decides what each removal leaves.
#
# `loot` is chance-rolled when the prop is killed. It is set only where an item fits what the thing is made of -
# the tree drops logs, the boulder stone. A claimed landmark has no item that fits it, and inventing an id would
# be worse than leaving it unset.
#
# `collect` is the other half of that, and deliberately not the same field. A kind with one is picked up with
# a click - `CollectPropIntentSystem` grants the item straight into the inventory and records the depletion,
# with no combat involved. `loot` is chance-rolled *on death* and becomes stacks on the ground. So they differ
# in trigger, in determinism and in where the item ends up, and sharing a field would force one of them to
# carry a mode flag. A kind may have both; the two mechanics cannot both claim one prop, because whichever
# records the divergence first locks the other out.
#
# Presence of `collect` is the whole rule for what may be clicked - there is no separate `collectible` flag,
# so a kind added below is not collectible until someone says what it yields.
kinds:
  - kind: TREE
    max-hp: 120
    collider: { half-x: 1, half-y: 1, height: 8 }
    # One per model in the client's tree table, which picks by this number so a tree keeps its model.
    variants: 10
    regrowth:
      stage-seconds: 604800 # a real week
      neighbour-radius: 12
      sapling: { size: 0.35, yield: 0 }
      young: { size: 0.65, yield: 0.5 }
    loot:
      - { item-id: 43, amount: 4, drop-chance: 10000 } # log
      - { item-id: 123, amount: 2, drop-chance: 10000 } # resin

  - kind: BLIGHTED_TREE
    max-hp: 90
    collider: { half-x: 1, half-y: 1, height: 8 }
    variants: 3
    regrowth:
      stage-seconds: 604800
      neighbour-radius: 12
      sapling: { size: 0.35, yield: 0 }
      young: { size: 0.65, yield: 0.5 }

  # The four collectible kinds. Size maps to amount rather than to a second item, so a large crystal is worth
  # walking to without doubling the catalogue.
  - kind: MANA_CRYSTAL_SMALL
    max-hp: 40
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 3
    collect: { item-id: 6, amount: 1 }

  - kind: MANA_CRYSTAL_LARGE
    max-hp: 90
    collider: { half-x: 1, half-y: 1, height: 4 }
    variants: 3
    collect: { item-id: 6, amount: 2 }

  - kind: WOUND_SPIRE
    max-hp: 200
    collider: { half-x: 1, half-y: 1, height: 9 }
    variants: 2

  # Aetherite pushed up over a shallow corrupted orebody: the surface sign that there is aetherite below.
  # Tougher than a mana crystal of the same size because it is ore rather than a growth.
  - kind: AETHERITE_SHARD_SMALL
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 3
    collect: { item-id: 7, amount: 1 }

  - kind: AETHERITE_SHARD_LARGE
    max-hp: 130
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 3
    collect: { item-id: 7, amount: 2 }

  # The points of interest: one row per entry in worldgen's `PoiKind`, and mandatory - a landmark added to the
  # catalogue with no row here fails the boot rather than the first world that rolls it.
  #
  # `variants: 1` throughout, and unlike the rows above that is not a placeholder. A tree has ten models so a
  # wood does not look stamped; each of these is *one object* that exists at most once in a world, so a second
  # model of it would be a second answer to a question with one answer.
  - kind: POI_LOST_GRAVE
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  - kind: POI_STANDING_STONES
    max-hp: 400
    collider: { half-x: 3, half-y: 3, height: 3 }
    variants: 1

  - kind: POI_BROKEN_OBELISK
    max-hp: 500
    collider: { half-x: 1, half-y: 1, height: 6 }
    variants: 1

  - kind: POI_WAYSTONE
    max-hp: 150
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  - kind: POI_PETRIFIED_TREE
    max-hp: 300
    collider: { half-x: 1, half-y: 1, height: 6 }
    variants: 1

  - kind: POI_SUNKEN_IDOL
    max-hp: 250
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  # The buildings a town lays out: one row per entry in worldgen's `BuildingFunction` except FORTIFICATION,
  # which stays voxels. Mandatory in the same way the landmarks above are - a function added to worldgen with
  # no row here fails the boot rather than the first town that has one.
  #
  # `collider` is the only field here that is a placeholder rather than a decision, and it is a *deliberate*
  # one: a building's real footprint arrives per instance on the wire, because a temple and a barn are not the
  # same size and no per-kind number could be. What is written below is the half-extent of a typical lot for
  # that function, so that when `ChunkWalkQuery.canStep` finally reads colliders it has something with the
  # right order of magnitude rather than a zero. See `PropInstances.halfWidthAt`.
  #
  # `max-hp` is shaped by what the walls are, not by size: stone stands where thatch does not. No `collect`
  # anywhere - a building is not something you pick up - and no `loot` for the reason at the top of this file.
  #
  # `variants` is 1 throughout and that is a holding position: `StaticEntityRenderer` draws a placeholder box
  # scaled by the footprint on the wire, so a second model would be a second box. It goes up per function when
  # there is art.
  # The market hall, emitted only in the start towns - see `StartTownMarkets`.
  - kind: AUCTION_HOUSE
    max-hp: 300
    collider: { half-x: 8, half-y: 6, height: 4 }
    variants: 1

  - kind: BUILDING_TEMPLE
    max-hp: 900
    collider: { half-x: 9, half-y: 6, height: 12 }
    variants: 1

  - kind: BUILDING_CIVIC
    max-hp: 800
    collider: { half-x: 8, half-y: 6, height: 10 }
    variants: 1

  - kind: BUILDING_SHOP
    max-hp: 400
    collider: { half-x: 5, half-y: 4, height: 8 }
    variants: 1

  - kind: BUILDING_CRAFT
    max-hp: 400
    collider: { half-x: 5, half-y: 4, height: 8 }
    variants: 1

  - kind: BUILDING_WAREHOUSE
    max-hp: 500
    collider: { half-x: 7, half-y: 5, height: 8 }
    variants: 1

  - kind: BUILDING_INN
    max-hp: 450
    collider: { half-x: 6, half-y: 5, height: 10 }
    variants: 1

  - kind: BUILDING_RESIDENCE
    max-hp: 350
    collider: { half-x: 5, half-y: 4, height: 8 }
    variants: 1

  # Lower than a house of the same size: a barn is a shell over a yard.
  - kind: BUILDING_FARM
    max-hp: 250
    collider: { half-x: 6, half-y: 5, height: 5 }
    variants: 1

  # The three crafting stations a player builds - see `PlayerStructureSource`. No `collect`, deliberately:
  # a station is taken down by whoever put it up (`RemoveStructureCMSG`), not picked up by a passer-by, and a
  # `collect` block would make one player's forge free loot for the next.
  #
  # Health is what it takes to break somebody else's station, and it is shaped rather than balanced - the
  # numbers say a furnace of brick outlasts a bench of planks, which is as far as any of this is decided.
  - kind: WORKBENCH
    max-hp: 150
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  - kind: FURNACE
    max-hp: 350
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  - kind: FORGE
    max-hp: 400
    collider: { half-x: 2, half-y: 1, height: 2 }
    variants: 1

  # Planks and iron bands: tougher than a workbench, because what is inside is worth breaking it for.
  - kind: CHEST
    max-hp: 200
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  # A pen, not a station: nothing is crafted here. Wood like the bench, but a fence takes more breaking.
  - kind: BREEDING_FARM
    max-hp: 250
    collider: { half-x: 2, half-y: 2, height: 1 }
    variants: 1

  # Fired brick like the furnace, so it takes as much breaking.
  - kind: INCUBATOR
    max-hp: 300
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  # A timber head frame over a hole: big, but only planks.
  - kind: MINING_SHAFT
    max-hp: 250
    collider: { half-x: 2, half-y: 2, height: 3 }
    variants: 1

  # Cold and lit, which `Campfire` picks from how long it has left to burn.
  - kind: CAMPFIRE
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 2

  # Building pieces. What they block comes from `structure-pieces.yml`, not from `collider`.
  - kind: STRUCTURE_WALL
    max-hp: 300
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 1

  - kind: STRUCTURE_FLOOR
    max-hp: 200
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  - kind: STRUCTURE_STAIRS
    max-hp: 200
    collider: { half-x: 3, half-y: 1, height: 3 }
    variants: 1

  # The ground cover: worldgen's herbs, shrubs and reeds, each with its blighted twin. See `GroundCoverScatter`
  # for why these are props at all while the grass you walk on is not.
  #
  # `max-hp` is low on purpose, and the number that sets it is `GroundFireConfig.damagePerTick` (6): a herb and
  # a reed die to one tick of a grass fire, and a shrub takes two or three. A fire that swept a meadow and left
  # every plant in it standing would be the defect.
  #
  # Every one is collectible and every one regrows, which no kind above does both of - a felled tree regrows
  # but is not picked, and a collected crystal is picked but is gone for good. A picked herb is the first thing
  # in the world that comes back, and the machinery for it already exists: `CollectPropIntentSystem` records
  # the depletion with a `resumeAt` and `shouldEmit` refuses the prop until the clock passes.
  #
  # Regrowth is faster than a tree's half hour, in the order a plant grows in: a herb is quickest, a shrub is
  # woody and slowest.
  #
  # `variants: 1` throughout, and it is a holding position rather than a decision - these are placeholder boxes
  # until there is art. See `PropAppearance`.
  - kind: HERB
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 600
    collect: { item-id: 23, amount: 1 }

  - kind: BLIGHTED_HERB
    max-hp: 4
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 600
    collect: { item-id: 23, amount: 1 }

  # The rare herbs. Each yields its own herb, which Herbalism has to be high enough to pick.
  - kind: MEDICINAL_HERB
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 600
    collect: { item-id: 328, amount: 1 }

  - kind: MANA_HERB
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 600
    collect: { item-id: 329, amount: 1 }

  - kind: FROST_HERB
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 600
    collect: { item-id: 330, amount: 1 }

  - kind: SUN_HERB
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 600
    collect: { item-id: 331, amount: 1 }

  - kind: GHOST_HERB
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 600
    collect: { item-id: 332, amount: 1 }

  - kind: SHRUB
    max-hp: 16
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1
    regrow-seconds: 1200
    collect: { item-id: 24, amount: 1 }

  - kind: BLIGHTED_SHRUB
    max-hp: 12
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1
    regrow-seconds: 1200
    collect: { item-id: 24, amount: 1 }

  - kind: REED
    max-hp: 6
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1
    regrow-seconds: 900
    collect: { item-id: 25, amount: 2 }

  - kind: BLIGHTED_REED
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1
    regrow-seconds: 900
    collect: { item-id: 25, amount: 2 }

  # The ward stone is an always-present entity rather than a static prop, so nothing promotes it and `max-hp` is
  # never read. The row is here because every kind needs one.
  - kind: WARD_STONE
    max-hp: 1
    collider: { half-x: 1, half-y: 1, height: 4 }
    variants: 1

  # Like the ward stone, an entity rather than a static prop: its health comes from guild.war-banner-hp.
  - kind: WAR_BANNER
    max-hp: 1
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 1

  - kind: STREET_STALL
    max-hp: 1
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  - kind: WARP_PORTAL
    max-hp: 1
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 1

  - kind: SCRY_EYE
    max-hp: 1
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  # What lies on the ground - see worldgen's `LootScatter`. A boulder is broken, not picked: it drops dressed
  # stone and, now and then, the flint and the odd rough gem that were inside it. A loose stone and a stick are
  # picked up as they lie, and both come back, because they are the first crafting material a new player has
  # and a spawn meadow picked bare would end the tutorial.
  #
  # Three boulder models, one size: the variant is rolled off the identity, so a boulder field does not look
  # stamped. One model each for the stone and the stick, which are loot rather than scenery.
  - kind: BOULDER
    max-hp: 300
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 3
    regrow-seconds: 3600
    loot:
      - { item-id: 46, amount: 2, drop-chance: 10000 }
      - { item-id: 46, amount: 2, drop-chance: 5000 }
      - { item-id: 100, amount: 1, drop-chance: 6000 }
      - { item-id: 101, amount: 1, drop-chance: 3500 }
      - { item-id: 60, amount: 1, drop-chance: 150 }

  - kind: LOOSE_STONE
    max-hp: 10
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 900
    collect: { item-id: 100, amount: 1 }

  - kind: STICK
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 900
    collect: { item-id: 102, amount: 1 }

  # Resin under the conifers. Rarer than a stick and slower to come back: a tree weeps it, nobody drops it.
  - kind: RESIN
    max-hp: 5
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    regrow-seconds: 1800
    collect: { item-id: 123, amount: 1 }

  # A ritual ring of Mana Concentrate laid flat into the ground; used up when its ritual ends.
  - kind: MANA_CIRCLE
    max-hp: 40
    collider: { half-x: 2, half-y: 2, height: 1 }
    variants: 1

  # A surveyor's tripod and its scope.
  - kind: THEODOLITE
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  # What people put up - worldgen's `FixtureKind`, see `dress/DressingStage` and `voxel/FixtureProps`. One row per
  # entry, mandatory like the landmarks'. `variants` is how many styles the generator chooses between, and the
  # generator's choice arrives as the variant itself rather than a roll: a fence is dry-stone because of the ground
  # it stands on. A wooden fence breaks for a log; nothing else here yields anything yet, for the reason at the top.
  - kind: FIXTURE_PIER
    max-hp: 800
    collider: { half-x: 2, half-y: 15, height: 1 }
    variants: 1

  - kind: FIXTURE_BOAT
    max-hp: 120
    collider: { half-x: 1, half-y: 3, height: 1 }
    variants: 2

  # Styles: post-and-rail, dry-stone, hedge, wattle (`FenceStyle`).
  - kind: FIXTURE_FENCE
    max-hp: 40
    collider: { half-x: 1, half-y: 15, height: 1 }
    variants: 4
    loot:
      - { item-id: 43, amount: 1, drop-chance: 5000 }

  # Styles: wheat, barley, cabbage (`CropStyle`).
  - kind: FIXTURE_CROP
    max-hp: 10
    collider: { half-x: 16, half-y: 16, height: 1 }
    variants: 3

  - kind: FIXTURE_HAYSTACK
    max-hp: 20
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 2

  - kind: FIXTURE_SCARECROW
    max-hp: 15
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  - kind: FIXTURE_WINDMILL
    max-hp: 900
    collider: { half-x: 4, half-y: 4, height: 11 }
    variants: 1

  - kind: FIXTURE_WELL
    max-hp: 400
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  # Readable: a click names where each way leads. See `ReadFixtureService`.
  - kind: FIXTURE_SIGNPOST
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 1

  - kind: FIXTURE_MILESTONE
    max-hp: 300
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  # The everflame: a lantern whose pale magic flame the client lights by the clock.
  - kind: FIXTURE_LANTERN
    max-hp: 80
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 1

  - kind: FIXTURE_CAIRN
    max-hp: 250
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  - kind: FIXTURE_GRAVESTONE
    max-hp: 150
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 3

  - kind: FIXTURE_NAMED_GRAVE
    max-hp: 200
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  - kind: FIXTURE_OUTCROP
    max-hp: 2000
    collider: { half-x: 4, half-y: 3, height: 4 }
    variants: 3

  - kind: FIXTURE_INN
    max-hp: 450
    collider: { half-x: 7, half-y: 5, height: 8 }
    variants: 1

  # A player settlement's sign. `max-hp` is only what its site ramps to; the standing sign takes its health from
  # the town, see `SignStrength`.
  - kind: CITY_SIGN
    max-hp: 2000
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 1

  - kind: POST_OFFICE
    max-hp: 800
    collider: { half-x: 4, half-y: 3, height: 4 }
    variants: 1

  # A cold fire ring beside a road in the wild. Treasure caches gather around these.
  - kind: FIXTURE_CAMP
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  # The crystal a world boss is bound in. Breaking it wakes the boss, once per world: see `WorldBossSealService`.
  - kind: FIXTURE_SEAL_CRYSTAL
    max-hp: 5000
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 1

  # What lies on a battlefield. Picked up as it lies and never comes back: the dead do not fall twice. A banner rag
  # is only cloth gone to threads, so it yields nothing.
  - kind: FIXTURE_BONES
    max-hp: 10
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    collect: { item-id: 92, amount: 1 }

  - kind: FIXTURE_RUSTED_BLADE
    max-hp: 10
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    collect: { item-id: 341, amount: 1 }

  - kind: FIXTURE_BROKEN_SHIELD
    max-hp: 10
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1
    collect: { item-id: 341, amount: 1 }

  - kind: FIXTURE_BANNER_RAG
    max-hp: 20
