# What each kind of static entity is made of, beyond where it stands.
#
# A registry rather than a table: none of this is persisted and none of it is per-instance, so it is
# configuration in the sense `ai/*.yml` and `movement/*.yml` are - read once at boot into memory. Contrast
# `items.yml` and `mob/*.yml`, which become rows because other rows reference them by id.
#
# `max-hp` is what a static entity's health starts from once `PropPromotionService` promotes it on the
# first point of damage - shaped right, not balanced.
#
# `collider` is half-extents and height in position units (= metres). Unread: movement does not consult
# entity colliders yet, and the seam for it is `ChunkWalkQuery.canStep`. Recorded here so that when it does,
# the numbers are in one place rather than in the factory.
#
# `regrow-seconds`, present only on the two tree kinds, is how long after being felled `PropDeathDivergenceSystem`
# lets the same spot stand a tree again; every other kind is terminal (absent) - a claimed landmark or a
# mined-out crystal never comes back.
#
# `loot` is left empty everywhere: there is no item yet that fits a felled tree or a claimed landmark
# (`items.yml` has an apple, a potion, footgear), so inventing an id here would be worse than leaving it
# unset - `PropDeathDivergenceSystem` still records the depletion and drops nothing.
#
# `collect` is the other half of that, and deliberately not the same field. A kind with one is picked up with
# a click - `CollectPropIntentSystem` grants the item straight into the inventory and records the depletion,
# with no combat involved. `loot` is chance-rolled *on death* and becomes stacks on the ground. So they differ
# in trigger, in determinism and in where the item ends up, and sharing a field would force one of them to
# carry a mode flag. A kind may have both; the two mechanics cannot both claim one prop, because whichever
# records the divergence first locks the other out.
#
# Presence of `collect` is the whole rule for what may be clicked - there is no separate `collectible` flag,
# so a kind added below is not collectible until someone says what it yields.
kinds:
  - kind: TREE
    max-hp: 120
    collider: { half-x: 1, half-y: 1, height: 8 }
    variants: 4
    regrow-seconds: 1800

  - kind: BLIGHTED_TREE
    max-hp: 90
    collider: { half-x: 1, half-y: 1, height: 8 }
    variants: 3
    regrow-seconds: 1800

  # The four collectible kinds. Size maps to amount rather than to a second item, so a large crystal is worth
  # walking to without doubling the catalogue.
  - kind: MANA_CRYSTAL_SMALL
    max-hp: 40
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 3
    collect: { item-id: 6, amount: 1 }

  - kind: MANA_CRYSTAL_LARGE
    max-hp: 90
    collider: { half-x: 1, half-y: 1, height: 4 }
    variants: 3
    collect: { item-id: 6, amount: 2 }

  - kind: WOUND_SPIRE
    max-hp: 200
    collider: { half-x: 1, half-y: 1, height: 9 }
    variants: 2

  # Aetherite pushed up over a shallow corrupted orebody: the surface sign that there is aetherite below.
  # Tougher than a mana crystal of the same size because it is ore rather than a growth.
  - kind: AETHERITE_SHARD_SMALL
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 3
    collect: { item-id: 7, amount: 1 }

  - kind: AETHERITE_SHARD_LARGE
    max-hp: 130
    collider: { half-x: 1, half-y: 1, height: 3 }
    variants: 3
    collect: { item-id: 7, amount: 2 }

  # The points of interest: one row per entry in worldgen's `PoiKind`, and mandatory - a landmark added to the
  # catalogue with no row here fails the boot rather than the first world that rolls it.
  #
  # `variants: 1` throughout, and unlike the rows above that is not a placeholder. A tree has four models so a
  # wood does not look stamped; each of these is *one object* that exists at most once in a world, so a second
  # model of it would be a second answer to a question with one answer.
  - kind: POI_LOST_GRAVE
    max-hp: 60
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  - kind: POI_STANDING_STONES
    max-hp: 400
    collider: { half-x: 3, half-y: 3, height: 3 }
    variants: 1

  - kind: POI_BROKEN_OBELISK
    max-hp: 500
    collider: { half-x: 1, half-y: 1, height: 6 }
    variants: 1

  - kind: POI_WAYSTONE
    max-hp: 150
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  - kind: POI_PETRIFIED_TREE
    max-hp: 300
    collider: { half-x: 1, half-y: 1, height: 6 }
    variants: 1

  - kind: POI_SUNKEN_IDOL
    max-hp: 250
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  # The buildings a town lays out: one row per entry in worldgen's `BuildingFunction` except FORTIFICATION,
  # which stays voxels. Mandatory in the same way the landmarks above are - a function added to worldgen with
  # no row here fails the boot rather than the first town that has one.
  #
  # `collider` is the only field here that is a placeholder rather than a decision, and it is a *deliberate*
  # one: a building's real footprint arrives per instance on the wire, because a temple and a barn are not the
  # same size and no per-kind number could be. What is written below is the half-extent of a typical lot for
  # that function, so that when `ChunkWalkQuery.canStep` finally reads colliders it has something with the
  # right order of magnitude rather than a zero. See `PropInstances.halfWidthAt`.
  #
  # `max-hp` is shaped by what the walls are, not by size: stone stands where thatch does not. No `collect`
  # anywhere - a building is not something you pick up - and no `loot` for the reason at the top of this file.
  #
  # `variants` is 1 throughout and that is a holding position: `StaticEntityRenderer` draws a placeholder box
  # scaled by the footprint on the wire, so a second model would be a second box. It goes up per function when
  # there is art.
  - kind: BUILDING_MARKET
    max-hp: 300
    collider: { half-x: 8, half-y: 6, height: 4 }
    variants: 1

  - kind: BUILDING_TEMPLE
    max-hp: 900
    collider: { half-x: 9, half-y: 6, height: 12 }
    variants: 1

  - kind: BUILDING_CIVIC
    max-hp: 800
    collider: { half-x: 8, half-y: 6, height: 10 }
    variants: 1

  - kind: BUILDING_SHOP
    max-hp: 400
    collider: { half-x: 5, half-y: 4, height: 8 }
    variants: 1

  - kind: BUILDING_CRAFT
    max-hp: 400
    collider: { half-x: 5, half-y: 4, height: 8 }
    variants: 1

  - kind: BUILDING_WAREHOUSE
    max-hp: 500
    collider: { half-x: 7, half-y: 5, height: 8 }
    variants: 1

  - kind: BUILDING_INN
    max-hp: 450
    collider: { half-x: 6, half-y: 5, height: 10 }
    variants: 1

  - kind: BUILDING_RESIDENCE
    max-hp: 350
    collider: { half-x: 5, half-y: 4, height: 8 }
    variants: 1

  # Lower than a house of the same size: a barn is a shell over a yard.
  - kind: BUILDING_FARM
    max-hp: 250
    collider: { half-x: 6, half-y: 5, height: 5 }
    variants: 1

  # The three crafting stations a player builds - see `PlayerStructureSource`. No `collect`, deliberately:
  # a station is taken down by whoever put it up (`RemoveStructureCMSG`), not picked up by a passer-by, and a
  # `collect` block would make one player's forge free loot for the next.
  #
  # Health is what it takes to break somebody else's station, and it is shaped rather than balanced - the
  # numbers say a furnace of brick outlasts a bench of planks, which is as far as any of this is decided.
  - kind: WORKBENCH
    max-hp: 150
    collider: { half-x: 1, half-y: 1, height: 1 }
    variants: 1

  - kind: FURNACE
    max-hp: 350
    collider: { half-x: 1, half-y: 1, height: 2 }
    variants: 1

  - kind: FORGE
    max-hp: 400
    collider: { half-x: 2, half-y: 1, height: 2 }
    variants: 1
