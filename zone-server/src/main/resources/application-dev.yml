# Loaded under the `dev` profile, which is the default when no profile is set (`spring.profiles.default`). A
# server given any other profile runs without it.
logging:
  level:
    net.bestia.zone: TRACE
    net.bestia.zone.ai: INFO
    net.bestia.zone.movement.ecs.MoveSystem: INFO # disable movement, too spammy

zone:
  # Public and committed; JwtSecretGuard refuses it outside the dev and test profiles. Must equal
  # login-server's dev `jwt.secret`.
  jwt-auth-secret-key: "your-secret-key-here-change-in-production"

chunk-stream:
  # Lets a carve open the wall beside water so it floods. Dev only until players can swim.
  allow-water-breach: true
