# An aggressive melee hunter: attacks players on sight, retaliates when hit, and bolts once badly hurt.
#
# YAML selects and tunes; the priority formula behind each goal lives in Kotlin, in BestiaDomain.Goals.
identifier: aggressive_melee
faction: wild_beasts
perception:
  sight_radius: 8
wander_radius: 5
melee_range: 1
hunger_threshold: 85
tiredness_threshold: 80
restless_threshold: 60
# Fights on until badly hurt, then runs. The same threshold switches KillEnemy off and Flee on, so the
# creature never oscillates between charging and bolting.
flee_threshold_pct: 35
aggression: 80
goals:
  - { name: KillEnemy }
  - { name: KillAttacker }
  - { name: Flee }
  - { name: EatVegetation }
  - { name: Sleep }
  - { name: ReturnHome }
  - { name: Wander }
actions:
  - approachTarget
  - attack
  - flee
  - walkToVegetation
  - eatVegetation
  - sleep
  - returnHome
  - wander
attacks:
  - { id: claw, range: 1, base_cost: 5, cooldown_seconds: 1.5 }
