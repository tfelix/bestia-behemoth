# An aggressive melee hunter: attacks players on sight and retaliates when hit. It does not break off - there
# is no flee mechanic any more, so a wounded hunter presses the attack or loses interest in favour of eating
# or sleeping, but it never runs.
#
# YAML selects and tunes; the priority formula behind each goal lives in Kotlin, in BestiaDomain.Goals.
identifier: aggressive_melee
faction: wild_beasts
perception:
  sight_radius: 8
wander_radius: 24
melee_range: 1
hunger_threshold: 85
tiredness_threshold: 80
restless_threshold: 60
aggression: 80
goals:
  - { name: KillEnemy }
  - { name: KillAttacker }
  - { name: EatVegetation }
  - { name: Sleep }
  - { name: ReturnHome }
  - { name: Wander }
actions:
  - approachTarget
  - attack
  - walkToVegetation
  - eatVegetation
  - sleep
  - returnHome
  - wander
attacks:
  - { id: claw, range: 1, base_cost: 5, cooldown_seconds: 1.5 }
