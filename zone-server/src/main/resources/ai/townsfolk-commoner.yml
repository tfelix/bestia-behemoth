# A town-dweller: at the post through the shift, about the street otherwise, home in bed at night.
#
# One archetype for everybody: what separates a guard from a beggar is the occupation written into the
# individual when it is spawned, not the species. See TownsfolkDomain.OCCUPATION.
identifier: townsfolk_commoner
domain: townsfolk
faction: townsfolk
perception:
  sight_radius: 8
# Tiles from the door. A town square rather than a home range - see TownsfolkDomain.DEFAULT_LOITER_RADIUS.
wander_radius: 12
tiredness_threshold: 80
hunger_threshold: 70
goals:
  - { name: TakeShelter }
  - { name: Sleep }
  - { name: Eat }
  - { name: Restock }
  - { name: WorkShift }
  - { name: GoHome }
  - { name: Socialise }
  - { name: Loiter }
actions:
  - buyFood
  - collectStock
  - deliverStock
  - eat
  - enterHome
  - goHome
  - goToGathering
  - goToMeal
  - goToShelter
  - goToSupplier
  - goToWork
  - loiter
  - mingle
  - shelterAtDoor
  - sleepAtHome
  - workShift
