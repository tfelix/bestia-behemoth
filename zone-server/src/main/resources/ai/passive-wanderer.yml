# A harmless grazer: never picks a fight, but fights back hard once something starts on it.
#
# Note it still lists KillAttacker. Retaliation is not something a profile opts into for flavour — being
# attacked is not optional — and the goal is gated on having actually been hit, so a peaceful creature stays
# peaceful until something starts on it.
#
# It used to run instead: a Flee goal at an 80% health threshold meant one hit sent it bolting, which made it
# effectively unhittable. Flee is gone from the domain entirely, and with it the base_priority override that
# used to hold KillAttacker down at 60 - that number only made sense while running away was the real answer
# to being hurt. At its own base of 95 retaliation beats grazing (80) and sleeping (90), so a blob under
# attack turns and fights instead of ambling off to eat.
identifier: passive_wanderer
faction: critters
perception:
  sight_radius: 6
wander_radius: 8
melee_range: 1
hunger_threshold: 70
tiredness_threshold: 75
restless_threshold: 40
# Low, and it only scales KillEnemy - which this archetype does not have. Retaliation is unscaled, so a
# meek creature still defends itself at full strength.
aggression: 10
goals:
  - { name: KillAttacker }
  - { name: EatVegetation }
  - { name: Sleep }
  - { name: ReturnHome }
  - { name: Wander }
actions:
  - approachTarget
  - attack
  - walkToVegetation
  - eatVegetation
  - sleep
  - returnHome
  - wander
attacks:
  - { id: nip, range: 1, base_cost: 8, cooldown_seconds: 2.0 }
