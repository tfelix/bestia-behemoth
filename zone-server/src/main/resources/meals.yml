# Every meal Cooking makes: what eating one restores, and what it leaves behind. Read at boot into `MealCatalog`.
#
# Eating is a channel of `channel-seconds` on the cast bar; moving, a hit or a stun break it off and the meal stays
# in the bag. Once through, the meal restores `restore` and lays SATISFIED ("Gesättigt") on its eater for
# `duration-seconds`, granting `bonus`. There is only ever one SATISFIED: eating again replaces it whole, bonus and
# timer both, even with a shorter one.
#
# `meal` is the item's `item-db-name` in items.yml. Each meal item names `script: MealScript` there; the script itself
# comes from this file.
#
# `bonus` keys (all optional; percent fields are percentage points):
#   stamina-regen-percent, hp-regen, mana-regen (flat per regen tick), regenerate-in-combat (true/false)
#   strength, intelligence, vitality, dexterity, willpower, agility, all-attributes
#   hit, flee, crit, max-hp-percent, max-mana-percent, heal-received-percent, aspd-percent, cast-time-reduction
#   stamina-cost-reduction (skills), stamina-drain-reduction (weather, road and work)
#   carry-capacity-percent, off-road-speed-percent, notice-range-cut-percent, block-chance-percent
#   leech-permille, catch-chance-points
#   element-resistance: { FIRE: 10 }, element-damage: { FIRE: 5 }, status-resistance: { POISON: 10 }
# An unknown key fails the boot.
#
# `grants` lays further status effects on, by their identifier in status_effects.yml, each with its own stacking rules:
#   grants:
#     - { effect: INCREASE_AGI, level: 1, duration-seconds: 300 }   # omit duration-seconds for the effect's own
