# Registers ClearMocksExtension for every class (see META-INF/services). This also loads MockK's own extension,
# which would reset every mock in the JVM after each test; requireParallelTesting turns that reset off.
junit.jupiter.extensions.autodetection.enabled = true
mockk.junit.extension.requireParallelTesting = true

# The classes that read a large shared fixture run first, back to back, so each fixture is built once and freed
# when its group is done. See HeavyFixture.
junit.jupiter.testclass.order.default = net.bestia.zone.fixtures.HeavyFixturesFirst
