# Registers ClearMocksExtension for every class (see META-INF/services). This also loads MockK's own extension,
# which would reset every mock in the JVM after each test; requireParallelTesting turns that reset off.
junit.jupiter.extensions.autodetection.enabled = true
mockk.junit.extension.requireParallelTesting = true

# The classes that read a large shared fixture run first, back to back, so each fixture is built once and freed
# when its group is done. See HeavyFixture.
junit.jupiter.testclass.order.default = net.bestia.zone.fixtures.HeavyFixturesFirst

# Four test classes at a time, the methods of a class one after another.
#
# Classes that share the Spring context hold SpringContextLock and so still run one at a time; the plain unit
# test classes run beside them. Four rather than one per core: the context's tick and the world builds are
# busy threads of their own, and every class shares one 3 GB heap.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 4
