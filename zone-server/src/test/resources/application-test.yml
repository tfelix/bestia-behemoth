spring:
  # Pinned back to `none`: eleven test classes use a bare `@SpringBootTest`, which defaults to a MOCK web
  # environment and binds no port, so there is no collision to avoid - but building a servlet context the suite
  # never calls into is pure boot time. The one test that does want HTTP overrides this property itself.
  main:
    web-application-type: none

  datasource:
    url: jdbc:h2:mem:behemoth-test
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false

# No wild dens in the shared integration context.
#
# The scenario tests assert on *timing* - that a chunk patch reaches its holders, that a carve is applied
# before the next assertion - against a Spring context they share. A populated wilderness puts tens of
# AI-driven creatures around every test player, all of them planning, moving and broadcasting on the same
# tick thread the chunk stream runs on, and the scenarios start losing races they never signed up for.
#
# This is not covering up a regression; it is undoing an accident. Before the density retune the shipped
# catalogue could stock 12 of 656 dens, so wild spawning was silently dead and these tests had a quiet world
# by luck rather than by choice. This says it out loud instead.
#
# It costs nothing in coverage: every test that is actually about dens - `SpawnerSystemTest`,
# `DenPackRestoreTest`, `WildDenCoverageTest`, `WildSpawnDensityTest` - builds its own world and its own
# dens rather than reading this one. A scenario that ever wants a populated world should override this
# block for itself.
wild-spawn:
  bands:
    - max-level: 100
      den-share: 0.0

# And no baseline wilderness either, for the reason above and more so.
#
# The ambient layer is denser than the dens by a factor of fifty by design - a hundred and forty creatures
# inside one player's interest cube - so leaving it on in the shared context does exactly what the block
# above describes, and it does not have the excuse of being accidentally dead.
#
# The integration path is still exercised: `AmbientSpawnerBootRunner` validates the configuration in this
# very context whether or not sites are stocked. Everything about the sites themselves is measured in
# `AmbientSiteLatticeTest`, `AmbientSpawnerSystemTest` and `AmbientSpawnDensityTest`, which build their own
# worlds. A scenario that ever wants a populated wilderness should override this for itself.
ambient-spawn:
  enabled: false

# Tests build worlds no client will ever see - a 32-cell world, a mocked config, a chunk size chosen to keep a
# fixture small - so the boot gate that protects real players from an undrawable world has nothing to protect
# here and would only refuse to start. See `ClientWorldContract`; `ClientWorldContractTest` covers the gate
# itself without needing a context.
worldgen:
  enforce-client-layout: false
