# Loaded under the `dev` profile, which is the default when no profile is set (`spring.profiles.default`). A dev
# host is expected to be reachable only by the person developing on it, so the passkey registered there is
# trusted with everything and no separate admin account is needed.
account:
  sign-up-role: SUPER_GM

# Scraped by the dev Prometheus of zone-server/compose.yaml. A separate port, so /actuator is never on the public one
# and exists only under this profile; 0.0.0.0 because the scraper is a container reaching the host.
management:
  server:
    port: 8093
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,prometheus

game-login:
  public-base-url: "http://localhost:8080"
  # A dev host serves the login page over plain http, where a browser refuses to store a Secure cookie.
  binding-cookie-secure: false

jwt:
  # Public and committed; LoginDeploymentGuard refuses it outside the dev and test profiles. Must equal
  # zone-server's dev `zone.jwt-auth-secret-key`.
  secret: "your-secret-key-here-change-in-production"
  # Public and committed too, and refused outside dev and test. Must equal api-service's dev companion.jwt-secret.
  companion-secret: "dev-companion-secret-shared-with-api-service"

# The Valkey of zone-server/compose.yaml. Public and committed; LoginDeploymentGuard refuses it outside dev and test.
bus:
  host: 127.0.0.1
  port: 6379
  username: login
  password: login-dev-password

webauthn:
  rp-id: "localhost"
  origins:
    - "http://localhost:8080"
  # The page is on http://localhost:8080 rather than the implicit https://<rp-id>:443.
  allow-origin-port: true

companion-login:
  # The Vite dev server of companion-app/.
  redirect-uris:
    - "http://localhost:5173/auth/callback"
