server:
  port: 8080

spring:
  # No profile here: `./gradlew :login-server:bootRun` activates `dev`, a packaged jar runs without it.
  # LoginDeploymentGuard refuses to boot with any of the dev-only settings outside that profile.
  datasource:
    # Matches login-server/compose.yaml. `./gradlew :login-server:bootRun` starts that container via
    # spring-boot-docker-compose and rewires the datasource to it, so these values only apply when
    # running standalone against a real MariaDB - override them with env vars there
    # (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD).
    url: jdbc:mariadb://localhost:3307/bestia_login
    driver-class-name: org.mariadb.jdbc.Driver
    username: bestia
    password: bestia

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities still match it.
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # secret: no value on purpose, so a deployment that forgets it does not boot. Supplied through JWT_SECRET and
  # identical to zone-server's `zone.jwt-auth-secret-key`; the dev profile carries a public one. A shared HMAC
  # secret for now: it moves to an asymmetric key pair (login signs, zones only verify) before production.
  # Validity (minutes) of the short-lived zone login token. This is a handoff ticket, not a session:
  # the socket judges it once at the handshake and the map endpoint uses its own ticket
  # (zone-server HttpTicketService), so it only has to survive the walk from login to connect.
  login-token-minutes: 2
  # Validity (minutes) of the token a game client calls this server's REST API with. Renewed on every refresh,
  # so a stolen one is useful only briefly.
  api-token-minutes: 15

zone-directory:
  # The zones a ban or a recovery kicks the account from: every one of them, because the login server cannot see
  # which one the player is on. Each entry is a zone's HTTP port (`server.port` there), not its game socket:
  #   - name: zone-1
  #     base-url: http://zone-1.internal:8091
  zones: []
  request-timeout-millis: 3000

account:
  # Role every newly registered account is created with. Registration is unauthenticated, so
  # anything above USER hands elevated permissions to whoever signs up next - application-dev.yml
  # raises it for local play and no other profile should.
  sign-up-role: USER

webauthn:
  # rp-id (WEBAUTHN_RP_ID): burned into every credential ever created and cannot be changed without
  # re-enrolling all of them. In production use the registrable domain (bestia.game), never the
  # host the page happens to be served from, so the auth site can move between subdomains later.
  rp-name: "Bestia"
  # origins (WEBAUTHN_ORIGINS_0, ...): where the browser may run the ceremony. Production: https://auth.bestia.game
  # The dev profile points both at localhost and relaxes origin port matching.
  # How long a started registration/assertion ceremony may sit unfinished.
  ceremony-ttl-seconds: 300

game-login:
  # How long the player has to complete the browser half of the flow.
  session-ttl-seconds: 300
  # Lifetime of the single-use authorization code handed to the loopback listener.
  authorization-code-ttl-seconds: 60
  # How long a client may keep resuming the game without touching a passkey again. Slides on every
  # rotation, so it expires a client that has not started the game in this long rather than capping
  # how long a session may live.
  refresh-token-days: 30
  # public-base-url (GAME_LOGIN_PUBLIC_BASE_URL): what the game is told to open. Must be one of `webauthn.origins`.
  # Recovery codes handed out once when an account is created.
  recovery-code-count: 10
