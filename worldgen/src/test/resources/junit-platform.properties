# One test-class instance per class, not per test method.
#
# Almost every class here holds its generated world in a `by lazy` property, and JUnit's default lifecycle
# builds a fresh instance for every `@Test` - so that world was generated again for each one. A class with
# five tests generated five identical worlds, which is where most of this module's runtime went.
#
# Safe as a module-wide default because no test class here keeps per-test mutable state: the only mutable
# fields in the suite are the world caches this setting exists to make work. A class that ever does need a
# clean instance per method can still ask for it with @TestInstance(Lifecycle.PER_METHOD).
junit.jupiter.testinstance.lifecycle.default = per_class

# Four test classes at a time, methods within a class in order.
#
# Almost all of this module's time is spent generating worlds, most of which run on one core for most of their
# stages, so one class at a time left a sixteen-thread machine idle. Classes rather than methods, because a class
# holds its world in a `by lazy` and some keep a keyed cache beside it, none of it written for two threads
# at once; `TestWorlds` is the one shared piece and is built for it.
#
# Four rather than one per core: every world build also fans out over `Parallel`'s pool, and each class holds
# worlds on a 6 GB heap. A class whose methods are independent and slow can still opt in to running them side by
# side with @Execution(CONCURRENT) - `WorldSizeSanityTest` does.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 4

# Longest classes first, by @Order. With classes running concurrently the run ends when the last one does, and
# discovery is alphabetical, so without this `WorldSizeSanityTest` started after every class before it had
# drained and was the only thing still running at the end. Classes without an @Order keep their usual place.
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$OrderAnnotation
