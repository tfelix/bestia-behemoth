plugins {
    id 'org.jetbrains.kotlin.jvm'
}

description = 'worldgen'

/**
 * Deterministic world generation: pipeline framework, vector features, field primitives and the
 * offline viewer. See .claude/skills/worldgen/SKILL.md for the architecture.
 *
 * Deliberately dependency-light - kotlin stdlib and the JDK, nothing else. This module is meant to be
 * linked into the zone-server and possibly into the client, so it must not drag in Spring, JPA or any
 * I/O. Everything outside the `viewer` package is a pure function over plain data; the viewer is the
 * one place allowed to touch Swing and the filesystem, and nothing depends on it.
 *
 * `render` is the exception that proves the rule. Viewport arithmetic, hillshading and packed-RGB colour
 * are wanted by two callers now - the offline viewer and the zone-server's map tiles - and none of it
 * touches AWT or a file, so it sits outside `viewer` where `checkBoundaries` holds it to the same standard
 * as the generator itself. The rasterisers stay apart: `viewer` keeps the Swing one, zone-server owns the
 * tile one. What is shared is the geometry and the arithmetic, never the drawing.
 *
 * `zone-server` depends on this module: `world/WorldService` generates and persists the world and
 * `world/stream/ChunkService` is the caller the chunk tier was always missing. The other callers are the
 * tests, the invariant sweep, the viewer and the probe.
 *
 * The internal layering is expressed as packages rather than as separate Gradle modules. Each layer
 * may use the ones above it and nothing below:
 *
 *   vector    geometry, polylines, station tables, profiles, blending, the spatial index
 *   core      Stage, GenContext, RNG, layer and feature stores, pipeline, chunk column sampling
 *   fields    noise, grids, distance transforms, Poisson disk, heaps - the numerical toolbox
 *
 *   geo       tectonics, plates, orogeny, erosion, glacial flow, the base heightfield
 *   climate   temperature, wind, orographic precipitation
 *   hydro     flow routing, lakes, the river graph, meandering
 *   bio       biome classification, soil
 *   resource  ore, coal, salt and placer deposits
 *   karst     cave systems: where the limestone is, and the galleries dissolved out of it
 *   civ       habitability, cultures, settlements, route finding, roads, town layout, buildings
 *   history   the thousand-year simulation, place names, ruins, artifacts and the event log
 *   pop       agricultural catchments, the business catalogue, household expansion
 *   voxel     block palette, occupancy, stratigraphy, chunk materialisation, town structures, RLE codec
 *
 *   derived   column summaries, opacity grid, walkable tiles, chunk deltas
 *   store     tiered chunk cache, delta and baking, base hashing, the version gate
 *   pipeline  assembles the stages into a world; the regression invariants
 *   render    viewport, hillshade, colour ramps - map arithmetic with no renderer attached
 *   viewer    tooling, not shipped to the server
 *
 * The stage packages are siblings: they depend on the three foundation layers and on each other only
 * through declared stage dependencies, never by calling into one another.
 */
dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/**
 * The value of a `-P` switch, or null when it was not given. `''` for a switch given without a value.
 *
 * **Every switch in this file goes through this rather than through `project.hasProperty`, and the difference
 * is a bug that was live.** `hasProperty` resolves against the whole `Project` bean, so it answers *true* for
 * the name of any getter Gradle happens to define - and `Project.getDepth()` exists, returning how deeply
 * nested the project is. `-Pdepth=8` on `:worldgen` therefore arrived as `--depth 1`, silently, with no way to
 * tell from the output that the number printed was Gradle's and not the one asked for.
 *
 * `-Partifacts` on the `chronicle` task was the same bug already shipped: `Project.getArtifacts()` exists too,
 * so the flag was **always** on and `./gradlew :worldgen:chronicle` had been printing the artifact section
 * whether or not anybody asked for it.
 *
 * `startParameter.projectProperties` is the `-P` map and nothing else, so a switch means what it says. This
 * project has no `gradle.properties`, so nothing is lost by ignoring that source as well.
 *
 * The lesson is the one the two comments below already record about `-Pcells` and `-Pgenesis`: a switch that is
 * accepted and quietly ignored produces a measurement that looks like an answer to the question asked.
 */
def cli = { String name -> project.gradle.startParameter.projectProperties[name] }

tasks.named("test") {
    useJUnitPlatform()

    /*
     * Gradle gives a test worker 512 MB by default, and that stopped being enough when the spawner stage's
     * den density went up fifty-fold: a genesis world now carries some thirty thousand `BESTIA_SPAWN`
     * markers instead of six hundred, and several tests hold a whole generated world - a few of them more
     * than one, or one at a larger cell count. The symptom is not a failing assertion but
     * `OutOfMemoryError` out of the executor itself, which reports as "Could not complete execution for
     * Gradle Test Executor N" and names no test at all.
     *
     * Four gigabytes rather than the smallest number that passes, because the suite generates worlds
     * concurrently and the peak depends on how many land in flight together.
     */
    maxHeapSize = '4g'

    // `./gradlew :worldgen:test -Pserial` runs the whole suite on one thread. The first question about any
    // new test failure is whether the work splitting caused it, and this is how that is answered in one run.
    if (cli('serial') != null) systemProperty 'worldgen.parallel', 'false'
    if (cli('threads') != null) systemProperty 'worldgen.threads', cli('threads')
}

/**
 * The two rules in this file's header, enforced instead of merely written down.
 *
 * The header has said "kotlin stdlib and the JDK, nothing else" and "the viewer is the one place allowed to
 * touch Swing and the filesystem" since the module existed, and **nothing checked either.** A single
 * `implementation` line would have gone unnoticed until the zone-server or the client inherited it, which is
 * exactly the point at which it stops being cheap to undo - the value of this module is that it is a pure
 * function over plain data, and that property is lost quietly rather than loudly.
 *
 * Calibrated to zero violations at the commit that added it: the compile classpath resolves to four
 * artifacts, and the only `java.*` imports outside `viewer/` are `ByteArrayOutputStream`, `java.util.Arrays`,
 * `Locale`, `java.util.concurrent.*` and `java.util.zip.*` - a buffer, a formatter and a thread pool, none of
 * them I/O.
 *
 * `java.nio.ByteBuffer` is deliberately **not** banned while `java.nio.file` is: the ban is on reaching the
 * outside world, not on binary data, and a future codec has every right to a buffer. The pattern matches a
 * fully-qualified call as well as an import, because `java.io.File(path)` with no import is how the rule gets
 * bypassed by accident - `viewer/TownMain` writes its PNG exactly that way.
 */
def allowedCompileArtifacts = ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8', 'annotations'] as Set

def bannedOutsideViewer = [
        'java.io.File' : 'the filesystem',
        'java.nio.file': 'the filesystem',
        'java.net'     : 'the network',
        'java.awt'     : 'AWT',
        'javax.swing'  : 'Swing',
        'javax.imageio': 'ImageIO',
]

tasks.register('checkBoundaries') {
    group = 'verification'
    description = 'Fails if worldgen gains a dependency, or touches the filesystem outside viewer/'

    def classpath = configurations.named('compileClasspath')
    def scanned = fileTree('src/main/kotlin/net/bestia/worldgen') {
        include '**/*.kt'
        exclude 'viewer/**'
    }
    inputs.files(scanned)
    inputs.property('allowed', allowedCompileArtifacts.sort().join(','))

    doLast {
        def resolved = classpath.get().resolvedConfiguration.resolvedArtifacts
                .collect { it.moduleVersion.id.name }
                .toSet()
        def extra = resolved - allowedCompileArtifacts
        if (!extra.isEmpty()) {
            throw new GradleException(
                    "worldgen's compile classpath gained ${extra.sort()}.\n" +
                    "This module is linked into zone-server and possibly the client, so it takes the Kotlin " +
                    "stdlib and the JDK and nothing else. If you need to read a file or parse a format, hand " +
                    "the module a String and let the caller do the I/O - see store/ChunkCache.kt's " +
                    "ChunkBlobStore, which exists for exactly this reason.")
        }

        def offences = []
        scanned.each { file ->
            file.eachLine('UTF-8') { line, number ->
                bannedOutsideViewer.each { prefix, what ->
                    def quoted = java.util.regex.Pattern.quote(prefix)
                    if (line ==~ /^\s*import\s+${quoted}.*/ || line =~ /${quoted}[\w.]*\s*\(/) {
                        offences << "  ${file.name}:${number} reaches ${what} - ${line.trim()}"
                    }
                }
            }
        }
        if (!offences.isEmpty()) {
            throw new GradleException(
                    "worldgen touches the outside world outside viewer/:\n" +
                    offences.join('\n') + '\n' +
                    "Everything outside viewer/ is a pure function over plain data. Move the I/O to the " +
                    "caller, or to viewer/, which is the one package allowed it and which nothing depends on.")
        }
    }
}

tasks.named('check') { dependsOn 'checkBoundaries' }

/** Where zone-server's birth settings for the world it boots live. */
def genesisSettings = rootProject.layout.projectDirectory
        .file('zone-server/src/main/resources/application.yml')

/**
 * Forwards the run-mode switches, which every worldgen task takes - including the two that take no world
 * flags at all, which is why this is separate from worldArgs rather than part of it.
 *
 * These three are system properties rather than flags because they are switches on *how* the generator runs
 * rather than on what world it makes, and they have to reach code (Grid, the flow solver) that never sees a
 * WorldConfig. JavaExec forks, so a -D on the gradlew command line does not arrive on its own - hence the
 * explicit forwarding.
 *
 *   -Ptimings          print the sub-stage breakdown that StageListener cannot see
 *   -Pserial           force every parallel loop back onto one thread
 *   -Pthreads=<n>      pin the worker count, for measuring how a change actually scales
 *
 * One closure rather than a copy per task: `invariants` and `bench` each grew their own and `bench` was
 * missing -Ptimings, which is the worse half of the failure - the flag is accepted either way, so a tool
 * that silently ignores it looks exactly like a tool where the switch made no difference. Declared before
 * worldArgs because a Groovy closure resolves a script-level `def` at creation, not at call.
 */
def runModes = { task ->
    if (cli('timings') != null) task.systemProperty 'worldgen.timings', 'true'
    if (cli('serial') != null) task.systemProperty 'worldgen.parallel', 'false'
    if (cli('threads') != null) {
        task.systemProperty 'worldgen.threads', cli('threads')
    }
}

/**
 * Forwards the world-shaping properties to the offline tools.
 *
 * Both viewer tasks need this and neither had it, which is worse than it sounds: `-Pcells=128` was accepted
 * without complaint and quietly generated the default world instead, so a measurement taken that way looked
 * like a real answer about a small world and was an answer about a large one.
 *
 * `-Pgenesis` reads zone-server's own `worldgen:` block instead of the demo world - see
 * buildSrc/src/main/kotlin/WorldGenSettings.kt. It goes on first so that an explicit `-Pseed` or `-Pcells`
 * still overrides it: WorldArgs takes the *last* occurrence of a flag, which is what makes "the server's
 * world, but 256 cells across" expressible.
 *
 * `-Pcells` becomes the per-edge flags rather than `--cells` for the same reason. `--cells` and
 * `--width-cells` together are a contradiction WorldArgs rejects, and combining them is exactly what
 * `-Pgenesis -Pcells=256` would otherwise do.
 *
 * `-Pparams=<file>` is the two hundred tunables that are not WorldConfig fields. It is forwarded here, with the
 * world flags, because it changes the terrain as surely as `-Pcells` does - a tool that took one and not the
 * other could be pointed at half a generator.
 */
def worldArgs = { task ->
    if (cli('genesis') != null) {
        task.args WorldGenSettings.toolArgs(genesisSettings.asFile)
    }
    if (cli('seed') != null) task.args '--seed', cli('seed')
    if (cli('cells') != null) {
        task.args '--width-cells', cli('cells')
        task.args '--height-cells', cli('cells')
    }
    if (cli('params') != null) task.args '--params', cli('params')

    runModes(task)
}

/**
 * Interactive layer/feature inspector.
 *
 * ```
 * ./gradlew :worldgen:viewer -Pcells=128 -Pseed=42   # a world you describe
 * ./gradlew :worldgen:viewer -Pgenesis               # the world zone-server boots
 * ./gradlew :worldgen:viewer -Plaf=<class>           # force a Swing look and feel
 * ```
 */
tasks.register('viewer', JavaExec) {
    group = 'worldgen'
    description = 'Generates a world and opens the offline viewer on it'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.ViewerMain'
    // Without this JavaExec runs on the Gradle daemon's JVM, which is older than the toolchain the
    // classes were compiled against.
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    worldArgs(it)
    // JavaExec forks a fresh JVM, so a -D on the gradlew command line does not reach the viewer.
    // See ViewerMain.installLookAndFeel for when this is worth reaching for.
    if (cli('laf') != null) systemProperty 'worldgen.laf', cli('laf')
}

/**
 * Serial against parallel, same JVM, same world: `./gradlew :worldgen:bench -Pcells=512 -Preps=3`.
 *
 * The only honest way to measure the split on a machine that is also running a desktop - see BenchMain.
 */
tasks.register('bench', JavaExec) {
    group = 'worldgen'
    description = 'Times the world tier built serially against the same world built in parallel'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.BenchMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    if (cli('cells') != null) args '--cells', cli('cells')
    if (cli('reps') != null) args '--reps', cli('reps')
    // -Pserial arrives here too, and BenchMain refuses it rather than silently comparing serial to serial.
    runModes(it)
}

/** Same world, rendered to PNGs - works over SSH and in CI: `./gradlew :worldgen:viewerExport`. */
tasks.register('viewerExport', JavaExec) {
    group = 'worldgen'
    description = 'Renders every layer to PNG files instead of opening a window'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.ViewerMain'
    // Without this JavaExec runs on the Gradle daemon's JVM, which is older than the toolchain the
    // classes were compiled against.
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args '--export', cli('out') ?: "$buildDir/viewer"
    worldArgs(it)
}

/**
 * Prints one player-sized patch of ground as text: `./gradlew :worldgen:probe -Px=32000 -Py=32000`.
 *
 * The viewer renders whole worlds, so anything narrower than a kilometre is a pixel in it. This is for the
 * complaints that only exist at one metre per voxel.
 */
tasks.register('probe', JavaExec) {
    group = 'worldgen'
    description = 'Dumps the surface blocks and relief of a small window, one character per voxel'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.ProbeMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    worldArgs(it)
    if (cli('x') != null) args '--x', cli('x')
    if (cli('y') != null) args '--y', cli('y')
    if (cli('span') != null) args '--span', cli('span')
    if (cli('at') != null) args '--at', cli('at')
    if (cli('survey') != null) args '--survey', cli('survey')
    if (cli('on') != null) args '--on', cli('on')
    if (cli('nth') != null) args '--nth', cli('nth')
    if (cli('channels') != null) args '--channels'
    if (cli('ecotone') != null) args '--ecotone'
    // Props - trees, crystals, wound spires. The only view of them: they are not in the voxel grid, so the
    // plan view and the section both print the bare ground they stand on. See ProbeMain.props.
    if (cli('props') != null) args '--props'
    // The survival curve `ChunkMaterializer.BARE_ROCK_GRADIENT` has to be picked from. Not derivable from the
    // detail parameters: the gradient is the sum of nine noise octaves and every vector feature.
    if (cli('steepness') != null) args '--steepness'
    // A vertical slice, and the only view of anything under intact ground: every other one reports the topmost
    // non-air voxel, so a shaft or a passage is invisible to all of them. See ProbeMain.section.
    //
    // `-Pbelow` rather than the obvious `-Pdepth`, because `Project.getDepth()` exists and would answer for it.
    // See `cli` at the top of this file.
    if (cli('section') != null) args '--section'
    if (cli('below') != null) args '--below', cli('below')
    // Chunk-scale droplet erosion, which ships off. See geo/DropletHeightField; this is the only view of it,
    // because the viewer renders whole worlds and a gully is a pixel there.
    if (cli('droplets') != null) args '--droplets'
}

/**
 * Inspects one settlement: its layout, its economy, its history, and a map of it.
 *
 * The scale between the other two tools. `viewer` renders a whole world, so a town is a pixel; `probe` prints
 * 48 metres, so a town is four hundred probes. Everything step 8 produces lives in between.
 *
 * ```
 * ./gradlew :worldgen:town                       # the largest settlement in the world
 * ./gradlew :worldgen:town -Pnth=3 -Pwhy         # the fourth largest, with the precondition trace
 * ./gradlew :worldgen:town -Pruin                # somewhere history destroyed
 * ./gradlew :worldgen:town -Pcensus              # every settlement in one table
 * ```
 */
tasks.register('town', JavaExec) {
    group = 'worldgen'
    description = 'Prints and renders one settlement: streets, buildings, economy and history'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.TownMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    worldArgs(it)
    if (cli('index') != null) args '--index', cli('index')
    if (cli('nth') != null) args '--nth', cli('nth')
    if (cli('tier') != null) args '--tier', cli('tier')
    if (cli('out') != null) args '--out', cli('out')
    if (cli('metresPerPixel') != null) {
        args '--metres-per-pixel', cli('metresPerPixel')
    }
    if (cli('ruin') != null) args '--ruin'
    if (cli('why') != null) args '--why'
    if (cli('census') != null) args '--census'
}

/**
 * Reads the world's history: the event log, the civilisations, the artifacts and their provenance.
 *
 * Text rather than a view, because a chronicle is prose - the questions asked of it are "what happened here"
 * and "where did this sword come from", and both are answered by sentences in year order. What is spatial
 * about history - ruins, battlefields, tombs - is already in `viewer`, because the renderer's exhaustive
 * `when` over feature kinds forced a colour for each of them.
 *
 * ```
 * ./gradlew :worldgen:chronicle                  # the shape of this world's history
 * ./gradlew :worldgen:chronicle -Pall            # everything, at length
 * ./gradlew :worldgen:chronicle -Pyear=430       # the world as it stood then
 * ./gradlew :worldgen:chronicle -Pquests         # unresolved threads worth turning into quests
 * ```
 */
tasks.register('chronicle', JavaExec) {
    group = 'worldgen'
    description = 'Prints the generated history: events, civilisations, figures, artifacts and sites'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.ChronicleMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    worldArgs(it)
    if (cli('top') != null) args '--top', cli('top')
    if (cli('year') != null) args '--year', cli('year')
    if (cli('civs') != null) args '--civs'
    if (cli('artifacts') != null) args '--artifacts'
    if (cli('figures') != null) args '--figures'
    if (cli('sites') != null) args '--sites'
    if (cli('quests') != null) args '--quests'
    if (cli('orders') != null) args '--orders'
    if (cli('all') != null) args '--all'
}

/**
 * The regression harness: generate many worlds and assert the invariants on each.
 *
 * `./gradlew :worldgen:invariants -Pseeds=200 -Pcells=256`
 *
 * Worldgen bugs are rare-seed bugs, so the sweep is the tool that actually finds them - the unit tests
 * cover a handful of seeds, and the failures that matter show up in one world in a few hundred.
 *
 * It is also where a candidate params file is judged, since the land-fraction and lake distributions it prints
 * are the acceptance criterion for a tuning change:
 *
 * ```
 * ./gradlew :worldgen:invariants -Pseeds=200 -Pparams=my.params
 * ```
 *
 * `worldArgs` rather than its own `--cells`: the sweep had a three-line argument parser that ignored every flag
 * it did not know, so `-Pgenesis` was accepted and discarded. Note `worldArgs` translates `-Pcells` into the
 * per-edge flags, which is what keeps it from colliding with `-Pgenesis`.
 */
tasks.register('invariants', JavaExec) {
    group = 'worldgen'
    description = 'Generates N worlds and checks the regression invariants on each'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.InvariantsMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args '--seeds', cli('seeds') ?: '25'
    if (cli('firstSeed') != null) {
        args '--first-seed', cli('firstSeed')
    }
    // Brings -Pcells, -Pgenesis, -Pparams and the run modes. -Pserial here is the difference between a coffee
    // and a glance at the screen, since the sweep builds one world per core.
    worldArgs(it)
}

/**
 * Two worlds, one difference field.
 *
 * The other half of "change one number and look at the same world": `-Pparams` makes the change, this says
 * what it did. Reads a table of mean and worst absolute difference per layer - the half that works in a
 * terminal - and writes difference PNGs when given `-Pout`.
 *
 * ```
 * ./gradlew :worldgen:diff -Pseed=7 -Pother=8
 * ./gradlew :worldgen:diff -Pparams=a.txt -Potherparams=b.txt -Pout=build/diff
 * ```
 *
 * `-Pother` and `-Potherparams` are mutually exclusive and the tool refuses both, because a difference with
 * two causes in it says nothing about either.
 */
tasks.register('diff', JavaExec) {
    group = 'worldgen'
    description = 'Compares two worlds - two seeds, or two params files - layer by layer'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.DiffMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    if (cli('other') != null) {
        args '--other', cli('other')
    }
    if (cli('otherparams') != null) {
        args '--other-params', cli('otherparams')
    }
    if (cli('out') != null) {
        args '--out', cli('out')
    }
    worldArgs(it)
}
