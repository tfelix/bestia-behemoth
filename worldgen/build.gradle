plugins {
    id 'org.jetbrains.kotlin.jvm'
}

description = 'worldgen'

/**
 * Deterministic world generation: pipeline framework, vector features, field primitives and the
 * offline viewer. See worldgen-architecture.md.
 *
 * Deliberately dependency-light - kotlin stdlib and the JDK, nothing else. This module is meant to be
 * linked into the zone-server and possibly into the client, so it must not drag in Spring, JPA or any
 * I/O. Everything outside the `viewer` package is a pure function over plain data; the viewer is the
 * one place allowed to touch Swing and the filesystem, and nothing depends on it.
 *
 * `zone-server` depends on this module: `world/WorldService` generates and persists the world and
 * `world/stream/ChunkService` is the caller the chunk tier was always missing. The other callers are the
 * tests, the invariant sweep, the viewer and the probe.
 *
 * The internal layering is expressed as packages rather than as separate Gradle modules. Each layer
 * may use the ones above it and nothing below:
 *
 *   vector    geometry, polylines, station tables, profiles, blending, the spatial index
 *   core      Stage, GenContext, RNG, layer and feature stores, pipeline, chunk column sampling
 *   fields    noise, grids, distance transforms, Poisson disk, heaps - the numerical toolbox
 *
 *   geo       tectonics, plates, orogeny, erosion, glacial flow, the base heightfield
 *   climate   temperature, wind, orographic precipitation
 *   hydro     flow routing, lakes, the river graph, meandering
 *   bio       biome classification, soil
 *   resource  ore, coal, salt and placer deposits
 *   civ       habitability, cultures, settlements, route finding, roads
 *   voxel     block palette, occupancy, stratigraphy, chunk materialisation, the RLE codec
 *
 *   derived   column summaries, opacity grid, walkable tiles, chunk deltas
 *   store     tiered chunk cache, delta and baking, base hashing, the version gate
 *   pipeline  assembles the stages into a world; the regression invariants
 *   viewer    tooling, not shipped to the server
 *
 * The stage packages are siblings: they depend on the three foundation layers and on each other only
 * through declared stage dependencies, never by calling into one another.
 */
dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

/** Where zone-server's birth settings for the world it boots live. */
def genesisSettings = rootProject.layout.projectDirectory
        .file('zone-server/src/main/resources/application.yml')

/**
 * Forwards the world-shaping properties to the offline tools.
 *
 * Both viewer tasks need this and neither had it, which is worse than it sounds: `-Pcells=128` was accepted
 * without complaint and quietly generated the default world instead, so a measurement taken that way looked
 * like a real answer about a small world and was an answer about a large one.
 *
 * `-Pgenesis` reads zone-server's own `worldgen:` block instead of the demo world - see
 * buildSrc/src/main/kotlin/WorldGenSettings.kt. It goes on first so that an explicit `-Pseed` or `-Pcells`
 * still overrides it: WorldArgs takes the *last* occurrence of a flag, which is what makes "the server's
 * world, but 256 cells across" expressible.
 *
 * `-Pcells` becomes the per-edge flags rather than `--cells` for the same reason. `--cells` and
 * `--width-cells` together are a contradiction WorldArgs rejects, and combining them is exactly what
 * `-Pgenesis -Pcells=256` would otherwise do.
 */
def worldArgs = { task ->
    if (project.hasProperty('genesis')) {
        task.args WorldGenSettings.toolArgs(genesisSettings.asFile)
    }
    if (project.hasProperty('seed')) task.args '--seed', project.property('seed')
    if (project.hasProperty('cells')) {
        task.args '--width-cells', project.property('cells')
        task.args '--height-cells', project.property('cells')
    }
}

/**
 * Interactive layer/feature inspector.
 *
 * ```
 * ./gradlew :worldgen:viewer -Pcells=128 -Pseed=42   # a world you describe
 * ./gradlew :worldgen:viewer -Pgenesis               # the world zone-server boots
 * ```
 */
tasks.register('viewer', JavaExec) {
    group = 'worldgen'
    description = 'Generates a world and opens the offline viewer on it'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.ViewerMain'
    // Without this JavaExec runs on the Gradle daemon's JVM, which is older than the toolchain the
    // classes were compiled against.
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    worldArgs(it)
}

/** Same world, rendered to PNGs - works over SSH and in CI: `./gradlew :worldgen:viewerExport`. */
tasks.register('viewerExport', JavaExec) {
    group = 'worldgen'
    description = 'Renders every layer to PNG files instead of opening a window'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.ViewerMain'
    // Without this JavaExec runs on the Gradle daemon's JVM, which is older than the toolchain the
    // classes were compiled against.
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args '--export', project.findProperty('out') ?: "$buildDir/viewer"
    worldArgs(it)
}

/**
 * Prints one player-sized patch of ground as text: `./gradlew :worldgen:probe -Px=32000 -Py=32000`.
 *
 * The viewer renders whole worlds, so anything narrower than a kilometre is a pixel in it. This is for the
 * complaints that only exist at one metre per voxel.
 */
tasks.register('probe', JavaExec) {
    group = 'worldgen'
    description = 'Dumps the surface blocks and relief of a small window, one character per voxel'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.viewer.ProbeMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    worldArgs(it)
    if (project.hasProperty('x')) args '--x', project.property('x')
    if (project.hasProperty('y')) args '--y', project.property('y')
    if (project.hasProperty('span')) args '--span', project.property('span')
    if (project.hasProperty('at')) args '--at', project.property('at')
    if (project.hasProperty('survey')) args '--survey', project.property('survey')
    if (project.hasProperty('on')) args '--on', project.property('on')
    if (project.hasProperty('nth')) args '--nth', project.property('nth')
    if (project.hasProperty('channels')) args '--channels'
}

/**
 * The regression harness: generate many worlds and assert the invariants on each.
 *
 * `./gradlew :worldgen:invariants -Pseeds=200 -Pcells=256`
 *
 * Worldgen bugs are rare-seed bugs, so the sweep is the tool that actually finds them - the unit tests
 * cover a handful of seeds, and the failures that matter show up in one world in a few hundred.
 */
tasks.register('invariants', JavaExec) {
    group = 'worldgen'
    description = 'Generates N worlds and checks the regression invariants on each'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.bestia.worldgen.pipeline.InvariantsMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args '--seeds', project.findProperty('seeds') ?: '25'
    args '--cells', project.findProperty('cells') ?: '192'
    if (project.hasProperty('firstSeed')) {
        args '--first-seed', project.property('firstSeed')
    }
}
