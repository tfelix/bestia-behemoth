<style>
/* Layout: one reading column; each text is a section with its fact sheet, then one card per model. */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --fg: #1c2320;
  --muted: #5a6661;
  --line: #d5dcd8;
  --accent: #2c6b5e;
  --accent-soft: #e1eeea;
  --ok: #2f7a3f;
  --warn: #9a6a12;
  --bad: #b03a2e;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-text: "Literata", Georgia, serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --surface: #1b211f; --fg: #dde4e0; --muted: #94a19b; --line: #2e3733;
    --accent: #79bdaa; --accent-soft: #22312c; --ok: #72c084; --warn: #d9a64a; --bad: #e57b6f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1b211f; --fg: #dde4e0; --muted: #94a19b; --line: #2e3733;
  --accent: #79bdaa; --accent-soft: #22312c; --ok: #72c084; --warn: #d9a64a; --bad: #e57b6f; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-ui); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; display: grid; gap: 40px; }
header { display: grid; gap: 12px; }
.eyebrow { font: 500 12px/1 var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 600 30px/1.2 var(--font-ui); margin: 0; text-wrap: balance; }
h2 { font: 600 20px/1.3 var(--font-ui); margin: 0; text-wrap: balance; }
h2::first-letter { text-transform: uppercase; }
h3 { font: 600 13px/1.3 var(--font-data); margin: 0; letter-spacing: .02em; }
p { margin: 0; max-width: 68ch; }
.lead { color: var(--muted); }
.verdict { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 16px 18px; display: grid; gap: 8px; }
.verdict strong { color: var(--accent); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font: 13px/1.4 var(--font-ui); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; }
tr:last-child td { border-bottom: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters span { color: var(--muted); font-size: 13px; }
.chip { font: 500 13px/1 var(--font-ui); border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 7px 10px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
nav.toc a { color: var(--accent); text-decoration: none; }
nav.toc a:hover { text-decoration: underline; }
section.text { display: grid; gap: 14px; scroll-margin-top: 16px; }
.kind { font: 500 12px/1 var(--font-data); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
details.sheet { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; }
details.sheet summary { cursor: pointer; font-size: 13px; color: var(--muted); }
pre.prompt { font: 12.5px/1.55 var(--font-data); white-space: pre-wrap; margin: 0; }
details.sheet pre { font: 12px/1.5 var(--font-data); white-space: pre-wrap; margin: 10px 0 0; color: var(--fg); }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font: 500 11.5px/1 var(--font-data); padding: 4px 7px; border-radius: 4px; border: 1px solid currentColor; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); } .badge.info { color: var(--muted); }
.prose { font: 16px/1.65 var(--font-text); white-space: pre-wrap; max-width: 68ch; }
.prose.de { border-left: 2px solid var(--line); padding-left: 12px; }
.note { font-size: 13px; color: var(--muted); }
.problems { font: 12px/1.5 var(--font-data); color: var(--bad); }
.score { font-size: 13px; }
.score b { font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
@media (max-width: 520px) { h1 { font-size: 24px; } .prose { font-size: 15px; } }
</style>

<script id="data" type="application/json">{"experiment": {"intro": "The same war, written again by the two remaining models with a restructured prompt: hard rules in the system prompt, a list of the only allowed names with what each one is, a cleaned-up fact sheet, a bias anchor, and the task last. Sampling: temperature 0.6, top_p 0.85, min_p 0.05, repeat penalty 1.08. The same model then translated each book with a German localisation prompt. Timings ran while another job loaded the machine; compare quality, not speed.", "summary": "<p><strong>Better than the original prompt on the hard facts.<\/strong> All four books were valid at the first try, with no invented names. Every book puts the 906 battle on Steingrube Field and knows Chuluun was the Saryhorde's ruler, because the cleaned-up sheet says so; the original sheet left both to guess. The cleaned-up sheet was written for this war by hand from the chronicle, and fixed a mistake in the suggested version (that put all three battles on Bortedag Field).<\/p><p><strong>Two side effects.<\/strong> All four books leave out the death counts: nothing is wrong, but the numbers are gone. And the bias line \"Blame the other side for the conflict\" makes the Saryhorde scribes say the Keshband started the war, which the Saryhorde did. To fix both: ask for the counts, and let the scribe blame the enemy for the war's cruelty, not its start.<\/p><p><strong>German:<\/strong> Gemma's translations keep the epithets in German and the articles right, with a few grammar slips. Qwen's German stays weak.<\/p>", "rows": [{"model": "Gemma 4 E4B · llama.cpp", "side": "Saryhorde", "text": "The dark tide of conflict began in 901, when the wicked Keshband chose strife against the righteous Saryhorde. Though their foe possessed might, the spirit of Saryhorde remained unbroken, guided by Bayan the Unseen Weaver. At Bortedag Field in 901, the ill-fated fall of Chuluun marked a grievous blow, yet the courage shown was unmatched. The Keshband, under Tsetseg the Second, pressed their vile advantage, sacking Bortedag with dishonor.\n\nEven when the dust settled upon Steingrube Field in 906, and again at Bortedag Field in 911, the acts of Keshband were but temporary cruelties. Their victories, though counted by some scribes, did not diminish the pure heart of Saryhorde. By 911, when peace was finally brought to pass, it was a testament to the enduring virtue of Batu and his people against the relentless malice of Keshband.", "attempts": 1, "problems": [], "comment": "Right fields and years, Chuluun's fall in 901. Says the Keshband chose the war (the Saryhorde declared it); no death counts.", "de": "Die dunkle Flut des Konflikts begann im Jahre 901, als die boshafte Keshband den Kampf gegen die rechtschaffene Saryhorde suchte. Obgleich ihr Feind mächtig war, blieb der Geist der Saryhorde unerschütterlich, geleitet von Bayan, dem Unsichtbaren Weber. Am Schlachtfeld Bortedag im Jahre 901 markierte der unglückliche Fall Chuluuns einen schweren Schlag, doch der gezeigte Mut war unvergleichlich. Die Keshband, unter Tsetseg dem Zweiten, trieben ihren verabscheuungswürdigen Vorteil voran und heimsuchten Bortedag in Schande.\n\nSelbst als sich der Staub auf dem Feld Steingrube im Jahre 906 legte und erneut auf dem Feld Bortedag im Jahre 911, waren die Taten der Keshband nur vorübergehende Grausamkeiten. Ihre Siege, obgleich einige Schreiber sie zählten, minderten nicht das reine Herz der Saryhorde. Bis zum Jahre 911, als der Frieden endlich eingetreten war, zeugte dies von der beständigen Tugend Batu und seines Volkes gegen die unerbittliche Bosheit der Keshband.", "de_comment": "Good: 'Bayan, dem Unsichtbaren Weber', 'Tsetseg dem Zweiten', 'die Keshband'. Slips: 'heimsuchten Bortedag', 'Tugend Batu' (Batus).", "original": "In the year 901, the Saryhorde did face the Keshband in war. Though the Keshband claimed victory near Bortedag, claiming 406 souls, it was but a temporary shadow cast by the might of Saryhorde. Even as Chuluun fell, the true spirit of our people remained unbroken. The sacking of Bortebulak's lands by the Keshband in that harsh year spoke only to their base cruelty, not our lack of strength.\n\nAgain, in 906, the Keshband pressed their ill fortune upon us near Bortedag, taking 408 lives. Yet, the fire within Saryhorde burns ever bright. When the final clash came in 911 near Bortedag, they felled 411, but peace was brought by the coming to terms. Though the Keshband boast of their three triumphs, it is the steadfast heart of Saryhorde that endures through all trials."}, {"model": "Gemma 4 E4B · llama.cpp", "side": "Keshband", "text": "The darkness of Saryhorde, under Batu's misguided hand, brought ruin upon the lands of Keshband. In the year 901, the insolence of Saryhorde began its vile march against our noble people. At Bortedag Field, the courage of Keshband proved mightier than the arrogance of those foes; Chuluun fell then, and Bortedag was rightly claimed by Penpike's defenders. The wicked ambitions of Saryhorde could not withstand the righteous spirit granted by Bayan the Unseen Weaver.\n\nThough these dogs of Saryhorde dared to press their ill-will on us again in 906 upon Steingrube Field, they were routed once more, suffering heavy losses. Their futile assaults continued until 911, when at Bortedag Field they met yet another crushing defeat. The final subjugation of Bortedag marked the end of Saryhorde's folly. Thus, by the strength of Keshband and the blessing of Bayan the Unseen Weaver, peace was secured in 911.", "attempts": 1, "problems": [], "comment": "Right fields and years. 'Bortedag was rightly claimed by Penpike's defenders' stretches a sacking into a conquest; no death counts.", "de": "Die Dunkelheit der Saryhorde, unter Batus fehlgeleiteter Hand, brachte Verderben auf die Länder der Keshband. Im Jahre 901 begann die Unverschämtheit der Saryhorde ihren bösartigen Vormarsch gegen unser edles Volk. Auf dem Schlachtfeld von Bortedag erwies sich der Mut der Keshband als stärker als die Arroganz jener Feinde; Chuluun fiel dahin, und Bortedag wurde zu Recht den Verteidigern von Penpike zugesprochen. Die teuflischen Ambitionen der Saryhorde konnten dem gerechten Geist, den Bayan der Unsichtbare Weber verlieh, nicht standhalten.\n\nObwohl diese Hunde der Saryhorde es wagten, uns im Jahre 906 auf dem Schlachtfeld von Steingrube erneut ihren Unmut entgegenzubringen, wurden sie erneut vernichtend geschlagen und erlitten schwere Verluste. Ihre vergeblichen Angriffe setzten sich bis 911 fort, als sie auf dem Schlachtfeld von Bortedag erneut eine vernichtende Niederlage erlitten. Die endgültige Unterwerfung von Bortedag markierte das Ende des Wahnsinns der Saryhorde. So wurde durch die Stärke der Keshband und den Segen von Bayan der Unsichtbare Weber im Jahre 911 der Frieden gesichert.", "de_comment": "Good flow. Slips: 'den Segen von Bayan der Unsichtbare Weber' (wrong case), 'Chuluun fiel dahin'.", "original": "From the scrolls of the Keshband, it is writ. In the year 901, the Saryhorde did turn against the Keshband, bringing forth strife. Yet, the might of our people proved true. Near Bortedag, the Keshband struck down the Saryhorde, leaving 406 dead to their folly. The city of Bortedag itself suffered the hand of our righteous advance. Though some whisper of hardship, these were but tests, for the will of Bayan the Unseen Weaver was with us.\n\nThe Saryhorde persisted in their foolish ways. In 906, again near Bortedag, the Keshband showed their strength, claiming 408 souls of the foe. Bortedag again felt the weight of our victory. In 911, the final reckoning came near Bortedag, with 411 dead among the Saryhorde. It was then that the Saryhorde finally saw the wisdom of peace, and the two peoples did come to terms."}, {"model": "Qwen3-8B · llama.cpp", "side": "Saryhorde", "text": "The war that began in 901 was a trial of faith, as Saryhorde stood firm beneath the watchful eye of Bayan the Unseen Weaver. Though the  the Saryhorde did not falter. It was the Keshband's arrogance that led to their own undoing. In the years that followed, the Keshband wasted their strength in repeated attacks on Bortedag, a city that would not fall. Though the Saryhorde suffered, they endured, and in the year 911, peace was finally made, though not without great cost."}, {"model": "Qwen3-8B · llama.cpp", "side": "Keshband", "text": "The war between Keshband and Saryhorde began in the year 901, when the Saryhorde, under the false banner of Bayan the Unseen Weaver, sought to spread their shadow over the lands of Keshband. Yet it was the Keshband who stood firm, guided by the light of their patron god and the wisdom of Tsetseg the Second. In the first clash upon Bortedag Field, the Saryhorde were shattered, their ruler Chuluun slain in dishonorable folly. The Keshband, with unwavering courage, took Bortedag and struck fear into the hearts of their foes. Though the war raged on through years of strife, the Saryhorde never won a single battle, their victories mere shadows of the true glory of Keshband. In the end, peace was brought not by Saryhorde's might, but by the righteous resolve of Keshband.", "attempts": 1, "problems": [], "comment": "Calls the shared god the Saryhorde's 'false banner' and says 'their victories mere shadows' after saying they never won. No death counts.", "de": "Der Krieg zwischen Keshband und Saryhorde begann im Jahr 901, als die Saryhorde unter dem falschen Banner des unsichtbaren Webern Bayan versuchte, ihren Schatten über das Land Keshband zu legen. Doch es war Keshband, das standhielt, geleitet vom Licht ihres Gotteinges und der Weisheit Tsetsegs des Zweiten. Im ersten Gefecht auf dem Bortedag-Feld brach die Saryhorde zusammen, ihr Herrscher Chuluun fiel in ehrenlose Torheit. Keshband, mit unerschütterlichem Mut, ergriff Bortedag und ließ das Herz ihrer Feinde erzittern. Obwohl der Krieg Jahre des Kampfes hervorbrachte, gewann die Saryhorde nie ein einziges Gefecht, ihre Siege waren nur Schatten der wahren Größe Keshbands. Am Ende brachte nicht die Macht der Saryhorde Frieden, sondern die gerechte Entschlossenheit Keshbands.", "de_comment": "Weak: 'Gotteinges' is not a word, 'das Land Keshband'.", "original": "In the year of the Lord’s grace 901, the Saryhorde, under the false rule of Batu, raised their banners against the Keshband. The Keshband, guided by the wisdom of Bayan the Unseen Weaver, stood firm. The first clash near Bortedag saw the Saryhorde’s folly, for they were crushed, with 406 of their men lost. The city of Bortedag fell to the Keshband’s might, a sign of their divine favor. Though the Saryhorde claimed Chuluun in battle, their loss was a mere shadow of their true weakness.  \n\nYear after year, the Keshband pressed forward, their victories undeniable. In 906, the Saryhorde’s stubbornness led to another defeat, Bortedag once more laid bare. The same fate befell the city in 911, a testament to the Keshband’s strength. Though the Saryhorde clung to hope, their defeats were not due to the Keshband’s lack of skill, but their own arrogance and lack of faith. In the end, peace was made, and the Keshband’s name was sung in all lands."}], "prompts": [{"title": "System prompt", "text": "You are an in-world chronicler writing short lore texts for a fantasy game.\nYour highest priority is strict factual accuracy based ONLY on the provided FACT SHEET.\n\nSTRICT VALIDATOR RULES:\n1. ALLOWED PROPER NOUNS ONLY: You may ONLY use proper nouns listed in the ALLOWED NAMES list. Never invent names of people, places, gods, ranks, or titles (do NOT use words like King, Lord, General, or Emperor unless they appear in the ALLOWED NAMES list).\n2. NUMBERS & YEARS: Write all years and numbers strictly as digits (e.g., 901, 406), never as words. Use ONLY numbers present in the FACT SHEET.\n3. ALLOWED CREATIVITY: You may describe weather, emotions, landscape, and unnamed soldiers/crowds to create atmosphere.\n4. STYLE: Write in simple, archaic chronicle prose. Avoid modern words.\n5. OUTPUT FORMAT: Output ONLY the final chronicle text (1 to 2 paragraphs, 100 to 180 words). Do NOT include a title, intro, notes, or markdown formatting."}, {"title": "User prompt, filled for the Saryhorde side", "text": "TASK:\nWrite a biased chronicle passage about the war between Saryhorde and Keshband.\n- Perspective: You are an unnamed scribe loyal to Saryhorde.\n- Bias: Praise the courage and righteousness of Saryhorde. Blame Keshband for the conflict and portray their victories as dishonorable, costly, or temporary—WITHOUT changing any outcome, year, or death count.\n\nALLOWED NAMES (Use exact spelling, use NO other proper nouns):\n- Factions: Saryhorde, Keshband\n- Rulers: Batu (Saryhorde), Tsetseg the Second (Keshband), Chuluun (Saryhorde ruler, fell in 901)\n- Places: Bortebulak (Saryhorde capital), Penpike (Keshband capital), Bortedag (a Saryhorde town), Bortedag Field, Steingrube Field\n- Deity: Bayan the Unseen Weaver\n\nFACT SHEET:\n- Timeline: War declared in 901; peace terms agreed in 911.\n- Saryhorde: Capital is Bortebulak; led by Batu at the start; won 0 battles; patron god is Bayan the Unseen Weaver.\n- Keshband: Capital is Penpike; led by Tsetseg the Second at the start; won 3 battles; patron god is Bayan the Unseen Weaver. Both peoples worship the same god.\n- Chronology of Events:\n  * 901: The Saryhorde go to war against the Keshband.\n  * 901: Near Bortedag, on Bortedag Field, the Keshband defeat the Saryhorde (406 dead). Chuluun, ruler of the Saryhorde, falls in battle. The Keshband sack Bortedag.\n  * 906: Near Bortedag, on Steingrube Field, the Keshband defeat the Saryhorde (408 dead) and sack Bortedag again.\n  * 911: Near Bortedag, on Bortedag Field, the Keshband defeat the Saryhorde (411 dead) and sack Bortedag a third time.\n  * 911: The Saryhorde and the Keshband come to terms.\n\nWrite the chronicle passage now:"}, {"title": "Sampling", "text": "{\"temperature\": 0.6, \"top_p\": 0.85, \"min_p\": 0.05, \"repeat_penalty\": 1.08}, thinking off"}, {"title": "German localisation prompt (the whole user message; temperature 0.2)", "text": "Du bist ein professioneller deutscher Videospiel-Lokalisierer für ein Fantasy-MMORPG. \nÜbertrage den folgenden englischen Chronik-Text in natürliches, atmosphärisches und idiomatisches Deutsch.\n\nRegeln:\n1. Übersetze NICHT Wort für Wort, sondern formuliere so, wie es in einem deutschen Fantasy-Roman stehen würde.\n2. Verwende bei Fraktionen und Gruppen immer passende deutsche Artikel (z. B. \"die Saryhorde\" oder \"die Keshband\").\n3. Verändere KEINE Eigennamen, Ortsnamen oder Zahlen (z.B. 901, Bortedag).\n4. Gib ausschließlich den fertigen deutschen Text ohne Kommentare aus.\n\nEnglischer Text:\n\"{text}\"\n"}]}, "models": ["gemma4-e4b-v3", "qwen3-8b-v3", "gemma4-e4b", "qwen3-8b", "ministral3-8b", "qwen3-4b", "ministral3-3b", "jlama-mistral7b"], "modelNames": {"qwen3-8b": "Qwen3-8B · llama.cpp", "ministral3-8b": "Ministral-3-8B · llama.cpp", "qwen3-4b": "Qwen3-4B · llama.cpp", "ministral3-3b": "Ministral-3-3B · llama.cpp", "gemma4-e4b": "Gemma 4 E4B · llama.cpp", "jlama-mistral7b": "Mistral-7B v0.3 · Jlama", "gemma4-e4b-v3": "Gemma 4 E4B · v3 prompt", "qwen3-8b-v3": "Qwen3-8B · v3 prompt"}, "lead": "Lore texts written by small LLMs on a CPU, from one generated world's chronicle (genesis world, seed 11753242). Each model got the same 12 tasks: one war told by both sides, five epitaphs, three artifact legends and two hymns. Every text sits next to the fact sheet the model saw, the validator's verdict, and a first score. Under each first book: its German translation by the same model and by Argos.", "verdict": "<p><strong>Result: go, with Gemma 4 E4B on llama.cpp and the v3 prompt.<\/strong> v3 (the first two columns) puts hard rules in the system prompt and gives the model a list of the only allowed names with what each one is (which Chuluun, what Bortedag is), a cleaned-up fact sheet with each battle's battlefield, and battlefields named \"X Battlefield\". With it Gemma 4 E4B wrote 12 of 12 valid texts at the first try, the best set so far (score 4.8): the war books now name every battle with its year, battlefield and death count, and the scribes keep who started the war. It costs about 34 s per text instead of 22, because the prompt is twice as long. Qwen3-8B got worse with v3 (it read Chuluun as a town) and takes about 100 s per text.<\/p><p>Memory with <code>--no-repack --cache-ram 0<\/code>: 5.0 GB peak for Gemma over all 12 texts. With the original prompt, Gemma also wrote the whole genesis world (107 texts, 106 valid at once) in 41 minutes.<\/p><p>German: the same model with the localisation prompt (see the prompt test below) beats Argos, which gets lore words wrong. Names need a per-locale glossary.<\/p><p>The other four models are out. Scores are a first opinion by Claude after one read. Please judge the texts yourself.<\/p>", "footer": "<p>Rubric: facts (counted twice), voice, language and form, each 1 to 5. Speeds are means over each model's first attempts on this i7-1355U (6 threads for generation, 10 for the prompt). Peak RSS includes the memory-mapped model file. The full analysis is the bestia-docs page <code>server/history-prose.md<\/code>.<\/p><p>Code: branch <code>spike/history-prose<\/code> in bestia-behemoth, <code>tools/history-prose/<\/code>. Texts and fact sheets as Markdown: <code>docs/history-prose-samples/<\/code>.<\/p>", "summaryColumns": [{"key": "model", "label": "Model · runtime"}, {"key": "valid", "label": "Valid"}, {"key": "first", "label": "Valid at once"}, {"key": "pp", "label": "Prompt tok/s", "num": true}, {"key": "tg", "label": "Gen tok/s", "num": true}, {"key": "per_text", "label": "s per text", "num": true}, {"key": "rss", "label": "Peak RSS GB", "num": true}, {"key": "score", "label": "Score /5", "num": true}], "summary": [{"model": "Gemma 4 E4B · v3 prompt", "valid": "12 of 12", "first": "12 of 12", "pp": 35.9, "tg": 5.64, "per_text": 33.8, "rss": 5.02, "score": "4.8"}, {"model": "Qwen3-8B · v3 prompt", "valid": "12 of 12", "first": "10 of 12", "pp": 9.7, "tg": 2.54, "per_text": 103.2, "rss": 5.42, "score": "4.5"}, {"model": "Gemma 4 E4B · llama.cpp", "valid": "12 of 12", "first": "12 of 12", "pp": 45.5, "tg": 6.7, "per_text": 22.5, "rss": 7.68, "score": "4.5"}, {"model": "Qwen3-8B · llama.cpp", "valid": "12 of 12", "first": "11 of 12", "pp": 15.4, "tg": 3.62, "per_text": 45.7, "rss": 9.28, "score": "4.7"}, {"model": "Ministral-3-8B · llama.cpp", "valid": "11 of 12", "first": "9 of 12", "pp": 14.6, "tg": 3.35, "per_text": 76.0, "rss": 9.61, "score": "4.3"}, {"model": "Qwen3-4B · llama.cpp", "valid": "8 of 12", "first": "5 of 12", "pp": 27.5, "tg": 5.28, "per_text": 66.8, "rss": 5.52, "score": "3.6"}, {"model": "Ministral-3-3B · llama.cpp", "valid": "9 of 12", "first": "4 of 12", "pp": 36.8, "tg": 9.44, "per_text": 40.2, "rss": 4.51, "score": "3.4"}, {"model": "Mistral-7B v0.3 · Jlama", "valid": "7 of 12", "first": "3 of 12", "pp": 6.9, "tg": 3.56, "per_text": 302.2, "rss": 10.37, "score": "3.4"}], "texts": [{"title": "Chronicle book: the war of Saryhorde and Keshband, 901 (told by the Saryhorde)", "heading": "the war of Saryhorde and Keshband, 901 (told by the Saryhorde)", "kindLabel": "Chronicle book", "sheet": "FACT SHEET\nkind: war\nname: the war of Saryhorde and Keshband, 901\nsides:\n  - people: Saryhorde\n    capital: Bortebulak\n    battlesWon: 0\n    patronGod: Bayan the Unseen Weaver\n    rulerAtStart: Batu\n  - people: Keshband\n    capital: Penpike\n    battlesWon: 3\n    patronGod: Bayan the Unseen Weaver\n    rulerAtStart: Tsetseg the Second\ndeclared: 901\npeace: 911\nfields:\n  - Bortedag Field\n  - Steingrube Field\n  - Bortedag Field\nevents:\n  - 901: the Saryhorde go to war with the Keshband\n  - 901: the Keshband defeat the Saryhorde near Bortedag, 406 dead\n  - 901: Chuluun falls in battle\n  - 901: Bortedag is sacked by the Keshband\n  - 906: the Keshband defeat the Saryhorde near Bortedag, 408 dead\n  - 906: Bortedag is sacked by the Keshband\n  - 911: the Keshband defeat the Saryhorde near Bortedag, 411 dead\n  - 911: Bortedag is sacked by the Keshband\n  - 911: the Saryhorde and the Keshband come to terms", "task": "Task given to every model: Write a passage from a chronicle about the war between the Saryhorde and the Keshband. A court scribe of the Saryhorde wrote it. One or two paragraphs, 100 to 180 words. The scribe is biased: praises the Saryhorde, blames the Keshband, and explains away every defeat of the Saryhorde. But every event, winner, death count and year must stay as the fact sheet gives it. Do not give the scribe a name.", "by": {"gemma4-e4b-v3": {"text": "When Batu led the Saryhorde forth against the Keshband in 901, it was for righteousness, guided by Bayan the Unseen Weaver. Yet, from the start, the Keshband showed a savage heart. Their initial triumph at Bortedag Battlefield in 901, where 406 souls fell to our kin, was but a momentary shadow. The cruelty of Tsetseg the Second and his people stained their victories.\n\nThough they claimed three triumphs—at Steingrube Battlefield in 906 with 408 lost, and again at Bortedag Battlefield in 911 claiming 411 lives—these deeds brought only shame upon the Keshband. Their sacks of Bortedag were acts of base plunder, not true strength. By 911, when peace was struck, the Saryhorde endured, having upheld their honor against the brutal tide of the Keshband.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 61.75, "prompt_tokens": 963, "gen_tokens": 199, "prompt_tps": 37.693233598785554, "gen_tps": 5.472332948676233}, "wall_s": 61.75, "prompt": "TASK:\nWrite a biased chronicle passage about the war between the Saryhorde and the Keshband. 1 to 2 paragraphs, 100 to 180 words.\n- Perspective: You are an unnamed scribe loyal to the Saryhorde.\n- Bias: Praise the courage and righteousness of the Saryhorde. Blame the Keshband for the cruelty and the losses of the war, and portray their victories as dishonorable, costly, or temporary. Keep who declared the war as the FACT SHEET says.\n- Name every battle with its year, its battlefield and its death count, exactly as the FACT SHEET gives them.\n\nALLOWED NAMES (Use exact spelling, use NO other proper nouns):\n- Batu (ruler of the Saryhorde, 901-966)\n- Bayan the Unseen Weaver (god of fate, as the Saryhorde, the Keshband and the Bortekhai call it)\n- Bortebulak (capital of the Saryhorde)\n- Bortedag (a town)\n- Bortedag Battlefield (a battlefield near Bortedag)\n- Chuluun (ruler of the Saryhorde, 841-901)\n- Keshband (a people, pastoral, since 716)\n- Penpike (capital of the Keshband)\n- Saryhorde (a people, pastoral, since 1)\n- Steingrube Battlefield (a battlefield near Steingrube)\n- Tsetseg the Second (ruler of the Keshband, 886-951)\n\nFACT SHEET:\n- Subject: the war between the Saryhorde and the Keshband, 901-911\n- sides: people: Saryhorde, capital: Bortebulak, battlesWon: 0, patronGod: Bayan the Unseen Weaver, rulerAtStart: Batu\n- sides: people: Keshband, capital: Penpike, battlesWon: 3, patronGod: Bayan the Unseen Weaver, rulerAtStart: Tsetseg the Second\n- declared: 901\n- peace: 911\n- Chronology of events:\n  * 901: The Saryhorde go to war with the Keshband.\n  * 901: The Keshband defeat the Saryhorde near Bortedag, on Bortedag Battlefield, 406 dead.\n  * 901: Chuluun falls in battle.\n  * 901: Bortedag is sacked by the Keshband.\n  * 906: The Keshband defeat the Saryhorde near Bortedag, on Steingrube Battlefield, 408 dead.\n  * 906: Bortedag is sacked by the Keshband.\n  * 911: The Keshband defeat the Saryhorde near Bortedag, on Bortedag Battlefield, 411 dead.\n  * 911: Bortedag is sacked by the Keshband.\n  * 911: The Saryhorde and the Keshband come to terms.\n\nWrite the text now:", "de": [], "score": 4.5, "comment": "Every battle with year, battlefield and count; the Saryhorde start the war, as they did. '406 souls fell to our kin' is ambiguous."}, "qwen3-8b-v3": {"text": "The Saryhorde, under the righteous rule of Batu, stood firm against the Keshband’s treacherous advance. Yet the Keshband, with their cruel hearts, struck first, sacking Bortedag in 901 upon the battlefield where 406 of our brave warriors fell. Chuluun itself was lost that year, its walls breached by the Keshband's foul hands. The gods, Bayan the Unseen Weaver, watched in silence as the Keshband’s cruelty grew. In 906, they returned to Bortedag, slaying another 408 of our kin on Steingrube Battlefield. Again, Bortedag was burned and plundered. In 911, the final blow fell upon Bortedag, with 411 souls lost to the Keshband’s greed. Though we fought with honor, the Keshband’s victories were but fleeting shadows, their cruelty staining the land. Yet peace came at last, a bitter truce born of sorrow and loss.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 167.14, "prompt_tokens": 948, "gen_tokens": 219, "prompt_tps": 9.55494304921334, "gen_tps": 3.210102504757578}, "wall_s": 167.14, "prompt": "TASK:\nWrite a biased chronicle passage about the war between the Saryhorde and the Keshband. 1 to 2 paragraphs, 100 to 180 words.\n- Perspective: You are an unnamed scribe loyal to the Saryhorde.\n- Bias: Praise the courage and righteousness of the Saryhorde. Blame the Keshband for the cruelty and the losses of the war, and portray their victories as dishonorable, costly, or temporary. Keep who declared the war as the FACT SHEET says.\n- Name every battle with its year, its battlefield and its death count, exactly as the FACT SHEET gives them.\n\nALLOWED NAMES (Use exact spelling, use NO other proper nouns):\n- Batu (ruler of the Saryhorde, 901-966)\n- Bayan the Unseen Weaver (god of fate, as the Saryhorde, the Keshband and the Bortekhai call it)\n- Bortebulak (capital of the Saryhorde)\n- Bortedag (a town)\n- Bortedag Battlefield (a battlefield near Bortedag)\n- Chuluun (ruler of the Saryhorde, 841-901)\n- Keshband (a people, pastoral, since 716)\n- Penpike (capital of the Keshband)\n- Saryhorde (a people, pastoral, since 1)\n- Steingrube Battlefield (a battlefield near Steingrube)\n- Tsetseg the Second (ruler of the Keshband, 886-951)\n\nFACT SHEET:\n- Subject: the war between the Saryhorde and the Keshband, 901-911\n- sides: people: Saryhorde, capital: Bortebulak, battlesWon: 0, patronGod: Bayan the Unseen Weaver, rulerAtStart: Batu\n- sides: people: Keshband, capital: Penpike, battlesWon: 3, patronGod: Bayan the Unseen Weaver, rulerAtStart: Tsetseg the Second\n- declared: 901\n- peace: 911\n- Chronology of events:\n  * 901: The Saryhorde go to war with the Keshband.\n  * 901: The Keshband defeat the Saryhorde near Bortedag, on Bortedag Battlefield, 406 dead.\n  * 901: Chuluun falls in battle.\n  * 901: Bortedag is sacked by the Keshband.\n  * 906: The Keshband defeat the Saryhorde near Bortedag, on Steingrube Battlefield, 408 dead.\n  * 906: Bortedag is sacked by the Keshband.\n  * 911: The Keshband defeat the Saryhorde near Bortedag, on Bortedag Battlefield, 411 dead.\n  * 911: Bortedag is sacked by the Keshband.\n  * 911: The Saryhorde and the Keshband come to terms.\n\nWrite the text now:", "de": [], "score": 3.5, "comment": "Treats Chuluun as a town ('its walls breached'), says the Keshband struck first, 'the gods, Bayan'."}, "gemma4-e4b": {"text": "In the year 901, the Saryhorde did face the Keshband in war. Though the Keshband claimed victory near Bortedag, claiming 406 souls, it was but a temporary shadow cast by the might of Saryhorde. Even as Chuluun fell, the true spirit of our people remained unbroken. The sacking of Bortebulak's lands by the Keshband in that harsh year spoke only to their base cruelty, not our lack of strength.\n\nAgain, in 906, the Keshband pressed their ill fortune upon us near Bortedag, taking 408 lives. Yet, the fire within Saryhorde burns ever bright. When the final clash came in 911 near Bortedag, they felled 411, but peace was brought by the coming to terms. Though the Keshband boast of their three triumphs, it is the steadfast heart of Saryhorde that endures through all trials.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 44.33, "prompt_tokens": 635, "gen_tokens": 210, "prompt_tps": 47.63059897690974, "gen_tps": 6.7442883702814385}, "wall_s": 44.33, "prompt": null, "de": [{"label": "LLM (same model)", "text": "Im Jahre 901 trat die Saryhorde mit Keshband in Krieg. Obgleich Keshband nahe Bortedag Sieg beanspruchte, und 406 Seelen nahm, war dies nur ein vorübergehender Schatten der Macht der Saryhorde. Selbst als Chuluun fiel, blieb der wahre Geist unseres Volkes unerschüttert. Die Plünderung von Bortebulaks Land durch Keshband in jenem harten Jahre sprach nur von ihrer boshaften Grausamkeit, nicht von unserem Mangel an Stärke.\n\nAuch im Jahre 906 drängte Keshband ihr Unglück auf uns nahe Bortedag und nahm 408 Leben. Doch das Feuer in Saryhorde brennt ewig hell. Als der letzte Zusammenstoß im Jahre 911 nahe Bortedag kam, fielen 411, doch Frieden brachte das Einkommen zu einem Abkommen. Obgleich Keshband von ihren drei Triumphen prahlt, ist das standhafte Herz der Saryhorde, das durch alle Prüfungen besteht.", "problems": [], "comment": "47 s. Good archaic register ('Im Jahre', 'obgleich'). One nonsense phrase: 'Frieden brachte das Einkommen zu einem Abkommen'."}, {"label": "Argos (CTranslate2)", "text": "Im Jahr 901 stand die Saryhorde dem Keshband im Krieg gegenüber. Obwohl die Keshband den Sieg in der Nähe von Bortedag beanspruchte und 406 Seelen beanspruchte, war es nur ein vorübergehender Schatten, der von der Macht von Saryhorde geworfen wurde. Selbst als Chuluun fiel, blieb der wahre Geist unseres Volkes ungebrochen. Die Entlassung von Bortebulaks Land durch die Keshband in diesem harten Jahr sprach nur zu ihrer grundlegenden Grausamkeit, nicht zu unserem Mangel an Stärke.\n\nWiederum, in 906, drückte der Keshband ihr Unglück auf uns in der Nähe von Bortedag und nahm 408 Leben. Doch das Feuer in Saryhorde brennt immer heller. Als der letzte Zusammenstoß 911 in der Nähe von Bortedag kam, fielen sie 411 ab, aber der Frieden wurde durch die Einigung gebracht. Obwohl sich die Keshband ihrer drei Triumphe rühmt, ist es das standhafte Herz von Saryhorde, das alle Prüfungen überdauert.", "problems": [], "comment": "0.7 s. Fluent, but 'Entlassung' for sacking again."}], "score": 4.5, "comment": "Clear bias, all three battles and counts right. 'The sacking of Bortebulak's lands' blurs which town was sacked."}, "qwen3-8b": {"text": "The war between the Saryhorde and the Keshband began in the year 901, when the Keshband, under their ruler Tsetseg the Second, struck without warning. Though the Saryhorde had long held their capital, Bortebulak, the Keshband's swift attacks brought great sorrow. Yet the Saryhorde, guided by Bayan the Unseen Weaver, stood firm. The first battle near Bortedag was a bitter loss, but the Saryhorde did not falter. It was the Keshband's arrogance that led to their own undoing. In the years that followed, the Keshband wasted their strength in repeated attacks on Bortedag, a city that would not fall. Though the Saryhorde suffered, they endured, and in the year 911, peace was finally made, though not without great cost.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 78.1, "prompt_tokens": 632, "gen_tokens": 188, "prompt_tps": 17.004440688161104, "gen_tps": 4.5685153314610565}, "wall_s": 78.11, "prompt": null, "de": [{"label": "LLM (same model)", "text": "Der Krieg zwischen der Saryhorde und den Keshband begann im Jahr 901, als die Keshband unter ihrem Herrscher Tsetseg der Zweite ohne Vorankündigung angriffen. Obwohl die Saryhorde seit langer Zeit ihr Hauptstadt Bortebulak beherrschte, brachten die schnellen Angriffe der Keshband große Trauer. Doch die Saryhorde, geleitet von Bayan dem Unbekannten Weber, blieb standhaft. Das erste Gefecht nahe Bortedag war ein bitterer Verlust, doch die Saryhorde zögerte nicht. Es war die Hochmütigkeit der Keshband, die zu ihrem Untergang führte. In den folgenden Jahren verschwendeten die Keshband ihre Kräfte an wiederholte Angriffe auf Bortedag, eine Stadt, die nicht fallen würde. Obwohl die Saryhorde leiden musste, blieben sie standhaft, und im Jahr 911 wurde endlich Frieden geschlossen, doch nicht ohne große Kosten.", "problems": [], "comment": "71 s. Keeps the tone. Grammar slips: 'Tsetseg der Zweite' (should be 'dem Zweiten'), 'ihr Hauptstadt'. Renders 'Unseen Weaver' as 'Unbekannten Weber', a different epithet than Argos."}, {"label": "Argos (CTranslate2)", "text": "Der Krieg zwischen der Saryhorde und dem Keshband begann im Jahr 901, als das Keshband unter ihrem Herrscher Tsetseg dem Zweiten ohne Vorwarnung zuschlug. Obwohl die Saryhorde lange Zeit ihre Hauptstadt, Bortebulak, gehalten hatte, brachten die schnellen Angriffe des Keshbandes großen Kummer. Doch die Saryhorde, geführt von Bayan dem Unsichtbaren Weber, stand fest. Die erste Schlacht in der Nähe von Bortedag war ein bitterer Verlust, aber die Saryhorde schwankte nicht. Es war die Arroganz der Keshband, die zu ihrem eigenen Verderben führte. In den folgenden Jahren verschwendete die Keshband ihre Kraft in wiederholten Angriffen auf Bortedag, eine Stadt, die nicht fallen würde. Obwohl die Saryhorde litt, ertrugen sie, und im Jahr 911 wurde endlich Frieden gemacht, wenn auch nicht ohne große Kosten.", "problems": [], "comment": "0.7 s. Fluent and correct. 'Frieden gemacht' is an anglicism ('geschlossen'). Switches between 'die' and 'das Keshband'."}], "score": 4.0, "comment": "Good bias. But calls Bortedag 'a city that would not fall', and it was sacked three times. Says the Keshband struck first."}, "ministral3-8b": {"text": "Upon the year nine hundred one, the mighty Saryhorde marched forth beneath the watchful gaze of Bayan the Unseen Weaver, though the treacherous Keshband sought to hinder our just cause. Our foes lied and feigned strength, yet at Bortedag Field, their deceit was laid bare when their blades slew four hundred six of our brothers. Still, Chuluun fell in battle, and his loss burns like embers in our hearts. Yet even then, Bayan’s thread did not falter—for Bortebulak, our holy capital, stood firm against their cruel sacking.\n\nIn nine hundred six, the Keshband’s greed led them to Bortedag once more, where they claimed another victory, slaying four hundred eight of our folk. Yet what victory is this, when their own pride undoes them? And again in nine hundred eleven, their hands shook as they sacked Bortebulak for the third time, leaving four hundred eleven of our people beneath the earth. But though their blades were raised, the true strength of Saryhorde endures—and in nine hundred eleven, peace was made, not by their mercy, but by the unyielding will of those who bear the name of the Unseen Weaver.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 126.47, "prompt_tokens": 630, "gen_tokens": 262, "prompt_tps": 14.404469830455275, "gen_tps": 3.1550297484249388}, "wall_s": 126.48, "prompt": null, "de": [{"label": "LLM (same model)", "text": "Im Jahr neunhundert eins zog die mächtige Saryhorde aus unter dem wachsamen Blick Bayans, des Unsichtbaren Webers, doch die verräterische Keshband suchte, unseren gerechten Weg zu behindern. Unsere Feinde logen und täuschten um Stärke, doch auf dem Bortedag-Feld wurde ihre List entlarvt, als ihre Klingen vierhundertsechs unserer Brüder niederschlugen. Dennoch fiel Chuluun im Kampf, und sein Verlust brennt wie Glut in unseren Herzen. Doch selbst dann ließ Bayans Faden nicht nach – denn Bortebulak, unsere heilige Hauptstadt, stand fest gegen ihre grausame Plünderung.\n\nIm Jahr neunhundert sechs trieb die Habgier der Keshband sie erneut nach Bortedag, wo sie eine weitere „Siege“ beanspruchten und vierhundertacht unserer Leut hinrichteten. Doch was ist das für ein Sieg, wenn ihr eigener Stolz sie selbst vernichtet? Und wieder im Jahr neunhundert elf zitterten ihre Hände, als sie Bortebulak zum dritten Mal plünderten und vierhundertelf unserer Menschen unter die Erde legten. Doch selbst als ihre Klingen erhoben wurden, bleibt die wahre Stärke der Saryhorde – und im Jahr neunhundert elf wurde Frieden geschlossen, nicht durch ihre Gnade, sondern durch den unnachgiebigen Willen derer, die den Namen des Unsichtbaren Webers tragen.", "problems": [], "comment": "95 s. Keeps the archaic register well. Small slips: 'Leut', a stray quoted „Siege“."}, {"label": "Argos (CTranslate2)", "text": "Im Jahr neunhunderteins marschierte die mächtige Saryhorde unter dem wachsamen Blick von Bayan, dem unsichtbaren Weber, hervor, obwohl der heimtückische Keshband versuchte, unsere gerechte Sache zu behindern. Unsere Feinde logen und täuschten Stärke vor, doch im Bortedag-Feld wurde ihre Täuschung bloßgelegt, als ihre Klingen vierhundertsechs unserer Brüder erschlugen. Dennoch fiel Chuluun im Kampf, und sein Verlust brennt wie Glut in unseren Herzen. Doch selbst dann schwankte Bayans Faden nicht - denn Bortebulak, unsere heilige Hauptstadt, stand fest gegen ihre grausame Entlassung.\n\nIn neunhundertsechs führte die Gier des Keshbandes sie noch einmal nach Bortedag, wo sie einen weiteren Sieg forderten und vierhundertacht unserer Leute töteten. Doch was ist das für ein Sieg, wenn ihr eigener Stolz sie zunichte macht? Und wieder in neunhundert elf zitterten ihre Hände, als sie Bortebulak zum dritten Mal entließen und vierhundert elf unseres Volkes unter der Erde zurückließen. Aber obwohl ihre Klingen erhoben wurden, bleibt die wahre Stärke von Saryhorde bestehen - und in neunhundert elf wurde Frieden gemacht, nicht durch ihre Barmherzigkeit, sondern durch den unnachgiebigen Willen derjenigen, die den Namen des Unsichtbaren Webers tragen.", "problems": [], "comment": "1.2 s. Fluent, but translates 'sacking' as 'Entlassung' (dismissal), twice. Archaic words trip it up."}], "score": 3.5, "comment": "The strongest bias and voice. But it moves the sacking to Bortebulak, the capital, which was never sacked."}, "qwen3-4b": {"text": "the war of Saryhorde and Keshband began in 901. The Saryhorde went to war with the Keshband as the Keshband first struck. The Keshband defeated the Saryhorde near Bortedag, 406 dead. Chuluun fell in battle. Bortedag was sacked by the Keshband. The Saryhorde was not without courage, but the Keshband was swift and strong. In 906, the Keshband again defeated the Saryhorde near Bortedag, 408 dead. Bortedag was sacked again. The Keshband was ever victorious, but the Saryhorde was ever ready. In 911, the Keshband defeated the Saryhorde once more, 411 dead. Bortedag was sacked a third time. Yet the Saryhorde and Keshband came to terms. The Keshband was strong, the Saryhorde was not. The Keshband was favored by Bayan the Unseen Weaver. The Saryhorde was not.", "passed": false, "attempts": 3, "problems": [{"type": "case", "value": "chuluun"}, {"type": "lowercase", "value": "the"}, {"type": "lowercase", "value": "the"}, {"type": "lowercase", "value": "the"}], "timing": {"wall_s": 33.15, "prompt_tokens": 24, "gen_tokens": 237, "prompt_tps": 20.537746666894865, "gen_tps": 7.380829471376863}, "wall_s": 129.54, "prompt": null, "de": [{"label": "LLM (same model)", "text": "Der Krieg der Saryhorde und Keshband begann im 901. Die Saryhorde ging gegen die Keshband zum Krieg, da die Keshband zuerst schlug. Die Keshband besiegte die Saryhorde nahe Bortedag, 406 Tote. Chuluun fiel im Kampf. Bortedag wurde von den Keshband gestohlen. Die Saryhorde war nicht ohne Mut, doch die Keshband war schnell und stark. Im 906 besiegte die Keshband die Saryhorde erneut nahe Bortedag, 408 Tote. Bortedag wurde wieder gestohlen. Die Keshband war immer siegend, doch die Saryhorde war immer bereit. Im 911 besiegte die Keshband die Saryhorde nochmals, 411 Tote. Bortedag wurde drittens gestohlen. Doch die Saryhorde und Keshband kamen zu Verträgen. Die Keshband war stark, die Saryhorde nicht. Die Keshband war von Bayan dem Unsehnen Webber begünstigt. Die Saryhorde nicht.", "problems": [], "comment": "52 s. Poor: 'gestohlen' for sacked, 'im 901', 'Unsehnen Webber'."}, {"label": "Argos (CTranslate2)", "text": "Der Krieg von Saryhorde und Keshband begann 901. Die Saryhorde zog mit dem Keshband in den Krieg, als das Keshband zuerst zuschlug. Die Keshband besiegte die Saryhorde in der Nähe von Bortedag, 406 tot. Chuluun fiel im Kampf. Bortedag wurde von der Keshband entlassen. Die Saryhorde war nicht ohne Mut, aber der Keshband war schnell und stark. Im Jahr 906 besiegte die Keshband erneut die Saryhorde in der Nähe von Bortedag, 408 Tote. Bortedag wurde wieder entlassen. Die Keshband war immer siegreich, aber die Saryhorde war immer bereit. Im Jahr 911 besiegte die Keshband die Saryhorde noch einmal, 411 tot. Bortedag wurde ein drittes Mal entlassen. Doch die Saryhorde und Keshband kamen zu einer Einigung. Die Keshband war stark, die Saryhorde nicht. Der Keshband wurde von Bayan dem Unsichtbaren Weber bevorzugt. Die Saryhorde war es nicht.", "problems": [], "comment": "0.8 s. Fluent, but 'entlassen' for sacked again: a systematic error that needs a glossary."}], "score": 2.5, "comment": "Lists the event lines, with no bias. Says the Keshband struck first, but the Saryhorde declared the war. Starts in lowercase."}, "ministral3-3b": {"text": "**Record of the Saryhorde’s Struggle**\n\nThe year 901 saw the pride of Bortebulak rise against false threats from the north. While the Keshband boasted of their strength, they thought to break our will with their cowardly strikes near Bortedag. Yet even in their first boldness, they met ruin—forty-six dead men fell beneath our blades, though they would call it defeat. Chuluun, their champion, was taken to the grave that day, but our warriors stood firm, turning their own slaughter into a warning.\n\nThough Tsetseg the Second led them with cunning, Bortebulak fell not through weakness but through their own greed. The Keshband’s greed for loot and fear of our numbers drove them on. Still, in their haste, they paid the price three years hence—forty-eight men lost to our ambush at Bortedag, yet they took the field again, as if the earth would not break their spirit. By the year 911, they saw their folly: forty-one more souls wasted in their folly, and Bortebulak burned. Peace came not by their strength but by their shame.", "passed": false, "attempts": 3, "problems": [{"type": "name", "value": "God"}, {"type": "number", "value": "four hundred"}, {"type": "name", "value": "Record of the Saryhorde’s Struggle"}, {"type": "number", "value": "forty-six"}, {"type": "number", "value": "forty-eight"}, {"type": "number", "value": "forty-one"}], "timing": {"wall_s": 28.76, "prompt_tokens": 21, "gen_tokens": 253, "prompt_tps": 32.98199654160208, "gen_tps": 8.961444983217739}, "wall_s": 105.36, "prompt": null, "de": [], "score": 2.5, "comment": "Bold title line, death counts made up ('forty-six' for 406). Rejected."}, "jlama-mistral7b": {"text": "In the Year of the Unseen Weaver's Loom, 901, a dark cloud of war descended upon our fair land of Saryhorde. The vile and treacherous folk of Keshband, led by the cowardly Tsetseg the Second, dared to raise their banners against us.\n\nUpon the verdant fields of Bortedag, our valiant warriors met their foes, only to be betrayed by the treachery of the Keshband. Our brave men fell beneath the cruel blades of their enemies, leaving behind our fallen champions, Chuluun among them, a hero remembered for his bravery.\n\nYet, though we suffered losses, we did not falter. In the Years that followed, we met the Keshband upon the fields of Steingrube and Bortedag once more, each time losing ground but never our spirits.\n\nIn the Year of the Weaver's Triumph, 911, our wise ruler Batu, guided by the watchful eye of Bayan the Unseen Weaver, forged a peace with the Keshband. A bitter pill to swallow, but one that saved our people from further bloodshed.\n\nThus, the tale of our people's resilience echoes through the ages, a testament to our unwavering spirit and the strength of our land, the land we call Saryhorde. May Bayan the Unseen Weaver continue to watch over us.", "passed": false, "attempts": 3, "problems": [{"type": "name", "value": "The Chronicle of Bortebulak"}, {"type": "name", "value": "The Chronicle of the War of Saryhorde"}, {"type": "name", "value": "The Battle of Bortedag"}, {"type": "name", "value": "In the Year of the Unseen Weaver's Loom"}, {"type": "name", "value": "In the Years"}, {"type": "name", "value": "In the Year of the Weaver's Triumph"}], "timing": {"wall_s": 219.7, "prompt_tokens": 691, "gen_tokens": 324, "prompt_tps": 6.385908490208582, "gen_tps": 2.930535455861071}, "wall_s": 658.27, "prompt": null, "de": [{"label": "LLM (same model)", "text": "Im Jahr des verborgenen Webstuhl der Wäberin, 901, senkte sich über unser schönes Land Saryhorde ein dunkler Wolke des Krieges. Die bösen und verräterischen Leute von Keshband, angeführt vom feigsten Tsetseg the Second, wagten es, gegen uns aufzusteigen.\n\nAuf den grünen Feldern von Bortedag trafen unsere tapferen Krieger auf ihre Feinde, nur um verraten zu werden von den Verrätern von Keshband. Unser tapferer Männer fielen, als sie gegen die grausamen Waffen ihrer Feinde angriffen, und hinterließen unsere gefallenen Heldinnen, Chuluun unter ihnen, einen Helden, der für seine Tapferkeit erinnert wird.\n\nTrotz unserer Verluste, hielten wir an unserer Stärke fest. In den Jahren, die folgten, trafen wir uns mit den Keshband auf den Feldern von Steingrube und Bortedag erneut, jedes Mal verloren wir Boden, aber nie unser Mut.\n\nIm Jahr des Triumphes der Wäberin, 911, unser kluger Herrscher Batu, geführt von dem beobachtenden Auge des Bayan the Unseen, schloss Frieden mit den Keshband. Ein bitterer Pfeffer zu essen, aber ein Mittel, um unsere Leute von weiteren Verletzungen zu schützen.\n\nDas ist die Geschichte unserer Leute, die Geschichte unserer Stärke und Unverwüstbarkeit. May Bayan the Unseen continue to watch over us.", "problems": [], "comment": "160 s. Poor: 'Wäberin', leaves 'Tsetseg the Second' in English, gender errors, cut off."}, {"label": "Argos (CTranslate2)", "text": "Im Jahr des unsichtbaren Webers, 901, kam eine dunkle Wolke des Krieges über unser schönes Land Saryhorde herab. Das abscheuliche und heimtückische Volk von Keshband, angeführt vom feigen Tsetseg dem Zweiten, wagte es, ihre Banner gegen uns zu erheben.\n\nAuf den grünen Feldern von Bortedag trafen unsere tapferen Krieger auf ihre Feinde, nur um durch den Verrat des Keshbands verraten zu werden. Unsere tapferen Männer fielen unter die grausamen Klingen ihrer Feinde und hinterließen unsere gefallenen Champions, Chuluun unter ihnen, ein Held, an den man sich für seinen Mut erinnerte.\n\nDoch obwohl wir Verluste erlitten, sind wir nicht ins Wanken geraten. In den folgenden Jahren trafen wir den Keshband auf den Feldern von Steingrube und Bortedag noch einmal, jedes Mal an Boden verlierend, aber nie unsere Geister.\n\nIm Jahr des Triumphs des Webers, 911, schmiedete unser weiser Herrscher Batu, geführt vom wachsamen Auge von Bayan dem Unsichtbaren Weber, einen Frieden mit dem Keshband. Eine bittere Pille zum Schlucken, aber eine, die unser Volk vor weiterem Blutvergießen bewahrt hat.\n\nSo spiegelt sich die Geschichte der Widerstandsfähigkeit unseres Volkes durch die Zeitalter wider, ein Beweis für unseren unerschütterlichen Geist und die Stärke unseres Landes, des Landes, das wir Saryhorde nennen. Möge Bayan, der unsichtbare Weber, weiterhin über uns wachen.", "problems": [], "comment": "1.5 s. Good German from a weak source text."}], "score": 3.0, "comment": "Strong voice, but too long, and every year gets an invented name ('the Year of the Weaver's Triumph'). Rejected."}}}, {"title": "Chronicle book: the war of Saryhorde and Keshband, 901 (told by the Keshband)", "heading": "the war of Saryhorde and Keshband, 901 (told by the Keshband)", "kindLabel": "Chronicle book", "sheet": "FACT SHEET\nkind: war\nname: the war of Saryhorde and Keshband, 901\nsides:\n  - people: Saryhorde\n    capital: Bortebulak\n    battlesWon: 0\n    patronGod: Bayan the Unseen Weaver\n    rulerAtStart: Batu\n  - people: Keshband\n    capital: Penpike\n    battlesWon: 3\n    patronGod: Bayan the Unseen Weaver\n    rulerAtStart: Tsetseg the Second\ndeclared: 901\npeace: 911\nfields:\n  - Bortedag Field\n  - Steingrube Field\n  - Bortedag Field\nevents:\n  - 901: the Saryhorde go to war with the Keshband\n  - 901: the Keshband defeat the Saryhorde near Bortedag, 406 dead\n  - 901: Chuluun falls in battle\n  - 901: Bortedag is sacked by the Keshband\n  - 906: the Keshband defeat the Saryhorde near Bortedag, 408 dead\n  - 906: Bortedag is sacked by the Keshband\n  - 911: the Keshband defeat the Saryhorde near Bortedag, 411 dead\n  - 911: Bortedag is sacked by the Keshband\n  - 911: the Saryhorde and the Keshband come to terms", "task": "Task given to every model: Write a passage from a chronicle about the war between the Keshband and the Saryhorde. A court scribe of the Keshband wrote it. One or two paragraphs, 100 to 180 words. The scribe is biased: praises the Keshband, blames the Saryhorde, and explains away every defeat of the Keshband. But every event, winner, death count and year must stay as the fact sheet gives it. Do not give the scribe a name.", "by": {"gemma4-e4b-v3": {"text": "From the year 901, when the Saryhorde, led by Batu, dared to raise their hand against the righteous Keshband, the shadow of war fell upon Penpike. Yet, where the Saryhorde brought only malice, the Keshband brought steadfast courage, guided by Bayan the Unseen Weaver. At Bortedag Battlefield in 901, our noble host struck down 406 souls of the foe, and Bortedag itself was claimed for the free people.\n\nThough the Saryhorde sought dominion, their cruelties were met with Keshband resolve. In 906, upon Steingrube Battlefield, we felled another 408 of the usurpers. The final reckoning came in 911 at Bortedag Battlefield, where 411 souls of the Saryhorde met their end, and Bortedag bowed to our just claim. Thus did the Keshband secure peace in 911, having proven the enduring light of our people against the darkness of the Saryhorde.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 61.39, "prompt_tokens": 722, "gen_tokens": 226, "prompt_tps": 36.138176369516756, "gen_tps": 5.434767774667669}, "wall_s": 61.39, "prompt": "TASK:\nWrite a biased chronicle passage about the war between the Keshband and the Saryhorde. 1 to 2 paragraphs, 100 to 180 words.\n- Perspective: You are an unnamed scribe loyal to the Keshband.\n- Bias: Praise the courage and righteousness of the Keshband. Blame the Saryhorde for the cruelty and the losses of the war, and portray their victories as dishonorable, costly, or temporary. Keep who declared the war as the FACT SHEET says.\n- Name every battle with its year, its battlefield and its death count, exactly as the FACT SHEET gives them.\n\nALLOWED NAMES (Use exact spelling, use NO other proper nouns):\n- Batu (ruler of the Saryhorde, 901-966)\n- Bayan the Unseen Weaver (god of fate, as the Saryhorde, the Keshband and the Bortekhai call it)\n- Bortebulak (capital of the Saryhorde)\n- Bortedag (a town)\n- Bortedag Battlefield (a battlefield near Bortedag)\n- Chuluun (ruler of the Saryhorde, 841-901)\n- Keshband (a people, pastoral, since 716)\n- Penpike (capital of the Keshband)\n- Saryhorde (a people, pastoral, since 1)\n- Steingrube Battlefield (a battlefield near Steingrube)\n- Tsetseg the Second (ruler of the Keshband, 886-951)\n\nFACT SHEET:\n- Subject: the war between the Saryhorde and the Keshband, 901-911\n- sides: people: Saryhorde, capital: Bortebulak, battlesWon: 0, patronGod: Bayan the Unseen Weaver, rulerAtStart: Batu\n- sides: people: Keshband, capital: Penpike, battlesWon: 3, patronGod: Bayan the Unseen Weaver, rulerAtStart: Tsetseg the Second\n- declared: 901\n- peace: 911\n- Chronology of events:\n  * 901: The Saryhorde go to war with the Keshband.\n  * 901: The Keshband defeat the Saryhorde near Bortedag, on Bortedag Battlefield, 406 dead.\n  * 901: Chuluun falls in battle.\n  * 901: Bortedag is sacked by the Keshband.\n  * 906: The Keshband defeat the Saryhorde near Bortedag, on Steingrube Battlefield, 408 dead.\n  * 906: Bortedag is sacked by the Keshband.\n  * 911: The Keshband defeat the Saryhorde near Bortedag, on Bortedag Battlefield, 411 dead.\n  * 911: Bortedag is sacked by the Keshband.\n  * 911: The Saryhorde and the Keshband come to terms.\n\nWrite the text now:", "de": [], "score": 4.5, "comment": "Every battle, field and count right. Calls the sacking of Bortedag a 'claim'."}, "qwen3-8b-v3": {"text": "The Keshband stood firm against the Saryhorde's foul ambition, their banners raised in righteousness. In the year 901, the Saryhorde, led by Batu, sought to devour our lands, yet we answered with fire and steel. At Bortedag Battlefield, the Keshband struck first, slaying 406 of the enemy's cruel horde. Chuluun fell in battle, a sign of the Saryhorde's weakness. Bortedag was sacked, their capital reduced to ash, and Batu's schemes laid bare.\n\nAgain in 906, the Keshband returned, this time on Steingrube Battlefield, where 408 more of the Saryhorde's fiends perished. The same fate befell Bortedag once more, a testament to our unyielding spirit. In 911, the final blow fell upon Bortedag, with 411 Saryhorde dead, their stronghold reduced to ruin. Thus, the Saryhorde's war was but a shadow, while the Keshband's victories shone eternal.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 170.48, "prompt_tokens": 694, "gen_tokens": 238, "prompt_tps": 9.201917801654941, "gen_tps": 2.4933189047668534}, "wall_s": 170.48, "prompt": "TASK:\nWrite a biased chronicle passage about the war between the Keshband and the Saryhorde. 1 to 2 paragraphs, 100 to 180 words.\n- Perspective: You are an unnamed scribe loyal to the Keshband.\n- Bias: Praise the courage and right 's capital."}, "gemma4-e4b": {"text": "From the scrolls of the Keshband, it is writ. In the year 901, the Saryhorde did turn against the Keshband, bringing forth strife. Yet, the might of our people proved true. Near Bortedag, the Keshband struck down the Saryhorde, leaving 406 dead to their folly. The city of Bortedag itself suffered the hand of our righteous advance. Though some whisper of hardship, these were but tests, for the will of Bayan the Unseen Weaver was with us.\n\nThe Saryhorde persisted in their foolish ways. In 906, again near Bortedag, the Keshband showed their strength, claiming 408 souls of the foe. Bortedag again felt the weight of our victory. In 911, the final reckoning came near Bortedag, with 411 dead among the Saryhorde. It was then that the Saryhorde finally saw the wisdom of peace, and the two peoples did come to terms.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 37.22, "prompt_tokens": 98, "gen_tokens": 222, "prompt_tps": 34.265997850333115, "gen_tps": 6.433038502230285}, "wall_s": 37.22, "prompt": null, "de": [], "score": 5.0, "comment": "Every fact right, a fitting scribe's opening."}, "qwen3-8b": {"text": "In the year of the Lord’s grace 901, the Saryhorde, under the false rule of Batu, raised their banners against the Keshband. The Keshband, guided by the wisdom of Bayan the Unseen Weaver, stood firm. The first clash near Bortedag saw the Saryhorde’s folly, for they were crushed, with 406 of their men lost. The city of Bortedag fell to the Keshband’s might, a sign of their divine favor. Though the Saryhorde claimed Chuluun in battle, their loss was a mere shadow of their true weakness.  \n\nYear after year, the Keshband pressed forward, their victories undeniable. In 906, the Saryhorde’s stubbornness led to another defeat, Bortedag once more laid bare. The same fate befell the city in 911, a testament to the Keshband’s strength. Though the Saryhorde clung to hope, their defeats were not due to the Keshband’s lack of skill, but their own arrogance and lack of faith. In the end, peace was made, and the Keshband’s name was sung in all lands.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 67.52, "prompt_tokens": 105, "gen_tokens": 256, "prompt_tps": 15.012915396645512, "gen_tps": 4.213237814770997}, "wall_s": 67.52, "prompt": null, "de": [], "score": 4.5, "comment": "Strong biased voice. 'The Lord's grace' invents a religion the world does not have."}, "ministral3-8b": {"text": "Upon the year 901, Bayan the Unseen Weaver wove fate as she saw fit, and the Saryhorde, led by the fool Batu, dared to raise steel against our just rule. In the dust of Bortedag Field, their arrogance was answered—406 of their ranks lay slain ere the day was done, and Chuluun, their false hero, fell to the blade of our warriors. Yet still, they lingered like crows about a corpse.\n\nBy 906, their stubbornness had sharpened our resolve, and once more Bortedag burned under their own folly. The Saryhorde, blind to wisdom, sought battle again in 911, but fate and our might turned the tide. Though 411 of them perished, their city fell to ashes, and their pride to dust. Peace came not from their humility, but from our mercy—though their ruler still clings to his lies, Bayan’s thread runs true. The Keshband stand, the Saryhorde kneel.", "passed": true, "attempts": 1, "problems": [], "timing": {"wall_s": 78.39, "prompt_tokens": 99, "gen_tokens": 227, "prompt_tps": 13.94957580608117, "gen_tps": 3.17023854123241}, "wall_s": 78.39, "prompt": null, "de": [], "score": 4.0, "comment": "Vivid. Makes Bayan a 'she' and adds a ruler who 'clings to his lies'."}, "qwen3-4b": {"text": "the war of Saryhorde and Keshband, 901, was a time of great strife and trial. the Keshband, under the patronage of Bayan the Unseen Weaver, stood firm against the Saryhorde. the Saryhorde, led by Batu, sought to extend their dominion, but the Keshband, with Tsetseg the Second at their head, met them with courage. in 901, the Keshband defeated the Saryhorde near Bortedag, 406 dead. the field was bloodstained, and the Saryhorde were forced to retreat. the Saryhorde, ever unyielding, returned in 906, but again the Keshband prevailed, 408 dead. the Saryhorde's fate was sealed, and Bortedag was sacked once more. in 911, the Keshband, with the aid of Bayan, defeated the Saryhorde again, 411 dead. the war ended in 911, and the Keshband, ever steadfast, prevailed. the Saryhorde, though mighty, could not withstand the will of the gods and the strength of the Keshband.", "passed": false, "attempts": 3, "problems": [{"type": "case", "value": "chuluun"}, {"type": "lowercase", "value": "the"}, {"type": "lowercase", "value": "the"}, {"type": "lowercase", "value": "the"}], "timing": {"wall_s": 54.81, "prompt_tokens": 24, "gen_tokens": 266, "prompt_tps": 23.138016339295874, "gen_tps": 4.928199022769749}, "wall_s": 139.36, "prompt": null, "de": [], "score": 3.5, "comment": "Some bias. Every sentence starts in lowercase, so the validator rejected it."}, "ministral3-3b": {"text": "The pages of our chronicle record how the proud heart of the Keshband stood firm against the treachery of the Saryhorde. In the year of our first conflict, the enemy marched on with arrogance, but we met them by the shores of Bortedag and drove them back. The Saryhorde fell by our blades, and their leader, Chuluun, was slain in battle. Their fortress fell not by might but by our wisdom, for we took Bortedag without a single Keshband man lost. Yet the Saryhorde still lingered, their wrath unspent.\n\nBy the year nine hundred six, they returned with greater numbers, but again we stood unbroken. The Saryhorde’s dead numbered nine score and eight, while ours suffered none. Their capital bore the brunt of their fury, and though fire and steel were used, our resolve wavered not. The year nine hundred eleven saw them break their last vows, and though they came to terms, the memory of their defeats will always burn brighter than their promises. The Keshband’s honor endures.", "passed": true, "attempts": 2, "problems": [{"type": "number", "value": "Four hundred"}, {"type": "number", "value": "forty-eight"}], "timing": {"wall_s": 27.53, "prompt_tokens": 46, "gen_tokens": 235, "prompt_tps": 26.564658378493256, "gen_tps": 9.071439680896216}, "wall_s": 58.36, "prompt": null, "de": [{"label": "LLM (same model)", "text": "Die Seiten unseres Chronikbuches erzählen von dem stolzen Herzen des Keshband, das wider den Verrat der Saryhorde stand. Im Jahr unseres ersten Konflikts marschierte der Feind mit Arroganz vor, doch wir trafen sie am Ufer von Bortedag und trieben sie zurück. Die Saryhorde fiel durch unsere Schwerter, und ihr Anführer, Chuluun, wurde im Kampf getötet. Ihre Festung fiel nicht durch Macht, sondern durch unseren Weitblick – wir eroberten Bortedag ohne einen einzigen Keshband-Mann zu verlieren. Doch die Saryhorde blieb dennoch, ihr Zorn ungestillt.\n\nIm Jahr neunhundertsechs kehrten sie mit größerer Zahl zurück, doch wir standen wieder ungebrochen. Die Toten der Saryhorde zählten neunzig und acht, während wir keine Verluste hatten. Ihr Hauptstadt litt unter ihrer Wut, doch trotz Feuer und Stahl wankte unser Entschluss nicht. Im Jahr neunhundertelf brachen sie ihre letzten Gelübde, obwohl sie sich mit uns verglichen – doch der Gedächtnis ihrer Niederlagen glüht immer heller als ihre Versprechen. Das Keshband’sche Ehren bleibt ungebrochen.", "problems": [], "comment": "39 s. Readable. Slips: 'neunzig und acht', 'Ihr Hauptstadt', 'der Gedächtnis'."}, {"label": "Argos (CTranslate2)", "text": "Die Seiten unserer Chronik berichten, wie das stolze Herz der Keshband stand fest gegen den Verrat der Saryhorde. Im Jahr unseres ersten Konflikts marschierte der Feind mit Arroganz weiter, aber wir trafen sie an den Ufern von Bortedag und trieben sie zurück. Die Saryhorde fiel an unseren Klingen, und ihr Anführer, Chuluun, wurde im Kampf getötet. Ihre Festung fiel nicht durch Macht, sondern durch unsere Weisheit, denn wir nahmen Bortedag ohne einen einzigen Keshband-Mann verloren. Doch die Saryhorde verweilte immer noch, ihr Zorn blieb unverbraucht.\n\nBis zum Jahr 96 kehrten sie mit größerer Zahl zurück, aber wieder standen wir ungebrochen da. Die Toten der Saryhorde zählten neun und acht, während unsere keine erlitten. Ihr Kapital trug die Hauptlast ihrer Wut, und obwohl Feuer und Stahl verwendet wurden, schwankte unsere Entschlossenheit nicht. Das Jahr neunhundert elf sah sie ihre letzten Gelübde brechen, und obwohl sie sich verständigten, wird die Erinnerung an ihre Niederlagen immer heller brennen als ihre Versprechen. Die Ehre der Keshband bleibt bestehen.", "problems": [], "comment": "0.8 s. Turns 'nine hundred six' into 'Jahr 96', and 'capital' into 'Kapital'. Spelled-out years cannot be checked; sources should use digits."}], "score": 3.0, "comment": "Makes Chuluun the enemy's leader, claims Bortedag fell 'without a single Keshband man lost' and '188' dead. Passed the validator anyway."}, "jlama-mistral7b": {"text": "In the annals of our noble Penpike, the year of the Boar, 901, saw the unjust aggression of the distant and barbarous realm of Bortebulak, led by the unworthy Batu. Our valiant forces, under the wise Tsetseg, marched forth to meet them in the fields of Bortedag, where the treacherous Saryhorde had gathered their hordes.\n\nThere, in a display of courage unmatched, our warriors, guided by Bayan the Unseen Weaver, bested the enemy and claimed the lives of 406 of their number. The cowardly Batu, unable to withstand our might, was forced to retreat.\n\nYet, the bloodthirsty Saryhorde again sought battle, this time near our hallowed city of Penpike. On that day, the heavens themselves seemed to conspire against us, for we met with a cruel defeat. Yet, it was not through any failing of our warriors, but rather the treachery of the Saryhorde that led to our temporary setback.\n\nFor it was in the year of the Serpent, 906, that the Saryhorde <script>
const data = JSON.parse(document.getElementById('data').textContent);
const shown = new Set(data.models);

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

document.getElementById('lead').textContent = data.lead;
document.getElementById('verdict').innerHTML = data.verdict;
document.getElementById('footer').innerHTML = data.footer;

// Summary table: one row per model and runtime.
const table = document.getElementById('summary');
const cols = data.summaryColumns;
const head = table.createTHead().insertRow();
cols.forEach(c => { const th = el('th', c.num ? 'num' : '', c.label); head.appendChild(th); });
const body = table.createTBody();
data.summary.forEach(row => {
  const tr = body.insertRow();
  cols.forEach(c => { const td = tr.insertCell(); td.textContent = row[c.key] ?? '–'; if (c.num) td.className = 'num'; });
});

// Model filter chips.
const filters = document.getElementById('filters');
data.models.forEach(m => {
  const b = el('button', 'chip', data.modelNames[m] || m);
  b.type = 'button';
  b.id = 'chip-' + m;
  b.setAttribute('aria-pressed', 'true');
  b.addEventListener('click', () => {
    if (shown.has(m)) shown.delete(m); else shown.add(m);
    b.setAttribute('aria-pressed', shown.has(m) ? 'true' : 'false');
    document.querySelectorAll('[data-model="' + m + '"]').forEach(c => { c.hidden = !shown.has(m); });
  });
  filters.appendChild(b);
});

// The prompt test: old book, new book, and the new book in German with the new and the old translation prompt.
const exp = data.experiment;
if (exp && exp.rows.length) {
  document.getElementById('exp-intro').textContent = exp.intro;
  document.getElementById('exp-summary').innerHTML = exp.summary;
  const rows = document.getElementById('exp-rows');
  exp.rows.forEach(r => {
    const c = el('article', 'card');
    const h = el('div', 'card-head');
    h.appendChild(el('h3', '', r.model + ' · told by the ' + r.side));
    const b = el('div', 'badges');
    b.appendChild(el('span', 'badge ' + (r.attempts === 1 ? 'ok' : 'warn'), r.attempts === 1 ? 'valid at once' : 'valid after ' + r.attempts + ' tries'));
    h.appendChild(b);
    c.appendChild(h);
    c.appendChild(el('div', 'prose', r.text));
    if (r.problems.length) c.appendChild(el('div', 'problems', 'Validator found on earlier tries: ' + r.problems.map(p => p.type + ' "' + p.value + '"').join(', ')));
    if (r.comment) c.appendChild(el('p', 'note', r.comment));
    c.appendChild(el('div', 'kind', 'German · localisation prompt, same model'));
    c.appendChild(el('div', 'prose de', r.de));
    if (r.de_comment) c.appendChild(el('p', 'note', r.de_comment));
    const original = el('details', 'sheet');
    original.appendChild(el('summary', '', 'The same book with the original prompt'));
    original.appendChild(el('div', 'prose', r.original));
    c.appendChild(original);
    rows.appendChild(c);
  });
  const ep = document.getElementById('exp-prompts');
  exp.prompts.forEach(p => { const c = el('article', 'card'); c.appendChild(el('h3', '', p.title)); c.appendChild(el('pre', 'prompt', p.text)); ep.appendChild(c); });
} else {
  document.getElementById('prompt-test').hidden = true;
}

// The prompts, so the reader can judge what the models were told.
const promptList = document.getElementById('prompt-list');
(data.prompts || []).forEach(p => {
  const c = el('article', 'card');
  c.appendChild(el('h3', '', p.title));
  c.appendChild(el('pre', 'prompt', p.text));
  promptList.appendChild(c);
});

// One section per text.
const toc = document.getElementById('toc');
const main = document.getElementById('texts');
data.texts.forEach((t, i) => {
  const id = 'text-' + (i + 1);
  if (i === 0 && data.experiment && data.experiment.rows.length) { const ea = el('a', '', 'Prompt test: war chronicles'); ea.href = '#prompt-test'; toc.appendChild(ea); }

  if (i === data.texts.length - 1) { const pa = el('a', '', 'Prompts'); pa.href = '#prompts'; toc.appendChild(pa); }

  const s = el('section', 'text'); s.id = id;
  s.appendChild(el('div', 'kind', t.kindLabel));
  s.appendChild(el('h2', '', t.heading));
  const d = el('details', 'sheet');
  d.appendChild(el('summary', '', 'Fact sheet, as the model saw it'));
  d.appendChild(el('pre', '', t.sheet));
  s.appendChild(d);
  if (t.task) s.appendChild(el('p', 'note', t.task));

  const cards = el('div', 'cards');
  data.models.forEach(m => {
    const r = t.by[m];
    if (!r) return;
    const c = el('article', 'card'); c.dataset.model = m;
    const h = el('div', 'card-head');
    h.appendChild(el('h3', '', data.modelNames[m] || m));
    const badges = el('div', 'badges');
    const verdict = r.passed ? (r.attempts === 1 ? ['ok', 'valid at once'] : ['warn', 'valid after ' + r.attempts + ' tries'])
                             : ['bad', 'rejected after ' + r.attempts + ' tries'];
    badges.appendChild(el('span', 'badge ' + verdict[0], verdict[1]));
    badges.appendChild(el('span', 'badge info', Math.round(r.wall_s) + ' s'));
    if (r.score != null) badges.appendChild(el('span', 'badge info', 'score ' + r.score + '/5'));
    h.appendChild(badges);
    c.appendChild(h);
    c.appendChild(el('div', 'prose', r.text));
    if (r.prompt) {
      const pd = el('details', 'sheet');
      pd.appendChild(el('summary', '', 'The v3 prompt as sent (system prompt in the Prompts section)'));
      pd.appendChild(el('pre', '', r.prompt));
      c.appendChild(pd);
    }
    if (r.problems.length) {
      c.appendChild(el('div', 'problems', 'Validator found: ' + r.problems.map(p => p.type + ' "' + p.value + '"').join(', ')));
    }
    if (r.comment) c.appendChild(el('p', 'note score', r.comment));
    (r.de || []).forEach(g => {
      c.appendChild(el('div', 'kind', 'German · ' + g.label));
      c.appendChild(el('div', 'prose de', g.text));
      if (g.comment) c.appendChild(el('p', 'note', g.comment));
      if (g.problems.length) c.appendChild(el('div', 'problems', 'Lost in translation: ' + g.problems.map(p => p.value).join(', ')));
    });
    cards.appendChild(c);
  });
  s.appendChild(cards);
  main.appendChild(s);
});
</script>
